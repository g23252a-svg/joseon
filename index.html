function raisable(P){
  if(!P || P.nat!=='kor') return 0;
  const 남길=Math.round(garrisonTarget(P)*0.55);
  return Math.max(0, Math.floor((P.army-남길)/500)*500);
}
/* 한 자리에 선 같은 편 군은 하나로 합친다.
   ----------------------------------------------------------------
   출정은 고을 하나에서만 뽑으므로, 여러 고을에서 군을 일으켜 한자리에
   모으면 깃발이 다섯 개 포개졌다. 그림은 서로를 덮어 숫자가 뭉개지고,
   눌러도 그중 하나만 잡히니 다섯을 해마다 따로따로 부려야 했다.
   판 위의 말은 「그 자리에 선 우리 군」 하나여야 한다.

   가는 중인 군은 합치지 않는다 — 아직 그 자리에 있는 것이 아니다. */
function mergeArmies(){
  if(!G.armies) return;
  const 자리={};
  G.armies.slice().forEach(A=>{
    if(A.dest) return;
    const k=A.at+'|'+A.nat, 앞=자리[k];
    if(!앞){ 자리[k]=A; return; }
    앞.men += A.men;
    앞.siege = Math.max(앞.siege||0, A.siege||0);
    앞.told  = 앞.told || A.told;
    앞.born  = Math.min(앞.born||G.year, A.born||G.year);
    G.armies = G.armies.filter(x=>x!==A);
    if(G.armySel===A.id) G.armySel=앞.id;
  });
}
function raiseArmy(P){
  const men=raisable(P); if(men<1000) return null;
  P.army-=men;
  const A={ id:ARMY_ID++, nat:'kor', at:P.id, dest:null, men, siege:0, mv:0, born:G.year };
  G.armies.push(A);
  G.armySel=A.id;
  mergeArmies();                 // 이미 그 자리에 우리 군이 있으면 한 덩어리가 된다
  log(P.nm+'에서 '+num(men)+'을 일으켜 군을 세웠다.');
  if(!G.saga || !(G.saga.did.chul)){
    /* 첫 군이다 — 무엇을 눌러야 하는지 한 번은 일러 준다 */
    log('군을 고른 채로 맞닿은 고을을 누르면 그리로 간다. 남의 성에 닿으면 포위가 시작된다.');
    const a2=fxAt(P.id);
    if(a2) fx({ kind:'float', life:3.2, at:{x:a2.x,y:a2.y-16},
                text:'맞닿은 고을을 누르시오', col:'#f0e2be', size:12, rise:14 });
  }
  fxPop(P.id,'출정','#e0bd76'); snd('levy');
  if(G.saga) G.saga.did.chul=(G.saga.did.chul||0)+1;
  // 합쳐졌으면 살아남은 덩어리를 돌려준다
  return G.armies.find(x=>x.id===G.armySel) || A;
}
function disbandArmy(A){
  const P=G.provs[A.at];
  if(P && P.nat===A.nat){ P.army+=A.men; log(P.nm+'에서 군을 풀었다.'); }
  else log('군이 흩어졌다.');
  G.armies=G.armies.filter(x=>x!==A);
  if(G.armySel===A.id) G.armySel=null;
}
/* 갈 수 있는 곳 — 맞닿은 고을 하나 */
/* 전세 — 이 전쟁을 누가 이기고 있는가.
   ----------------------------------------------------------------
   여태 화친은 전세를 몰랐다. 스무 해를 이겨도 화친하려면 값을 치르고
   정통을 깎였다 — 이긴 전쟁과 진 전쟁이 같은 값이었다.
   야전과 함락이 전세에 쌓이고, 화친의 값이 전세를 따라 달라진다. */
function warScore(k, v){
  const d=dipOf(k); if(!d) return 0;
  if(v!=null) d.score=clamp((d.score||0)+v, -100, 100);
  return d.score||0;
}
function warScoreLabel(sc){
  return sc>=35? '크게 이기고 있다' : sc>=12? '이기고 있다'
       : sc>-12? '팽팽하다' : sc>-35? '밀리고 있다' : '크게 밀리고 있다';
}
function canGo(A, id){
  const P=G.provs[A.at]; if(!P) return false;
  return P.adj.has(id);
}
/* 길찾기 — 먼 고을을 눌러도 간다.
   ----------------------------------------------------------------
   여태는 맞닿은 고을만 눌 수 있었다. 세 칸 밖의 성을 치려면 해마다
   깃발을 다시 골라 다음 칸을 눌러 주어야 했다 — 명령이 아니라 시중이다.
   이제 어느 고을을 눌러도 가장 가까운 길을 스스로 찾아 해마다 한 걸음씩
   간다. 명령은 한 번이면 된다.
   길은 이렇게 고른다: 우리 땅과 목적지는 그냥 밟고, 남의 땅을 거쳐야
   하면 그만큼 비싸게 센다(싸움을 부르는 길이므로 돌아갈 수 있으면 돈다). */
function findPath(A, 끝){
  if(A.at===끝) return null;
  const 값={ [A.at]:0 }, 앞={}, 줄=[A.at];
  while(줄.length){
    let bi=0; for(let i=1;i<줄.length;i++) if(값[줄[i]]<값[줄[bi]]) bi=i;
    const 지금=줄.splice(bi,1)[0];
    if(지금===끝) break;
    const P=G.provs[지금]; if(!P) continue;
    [...P.adj].forEach(id=>{
      const q=G.provs[id]; if(!q) return;
      // 남의 땅을 거치는 값 — 목적지는 제값, 지나는 길이면 비싸게
      const 무게 = 1 + (id!==끝 && q.nat!==A.nat? 2.5 : 0)
                     + (SEA_LINK[지금+'|'+id]||q.t==='mtn'? 1 : 0);
      const v=값[지금]+무게;
      if(값[id]===undefined || v<값[id]){ 값[id]=v; 앞[id]=지금; if(!줄.includes(id)) 줄.push(id); }
    });
  }
  if(앞[끝]===undefined) return null;
  const 길=[]; let c=끝;
  while(c!==A.at){ 길.unshift(c); c=앞[c]; }
  return 길;
}
function orderMove(A, id){
  if(canGo(A,id)){ A.path=null; }
  else {
    const 길=findPath(A, id);
    if(!길 || !길.length) return false;
    A.path=길.slice(1);              // 첫 걸음은 dest 로, 나머지는 주머니에
    id=길[0];
  }
  A.dest=id; A.mv=0;
  const 느림 = SEA_LINK[A.at+'|'+id] || (G.provs[id] && G.provs[id].t==='mtn');
  A.need = 느림? 2 : 1;
  return true;
}
/* 군의 힘 — 고을이 치던 것과 같은 셈을 쓴다 */
function armyAtk(A){
  const P=G.provs[A.at];
  const U=unitOf(P && P.nat===A.nat? P : null);
  const gov=P? officialAt(P.id) : null;
  const mil=gov&&P.nat===A.nat? 1+gov.mil/160 : 1;
  return A.men * U.atk * mil * (A.nat==='kor'? mods().atk : 1) * (1+techOf(A.nat)/220);
}
/* 고을이 버티는 힘 — 성곽과 지형과 그 자리의 수비병 */
function provDef(P, 미는이){
  const T=TERR[P.t], V=unitOf(P);
  let 원군=0;
  [...P.adj].forEach(id=>{ const q=G.provs[id];
    if(q && q.nat===P.nat && q.id!==(미는이&&미는이.at)) 원군 += q.army*0.20; });
  // 그 고을에 선 우군 야전군도 성을 지킨다
  const 지킴=armiesAt(P.id).filter(a=>a.nat===P.nat).reduce((s,a)=>s+a.men,0);
  const 혼란 = G.nations[P.nat] && G.nations[P.nat].chaos>0 ? 0.82 : 1;   // 왕조 교체기의 성은 무르다
  return (P.army+원군+지킴)*T.def*(1+P.fort*0.16)*V.def*혼란
         *(P.nat==='kor'? mods().defKor : 1)*(1+techOf(P.nat)/220);
}
/* 야전 — 같은 고을에서 마주친 두 군 */
function fieldBattle(A, B2){
  const a=armyAtk(A), b=armyAtk(B2);
  // 그 고을의 임자가 지형의 덕을 본다
  const P=G.provs[A.at];
  const aT = P && P.nat===A.nat? TERR[P.t].def : 1;
  const bT = P && P.nat===B2.nat? TERR[P.t].def : 1;
  const p=winChance(a*aT, b*bT);
  const A이김=Math.random()<p;
  const 이긴=A이김?A:B2, 진=A이김?B2:A;
  const 이긴손=Math.round(이긴.men*clamp(0.10+(1-(A이김?p:1-p))*0.5,0.08,0.55));
  이긴.men=Math.max(0,이긴.men-이긴손);
  const at=fxAt(A.at);
  if(at){
    fx({ kind:'clash', life:1.2, at, won:true, shake:0.8, snd:'battle' });
    fx({ kind:'float', delay:0.3, life:2.0, at:{x:at.x,y:at.y-10},
         text:'야전 — '+natName(이긴.nat)+' 이김', col:'#f0e2be', size:13, rise:22 });
  }
  log('['+ (G.provs[A.at]? G.provs[A.at].nm : '') +'] 야전. '
      + natName(이긴.nat)+이가(natName(이긴.nat))+' 이겼다. ('+natName(진.nat)+'의 '+num(진.men)+' 흩어짐)');
  G.armies=G.armies.filter(x=>x!==진);
  if(G.armySel===진.id) G.armySel=null;
  // 전세 — 조선이 낀 야전이면 쌓는다
  if(이긴.nat==='kor' && DIP_NATS.includes(진.nat)) warScore(진.nat, +8);
  if(진.nat==='kor' && DIP_NATS.includes(이긴.nat)) warScore(이긴.nat, -8);
  if(진.nat==='kor'){ G.nations.kor.stab=clamp(G.nations.kor.stab-4,0,100); snd('lose'); }
  if(G.saga) G.saga.fields=(G.saga.fields||0)+1;
  return 이긴;
}
/* 포위 — 한 해치 */
/* 한 해에 성을 얼마나 미는가.
   ----------------------------------------------------------------
   예전에는 성곽이 두 번 셈에 들었다. provDef 가 (1+성곽×0.16) 으로 한 번
   곱하고 — 성곽 9면 2.44배다 — 걸음에서 성곽×2.2 를 또 뺐다. 그래서
   산업화 시대에 성곽 9인 성을 보이는 병력의 두 배로 밀면 한 해에 3.6,
   백을 채우는 데 스물여덟 해가 걸렸다. 그동안 군은 해마다 7%씩 녹으므로
   실제로는 영영 안 넘어왔다. 압도적인 병력으로 쳐도 성이 안 따이는 것은
   놀이가 어려운 것이 아니라 셈이 틀린 것이다.

   이제 성곽은 provDef 안에서 한 번만 센다. 여기서 빼는 몫은 「사다리와
   공성구가 없으면 성벽 앞에서 하루가 그냥 간다」는 정도로만 남긴다. */
/* 한 성을 미는 힘은 그 자리에 선 같은 편 군을 모두 더한 것이다.
   예전에는 군마다 제 눈금을 따로 밀었다. 그래서 삼만 셋으로 나누어 보낸
   구만이 한 덩어리 구만보다 네 배 넘게 느렸다(4해 → 17해). 삼만 둘로 나눈
   육만은 영영 성을 못 넘겼다 — 한 덩어리 육만은 여덟 해면 넘겼는데도.
   판은 「군을 더 보내면 빨라진다」고 적어 두었는데 보낼수록 느려졌다.
   출정은 고을 하나에서만 뽑으므로 사람은 자연히 이 나뉜 모양이 된다. */
function siegeStep(A, P){
  if(!P) return 0;
  const 무=Array.isArray(A)? A : [A]; if(!무.length) return 0;
  const 수비=provDef(P, 무[0]);
  const 밀기=무.reduce((s,a)=>s+armyAtk(a), 0);
  return clamp(30*(밀기/Math.max(1,수비)) - P.fort*0.9, -4, 50);
}
/* 그 성을 함께 미는 우리 편 무리 */
function siegeParty(A){
  return armiesAt(A.at).filter(a=>a.nat===A.nat);
}
function siegeTick(무리, B){
  const 무=Array.isArray(무리)? 무리 : [무리];
  const A0=무[0]; if(!A0) return;
  const P=G.provs[A0.at]; if(!P) return;
  const 총=무.reduce((s,a)=>s+a.men, 0);
  /* 에워싼 첫해에 한 번은 알린다. 여태 아무 말이 없다가 몇 해 뒤에
     「함락시켰다」만 떴으니, 성이 갑자기 사라지는 것처럼 보였다. */
  if(!무.some(a=>a.told)){
    무.forEach(a=>a.told=1);
    if(P.nat==='kor'){
      log(natName(A0.nat)+'의 군 '+num(총)+'이 '+P.nm+을를(P.nm)+' 에워쌌다.');
      if(B) B.events.push(P.nm+' 포위됨');
      snd('war'); shake(0.4);
      const at=fxAt(P.id);
      if(at) fx({ kind:'float', life:2.2, at:{x:at.x,y:at.y-12},
                  text:P.nm+' 포위', col:'#c4534a', size:13, rise:20 });
    } else if(A0.nat==='kor'){
      log('우리 군 '+num(총)+'이 '+P.nm+을를(P.nm)+' 에워쌌다. 성곽 '+P.fort+'.');
      if(B) B.events.push(P.nm+' 포위');
    }
  } else 무.forEach(a=>a.told=1);
  const 걸음=siegeStep(무, P);
  // 눈금은 무리가 함께 쥔다 — 뒤늦게 붙은 군이 앞의 공을 지우면 안 된다
  const 눈금=clamp(Math.max(...무.map(a=>a.siege||0))+걸음, 0, 100);
  무.forEach(a=>a.siege=눈금);
  // 포위된 고을은 시끄러워지고 수비병이 준다
  P.unrest=clamp(P.unrest+2.2,0,100);
  P.army=Math.round(P.army*0.96);
  if(눈금>=100){
    const 옛=P.nat;
    P.nat=A0.nat; P.unrest=clamp(P.unrest+40,0,100); P.assim=0;
    P.army=Math.round(총*0.22);
    무.forEach(a=>{ a.men=Math.round(a.men*0.82); a.siege=0; a.told=0; });
    G.plateDirty=true; ROUTEKEY='';
    fxFlip(P, 옛, P.nm+' 함락', A0.nat==='kor'? '#f0e2be':'#c4534a');
    shake(0.9); snd(A0.nat==='kor'? 'win':'lose');
    log(natName(A0.nat)+이가(natName(A0.nat))+' '+P.nm+을를(P.nm)+' 함락시켰다.');
    if(B) B.events.push(P.nm+(A0.nat==='kor'? ' 함락':' 잃음'));
    if(A0.nat==='kor'){
      G.legit=clamp(G.legit+2,0,100); sagaDo('takeWin', P.nm);
      if(G.reign) G.reign.얻음++;
      if(DIP_NATS.includes(옛)) warScore(옛, +18);
    } else if(옛==='kor'){
      if(DIP_NATS.includes(A0.nat)) warScore(A0.nat, -18);
      G.nations.kor.stab=clamp(G.nations.kor.stab-12,0,100);
      G.legit=clamp(G.legit-5,0,100);
      sagaDo('lost', P.nm); if(G.reign) G.reign.뺏김++;
      if(P.cap){ log('도읍이 넘어갔다.'); if(G.reign) G.reign.도읍잃음=1; }
    }
  }
}
/* ================================================================
   반군의 한 해
   ----------------------------------------------------------------
   예전에는 등을 돌린 고을이 '유구'가 되어 영영 가만히 앉아 있었다.
   반란이 아니라 실종이었다. 이제 반군은 몇 해 동안 번진다 — 이웃을
   들쑤시고, 군을 내어 약한 고을을 문다. 그리고 식는다. 어지러움이
   가라앉은 반군 고을은 스스로 조정에 돌아온다.
   칼로 되찾는 길과 달래서 되돌리는 길이 함께 있다.
   ================================================================ */
function rebTurn(B){
  const 반군땅=Object.values(G.provs).filter(p=>p.nat==='reb');
  if(!G.nations.reb) return;
  if(!반군땅.length){ G.nations.reb.tech=G.nations.kor.tech; return; }
  // 반군의 기술은 조선을 따라온다 — 같은 백성이다
  G.nations.reb.tech=+(G.nations.kor.tech*0.9).toFixed(1);
  const 반군군=armyList('reb');
  반군땅.forEach(P=>{
    if(P.rebFire>0){
      P.rebFire--;
      P.unrest=clamp(P.unrest+2,0,100);
      // 무리가 불어난다 — 키우기만 한다. min 으로 씌우면 작은 고을의
      // 반군이 출몰 문턱(4천) 아래로 깎여 영영 나오지 못한다.
      P.army=Math.max(P.army, Math.min(Math.round(garrisonTarget(P)*2.2), P.army+ri(300,700)));
      // 불길 — 맞닿은 조선 고을이 들썩인다
      [...P.adj].forEach(id=>{ const q=G.provs[id];
        if(q && q.nat==='kor'){ q.unrest=clamp(q.unrest+4,0,100); } });
      // 군을 내어 가장 약한 이웃을 문다 — 판에 둘까지만
      if(반군군.length<2 && P.army>4000 && Math.random()<0.45){
        const 목=[...P.adj].map(id=>G.provs[id])
          .filter(q=>q&&q.nat==='kor')
          .sort((x,y2)=>provDef(x,null)-provDef(y2,null))[0];
        if(목){
          const men=Math.round(P.army*0.55); P.army-=men;
          const A={ id:ARMY_ID++, nat:'reb', at:P.id, dest:null, men, siege:0, mv:0, born:G.year };
          G.armies.push(A); orderMove(A, 목.id);
          log(natName('reb')+이가(natName('reb'))+' '+P.nm+'에서 나와 '+목.nm+을를(목.nm)+' 노린다.');
          B.events.push(P.nm+' 반군 출몰'); snd('revolt');
        }
      }
    } else {
      // 불이 꺼지면 식는다
      P.unrest=clamp(P.unrest-3,0,100);
      // 조정의 명분이 설수록 빨리 식는다
      if(G.legit>=60) P.unrest=clamp(P.unrest-1,0,100);
      if(P.home==='kor' && P.unrest<30){
        P.nat='kor'; P.unrest=45; P.rebel=0; G.plateDirty=true; ROUTEKEY='';
        log(P.nm+이가(P.nm)+' 스스로 조정에 돌아왔다. 사면을 내렸다.');
        B.events.push(P.nm+' 귀순');
        fxFlip(P, 'reb', P.nm+' 귀순', '#8fa86a'); snd('treaty');
        G.legit=clamp(G.legit+2,0,100);
      }
    }
  });
}

/* 한 해 — 움직이고, 부딪히고, 줄어든다 */
function armyTurn(B){
  if(!G.armies) G.armies=[];
  const M=mods();
  // ① 움직임
  G.armies.forEach(A=>{
    if(!A.dest) return;
    A.mv++;
    if(A.mv < (A.need||1)) return;
    if(!G.provs[A.dest]){ A.dest=null; return; }
    A.at=A.dest; A.dest=null; A.mv=0; A.siege=0; A.told=0;
    if(A.nat==='kor'){
      const P=G.provs[A.at];
      if(P && DIP_NATS.includes(P.nat)) declareWar(P.nat, true);
    }
    /* 주머니에 남은 길이 있으면 다음 걸음을 꺼낸다 — 명령은 한 번이면 된다.
       닿은 자리가 남의 땅이면 멈춘다: 싸움이 시작되는 자리다. */
    const 여기=G.provs[A.at];
    if(A.path && A.path.length && 여기 && 여기.nat===A.nat){
      const 다음=A.path[0];
      if(G.provs[다음]){ A.path=A.path.slice(1); A.dest=다음; A.mv=0;
        A.need=(SEA_LINK[A.at+'|'+다음]||G.provs[다음].t==='mtn')? 2:1; }
      else A.path=null;
    } else if(A.path && (!여기 || 여기.nat!==A.nat)) A.path=null;
  });
  // 닿은 자리에서 같은 편끼리 한 덩어리가 된다 — 깃발이 포개지지 않게
  mergeArmies();
  // ② 야전 — 한 고을에 두 나라의 군이 있으면
  let 안전=0;
  while(안전++<40){
    let 붙음=null;
    const 자리={};
    for(const A of G.armies){
      const 앞=자리[A.at];
      if(앞 && 앞.nat!==A.nat){ 붙음=[앞,A]; break; }
      if(!앞) 자리[A.at]=A;
    }
    if(!붙음) break;
    fieldBattle(붙음[0], 붙음[1]);
  }
  // ③ 포위 — 한 성에 선 같은 편은 무리로 묶어 함께 민다
  const 무리={};
  G.armies.forEach(A=>{
    const P=G.provs[A.at];
    if(!P) return;
    if(P.nat===A.nat){ A.siege=0; A.told=0; return; }
    const k=A.at+'|'+A.nat;
    (무리[k]=무리[k]||[]).push(A);
  });
  Object.values(무리).forEach(무=>siegeTick(무, B));
  // ④ 소모
  G.armies.slice().forEach(A=>{
    const P=G.provs[A.at];
    if(!P){ return; }
    // 소모 — 남의 땅에서는 빨리 줄어든다
    const 밖 = !P || P.nat!==A.nat;
    A.men=Math.round(A.men*(밖? 0.93 : 0.985));
    if(A.men<400){
      log((P? P.nm+'에서 ' : '')+natName(A.nat)+'의 군이 흩어졌다.');
      G.armies=G.armies.filter(x=>x!==A);
      if(G.armySel===A.id) G.armySel=null;
    }
  });
  // ⑤ 군량 — 야전군은 곳간을 먹는다
  const 우리군=armyList('kor').reduce((s,a)=>s+a.men,0);
  B.upkeepField=Math.round(우리군*0.010*(1+G.era*0.3));
  G.nations.kor.gold=Math.max(0, G.nations.kor.gold-B.upkeepField);
  B.fieldMen=우리군;
}

/* ================================================================
   위협 — 이 고을을 실제로 무엇이 위협하는가
   ----------------------------------------------------------------
   군대 층이 생긴 뒤로 「요동이 치면 88%로 진다」는 말이 거짓이 되었다.
   요동은 치지 않는다 — 명의 야전군이 친다. 판이 말하는 것과 실제로
   일어나는 일이 어긋나면 그 숫자는 없느니만 못하다.

   이제 진짜로 셋을 본다.
     ① 이 성을 이미 밀고 있는 군
     ② 맞닿은 고을에 서 있는 남의 군 (한 해 뒤면 닿는다)
     ③ 맞닿은 남의 고을이 일으킬 수 있는 군 (아직 없지만 낼 수는 있다)
   ================================================================ */
function raisableOf(P){
  if(!P) return 0;
  const 남길=Math.round(garrisonTarget(P)*0.5);
  return Math.max(0, P.army-남길);
}
function threatOf(P){
  if(!P || P.nat!=='kor') return null;
  const 수비=provDef(P, null);
  let 힘=0, 처=null, 언제=9, 무엇='';
  // ① 이미 밀고 있는 군
  armiesAt(P.id).forEach(A=>{
    if(A.nat===P.nat) return;
    const a=armyAtk(A);
    if(a>힘){ 힘=a; 처={nm:natName(A.nat)+'의 군', nat:A.nat}; 언제=0; 무엇='포위 중'; }
  });
  // ② 맞닿은 자리의 남의 군
  [...P.adj].forEach(id=>{
    (G.armies||[]).forEach(A=>{
      if(A.at!==id || A.nat===P.nat) return;
      const a=armyAtk(A)*0.95;
      if(a>힘 || (언제>1 && a>힘*0.7)){ 힘=Math.max(힘,a);
        처={nm:natName(A.nat)+'의 군', nat:A.nat}; 언제=Math.min(언제,1); 무엇='한 해 거리'; }
    });
  });
  // ③ 아직 없지만 낼 수 있는 군
  if(언제>1){
    [...P.adj].forEach(id=>{
      const q=G.provs[id]; if(!q || q.nat===P.nat) return;
      const men=raisableOf(q); if(men<1500) return;
      const U=unitOf(q);
      const a=men*U.atk*(1+techOf(q.nat)/220);
      if(a>힘){ 힘=a; 처=q; 언제=2; 무엇='아직 군을 내지 않았다'; }
    });
  }
  if(!처) return null;
  const p=winChance(힘, 수비);
  /* 낌새 — 셀 수 있다와 칠 것 같다는 다르다 */
  const d=DIP_NATS.includes(처.nat)? dipOf(처.nat) : null;
  let 마음 = !d? 0.7 : d.war? 1 : (d.ally||d.truce>0)? 0 : clamp(0.45-d.rel/140, 0, 1);
  if(언제===0) 마음=1;                      // 이미 밀고 있으면 낌새가 아니라 사실이다
  else if(언제===1) 마음=Math.max(마음,0.8);
  return { 수비, 힘, 처, p, 언제, 무엇, 마음, d };
}

/* ================================================================
   외교의 손 — 조정이 이웃에게 하는 일
   ================================================================ */
function dipActs(k){
  const d=dipOf(k), N=G.nations.kor, 물가=1+G.era*0.9;
  const nm=()=>natName(k);
  return [
    { id:'envoy', nm:'사신', adm:1, cost:Math.round(70*물가),
      can:()=>!!d,
      desc:()=>{ const g=Math.round(5+bestDip()/9);
        return '사이 +'+g+'.  외교에 밝은 신하가 있으면 더 오른다 (지금 '+bestDip()+').'
             + '  세 해 동안 사이가 제자리로 돌아가는 속도가 절반이 된다.'; },
      run:()=>{ const g=5+bestDip()/9;
        d.rel=clamp(d.rel+g,-100,100); d.envoy=3;
        log(nm()+'에 사신을 보냈다.'); } },
    { id:'tribute', nm:d&&d.tribute?'세폐를 거둔다':'세폐를 바친다', adm:1,
      cost:d&&d.tribute? 0 : Math.round(120*물가),
      can:()=>!!d && !d.war,
      desc:()=>d.tribute
        ? '해마다 나가던 세폐를 그친다.  사이 −18, 정통 +6.'
        : '해마다 국고와 곡식이 나간다.  사이 +30, 침공 위험이 크게 준다.  정통 −0.4/년.',
      run:()=>{ if(d.tribute){ d.tribute=false; d.rel=clamp(d.rel-18,-100,100);
          G.legit=clamp(G.legit+6,0,100); log(nm()+'에 보내던 세폐를 그쳤다.'); }
        else { d.tribute=true; d.rel=clamp(d.rel+18,-100,100);
          log(nm()+'에 세폐를 보내기로 하였다.'); } } },
    { id:'trade', nm:d&&d.trade?'통상을 닫는다':'통상 조약', adm:1,
      cost:d&&d.trade? 0 : Math.round(160*물가),
      can:()=>!!d && !d.war && (d.trade || d.rel>=25),
      desc:()=>d.trade
        ? '통상을 닫는다.  수출이 그만큼 준다.'
        : '특산을 판다.  사이 25 이상이라야 한다 (지금 '+Math.round(d.rel)+').'
          + '  지금 맺으면 해마다 약 '+num(exportGuess(1))+'전.',
      run:()=>{ d.trade=!d.trade;
        log(d.trade? nm()+'과 통상을 열었다.' : nm()+'과의 통상을 닫았다.'); } },
    { id:'ally', nm:d&&d.ally?'동맹을 거둔다':'동맹', adm:2,
      cost:d&&d.ally? 0 : Math.round(300*물가),
      /* 명과 일본은 서로를 겨눈다. 둘 다와 형제가 될 수는 없다 —
         그럴 수 있으면 아무도 우리를 못 치게 되어 놀이가 끝난다. */
      /* 둘이 서로 형제가 되어 있으면 조선은 어느 쪽과도 손을 잡을 수 없다 —
         이미 짝이 있는 사람에게 형제를 청할 수는 없다. */
      can:()=>!!d && !d.war && (d.ally || (d.rel>=60 && !(G.cj&&G.cj.ally)
                                && !DIP_NATS.some(o=>o!==k && dipOf(o) && dipOf(o).ally))),
      desc:()=>{
        const 딴벗=DIP_NATS.find(o=>o!==k && dipOf(o) && dipOf(o).ally);
        return d.ally
        ? '동맹을 거둔다.  사이 −20.'
        : (G.cj&&G.cj.ally)? (natName('chn')+과와(natName('chn'))+' '+natName('jpn')+이가(natName('jpn'))+' 이미 서로 손을 잡았다. 그 사이를 벌려 놓기 전에는 어느 쪽과도 맺을 수 없다.')
        : 딴벗? ('이미 '+natName(딴벗)+과와(natName(딴벗))+' 동맹을 맺었다. 둘 다와 형제가 될 수는 없다.')
        : '사이 60 이상이라야 한다 (지금 '+Math.round(d.rel)+').'
          + '  우리가 지킬 때 군사를 보내고, 우리를 친 쪽을 문다.'
          + '  다른 이웃과의 사이는 크게 떨어진다.'; },
      run:()=>{ if(d.ally){ d.ally=false; d.rel=clamp(d.rel-20,-100,100);
          log(natName(k)+과와(natName(k))+'의 동맹을 거두었다.'); }
        else { d.ally=true; d.rel=clamp(d.rel+10,-100,100);
          // 한쪽과 손을 잡으면 다른 쪽이 등을 돌린다
          const o=DIP_NATS.find(x=>x!==k); if(o&&dipOf(o)) dipOf(o).rel=clamp(dipOf(o).rel-22,-100,100);
          log(natName(k)+과와(natName(k))+' 동맹을 맺었다.'); } } },
    { id:'peace', nm:'화친', adm:2,
      cost: (d&&(d.score||0)>=12)? 0 : Math.round(260*물가*((d&&(d.score||0)<=-12)?1.6:1)),
      can:()=>!!d && d.war,
      desc:()=>{ const sc=d.score||0;
        if(sc>=35) return '전세 +'+Math.round(sc)+' — '+warScoreLabel(sc)+'.  배상 '+num(600+Math.round(sc*14))+'전을 받고 정통 +4.';
        if(sc>=12) return '전세 +'+Math.round(sc)+' — '+warScoreLabel(sc)+'.  값 없이 끝낸다. 정통은 깎이지 않는다.';
        if(sc>-12) return '전세 '+Math.round(sc)+' — '+warScoreLabel(sc)+'.  국고를 치르고 정통 −5.';
        return '전세 '+Math.round(sc)+' — '+warScoreLabel(sc)+'.  비싼 값을 치르고 정통 −8. 진 싸움의 화친이다.'; },
      run:()=>{ const sc=d.score||0;
        d.war=false; d.warYears=0; d.truce=8; d.score=0;
        d.rel=clamp(d.rel+25,-100,100);
        if(sc>=35){ const 상=600+Math.round(sc*14); G.nations.kor.gold+=상;
          G.legit=clamp(G.legit+4,0,100);
          log(natName(k)+이가(natName(k))+' 배상 '+num(상)+'전을 물고 화친을 청해 왔다.'); }
        else if(sc>=12) log(natName(k)+과와(natName(k))+' 대등하게 화친하였다.');
        else if(sc>-12){ G.legit=clamp(G.legit-5,0,100); log(natName(k)+'과 화친하였다.'); }
        else { G.legit=clamp(G.legit-8,0,100);
          log('진 싸움을 값을 치르고 끝냈다. '+natName(k)+'의 기세가 등등하다.'); } } },
    { id:'denounce', nm:'국서로 꾸짖는다', adm:1, cost:Math.round(40*물가),
      can:()=>!!d && !d.ally,
      desc:()=>'사이 −14.  다른 이웃과의 사이 +8, 정통 +3.  명분은 값이 싸지 않다.',
      run:()=>{ d.rel=clamp(d.rel-14,-100,100);
        const o=DIP_NATS.find(x=>x!==k); if(o&&dipOf(o)) dipOf(o).rel=clamp(dipOf(o).rel+8,-100,100);
        G.legit=clamp(G.legit+3,0,100);
        log(natName(k)+'에 국서를 보내 꾸짖었다.'); } }
  ];
}
/* 이웃끼리의 사이에 손을 대는 두 가지.
   벌리는 쪽(이간)은 값이 싸고 들키면 판이 크게 나빠진다.
   말리는 쪽(중재)은 값이 비싸고 명분이 남는다. */
function cjActs(){
  const C=G.cj, 물가=1+G.era*0.9;
  const 솜씨=bestDip();
  return [
    { id:'wedge', nm:'이간', adm:2, cost:Math.round(180*물가),
      can:()=>!!C && !C.war,
      desc:()=>'두 나라 사이를 '+Math.round(14+솜씨/8)+' 벌린다.  '
        + '들킬 낌새 '+Math.round(wedgeRisk()*100)+'% — 들키면 양쪽과의 사이가 각각 −16, 정통 −5.'
        + '  외교에 밝은 신하가 벌리기도 잘하고 덜 들킨다 (지금 '+솜씨+').',
      run:()=>{
        const 폭=14+솜씨/8;
        C.wedge=(C.wedge||0)-폭; C.rel=clamp(C.rel-폭,-100,100);
        if(Math.random()<wedgeRisk()){
          DIP_NATS.forEach(k=>{ const d=dipOf(k); if(d) d.rel=clamp(d.rel-16,-100,100); });
          G.legit=clamp(G.legit-5,0,100);
          log('이간질이 드러났다. 두 나라가 다 조선을 흘겨본다.'); snd('bad');
        } else {
          log('두 나라 사이에 말을 넣었다.'); snd('treaty');
        }
      } },
    { id:'mediate', nm:'중재', adm:2, cost:Math.round(320*물가),
      can:()=>!!C && C.war && !C.mediate,
      desc:()=>'두 나라의 싸움을 말린다.  다섯 해 동안 손을 놓을 낌새가 크게 는다.  '
        + '말려지면 정통 +8, 양쪽과의 사이 +12.  중화의 자리에 서는 값이다.',
      run:()=>{
        C.mediate=5; C.rel=clamp(C.rel+10,-100,100);
        G.legit=clamp(G.legit+8,0,100);
        DIP_NATS.forEach(k=>{ const d=dipOf(k); if(d) d.rel=clamp(d.rel+12,-100,100); });
        log('두 나라 사이에 사람을 넣어 싸움을 말리기로 하였다.'); snd('treaty');
      } }
  ];
}
function wedgeRisk(){ return clamp(0.34 - bestDip()/380 - G.legit/900, 0.08, 0.34); }
/* 통상을 하나 더 열면 해마다 얼마가 들어오는지 — 어림이라도 보여 준다 */
function exportGuess(add){
  const M=mods();
  let pot=0;
  natProvs('kor').forEach(P=>{
    pot += goodVal(P,'exp',0)*(1+P.trade/44)*Math.pow(P.pop/100000,0.8);
  });
  const 지금 = DIP_NATS.filter(k=>dipOf(k)&&dipOf(k).trade&&!dipOf(k).war).length;
  return Math.max(0, Math.round(pot*(지금+add)*1.6*M.exp) - Math.round(pot*지금*1.6*M.exp));
}

/* ================================================================
   기술 마디를 연다
   ================================================================ */
function unlockTech(t){
  if(techDone(t.id)){ log('이미 열린 마디요.'); return; }
  if(t.era-G.era>=3){ log('아직 이를 다룰 때가 아니오.'); return; }
  const prev=techPrev(t);
  if(prev && !techDone(prev.id)){ log(prev.nm+을를(prev.nm)+' 먼저 이루어야 하오.'); return; }
  const 값=techCost(t);
  if(G.res.pt < 값){ log('연구가 모자라오.'); return; }
  const 앞섬=techAhead(t);
  G.res.pt = +(G.res.pt - 값).toFixed(2);
  G.res.done[t.id]=G.year;
  G.nations.kor.tech = +(G.nations.kor.tech + 4 + G.era*1.5).toFixed(1);
  log(앞섬? ('때보다 앞서 「'+t.nm+'」'+을를(t.nm)+' 이루었다.')
          : ('「'+t.nm+'」'+을를(t.nm)+' 이루었다.'));
  snd('tech');
}

/* ================================================================
   길잡이 — 이번 해에 할 일
   ----------------------------------------------------------------
   판에는 손이 스물 남짓 있고 눈금은 그보다 많다. 처음 잡은 사람은
   1392년에 무엇부터 눌러야 하는지 알 길이 없어, Space만 누르다 망한다.

   여기서는 지금 판을 읽어 "무엇을, 왜" 를 짚어 준다. 대신 해 주지는 않는다 —
   고르는 것이 이 놀이인데 길잡이가 골라 버리면 놀이가 없어진다.
   ================================================================ */
function advice(){
  const out=[], N=G.nations.kor, 우리=natProvs('kor');
  const 더 = (급함, 말, 까닭, 손) => out.push({급함, 말, 까닭, 손});

  /* 처음 잡은 사람에게 — 첫 몇 해 동안만 맨 위에 세운다.
     일러두기를 만들어 두어도 있는 줄을 모르면 없는 것과 같다. */
  if((G.turn||0)<3) 더(93, '처음이라면 일러두기부터',
    '메뉴의 「일러두기」에 놀이하는 법이 네 쪽으로 적혀 있다 — 무엇을 누르는지, 눈금이 무엇을 말하는지.',
    ()=>{ openHelp(); });

  /* 수령 — 가장 먼저, 가장 값싸게 듣는 약 */
  const 빈=우리.filter(p=>!officialAt(p.id));
  if(빈.length) 더(빈.length>=3? 92:64,
    '수령 없는 고을이 '+빈.length+'곳',
    '수령이 없으면 어지러움이 절로 오르고 세도 덜 걷힌다. 신하 탭에서 한 번에 채운다.',
    ()=>{ G.tab='신하'; G.sel=빈[0].id; });

  /* 곧 무너질 고을 */
  const 시끄=우리.filter(p=>p.unrest>=60).sort((a,b)=>b.unrest-a.unrest);
  if(시끄.length) 더(시끄[0].unrest>=80? 98:70,
    시끄[0].nm+'의 어지러움 '+Math.round(시끄[0].unrest),
    '오래 두면 조정을 등진다. 진휼로 눌러 두거나 수령을 좋은 사람으로 바꾼다.',
    ()=>{ G.sel=시끄[0].id; });

  /* 위태로운 국경 — 다만 '셀 수 있다'와 '칠 것 같다'는 다르다.
     명은 늘 우리보다 세다. 그것만으로 겁을 주면 길잡이가 늑대를 부르는 꼴이 된다.
     사이가 좋고 조약이 있으면 센 이웃도 당장의 위험은 아니다.
     여러 곳이 걸려도 한 줄로 묶는다 — 같은 말을 네 번 하면 아무 말도 아니다. */
  const 위태목록=[];
  우리.forEach(P=>{
    const t=threatOf(P);
    if(!t || t.p<=0.55 || t.마음<0.35) return;
    위태목록.push(Object.assign({P}, t));
  });
  if(위태목록.length){
    위태목록.sort((a,b)=>(b.p*b.마음)-(a.p*a.마음));
    const w0=위태목록[0], 여럿=위태목록.length>1;
    더(Math.round(58 + w0.p*22 + w0.마음*20),
      여럿? ('국경 '+위태목록.length+'곳이 위태롭다') : (w0.P.nm+이가(w0.P.nm)+' 위태롭다'),
      (여럿? '가장 급한 곳은 '+w0.P.nm+'. ' : '')
      + w0.처.nm+이가(w0.처.nm)+' 밀면 '+Math.round(w0.p*100)+'%로 진다'
      + (w0.언제===0? ' — 이미 밀고 있다.' : w0.언제===1? ' — 한 해 거리에 와 있다.' : '.')
      + (w0.d && !w0.d.war && w0.d.rel<40 && w0.언제>1
          ? '  '+natName(w0.처.nat)+과와(natName(w0.처.nat))+'의 사이를 올려 두면 먼저 물지 않는다 — 사신이 성보다 싸다.'
          : '  모병으로 군사를 두거나 성을 쌓는다. 군을 보내 야전으로 걷어 낼 수도 있다.'),
      ()=>{ G.sel=w0.P.id; });
  }

  /* 나라의 민심과 정통 — 고을 하나가 아니라 판 전체가 기울 때.
     고을마다의 어지러움은 위에서 짚지만, 그 어지러움을 끌어올리는 뿌리는
     여기다. 눈금이 붉어져 있는데 아무도 말해 주지 않으면 까닭을 모른 채 진다. */
  if(N.stab<32) 더(N.stab<16? 94:70, '민심이 '+Math.round(N.stab),
    '민심이 바닥나면 고을이 절로 시끄러워지고 끝내 조정을 등진다. 진휼과 종묘의 예로 올린다.', null);
  if(G.legit<34) 더(G.legit<18? 82:56, '정통이 '+Math.round(G.legit),
    '정통이 낮으면 사화가 잦고 고을이 먼저 등을 돌린다. 종묘의 예를 올리고 싸움을 줄인다.', null);

  /* 곳간 */
  if(N.food < N.army/1000*4 + N.pop/9500) 더(88,
    '곡식이 한 해를 못 넘긴다',
    '먹을 것이 모자라면 굶고, 군대가 흩어지고, 온 고을이 시끄러워진다. 개간하거나 군사를 줄인다.',
    null);
  if(N.gold < 200 && G.era<3) 더(60,
    '국고가 얕다', '녹봉이 밀리면 신하의 충성이 떨어진다. 장을 열어 세입을 늘린다.', null);

  DIP_NATS.forEach(k=>{ const d=dipOf(k); if(!d) return;

  /* 판 위의 군 — 세워 두고 잊으면 그 자리에서 녹는다 */
  const 우리군=armyList('kor');
  const 멈춘=우리군.filter(a=>!a.dest && G.provs[a.at] && G.provs[a.at].nat==='kor');
  if(멈춘.length) 더(70, '군 '+멈춘.length+'이 멈춰 서 있다',

  const 포위중=우리군.filter(a=>a.siege>0);
  if(포위중.length){

  }
  const 밀림=(G.armies||[]).filter(a=>a.nat!=='kor' && G.provs[a.at] && G.provs[a.at].nat==='kor');
  if(밀림.length){
    const A=밀림.sort((a,b)=>b.siege-a.siege)[0], q=G.provs[A.at];
    더(96, (q?q.nm:'')+(q?이가(q.nm):'')+' 포위당했다 '+Math.round(A.siege)+'%',
      natName(A.nat)+'의 군 '+num(A.men)+'이 성을 밀고 있다. '

  /* 다가오는 일 — 가까울수록 급해진다. 가장 위에 서야 하는 줄이다. */
  const 조짐=omenNow();
  if(조짐){
    const {O,남}=조짐;
    const 급 = 남<=3? 96 : 남<=7? 82 : 남<=12? 68 : 56;
    const 볼곳=O.본다();
    더(급, 남+'해 뒤 — '+O.나, O.말+'  '+O.채비,
      볼곳.length? ()=>{ const p=볼곳.find(id=>G.provs[id]&&G.provs[id].nat==='kor');
                         if(p){ G.sel=p; G.mapFocus='korea'; } }
                 : ()=>{ G.tab='기술'; });

  /* 반군 — 번지기 전에 잡거나 달래야 한다 */
  {
    const 반=Object.values(G.provs).filter(p=>p.nat==='reb');
    if(반.length){
      const 불=반.filter(p=>p.rebFire>0).length;
      더(불? 90:62, '반군이 일어섰다 — '+반.length+'곳'+(불? ' (번지는 중 '+불+')':''),
        '칼로 치면 빠르지만 백성이 상하고, 사면과 회유로 달래면 스스로 돌아온다. 고을을 골라 회유하거나 군을 보낸다.',
        ()=>{ G.sel=반[0].id; G.mapFocus='korea'; });
    }
  }

  /* 왕조 교체기 — 역사가 조선에 준 몇 안 되는 틈 */
  DIP_NATS.forEach(k=>{
    const N2=G.nations[k];
    if(N2 && N2.chaos>0) 더(78, natName(k)+' 땅이 어지럽다 — '+N2.chaos+'해의 틈',
      '왕조가 갈리는 중이라 군을 내지 못하고 성이 무르다(수비 −18%). 칠 것이면 지금이고, 아니면 성을 쌓아 둘 때다.',
      ()=>{ G.tab='외교'; });
  });

  /* 이웃끼리의 사이 — 틈이 열렸는지, 사이에 끼었는지 */
  const C=G.cj;
  if(C && C.war) 더(72, natName('chn')+과와(natName('chn'))+' '+natName('jpn')+이가(natName('jpn'))+' 서로 싸운다',
    '둘 다 군사를 그쪽으로 돌린 동안은 조선을 덜 본다. 지금이 성을 쌓고 북쪽을 볼 틈이다. '
    + '말리면 정통이 오른다 — 중재는 값이 비싸다.', ()=>{ G.tab='외교'; });
  else if(C && C.ally) 더(86, natName('chn')+과와(natName('chn'))+' '+natName('jpn')+이가(natName('jpn'))+' 손을 잡았다',
    '조선이 사이에 끼었다. 둘 다 조선 쪽으로 더 나온다. 한쪽과 사이를 트거나 이간으로 벌려 놓는다.',
    ()=>{ G.tab='외교'; });
  else if(C && C.rel<=-34 && !C.truce) 더(54, natName('chn')+과와(natName('chn'))+' '+natName('jpn')+이가(natName('jpn'))+' 서로 흘긴다',
    '사이가 '+Math.round(C.rel)+'이다. 조금만 더 벌려 두면 저희끼리 붙는다 — 이간은 값이 싸다.',
    ()=>{ G.tab='외교'; });

  /* 붕당 */
  const fs=Object.keys(G.factions), 고름=100/Math.max(1,fs.length);
  const 센당=fs.find(f=>G.factions[f]>고름+22);
  if(센당) 더(66, 센당+'이 조정을 쥐었다',
    '한 당이 자리를 너무 많이 쥐면 사화가 난다. 다른 당의 신하를 수령으로 보내면 몫이 돌아온다.',
    ()=>{ G.tab='신하'; });

  /* 점령지 */
  const 넘침=overExtend();
  if(넘침) 더(84, '점령지가 '+넘침+'곳 넘친다',
    '지고 갈 수 있는 것보다 많이 쥐면 해마다 민심과 정통이 깎인다. 수령을 두어 편입을 서두르거나 놓아준다.', null);

  /* 나라의 큰 일 — 국고가 두터운데 도감이 논다 */
  {
    const WK=G.works||{done:{},b:null};
    const 할것=WORKS.filter(W=>!WK.done[W.id] && G.era>=W.era);
    if(!WK.b && 할것.length && N.gold>=할것[0].cost*1.3)
      더(56, '국고가 두텁다 — 나라의 큰 일을 벌일 때다',
        '「'+할것[0].nm+'」'+을를(할것[0].nm)+' 세울 수 있다. '+할것[0].good+'  정책 판에서 시작한다.',
        ()=>{ G.tab='정책'; });
  }

  /* 정책 자리 */
  if(G.policies.length<3){
    const 열린=POLICIES.filter(P=>G.era>=P.era && !G.policies.includes(P.id)
      && !conflictOf(P.id).length && N.gold>=P.cost*1.5);
    if(열린.length) 더(52, '정책 자리가 '+(3-G.policies.length)+' 비었다',
      '「'+열린[0].nm+'」'+을를(열린[0].nm)+' 펼 수 있다. 얻는 것과 잃는 것을 견주어 고른다.',
      ()=>{ G.tab='정책'; });
  }

  /* 등용 대기 */
  if(G.pool.length && G.officials.length < 우리.length+2 && N.gold>=40)
    더(50, '등용을 기다리는 사람이 '+G.pool.length+'명',
      '고을 수보다 신하가 적으면 빈 고을이 생긴다.', ()=>{ G.tab='신하'; });

  out.sort((a,b)=>b.급함-a.급함);
  return out;
}
function adviceCol(급함){ return 급함>=88? '#c4534a' : 급함>=70? '#e0bd76' : 'rgba(150,145,135,.9)'; }

/* ================================================================
   소리
   ----------------------------------------------------------------
   음원 파일을 두지 않는다. 이 놀이는 파일 하나로 돌아가는 것이 규칙이므로,
   소리도 그 자리에서 만들어 쓴다(Web Audio).
   악기는 셋이면 넉넉하다 — 북, 징, 그리고 뜯는 줄.
   여기에 숨소리 섞인 피리를 더해 시대마다 빛깔을 달리한다.

   브라우저는 사람이 한 번 누르기 전에는 소리를 내주지 않는다.
   그래서 첫 누름에서 깨운다. 깨우지 못해도 놀이는 그대로 돈다.
   ================================================================ */
const SND={
  ctx:null, master:null, busSfx:null, busMus:null, comp:null,
  on:{ sfx:true, mus:true }, vol:{ sfx:0.55, mus:0.30 },
  ready:false, failed:false
};
function sndLoad(){
  try{
    const d=JSON.parse(localStorage.getItem(CFG.SOUND)||'null');
    if(d){ if(d.on) Object.assign(SND.on,d.on); if(d.vol) Object.assign(SND.vol,d.vol); }
  }catch(e){}
}
function sndSave(){
  try{ localStorage.setItem(CFG.SOUND, JSON.stringify({on:SND.on, vol:SND.vol})); }catch(e){}
}
function sndInit(){
  if(SND.ctx || SND.failed) return;
  const AC = (typeof AudioContext!=='undefined')? AudioContext
           : (typeof webkitAudioContext!=='undefined')? webkitAudioContext : null;
  if(!AC){ SND.failed=true; return; }
  try{
    const c=new AC();
    SND.ctx=c;
    // 여러 소리가 겹쳐도 찢어지지 않게 눌러 준다
    SND.comp=c.createDynamicsCompressor();
    SND.comp.threshold.value=-14; SND.comp.ratio.value=6; SND.comp.attack.value=0.005;
    SND.master=c.createGain(); SND.master.gain.value=0.9;
    SND.busSfx=c.createGain(); SND.busSfx.gain.value=SND.vol.sfx;
    SND.busMus=c.createGain(); SND.busMus.gain.value=SND.vol.mus;
    SND.busSfx.connect(SND.comp); SND.busMus.connect(SND.comp);
    SND.comp.connect(SND.master); SND.master.connect(c.destination);
    SND.ready=true;
  }catch(e){ SND.failed=true; }
}
/* 사람이 처음 누를 때 깨운다 */
function sndWake(){
  sndInit();
  if(SND.ctx && SND.ctx.state==='suspended'){ try{ SND.ctx.resume(); }catch(e){} }
}
function sndApply(){
  if(!SND.ready) return;
  SND.busSfx.gain.value = SND.on.sfx? SND.vol.sfx : 0;
  SND.busMus.gain.value = SND.on.mus? SND.vol.mus : 0;
}

/* ── 악기 ── */
function sEnv(t0, a, d, peak, bus){
  const c=SND.ctx, g=c.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak), t0+a);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+a+d);
  g.connect(bus||SND.busSfx);
  return g;
}
/* 뜯는 줄 — 가야금·거문고. 톱니를 낮은 거름으로 훑어 내린다. */
function sPluck(freq, t0, dur, peak, bus){
  const c=SND.ctx;
  const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=freq;
  const f=c.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(freq*7+900, t0);
  f.frequency.exponentialRampToValueAtTime(Math.max(220,freq*1.6), t0+dur*0.85);
  f.Q.value=1.2;
  const g=sEnv(t0, 0.006, dur, peak, bus);
  o.connect(f); f.connect(g);
  o.start(t0); o.stop(t0+dur+0.05);
}
/* 피리·대금 — 숨소리를 조금 섞고 떨림을 준다 */
function sFlute(freq, t0, dur, peak, bus){
  const c=SND.ctx;
  const o=c.createOscillator(); o.type='triangle'; o.frequency.value=freq;
  const lfo=c.createOscillator(); lfo.frequency.value=5.2;
  const lg=c.createGain(); lg.gain.value=freq*0.008;
  lfo.connect(lg); lg.connect(o.frequency);
  const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(peak, t0+dur*0.25);
  g.gain.setValueAtTime(peak, t0+dur*0.7);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  g.connect(bus||SND.busSfx);
  o.connect(g);
  o.start(t0); o.stop(t0+dur+0.05);
  lfo.start(t0); lfo.stop(t0+dur+0.05);
}
/* 북 — 낮은 소리가 뚝 떨어지고, 가죽 소리를 얹는다 */
function sDrum(t0, peak, pitch, bus){
  const c=SND.ctx;
  const o=c.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(pitch||140, t0);
  o.frequency.exponentialRampToValueAtTime((pitch||140)*0.35, t0+0.16);
  const g=sEnv(t0, 0.004, 0.30, peak, bus);
  o.connect(g); o.start(t0); o.stop(t0+0.4);
  sNoise(t0, 0.05, peak*0.5, 1400, bus);
}
/* 징 — 어울리지 않는 배음을 겹쳐 길게 끈다 */
function sGong(t0, peak, base, bus){
  const c=SND.ctx, f0=base||196;
  [1, 2.37, 3.41, 4.72, 6.1].forEach((r,i)=>{
    const o=c.createOscillator(); o.type='sine'; o.frequency.value=f0*r;
    const g=sEnv(t0+i*0.008, 0.01, 2.6-i*0.28, peak/(1.6+i*1.5), bus);
    o.connect(g); o.start(t0); o.stop(t0+3.2);
  });
  sNoise(t0, 0.25, peak*0.28, 2600, bus);
}
/* 바람·쇳소리 — 잡음을 걸러 쓴다 */
function sNoise(t0, dur, peak, cut, bus){
  const c=SND.ctx;
  const n=Math.max(1,Math.floor(c.sampleRate*dur));
  const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||3000;
  const g=sEnv(t0, 0.004, dur, peak, bus);
  src.connect(f); f.connect(g); src.start(t0); src.stop(t0+dur+0.05);
}

/* ── 무슨 소리를 낼 것인가 ── */

  bad:     t=>{ sPluck(233,t,0.25,0.10); sPluck(220,t+0.09,0.3,0.08); }
};
let SFX_LAST={};
function snd(name, gap){
  if(!SND.ready || !SND.on.sfx || !SFX[name]) return;
  const c=SND.ctx, t=c.currentTime+0.01;
  // 같은 소리가 한꺼번에 몰리면 귀가 아프다
  if(SFX_LAST[name] && t-SFX_LAST[name] < (gap==null?0.06:gap)) return;
  SFX_LAST[name]=t;
  try{ SFX[name](t); }catch(e){}
}

/* ================================================================
   배경음 — 시대마다 다른 가락
   ----------------------------------------------------------------
   가락을 미리 적어 두지 않는다. 오음계에서 몇 음을 골라 느리게 놓고,
   나라 형편(전쟁·민심)에 따라 빛깔을 바꾼다. 같은 판이 두 번 나오지 않는다.
   ================================================================ */
const MUS={ next:0, step:0, root:0 };
/* 평조·계면조 — 조선 음악의 다섯 음 */
const SCALE_PYEONG=[0,2,4,7,9], SCALE_GYEMYEON=[0,3,5,7,10];
function musEra(){
  const e=G? G.era : 0;
  //      빠르기   높이   피리 섞임   북
  const T=[[2.05,  -5, 0.30, 0.00],   // 조선 전기 — 성기고 느리다
           [1.55, -12, 0.20, 0.55],   // 임진왜란 — 북이 들어온다
           [1.90,  -7, 0.34, 0.10],   // 조선 후기
           [1.70,  -3, 0.40, 0.14],   // 개항
           [1.60,  -8, 0.26, 0.20],   // 식민 — 낮고 어둡다
           [1.65,   0, 0.42, 0.12],   // 해방
           [1.35,   2, 0.30, 0.26],   // 산업화 — 걸음이 빨라진다
           [1.25,   4, 0.36, 0.18]];  // 현대
  return T[Math.min(T.length-1, e)];
}
function musicTick(){
  if(!SND.ready || !SND.on.mus || !G) return;
  const c=SND.ctx;
  if(c.state!=='running') return;
  const [beat, shift, breath, drum] = musEra();
  if(!MUS.next) MUS.next=c.currentTime+0.2;
  let guard=0;
  while(MUS.next < c.currentTime+1.2 && guard++<8){
    const t=MUS.next, s=MUS.step;
    const 전쟁 = DIP_NATS.some(k=>dipOf(k)&&dipOf(k).war);
    const 어렵 = G.nations.kor.stab<35 || G.ended;
    // 어지러운 때에는 계면조로 내려앉는다
    const sc = (전쟁||어렵)? SCALE_GYEMYEON : SCALE_PYEONG;
    const base = 220*Math.pow(2,(shift+(어렵?-2:0))/12);
    const f = n => base*Math.pow(2, n/12);
    // 여덟 걸음마다 한 번, 낮은 줄로 바닥을 깐다
    if(s%8===0) sPluck(f(sc[0]-12), t, beat*3.2, 0.055, SND.busMus);
    // 가락 — 늘 울리지 않는다. 빈 곳이 있어야 가락이 된다.
    if(Math.random()<0.62){
      const n=sc[Math.floor(Math.random()*sc.length)] + (Math.random()<0.25?12:0);
      sPluck(f(n), t, beat*1.5, 0.075, SND.busMus);
      if(Math.random()<breath) sFlute(f(n)*2, t+beat*0.35, beat*0.9, 0.030, SND.busMus);
    }
    // 북 — 전쟁이면 반드시 울린다
    const 북확률 = 전쟁? Math.max(0.5,drum+0.35) : drum;
    if(s%4===0 && Math.random()<북확률) sDrum(t, 전쟁?0.13:0.085, 전쟁?104:120, SND.busMus);
    MUS.step++; MUS.next += beat*(0.9+Math.random()*0.2);
  }
}

/* ================================================================
   움직임
   ----------------------------------------------------------------
   예전에는 고을을 빼앗아도 칠이 한 번 바뀔 뿐이었다. 육백 년이 걸린
   전쟁이 눈금 하나로 끝나면, 그 전쟁은 일어나지 않은 것과 같다.

   여기서는 화면을 한 겹 더 얹는다. 군사가 건너가고, 부딪히고, 먹이 튀고,
   화면이 흔들리고, 빼앗긴 땅의 빛이 천천히 넘어온다.
   판정은 이미 끝난 뒤다 — 이 겹은 규칙에 손대지 않고 보여 주기만 한다.
   ================================================================ */
const FX=[];
let NOW=0, DT=0, SHAKE=0;
/* 떠오르는 글자.
   ----------------------------------------------------------------
   한 해에 고을 여럿이 한꺼번에 넘어가면 — 무너지는 판에서는 흔한 일이다 —
   같은 자리에 붉은 글이 포개져 읽을 수 없는 벽이 된다. Space 로 해를
   빨리 넘길 때도 마찬가지다. 그래서 셋을 둔다.
     ① 살아 있는 글은 여덟 줄까지. 넘치면 오래된 것부터 걷는다.
     ② 뒤에 오는 글은 조금씩 늦게 뜬다 — 한꺼번에 터지지 않고 이어 읽힌다.
     ③ 그리는 때에 화면에서 겹치면 위로 밀어 올린다 (stackFloats).           */
const FLOAT_MAX=8;
function fx(o){
  const f=Object.assign({t:0, life:1}, o);
  if(f.kind==='float'){
    const 산것=FX.filter(x=>x.kind==='float');
    if(산것.length>=FLOAT_MAX){
      const 늙은=산것.reduce((a,b)=> (b.t-(b.delay||0))>(a.t-(a.delay||0))? b:a);
      FX.splice(FX.indexOf(늙은),1);
    }
    if(f.delay===undefined) f.delay=Math.min(산것.length,FLOAT_MAX-1)*0.09;
  }
  FX.push(f);
}
function fxTick(dt){
  for(let i=FX.length-1;i>=0;i--){
    const f=FX[i]; f.t+=dt;
    // 늦게 시작하는 겹 — 군사가 닿은 뒤에 부딪히는 소리가 나야 한다
    if(!f.fired && f.t>=(f.delay||0)){
      f.fired=true;
      if(f.shake) shake(f.shake);
      if(f.snd) snd(f.snd, 0);
    }
    if(f.t>=f.life+(f.delay||0)) FX.splice(i,1);
  }
  SHAKE=Math.max(0, SHAKE - dt*2.6);
  // 임자가 바뀐 고을의 빛이 넘어오는 중
  if(G && G.provs) for(const k in G.provs){
    const P=G.provs[k];
    if(P.fxNat && P.fxNat.t<1) P.fxNat.t=Math.min(1, P.fxNat.t + dt*0.9);
  }
}
function shake(v){ SHAKE=Math.min(1.4, SHAKE+v); }
/* 고을의 자리.
   지도 안쪽에서 그리는 좌표계는 순수한 지도 좌표가 아니라 CFG.GX/GY 만큼
   밀려 있다(beginMapView 를 보라). 이름표도 그 자리에 놓이므로 여기서도 맞춘다.
   — 처음에 이 몫을 빼먹어 효과가 지도 왼쪽 위로 백여 픽셀 달아났다. */
function fxAt(id){
  const R=MAPVIS && MAPVIS.regions[id];
  return R? {x:CFG.GX+R.anchor[0], y:CFG.GY+R.anchor[1]} : null;
}
/* 두 빛깔을 섞는다 — 임자가 바뀔 때 천천히 넘어가게 */
function hex2rgb(h){
  const v=parseInt(h.slice(1),16);
  return [(v>>16)&255,(v>>8)&255,v&255];
}
function mixCol(a,b,t){
  const A=hex2rgb(a), B=hex2rgb(b);
  return 'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')';
}
/* 지금 이 고을을 어떤 빛으로 칠할 것인가 */
function natColOf(P){
  const now=NATIONS[P.nat].col;
  if(P.fxNat && P.fxNat.t<1){
    return mixCol(NATIONS[P.fxNat.prev].col, now, clamp(P.fxNat.t,0,1));
  }
  return now;
}

/* 싸움을 보여 주던 fxBattle 도 걷어냈다 — 고을이 고을을 치던 때의 것이다.
   지금은 fieldBattle 이 야전을, siegeTick 이 포위를 제 자리에서 보여 준다. */
/* 임자가 바뀌었다 — 싸움 없이 넘어간 때(반란·편입)에도 쓴다 */
function fxFlip(P, prevNat, text, col){
  const a=fxAt(P.id); if(!a) return;
  P.fxNat={ prev:prevNat, t:0 };
  fx({ kind:'ring', life:1.0, at:a, col:col||'#c9a24a' });
  if(text) fx({ kind:'float', life:1.9, at:{x:a.x,y:a.y-8}, text, col:col||'#c9a24a', size:12 });
}
/* 흙먼지 — 무엇을 지으면 그 자리에서 인다 */
function fxDust(id, col, n){
  const a=fxAt(id); if(!a) return;
  for(let i=0;i<(n||6);i++){
    const ang=Math.random()*Math.PI*2, sp=6+Math.random()*16;
    fx({ kind:'dust', life:0.9+Math.random()*0.6, at:{x:a.x,y:a.y},
         vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp*0.5-10-Math.random()*10,
         r:1.2+Math.random()*1.8, col:col||'#cfc7b6' });
  }
}
/* 고을에서 뭔가 좋은 일이 일어났다 */
function fxPop(id, text, col){
  const a=fxAt(id); if(!a) return;
  fx({ kind:'float', life:1.4, at:{x:a.x,y:a.y-6}, text, col:col||'#8fa86a', size:11 });
}

/* 겹치는 글자를 위로 밀어 올린다.
   글자는 지도 좌표에 놓이지만 화면에서는 늘 같은 크기로 읽히므로(inv),
   비켜 세우는 거리도 inv 를 따라야 배율이 달라져도 한 줄씩 떨어진다. */
function stackFloats(inv){
  const fs=FX.filter(f=>f.kind==='float' && f.t>=(f.delay||0));
  const 놓음=[];
  fs.sort((a,b)=> (a.at.y-b.at.y) || (a.at.x-b.at.x));
  fs.forEach(f=>{
    const s=(f.size||11)*inv;
    const w=(f.text? f.text.length:2)*s*0.62, h=s+5*inv;
    let y=f.at.y, 안전=0, 밀림=true;
    while(밀림 && 안전++<FLOAT_MAX*2){
      밀림=false;
      for(const p of 놓음){
        if(Math.abs(f.at.x-p.x) > (w+p.w)/2) continue;
        if(Math.abs(y-p.y) < (h+p.h)/2){ y=p.y-(h+p.h)/2; 밀림=true; }
      }
    }
    f.off=f.at.y-y;
    놓음.push({x:f.at.x, y, w, h});
  });
}

/* ── 효과를 그린다 — 지도 안쪽 좌표계에서 ── */
function drawFX(g, inv){
  stackFloats(inv);
  FX.forEach(f=>{
    const tt=f.t-(f.delay||0);
    if(tt<0) return;                       // 아직 차례가 아니다
    const k=clamp(tt/f.life,0,1);
    g.save();
    if(f.kind==='yearSweep'){
      // 지도 위를 왼쪽에서 오른쪽으로 지나가는 빛
      const V=activeMapView(), z=V.zoom;
      const x0=V.x, x1=V.x+VIEW.w/z, y0=V.y, y1=V.y+VIEW.h/z;
      const w=(x1-x0)*0.22, cx=lerp(x0-w, x1+w, k);
      const gr=g.createLinearGradient(CFG.GX+cx-w, 0, CFG.GX+cx+w, 0);
      const a2=(1-Math.abs(k*2-1))*0.16;
      gr.addColorStop(0,'rgba(255,244,206,0)');
      gr.addColorStop(0.5,'rgba(255,244,206,'+a2.toFixed(3)+')');
      gr.addColorStop(1,'rgba(255,244,206,0)');
      g.fillStyle=gr;
      g.fillRect(CFG.GX+cx-w, CFG.GY+y0, w*2, y1-y0);
      g.restore(); return;
    }
    if(f.kind==='dust'){
      // 흙먼지 — 지은 자리에서 튀어 오르다 가라앉는다
      const px=f.at.x+f.vx*tt, py=f.at.y+f.vy*tt+38*tt*tt;
      g.globalAlpha=(1-k)*0.8;
      g.fillStyle=f.col;
      g.beginPath(); g.arc(px,py,f.r*(1-k*0.4)*inv,0,7); g.fill();
      g.restore(); return;
    }
    if(f.kind==='march'){
      // 군사가 건너간다 — 점선이 흘러가고 화살촉이 앞선다
      const e=clamp(k/0.55,0,1);
      const x=lerp(f.a.x,f.b.x,e), y=lerp(f.a.y,f.b.y,e);
      const mx=(f.a.x+f.b.x)/2, my=(f.a.y+f.b.y)/2 - Math.hypot(f.b.x-f.a.x,f.b.y-f.a.y)*0.22;
      g.globalAlpha=(1-k*k)*0.95;
      g.lineCap='round';
      g.strokeStyle='rgba(8,10,12,.55)'; g.lineWidth=5.2*inv;
      g.beginPath(); g.moveTo(f.a.x,f.a.y); g.quadraticCurveTo(mx,my,x,y); g.stroke();
      g.strokeStyle=f.col; g.lineWidth=2.8*inv; g.setLineDash([6*inv,5*inv]);
      g.lineDashOffset=-tt*54*inv;
      g.beginPath(); g.moveTo(f.a.x,f.a.y); g.quadraticCurveTo(mx,my,x,y); g.stroke();
      g.setLineDash([]);
      const ang=Math.atan2(f.b.y-f.a.y, f.b.x-f.a.x), sz=8*inv;
      g.fillStyle=f.col; g.strokeStyle='rgba(8,10,12,.7)'; g.lineWidth=1.2*inv;
      g.beginPath(); g.moveTo(x+Math.cos(ang)*sz*1.8, y+Math.sin(ang)*sz*1.8);
      g.lineTo(x+Math.cos(ang+2.5)*sz, y+Math.sin(ang+2.5)*sz);
      g.lineTo(x+Math.cos(ang-2.5)*sz, y+Math.sin(ang-2.5)*sz);
      g.closePath(); g.fill(); g.stroke();
    }
    else if(f.kind==='provFlash'){
      // 고을 자체가 번쩍인다 — 어디서 일어난 일인지 한눈에 든다
      const p=MAPVIS && MAPVIS.rect[f.id];
      if(p){
        const pulse=Math.max(0, Math.sin(k*Math.PI))*(1-k*0.4);
        g.globalAlpha=pulse*0.55;
        g.fillStyle= f.won? 'rgba(248,236,190,1)' : 'rgba(196,83,74,1)';
        g.save(); g.translate(CFG.GX,CFG.GY); g.fill(p,'evenodd'); g.restore();
      }
    }
    else if(f.kind==='clash'){
      // 부딪힘 — 먹이 튀듯 갈래로 뻗는다
      const n=14;
      for(let i=0;i<n;i++){
        const a2=(i/n)*Math.PI*2 + f.at.x*0.7;
        const d=(10+hash2(i,3)*44)*Math.sqrt(k)*inv;
        g.globalAlpha=(1-k)*0.95;
        g.strokeStyle= f.won? 'rgba(250,238,196,.98)' : 'rgba(214,92,80,.98)';
        g.lineWidth=(1-k)*3.4*inv; g.lineCap='round';
        g.beginPath();
        g.moveTo(f.at.x+Math.cos(a2)*d*0.30, f.at.y+Math.sin(a2)*d*0.30);
        g.lineTo(f.at.x+Math.cos(a2)*d, f.at.y+Math.sin(a2)*d);
        g.stroke();
      }
      g.globalAlpha=(1-k)*0.75;
      g.fillStyle= f.won? 'rgba(255,246,214,.95)':'rgba(214,92,80,.95)';
      g.beginPath(); g.arc(f.at.x,f.at.y,(3+16*(1-k))*inv,0,7); g.fill();
    }
    else if(f.kind==='ring'){
      g.globalAlpha=(1-k)*0.9;
      g.strokeStyle=f.col; g.lineWidth=(3.4*(1-k)+0.5)*inv;
      g.beginPath(); g.arc(f.at.x,f.at.y,(6+56*k)*inv,0,7); g.stroke();
      g.globalAlpha=(1-k)*0.45;
      g.beginPath(); g.arc(f.at.x,f.at.y,(6+34*k)*inv,0,7); g.stroke();
    }
    else if(f.kind==='smoke'){
      // 불탄 자리 — 연기가 천천히 오른다
      for(let i=0;i<4;i++){
        const p=(k+i*0.25)%1;
        g.globalAlpha=(1-p)*0.34*(1-k);
        g.fillStyle='rgba(64,60,54,1)';
        g.beginPath();
        g.arc(f.at.x+Math.sin(p*4+i)*6*inv, f.at.y-p*30*inv, (4+p*11)*inv, 0, 7);
        g.fill();
      }
    }
    else if(f.kind==='float'){
      // 떠오르는 글자 — 화면에서 늘 같은 크기로 읽히게 한다
      const size=(f.size||11)*inv;
      g.globalAlpha=k<0.12? k/0.12 : Math.min(1,(1-k)*2.2);
      g.font='700 '+size+'px serif'; g.textAlign='center';
      g.lineWidth=3.4*inv; g.strokeStyle='rgba(8,10,12,.92)';
      const y=f.at.y - (f.off||0) - k*(f.rise||16)*inv;
      g.strokeText(f.text, f.at.x, y); g.fillStyle=f.col; g.fillText(f.text, f.at.x, y);

function quote(admCost, baseCost){
  const N=G.nations.kor, 손=(N.adm||0)>=admCost, 별칙=!손;

   지도판은 바뀔 때만 다시 굽는다.
   ================================================================ */
const PAL={ paper:'#e7ddc4', ink:'#2c2822', gold:'#8a6a2f', red:'#9d3b32' };
const WASH={ kor:'rgba(79,127,181,.26)', chn:'rgba(181,101,79,.24)',
             jpn:'rgba(138,111,174,.24)', ind:'rgba(111,138,114,.24)',
             reb:'rgba(160,82,63,.26)' };
/* 강 — 격자 좌표 폴리라인 */
const RIVERS=[
  [[47,11],[50,11],[53,10],[56,11]],                      // 압록·두만
  [[57,19],[55,19],[53,19],[51,20],[49,20]],              // 한강
  [[18,13],[24,14],[29,15],[34,15],[38,16]],              // 황하
  [[12,21],[18,22],[24,23],[30,23],[35,23],[39,23]]       // 양자강
];

function jit(x,y){ return [x+(hash2(x,y)-.5)*.5, y+(hash2(y+31,x+17)-.5)*.5]; }
function traceLoops(test){
  const out=new Map(), key=(a,b)=>a+','+b;
  const add=(ax,ay,bx,by)=>{ const k=key(ax,ay); if(!out.has(k)) out.set(k,[]); out.get(k).push([bx,by]); };
  for(let y=0;y<CFG.GH;y++) for(let x=0;x<CFG.GW;x++){
    if(!test(x,y)) continue;
    if(!test(x,y-1)) add(x,y,x+1,y);
    if(!test(x+1,y)) add(x+1,y,x+1,y+1);
    if(!test(x,y+1)) add(x+1,y+1,x,y+1);
    if(!test(x-1,y)) add(x,y+1,x,y);
  }
  const loops=[];
  while(out.size){
    const sk=out.keys().next().value, s=sk.split(',').map(Number);
    let cx=s[0], cy=s[1]; const loop=[]; let guard=0;
    while(guard++<20000){
      const k=key(cx,cy), arr=out.get(k);
      if(!arr||!arr.length){ out.delete(k); break; }
      const n=arr.pop(); if(!arr.length) out.delete(k);
      loop.push([cx,cy]); cx=n[0]; cy=n[1];
      if(cx===s[0]&&cy===s[1]) break;
    }
    if(loop.length>3) loops.push(loop);
  }
  return loops;
}
function chaikin(p,it){
  for(let k=0;k<it;k++){ const q=[];
    for(let i=0;i<p.length;i++){ const a=p[i], b=p[(i+1)%p.length];
      q.push([a[0]*.75+b[0]*.25, a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75, a[1]*.25+b[1]*.75]); }
    p=q; }
  return p;
}
function pathOf(test,iter){
  const C=CFG.CELL, path=new Path2D();
  traceLoops(test).forEach(loop=>{
    const s=chaikin(loop.map(([x,y])=>jit(x,y)), iter===undefined?3:iter);
    path.moveTo(s[0][0]*C, s[0][1]*C);
    for(let i=1;i<s.length;i++) path.lineTo(s[i][0]*C, s[i][1]*C);
    path.closePath();
  });
  return path;
}

    const x=Math.random()*w, y=Math.random()*h, r=30+Math.random()*170;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0, Math.random()<.5?'rgba(146,116,64,.045)':'rgba(255,252,240,.06)');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  g.lineWidth=1;
  for(let i=0;i<1400;i++){
    const x=Math.random()*w, y=Math.random()*h, L=5+Math.random()*24;
    const a=(Math.random()<.5?0:Math.PI/2)+(Math.random()-.5)*.45;
    g.strokeStyle=Math.random()<.5?'rgba(120,98,62,.055)':'rgba(255,253,244,.07)';
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*L, y+Math.sin(a)*L); g.stroke();
  }
  const vg=g.createRadialGradient(w/2,h/2,Math.min(w,h)*.25,w/2,h/2,Math.max(w,h)*.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(92,66,30,.20)');
  g.fillStyle=vg; g.fillRect(0,0,w,h);
  return c;
}
function seaDist(){
  const d=[]; for(let y=0;y<CFG.GH;y++) d.push(new Array(CFG.GW).fill(-1));
  const q=[];
  for(let y=0;y<CFG.GH;y++) for(let x=0;x<CFG.GW;x++) if(G.land[y][x]){ d[y][x]=0; q.push([x,y]); }
  for(let h=0;h<q.length;h++){ const [x,y]=q[h];
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{ const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=CFG.GW||ny>=CFG.GH||d[ny][nx]>=0) return;
      d[ny][nx]=d[y][x]+1; q.push([nx,ny]); }); }
  return d;
}
/* ================================================================
   고을 — 지도 위에 실제로 서는 마을
   ----------------------------------------------------------------
   여태 개발 4인 고을과 40인 고을이 똑같이 생겼다. 다각형에 빛깔을 칠하고
   이름을 얹은 것이 전부였으니, 삼백 해를 개간하고 축성해도 지도는 첫해와
   같은 그림이었다. 눈금이 오르는 것을 숫자로만 알 수 있으면 그것은
   장부이지 지도가 아니다.

   이제 고을마다 마을을 그린다. 자리는 고을 이름을 씨앗으로 한 번 정해
   두고(TOWNLAY), 몇 채를 그릴지만 지금 눈금에서 가져온다. 그러면
     개간하면  논이 한 뙈기 는다
     장을 열면 저자에 깃발이 하나 선다
     축성하면  성벽이 한 칸 오른다
     모병하면  창대가 하나 는다
   자리가 늘 같으므로 '자란다'로 보이고, 새로 선 것만 솟아오른다.
   ================================================================ */
const TOWNLAY={};
/* 한 번만 정하는 자리들. 씨앗은 고을 id — 판을 다시 열어도 같은 마을이다. */
function townLayout(P){
  if(TOWNLAY[P.id]) return TOWNLAY[P.id];
  let n=0; for(let i=0;i<P.id.length;i++) n=(n*131+P.id.charCodeAt(i))>>>0;
  let s=n||1;
  const r=()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; };
  const 집=[], 논=[], 저자=[], 배=[], 창=[];
  // 집 — 가운데에 모이고 바깥으로 퍼진다
  for(let i=0;i<16;i++){
    const a=r()*Math.PI*2, d=(0.35+Math.sqrt(i/16)*1.5)*(0.8+r()*0.5);
    /* 넷째 값은 '기와냐'가 아니라 그냥 주사위 하나다 —
       무슨 지붕을 일지는 시대가 정한다(eraFace). 자리는 그대로 두고 얼굴만 바뀐다. */
    집.push([Math.cos(a)*d, Math.sin(a)*d*0.62, 0.8+r()*0.5, r()]);
  }
  // 논 — 마을 바깥의 네모난 뙈기
  for(let i=0;i<14;i++){
    const a=r()*Math.PI*2, d=1.9+r()*2.3;
    논.push([Math.cos(a)*d, Math.sin(a)*d*0.6, 0.9+r()*0.7, r()*0.5-0.25]);
  }
  for(let i=0;i<8;i++){ const a=r()*Math.PI*2, d=0.9+r()*0.7;
    저자.push([Math.cos(a)*d, Math.sin(a)*d*0.6, r()]); }
  for(let i=0;i<5;i++){ const a=(r()*0.9+0.3)*Math.PI, d=3.0+r()*1.6;
    배.push([Math.cos(a)*d, Math.sin(a)*d*0.7, r()]); }
  for(let i=0;i<10;i++){ const a=r()*Math.PI*2, d=1.3+r()*0.9;
    창.push([Math.cos(a)*d, Math.sin(a)*d*0.6, r()]); }
  return (TOWNLAY[P.id]={집,논,저자,배,창});
}
/* ================================================================
   시대의 얼굴
   ----------------------------------------------------------------
   1392년 지도와 1988년 지도가 초가 지붕 말고는 똑같았다. 육백 년을 지났다는
   실감이 나려면 지도가 늙어야 한다.

   자리는 건드리지 않는다. 같은 집이 초가에서 기와로, 벽돌로, 콘크리트로
   바뀔 뿐이다. 성벽은 개항 뒤에 헐리고, 그 자리에 굴뚝이 선다.
   ================================================================ */
function eraFace(){
  const e=(G&&G.era)||0;
  return {
    e,
    초가: e<=1? 0.62 : e===2? 0.42 : e===3? 0.22 : e===4? 0.08 : 0,
    양옥: e>=3,          // 벽돌·양식 건물이 섞이기 시작한다
    상자: e>=5,          // 네모난 콘크리트
    굴뚝: e>=4,          // 공장 굴뚝
    기선: e>=3,          // 돛 대신 연통
    성헐림: e>=4,        // 성벽이 헐린다 — 그림만 그렇고 셈은 그대로다
    논빛: e>=6? 'rgba(120,140,86,.5)' : 'rgba(126,148,74,.62)',
    몸빛: e>=5? 'rgba(104,100,96,.92)' : 'rgba(64,56,46,.92)'
  };
}
/* 이 집은 무슨 지붕을 이었는가 — 주사위 하나와 시대로 정한다 */
function roofKind(r, F){
  if(F.상자 && r>0.42) return '평';       // 평지붕 콘크리트
  if(F.양옥 && r>0.74) return '벽';       // 벽돌 양옥
  if(r < F.초가) return '초';
  return '와';
}
/* 마을의 크기 — 사람과 개발이 정한다 */
function townScale(P){
  return clamp(Math.pow(Math.max(1,P.pop)/260000, 0.34) * (0.62 + (P.dev||0)/46), 0.45, 2.4);
}
/* 새로 선 것은 솟아오른다 — 무엇을 지었는지 P.built 에 적어 둔다 */
function townBuilt(P, 무엇){
  P.built={ k:무엇, t:NOW };
  G.plateDirty=G.plateDirty;   // 판은 다시 굽지 않는다 — 마을은 실시간으로 그린다
}
function 솟음(P, 무엇){
  if(!P.built || P.built.k!==무엇) return 1;
  const t=(NOW-P.built.t)/0.9;
  return t>=1? 1 : clamp(t,0,1);
}
/* 고을 하나를 그린다. 지도 안쪽 좌표계에서 부른다. */
function drawTown(g, P, z){
  const R=MAPVIS.regions[P.id]; if(!R) return;
  /* 자리는 R.anchor 다. label 은 글자를 놓는 자리라 바다로 밀려 있는 것이 있다 —
     처음에 그것을 썼더니 개성이 바다 한가운데에 성을 쌓았다. */
  const x=CFG.GX+R.anchor[0], y=CFG.GY+R.anchor[1];
  const S=townScale(P), L=townLayout(P), F=eraFace();
  const 우리=P.nat==='kor';
  const col=NATIONS[P.nat].col, col2=NATIONS[P.nat].col2;
  /* 확대에 따라 보이는 것이 달라진다 —
     멀리서는 점 하나, 다가가면 지붕과 성벽, 더 다가가면 논과 저자가 나온다.
     한반도를 통째로 보는 자리에서 논두렁까지 그리면 마흔둘을 다 그리느라
     한 프레임이 31ms 로 늘어졌다(60프레임은 16.7ms 안에 끝나야 한다).
     나라 전체를 보는 눈에 이랑이 보일 까닭도 없다. */
  const 자세히 = z>=1.6, 아주자세히 = z>=4.0;
  const u=1.15*S;                                  // 한 칸의 크기
  /* 화면에서 몇 픽셀이나 되는가 — 두 픽셀짜리 마을에 지붕을 스물 그릴 까닭이 없다 */
  if(u*z < 2.4){

  }

    // 멀리서 — 크기만 보이는 덩어리
    g.fillStyle='rgba(58,48,38,.75)';
    g.beginPath(); g.ellipse(x,y+u*0.2,u*1.15,u*0.62,0,0,7); g.fill();
    g.fillStyle=col;
    g.beginPath(); g.arc(x,y,Math.max(1.1,u*0.42),0,7); g.fill();
    return;
  }
  g.save();
  /* ── 논밭 ── */
  if(아주자세히 && P.farm>0){
    const n=Math.min(L.논.length, Math.round(P.farm/3.4));
    const 새=솟음(P,'farm');
    const 뙈기=new Path2D(), 이랑=new Path2D();
    for(let i=0;i<n;i++){
      const [dx,dy,sz,tilt]=L.논[i];
      const k = (i===n-1)? 새 : 1;
      if(k<=0.02) continue;
      const w=u*1.05*sz*k, h=u*0.55*sz*k;
      const m=new DOMMatrix().translate(x+dx*u, y+dy*u).rotate(tilt*57.2958);
      const one=new Path2D(); one.rect(-w/2,-h/2,w,h);
      뙈기.addPath(one, m);
      const two=new Path2D();
      for(let j=1;j<3;j++){ two.moveTo(-w/2, -h/2+h*j/3); two.lineTo(w/2, -h/2+h*j/3); }
      이랑.addPath(two, m);
    }
    g.fillStyle= 우리? F.논빛 : 'rgba(104,118,72,.42)';
    g.fill(뙈기);
    g.lineWidth=Math.max(0.3,0.5/z);
    g.strokeStyle='rgba(52,58,34,.5)'; g.stroke(뙈기);
    g.strokeStyle='rgba(70,86,44,.45)'; g.stroke(이랑);
  }
  /* ── 성벽 — 남문을 비운 고리.
     개항 뒤로는 헐린다. 셈에서 성곽은 그대로 값을 하지만(규칙은 건드리지 않는다)
     그림으로는 끊긴 토막과 남은 문루만 남는다 — 실제로 그러했다. */
  if(P.fort>0){
    const 새=솟음(P,'wall');
    const rad=u*(1.05+P.fort*0.055);
    const 두께=Math.max(0.5, (0.5+P.fort*0.15)*(F.성헐림? 0.62 : 1));
    const 문=0.32;                                   // 남쪽으로 열린 문
    const 흐림=F.성헐림? 0.42 : 1;
    g.save(); g.translate(x,y); g.scale(1,0.60);
    g.lineCap='butt';
    if(F.성헐림) g.setLineDash([rad*0.5, rad*0.42]);
    g.strokeStyle='rgba(30,27,22,'+(0.9*흐림).toFixed(2)+')'; g.lineWidth=두께+0.8;
    g.beginPath(); g.arc(0,0,rad, Math.PI/2+문, Math.PI/2-문+Math.PI*2); g.stroke();
    g.strokeStyle= 우리? 'rgba(176,162,132,'+(0.95*흐림).toFixed(2)+')'
                       : 'rgba(136,128,112,'+(0.8*흐림).toFixed(2)+')';
    g.lineWidth=두께;
    g.beginPath(); g.arc(0,0,rad, Math.PI/2+문, Math.PI/2-문+Math.PI*2); g.stroke();
    g.setLineDash([]);
    // 망루 — 성곽 수만큼. 마지막 하나는 새로 쌓은 것이라 솟아오른다.
    const 망=F.성헐림? Math.min(3,P.fort) : Math.min(9,P.fort+2);
    for(let i=0;i<망;i++){
      const a=Math.PI/2+문 + (i/(망-0.001))*(Math.PI*2-문*2);
      const k=(i===망-1)? 새 : 1;
      if(k<=0.02) continue;
      const tw=u*0.24, tx=Math.cos(a)*rad, ty=Math.sin(a)*rad;
      g.fillStyle='rgba(34,30,25,.92)';
      g.fillRect(tx-tw/2, ty-tw*1.1*k, tw, tw*2.0*k);
      g.fillStyle= 우리? '#c3b592' : '#96907f';

    }

    g.fillRect(-u*0.19, rad-u*0.09, u*0.38, u*0.24);
    g.fillStyle= 우리? '#8d7b58' : '#7a7364';
    g.fillRect(-u*0.15, rad-u*0.07, u*0.30, u*0.18);
    g.restore();
  }
  /* ── 집 ──
     한 채마다 fill 을 부르면 마흔두 고을에 오백 번이 넘는다. 빛깔이 같은 것끼리
     한 길(path)에 모아 세 번만 부른다 — 한 프레임에서 수 밀리초가 걸린 자리였다. */
  {
    const n=Math.min(L.집.length, 2+Math.round((P.dev||0)/3.4));
    const 새=솟음(P,'house');
    /* 몸체 — 콘크리트 시대의 것은 높이 선다 */
    g.beginPath();
    for(let i=0;i<n;i++){
      const [dx,dy,sz,rr]=L.집[i];
      const k=(i===n-1)? 새 : 1; if(k<=0.02) continue;
      const 꼴=roofKind(rr,F);
      const w=u*0.42*sz, h=u*0.30*sz*k*(꼴==='평'? 2.1 : 1);
      g.rect(x+dx*u-w/2, y+dy*u-h*(꼴==='평'? 0.75 : 0.2), w, h*(꼴==='평'? 1.0 : 0.75));
    }
    g.fillStyle=F.몸빛; g.fill();
    /* 창 — 상자 시대의 집에는 불이 켜져 있다 */
    if(F.상자){
      g.beginPath();
      for(let i=0;i<n;i++){
        const [dx,dy,sz,rr]=L.집[i];
        if(roofKind(rr,F)!=='평') continue;
        const k=(i===n-1)? 새 : 1; if(k<=0.6) continue;
        const w=u*0.42*sz, h=u*0.30*sz*2.1;
        const hx=x+dx*u-w/2, hy=y+dy*u-h*0.75;
        for(let ry=0;ry<3;ry++) for(let cx2=0;cx2<2;cx2++){
          if(((i*7+ry*3+cx2)%5)===0) continue;      // 몇 집은 불이 꺼져 있다
          g.rect(hx+w*(0.20+cx2*0.42), hy+h*(0.16+ry*0.26), w*0.20, h*0.14);
        }
      }
      g.fillStyle='rgba(238,214,150,.62)'; g.fill();
    }
    /* 지붕 — 종류별로 한 길에 모아 칠한다 */
    const 지붕빛={ '초':'rgba(150,128,84,.9)',
                  '와': 우리? 'rgba(92,88,96,.95)' : 'rgba(82,80,86,.9)',
                  '벽':'rgba(134,86,68,.92)',
                  '평':'rgba(126,124,120,.95)' };
    for(const 꼴 of ['초','와','벽','평']){
      let 있다=false; g.beginPath();
      for(let i=0;i<n;i++){
        const [dx,dy,sz,rr]=L.집[i];
        if(roofKind(rr,F)!==꼴) continue;
        const k=(i===n-1)? 새 : 1; if(k<=0.02) continue;
        const w=u*0.42*sz, h=u*0.30*sz*k, hx=x+dx*u, hy=y+dy*u;
        있다=true;
        if(꼴==='평'){                                 // 평지붕 — 옥상 난간만
          const H=h*2.1;
          g.rect(hx-w*0.56, hy-H*0.80, w*1.12, H*0.10);
        } else if(꼴==='와'){                          // 기와 — 처마가 휜다
          g.moveTo(hx-w*0.72, hy-h*0.16);
          g.quadraticCurveTo(hx, hy-h*1.25, hx+w*0.72, hy-h*0.16);
          g.lineTo(hx+w*0.55, hy-h*0.02); g.lineTo(hx-w*0.55, hy-h*0.02);
          g.closePath();
        } else if(꼴==='벽'){                          // 벽돌 양옥 — 가파른 박공
          g.moveTo(hx-w*0.58, hy-h*0.16); g.lineTo(hx, hy-h*1.30);
          g.lineTo(hx+w*0.58, hy-h*0.16); g.closePath();
        } else {                                      // 초가
          g.moveTo(hx-w*0.6, hy-h*0.16); g.lineTo(hx, hy-h*1.0);
          g.lineTo(hx+w*0.6, hy-h*0.16); g.closePath();
        }
      }
      if(!있다) continue;
      g.fillStyle=지붕빛[꼴]; g.fill();
    }
    /* 공장 굴뚝 — 개항 뒤로 저자가 큰 고을에 선다 */
    if(F.굴뚝 && P.trade>=12){
      const m=clamp(1+Math.round((P.trade-12)/11), 1, 3);
      g.beginPath();
      for(let i=0;i<m;i++){
        const [dx,dy,sz]=L.집[(i*5+2)%L.집.length];
        const cw=u*0.13*sz, ch=u*(0.95+i*0.12);
        g.rect(x+dx*u-cw/2, y+dy*u-ch, cw, ch);
      }
      g.fillStyle='rgba(88,78,70,.95)'; g.fill();
    }
  }
  /* ── 도읍의 지붕 ── */
  if(P.cap){
    const w=u*0.95, h=u*0.62;
    g.save(); g.translate(x, y-u*0.55);
    for(let i=0;i<2;i++){
      const s2=1-i*0.28, yy=-i*h*0.42;
      g.beginPath();
      g.moveTo(-w*0.62*s2, yy);
      g.quadraticCurveTo(0, yy-h*0.72*s2, w*0.62*s2, yy);
      g.lineTo(w*0.45*s2, yy+h*0.10); g.lineTo(-w*0.45*s2, yy+h*0.10);
      g.closePath();
      g.fillStyle= i? 'rgba(124,104,74,.95)' : 'rgba(96,80,60,.95)';
      g.fill();
      g.strokeStyle='rgba(30,26,20,.8)'; g.lineWidth=Math.max(0.3,0.5/z); g.stroke();
    }
    g.fillStyle='rgba(70,60,48,.95)'; g.fillRect(-w*0.30, 0, w*0.60, h*0.42);
    g.restore();
    // 상자의 시대에는 궁 뒤로 높은 건물이 선다
    if(F.상자){
      g.fillStyle='rgba(112,110,108,.95)';
      g.fillRect(x-u*0.16, y-u*2.5, u*0.32, u*1.9);
      g.fillStyle='rgba(238,214,150,.55)';
      for(let ry=0;ry<5;ry++) g.fillRect(x-u*0.09, y-u*(2.34-ry*0.34), u*0.18, u*0.13);
    }

function terrainMarks(g,P){
  const C=CFG.CELL;
  g.save(); g.clip(P._path);
  P.cells.forEach(([x,y])=>{
    const h=hash2(x*7+3,y*13+5), h2=hash2(y*5+1,x*11+9);
    const px=(x+.15+h*.7)*C, py=(y+.15+h2*.7)*C;
    if(P.t==='mtn'){
      if(h>.42) return;
      const s=5+h2*4;
      g.beginPath(); g.moveTo(px-s*.9,py+s*.5); g.lineTo(px,py-s*.55); g.lineTo(px+s*.9,py+s*.5);
      g.closePath(); g.fillStyle='rgba(96,90,76,.30)'; g.fill();
      g.strokeStyle='rgba(40,36,30,.65)'; g.lineWidth=1; g.beginPath();
      g.moveTo(px-s*.9,py+s*.5); g.lineTo(px,py-s*.55); g.lineTo(px+s*.55,py+s*.1); g.stroke();
    } else if(P.t==='hill'){
      if(h>.34) return;
      g.strokeStyle='rgba(52,46,36,.42)'; g.lineWidth=1;
      g.beginPath(); g.arc(px,py+3,3.5+h2*2,Math.PI*1.06,Math.PI*1.94); g.stroke();
    } else if(P.t==='coast'){
      if(h>.30) return;
      g.strokeStyle='rgba(60,80,84,.35)'; g.lineWidth=1;
      for(let i=0;i<2;i++){ g.beginPath(); g.moveTo(px-4,py+i*3.5);
        g.quadraticCurveTo(px,py+i*3.5-2,px+4,py+i*3.5); g.stroke(); }
    } else {
      if(h>.30) return;
      g.strokeStyle='rgba(70,72,44,.34)'; g.lineWidth=1;
      g.beginPath(); g.moveTo(px-3.5,py); g.lineTo(px+3.5,py);
      g.moveTo(px-3.5,py+3); g.lineTo(px+3.5,py+3); g.stroke();
    }
  });
  g.restore();
}
function inkStroke(g,path,w,a,col){
  g.strokeStyle=col||PAL.ink; g.lineJoin='round'; g.lineCap='round';
  g.globalAlpha=a*.5; g.lineWidth=w*1.9; g.stroke(path);
  g.globalAlpha=a;    g.lineWidth=w;     g.stroke(path);
  g.globalAlpha=1;
}
function buildPlate(){
  const C=CFG.CELL, MW=CFG.GW*C, MH=CFG.GH*C;
  const c=document.createElement('canvas'); c.width=MW; c.height=MH;
  const g=c.getContext('2d');
  if(!PAPER) PAPER=makePaper(MW,MH);
  /* 바다 — 종이 위 옅은 청록, 해안 등거리선 */
  g.drawImage(PAPER,0,0);
  g.fillStyle='rgba(150,178,178,.34)'; g.fillRect(0,0,MW,MH);
  const D=seaDist();
  for(let k=4;k>=1;k--){
    const p=pathOf((x,y)=>x>=0&&y>=0&&x<CFG.GW&&y<CFG.GH&&D[y][x]>=0&&D[y][x]<=k,3);
    g.strokeStyle='rgba(66,96,102,'+(0.05+(5-k)*0.045)+')'; g.lineWidth=1; g.stroke(p);
  }
  /* 땅 바탕 — 이음매가 안 보이게 통째로 */
  const landPath=pathOf((x,y)=>x>=0&&y>=0&&x<CFG.GW&&y<CFG.GH&&G.land[y][x],3);
  g.save(); g.clip(landPath); g.drawImage(PAPER,0,0);
  g.fillStyle='rgba(226,214,182,.55)'; g.fillRect(0,0,MW,MH); g.restore();
  /* 지방 채색 + 지형 기호 */
  Object.values(G.provs).forEach(P=>{
    P._path=pathOf((x,y)=>x>=0&&y>=0&&x<CFG.GW&&y<CFG.GH&&G.grid[y][x]===P.id,3);
    g.save();
    g.fillStyle=WASH[P.nat]||WASH.ind; g.fill(P._path);
    g.clip(P._path);
    g.strokeStyle=NATIONS[P.nat].col; g.globalAlpha=.10; g.lineWidth=14; g.stroke(P._path);
    g.globalAlpha=.14; g.lineWidth=5; g.stroke(P._path);
    g.globalAlpha=1; g.restore();
    terrainMarks(g,P);
  });
  /* 강 */
  g.lineCap='round';
  RIVERS.forEach(r=>{
    const s=chaikin(r.map(([x,y])=>[x+.5,y+.5]),3);
    g.beginPath(); g.moveTo(s[0][0]*C,s[0][1]*C);
    for(let i=1;i<s.length;i++) g.lineTo(s[i][0]*C,s[i][1]*C);
    g.strokeStyle='rgba(84,116,124,.55)'; g.lineWidth=2.2; g.stroke();
    g.strokeStyle='rgba(150,182,186,.45)'; g.lineWidth=1; g.stroke();
  });
  /* 먹선 — 도 경계 → 국경 → 해안선 */
  Object.values(G.provs).forEach(P=>inkStroke(g,P._path,0.8,.28));
  Object.keys(NATIONS).forEach(k=>{
    const p=pathOf((x,y)=>x>=0&&y>=0&&x<CFG.GW&&y<CFG.GH&&G.grid[y][x]&&G.provs[G.grid[y][x]].nat===k,3);
    inkStroke(g,p,1.7,.62);
  });
  inkStroke(g,landPath,1.5,.75);
  g.globalCompositeOperation='multiply'; g.globalAlpha=.35; g.drawImage(PAPER,0,0);
  g.globalCompositeOperation='source-over'; g.globalAlpha=1;
  PLATE=c; G.plateDirty=false;
}

/* ================================================================
   보는 창 — 얼마나 당겨 보고 어디를 보는가
   ----------------------------------------------------------------
   지도 창은 888×480으로 옆으로 길고, 한반도는 68×128로 세로로 길다.
   그래서 배율을 하나로 못 박아 두면 어떻게 잡아도 고을이 작다.
   배율과 자리를 플레이어에게 넘긴다 — 휠로 당기고, 끌어서 옮긴다.
   지도판·경계·이름은 그대로 두고 보는 창만 움직이므로
   전쟁·인접 판정은 하나도 달라지지 않는다.
   ================================================================ */
const MAP_ZOOM_MIN=1, MAP_ZOOM_MAX=8;
/* 한반도가 창 높이에 꼭 차는 배율. 실제 좌표에서 재어 둔 값이다. */
const KOR_BOX={x0:585,y0:154,x1:653,y1:282};
const MAP_PRESETS={
  all:  ()=>({ zoom:Math.min(VIEW.w/MAP_GEO.width, VIEW.h/MAP_GEO.height),
               cx:MAP_GEO.width/2, cy:MAP_GEO.height/2 }),
  korea:()=>({ zoom:Math.min(MAP_ZOOM_MAX, (VIEW.h/(KOR_BOX.y1-KOR_BOX.y0))*0.92),
               cx:(KOR_BOX.x0+KOR_BOX.x1)/2, cy:(KOR_BOX.y0+KOR_BOX.y1)/2 })
};
function mapZoom(){ return (G&&G.mapZoom)||1; }
function activeMapView(){ return { zoom:mapZoom(), x:(G&&G.mapPan?G.mapPan.x:0), y:(G&&G.mapPan?G.mapPan.y:0) }; }
/* 창이 지도 밖으로 나가지 않게 잡아 둔다 */
function clampPan(){
  if(!G||!G.mapPan) return;
  const z=mapZoom(), vw=VIEW.w/z, vh=VIEW.h/z;
  G.mapPan.x=clamp(G.mapPan.x, Math.min(0, MAP_GEO.width-vw), Math.max(0, MAP_GEO.width-vw));
  G.mapPan.y=clamp(G.mapPan.y, Math.min(0, MAP_GEO.height-vh), Math.max(0, MAP_GEO.height-vh));
}
/* 가운데를 정해 창을 옮긴다 */
function centerMap(cx,cy){
  const z=mapZoom();
  G.mapPan={ x:cx-VIEW.w/(2*z), y:cy-VIEW.h/(2*z) };
  clampPan();
}
function setMapPreset(name){
  const p=(MAP_PRESETS[name]||MAP_PRESETS.korea)();
  G.mapZoom=clamp(p.zoom, MAP_ZOOM_MIN, MAP_ZOOM_MAX);
  G.mapFocus=name;
  centerMap(p.cx, p.cy);
}
/* 짚은 자리를 붙들고 당긴다 — 커서 밑의 땅이 그대로 커서 밑에 남는다 */
function zoomAt(sx, sy, factor){
  if(!G||!G.mapPan) return;
  const before=mapScreenToLocal(sx,sy);
  const z0=mapZoom();
  G.mapZoom=clamp(z0*factor, MAP_ZOOM_MIN, MAP_ZOOM_MAX);
  if(G.mapZoom===z0) return;
  if(before){
    G.mapPan.x=before.x-(sx-VIEW.x)/G.mapZoom;
    G.mapPan.y=before.y-(sy-VIEW.y)/G.mapZoom;
  }
  G.mapFocus= G.mapZoom<=MAP_ZOOM_MIN+0.02? 'all' : 'free';
  clampPan();
}
function overMap(x,y){
  return x>=VIEW.x && y>=VIEW.y && x<=VIEW.x+VIEW.w && y<=VIEW.y+VIEW.h;
}
function mapScreenToLocal(x,y){
  if(!overMap(x,y)) return null;
  const V=activeMapView();
  return {x:(x-VIEW.x)/V.zoom+V.x,y:(y-VIEW.y)/V.zoom+V.y};
}
function beginMapView(g){
  const V=activeMapView();
  g.save(); g.beginPath(); g.rect(VIEW.x,VIEW.y,VIEW.w,VIEW.h); g.clip();
  // 흔들림 — 싸움이 붙으면 지도만 흔든다. 판과 단추까지 흔들면 누르기가 어렵다.
  if(SHAKE>0.001){
    const a=SHAKE*SHAKE*5;
    g.translate((Math.random()-0.5)*a, (Math.random()-0.5)*a);
  }
  // 창은 화면 어디에나 놓일 수 있지만, 그 안의 좌표계는 늘 MAP_O 를 원점으로 한다
  g.translate(VIEW.x,VIEW.y); g.scale(V.zoom,V.zoom); g.translate(-MAP_O.x-V.x,-MAP_O.y-V.y);
  return V;
}

function ensureMapVis(){
  if(MAPVIS) return;
  if(!window.MAP_GEO) throw new Error('assets/map_geo.js를 불러오지 못했습니다.');
  const regions={}, prov={}, rect={}, provOutline={}, anchors={};
  PROVDEF.forEach(P=>{ if(!MAP_GEO.regions[P.id]) throw new Error('지도 권역 누락: '+P.id); });
  Object.entries(MAP_GEO.regions).forEach(([id,data])=>{
    const path=new Path2D(data.d);
    regions[id]={...data,path}; prov[id]=path; rect[id]=path; provOutline[id]=path;
    anchors[id]={x:CFG.GX+data.label[0],y:CFG.GY+data.label[1]};
    if(G&&G.provs[id]){ G.provs[id]._path=path; G.provs[id].cx=data.label[0]; G.provs[id].cy=data.label[1]; }
  });
  const boundaries=MAP_GEO.borders.map(b=>({...b,path:new Path2D(b.d)}));
  MAPVIS={land:new Path2D(MAP_GEO.coast),regions,prov,rect,provOutline,anchors,
    inner:new Path2D(MAP_GEO.borders.map(b=>b.d).join('')),boundaries};
}

function rebuildMapBase(){
  ensureMapVis();
  /* 구워 두는 판의 크기는 화면이 아니라 지도가 정한다.
     화면 크기로 잡으면 세로 판(470×980)에서 지도 오른쪽이 통째로 잘려
     동해 건너부터 까만 구멍이 남는다 — 손전화에서 일본이 사라졌다. */
  const c=document.createElement('canvas');
  c.width=CFG.GX+MAP_GEO.width; c.height=CFG.GY+MAP_GEO.height;
  const g=c.getContext('2d'), W=MAP_GEO.width, H=MAP_GEO.height;
  const sea=g.createLinearGradient(CFG.GX,CFG.GY,CFG.GX+W,CFG.GY+H);
  sea.addColorStop(0,'#071923'); sea.addColorStop(.52,'#0b2a38'); sea.addColorStop(1,'#123d4a');
  g.fillStyle=sea; g.fillRect(CFG.GX,CFG.GY,W,H);
  g.save(); g.translate(CFG.GX,CFG.GY); g.lineJoin='round'; g.lineCap='round';
  [[24,'rgba(66,120,132,.065)'],[13,'rgba(93,146,150,.095)'],[5,'rgba(179,197,180,.15)']].forEach(([w,col])=>{
    g.strokeStyle=col; g.lineWidth=w; g.stroke(MAPVIS.land);
  }); g.restore();
  g.save(); g.beginPath(); g.rect(CFG.GX,CFG.GY,W,H); g.clip();
  for(let i=0;i<34;i++){
    const q=hash2(i,13), q2=hash2(i,29), x=CFG.GX+q*W, y=CFG.GY+q2*H;
    const len=28+hash2(i,47)*70, rise=(hash2(i,61)-.5)*5;
    g.strokeStyle='rgba(137,184,190,'+(0.018+hash2(i,73)*0.025)+')'; g.lineWidth=.65;
    g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+len*.25,y-2+rise,x+len*.5,y);
    g.quadraticCurveTo(x+len*.75,y+2-rise,x+len,y); g.stroke();
  } g.restore();
  g.save(); g.translate(CFG.GX,CFG.GY);
  g.save(); g.shadowColor='rgba(0,0,0,.52)'; g.shadowBlur=5; g.shadowOffsetY=2;
  g.fillStyle='#415042'; g.fill(MAPVIS.land,'evenodd'); g.restore();
  if(hasAsset('relief')){
    g.save(); g.clip(MAPVIS.land,'evenodd'); g.filter='saturate(.96) contrast(1.04)';
    g.drawImage(ASSETS.img.relief,0,0,W,H); g.filter='none';
    const shade=g.createLinearGradient(0,0,W,H);
    shade.addColorStop(0,'rgba(244,226,164,.035)'); shade.addColorStop(1,'rgba(8,24,27,.12)');
    g.fillStyle=shade; g.fillRect(0,0,W,H); g.restore();
  }else{
    Object.values(G.provs).forEach(P=>{ g.fillStyle=TERR[P.t].col; g.fill(MAPVIS.rect[P.id],'evenodd'); });
  }
  g.restore(); MAPBASE=c;
}

function ensureCloudLayer(){
  if(MAPCLOUDS) return;
  const c=document.createElement('canvas'); c.width=MAP_GEO.width; c.height=MAP_GEO.height;
  const g=c.getContext('2d');
  [[555,408,.92],[800,386,1.02]].forEach(([cx,cy,s],cluster)=>{
    for(let i=0;i<14;i++){
      const a=hash2(cluster*31+i,401)*Math.PI*2, d=hash2(cluster*31+i,409)*44*s;
      const x=cx+Math.cos(a)*d, y=cy+Math.sin(a)*d*.42, r=(16+hash2(i,cluster+419)*30)*s;
      const cloud=g.createRadialGradient(x-r*.2,y-r*.15,r*.08,x,y,r);
      cloud.addColorStop(0,'rgba(244,241,222,.18)'); cloud.addColorStop(.55,'rgba(224,231,220,.10)');
      cloud.addColorStop(1,'rgba(214,228,222,0)'); g.fillStyle=cloud; g.fillRect(x-r,y-r,r*2,r*2);
    }
  }); MAPCLOUDS=c;
}

/* 어느 고을을 짚었는가.
   좁은 섬을 손가락으로 찍기는 어렵다. 그래서 이름표에서 가장 가까운 고을을 먼저 보고,
   그것이 없을 때만 실제 경계 안쪽인지 따진다. 잡히는 반경은 손가락이냐 마우스냐와
   화면이 얼마나 줄어 있느냐에 따라 달라진다. */
function provinceAtPoint(x,y){
  const point=mapScreenToLocal(x,y); if(!point) return null;
  ensureMapVis(); const lx=point.x, ly=point.y, V=activeMapView();
  const cssScale=Math.max(.1,cv.getBoundingClientRect().width/CFG.W);
  const hitRadius=clamp((Mouse.touch?28:15)/cssScale,Mouse.touch?24:14,Mouse.touch?88:38);
  let nearest=null, nearestDistance=Infinity;
  for(const [id,R] of Object.entries(MAPVIS.regions)){
    const distance=Math.hypot(lx-R.label[0],ly-R.label[1])*V.zoom;
    const radius=hitRadius*(R.small?1.12:1);
    if(distance<=radius&&distance<nearestDistance){ nearest=id; nearestDistance=distance; }
  }
  if(nearest) return nearest;
  for(const [id,R] of Object.entries(MAPVIS.regions)){
    const b=R.bbox;
    if(lx>=b[0]&&ly>=b[1]&&lx<=b[2]&&ly<=b[3]&&ctx.isPointInPath(R.path,lx,ly,'evenodd')) return id;
  }
  return null;
}

function drawSeaRoutes(g){

  const routes=[['gyen','tsus'],['tsus','kyus'],['shan','hwan'],['zhej','ryuk'],['fuji','taiw']];

  g.strokeStyle=G.mapMode==='political'?'rgba(105,157,181,.52)':'rgba(123,180,196,.30)'; g.lineWidth=inv;
  routes.forEach(([a,b],i)=>{
