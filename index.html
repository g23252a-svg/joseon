<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>동아 — 조선에서 현대까지</title>
<style>
  html,body{margin:0;padding:0;background:#0a0b0e;height:100%;overflow:hidden;
    font-family:"Nanum Myeongjo","Batang","AppleMyungjo","Malgun Gothic",serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  #wrap{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);}
  canvas{display:block;background:#0a0b0e;box-shadow:0 0 60px rgba(0,0,0,.9);}
  /* 작은 화면·손가락에서는 고을을 정확히 찍기 어렵다.
     캔버스 밖에 진짜 <select> 를 하나 두어 목록에서 고르게 한다. */
  #province-tool{display:none;position:fixed;z-index:10;left:50%;bottom:max(12px,env(safe-area-inset-bottom));
    transform:translateX(-50%);align-items:center;gap:10px;width:min(430px,calc(100vw - 24px));
    box-sizing:border-box;padding:8px 10px;background:rgba(14,16,20,.97);color:#e0bd76;
    border:1px solid rgba(224,189,118,.58);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.55);}
  #province-tool[hidden]{display:none!important;}
  #province-tool label{flex:0 0 auto;font-size:14px;font-weight:700;white-space:nowrap;}
  #province-select{min-width:0;flex:1;height:44px;padding:0 38px 0 12px;border:1px solid rgba(224,189,118,.5);
    border-radius:6px;background:#20242b;color:#f2ead7;font:16px "Nanum Myeongjo","Batang","Malgun Gothic",serif;}
  #province-select:focus-visible{outline:3px solid rgba(231,224,240,.8);outline-offset:2px;}
  .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;
    overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;}
  @media (max-width:900px),(max-height:620px),(pointer:coarse){
    #province-tool:not([hidden]){display:flex;}
  }
  @media (orientation:landscape) and (max-height:620px){
    #province-tool{left:12px;top:max(10px,env(safe-area-inset-top));bottom:auto;transform:none;width:min(360px,calc(100vw - 24px));}
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1280" height="720"></canvas></div>
<div id="province-tool" hidden>
  <label for="province-select">고을 바로 선택</label>
  <select id="province-select" aria-label="고을 바로 선택">
    <option value="">고을을 고르시오</option>
  </select>
</div>
<output id="selection-status" class="sr-only" aria-live="polite"></output>
<script src="assets/map_geo.js"></script>
<script>
"use strict";
/* =========================================================================
   동아 — 조선에서 현대까지
   한·중·일 삼국 대전략
   v0.1.0
   ========================================================================= */
const VERSION = '0.3.0';
const MAP_MODE_PARAM=new URLSearchParams(location.search).get('map');
const START_MAP_MODE=MAP_MODE_PARAM==='political'?'political':'terrain';
const MAP_FOCUS_PARAM=new URLSearchParams(location.search).get('focus');
const START_MAP_FOCUS=MAP_FOCUS_PARAM==='all'?'all':'korea';

const CFG = { W:1280, H:720, CELL:12, GX:8, GY:62, GW:74, GH:40,
              SAVE:'donga_save_v5', RECORDS:'donga_records_v1' };

/* ---------------------------------------------------------------- 유틸 */
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function hash2(x,y){ let n=x*374761393+y*668265263; n=(n^(n>>13))*1274126177; return ((n^(n>>16))>>>0)/4294967295; }
function num(n){ return Math.round(n).toLocaleString('ko-KR'); }

/* ---------------------------------------------------------------- 입력 */
const Key={pressed:{},down:{}};
addEventListener('keydown',e=>{
  // 캔버스 밖의 <select> 를 다루는 동안에는 놀이 조작으로 새지 않게 한다
  const tag=e.target&&e.target.tagName;
  if(['INPUT','SELECT','TEXTAREA','BUTTON'].includes(tag)||(e.target&&e.target.isContentEditable)) return;
  if(!Key.down[e.code])Key.pressed[e.code]=true; Key.down[e.code]=true;
  if(['Space','Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup',e=>{ Key.down[e.code]=false; });
const Mouse={x:0,y:0,click:false,rclick:false,wheel:0,touch:false};
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const provinceTool=document.getElementById('province-tool');
const provinceSelect=document.getElementById('province-select');
const selectionStatus=document.getElementById('selection-status');
function toCanvas(e){ const r=cv.getBoundingClientRect();
  return { x:(e.clientX-r.left)*(CFG.W/r.width), y:(e.clientY-r.top)*(CFG.H/r.height) }; }
/* 창이 아니라 캔버스에 건다 — 그래야 아래의 고을 선택 상자가 제 노릇을 한다 */
/* 지도 위에서 끌면 지도를 옮긴다. 그래서 '눌렀다'는 판정은 뗄 때 내린다 —
   끌기 시작한 자리의 고을이 덜컥 골라지지 않아야 한다.
   단추도 같은 규칙을 따르므로 누른 뒤 밖으로 끌면 취소된다. */
let MDOWN=null, PAN=null;
function canPanNow(){ return !!(G && G.mapPan && SCENE==='play' && !MENU && !G.popup && !G.report); }
function beginPan(x,y){ if(canPanNow() && overMap(x,y)) PAN={sx:x, sy:y, ox:G.mapPan.x, oy:G.mapPan.y}; }
function dragPan(x,y){
  if(!PAN||!G||!G.mapPan) return;
  const z=mapZoom();
  G.mapPan.x=PAN.ox-(x-PAN.sx)/z;
  G.mapPan.y=PAN.oy-(y-PAN.sy)/z;
  clampPan();
}
cv.addEventListener('mousemove',e=>{ const p=toCanvas(e); Mouse.x=p.x; Mouse.y=p.y; Mouse.touch=false;
  if(MDOWN){
    if(Math.hypot(p.x-MDOWN.x,p.y-MDOWN.y)>4) MDOWN.moved=true;
    if(MDOWN.moved) dragPan(p.x,p.y);
  }
});
cv.addEventListener('mousedown',e=>{ const p=toCanvas(e); Mouse.x=p.x; Mouse.y=p.y; Mouse.touch=false;
  if(e.button!==0){ Mouse.rclick=true; return; }
  MDOWN={x:p.x,y:p.y,moved:false}; beginPan(p.x,p.y);
});
addEventListener('mouseup',e=>{
  if(MDOWN && !MDOWN.moved && e.button===0) Mouse.click=true;
  MDOWN=null; PAN=null;
});
cv.addEventListener('contextmenu',e=>e.preventDefault());
/* 휠 — 지도 위에서는 당기고, 오른쪽 판 위에서는 굴린다.
   한 번에 얼마나 굴렸는지를 보고 그만큼 당긴다. 굴린 양을 무시하고 한 눈금씩
   당기면, 잔걸음으로 여러 번 알리는 판(트랙패드)에서는 한숨에 끝까지 가 버린다. */
function wheelAmount(e){
  let dy=e.deltaY;
  if(e.deltaMode===1) dy*=16;        // 줄 단위로 알리는 판
  else if(e.deltaMode===2) dy*=400;  // 쪽 단위로 알리는 판
  return dy;
}
cv.addEventListener('wheel',e=>{
  const p=toCanvas(e); Mouse.x=p.x; Mouse.y=p.y;
  const dy=wheelAmount(e);
  if(canPanNow() && overMap(p.x,p.y)) zoomAt(p.x, p.y, clamp(Math.exp(-dy*0.0015), 0.5, 2));
  else Mouse.wheel+=Math.sign(dy)*38;
  e.preventDefault();
},{passive:false});
/* 손가락 — 지도 위에서 끌면 지도를 옮기고, 두 손가락은 당긴다.
   그 밖에서 끌면 오른쪽 판을 굴린다. 거의 안 움직였으면 누른 것으로 본다.
   움직인 거리는 캔버스 좌표가 아니라 화면 좌표로 잰다 — 확대해도 기준이 같아야 한다. */
let TCH=null, PINCH=null;
function touchSpan(e){
  const a=e.touches[0], b=e.touches[1];
  return { d:Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY),
           mx:(a.clientX+b.clientX)/2, my:(a.clientY+b.clientY)/2 };
}
cv.addEventListener('touchstart',e=>{
  if(e.touches.length>=2 && canPanNow()){ PINCH=touchSpan(e); TCH=null; PAN=null; e.preventDefault(); return; }
  if(!e.touches[0])return;
  const t=e.touches[0], p=toCanvas(t);
  Mouse.x=p.x; Mouse.y=p.y; Mouse.touch=true;
  TCH={x:p.x,y:p.y,startX:t.clientX,startY:t.clientY,moved:false,onMap:overMap(p.x,p.y)};
  beginPan(p.x,p.y);
  e.preventDefault(); },{passive:false});
cv.addEventListener('touchmove',e=>{
  if(PINCH && e.touches.length>=2){
    const s=touchSpan(e);
    if(PINCH.d>0){
      const r=cv.getBoundingClientRect();
      const cx=(s.mx-r.left)*(CFG.W/r.width), cy=(s.my-r.top)*(CFG.H/r.height);
      zoomAt(cx, cy, s.d/PINCH.d);
    }
    PINCH=s; e.preventDefault(); return;
  }
  if(!TCH||!e.touches[0])return;
  const t=e.touches[0], p=toCanvas(t);
  if(Math.hypot(t.clientX-TCH.startX,t.clientY-TCH.startY)>10) TCH.moved=true;
  if(TCH.onMap && PAN){ if(TCH.moved) dragPan(p.x,p.y); }
  else Mouse.wheel += (TCH.y-p.y);
  TCH.x=p.x; TCH.y=p.y; Mouse.x=p.x; Mouse.y=p.y; e.preventDefault(); },{passive:false});
cv.addEventListener('touchend',e=>{
  if(PINCH && e.touches.length<2) PINCH=null;
  if(TCH && !TCH.moved) Mouse.click=true;
  TCH=null; PAN=null; },{passive:false});
function resize(){ const s=Math.min(innerWidth/CFG.W, innerHeight/CFG.H);
  cv.style.width=(CFG.W*s)+'px'; cv.style.height=(CFG.H*s)+'px'; }
addEventListener('resize',resize); resize();
provinceSelect.addEventListener('change',()=>{
  if(!G||!provinceSelect.value) return;
  G.sel=provinceSelect.value; G.mapFocus='korea';
});

/* ================================================================
   에셋 슬롯
   아래 경로에 그림이 있으면 그걸 쓰고, 없으면 코드로 그린다.
   규격은 ASSETS.md 참조. 파일만 놓으면 되고 코드는 손대지 않아도 된다.
   ================================================================ */
const ASSETS={
  src:{
    relief:   'assets/east_asia_relief.webp', // 실제 지표·음영기복 (888×480)
    terrain:  'assets/terrain.png',    // 44×44 지형 4칸 (평야·구릉·산지·연안)
    icons:    'assets/icons.png',      // 32×32 아이콘 8칸
    flags:    'assets/flags.png',      // 48×32 세력기 3칸
    portraits:'assets/portraits.png',  // 64×64 초상 16칸
    frame:    'assets/ui_frame.png',   // 192×64 판 장식 3칸 (+4칸째: 선택지 바탕)
    seal:     'assets/seal.png',       // 64×64 성적 도장 4칸 (상·중·하·난세)
    frameBig: 'assets/frame_big.png'   // 32×32 큰 창 9분할 (3×3)
  },
  img:{}, ready:{}, log:[]
};
const ICON_UV={ gold:0, food:1, pop:2, army:3, tech:4, prov:5, stab:6, unrest:7 };
const TERR_UV={ plain:0, hill:1, mtn:2, coast:3 };
const NAT_UV ={ kor:0, chn:1, jpn:2 };
function loadAssets(){
  for(const k in ASSETS.src){
    const im=new Image();
    im.onload =()=>{ ASSETS.ready[k]=true; ASSETS.log.push(k+' ✓ '+im.width+'×'+im.height);
      if(k==='relief') MAPBASE=null; };
    im.onerror=()=>{ ASSETS.ready[k]=false; ASSETS.log.push(k+' — 없음(코드 그림)'); };
    im.src=ASSETS.src[k]; ASSETS.img[k]=im;
  }
}
function hasAsset(k){ return !!ASSETS.ready[k]; }
function blit(g,sheet,idx,x,y,cw,ch,dw,dh){
  if(!hasAsset(sheet)||idx==null) return false;
  const im=ASSETS.img[sheet], per=Math.max(1,Math.floor(im.width/cw));
  const sx=(idx%per)*cw, sy=Math.floor(idx/per)*ch;
  // 시트에 없는 칸을 달라고 하면 그리지 않았다고 알린다 — 코드 그림으로 돌아가라고
  if(sx+cw>im.width || sy+ch>im.height) return false;
  g.drawImage(im, sx,sy, cw,ch, x,y, dw||cw, dh||ch);
  return true;
}
function assetStatus(){ return ASSETS.log.join('\n'); }
/* 큰 창 테두리 — 9분할. 그림이 없으면 false를 돌려주고 코드 그림으로 돌아간다. */
function frame9(g,x,y,w,h){
  if(!hasAsset('frameBig')) return false;
  const im=ASSETS.img.frameBig, c=Math.floor(im.width/3);
  const mw=Math.min(c, w/2), mh=Math.min(c, h/2);
  const put=(sx,sy,dx,dy,dw,dh)=>{ if(dw>0&&dh>0) g.drawImage(im, sx*c,sy*c,c,c, dx,dy,dw,dh); };
  const iw=w-mw*2, ih=h-mh*2;
  put(0,0, x,y, mw,mh);            put(1,0, x+mw,y, iw,mh);        put(2,0, x+w-mw,y, mw,mh);
  put(0,1, x,y+mh, mw,ih);         put(1,1, x+mw,y+mh, iw,ih);     put(2,1, x+w-mw,y+mh, mw,ih);
  put(0,2, x,y+h-mh, mw,mh);       put(1,2, x+mw,y+h-mh, iw,mh);   put(2,2, x+w-mw,y+h-mh, mw,mh);
  return true;
}
/* 창 바탕 — 큰 테두리 그림이 있으면 그것으로, 없으면 판을 그린다 */
function bigPanel(g,x,y,w,h){
  g.fillStyle='rgba(14,16,20,.97)'; g.fillRect(x,y,w,h);
  if(!frame9(g,x,y,w,h)){
    g.strokeStyle='rgba(190,158,96,.42)'; g.lineWidth=1; g.strokeRect(x+.5,y+.5,w-1,h-1);
    if(hasAsset('frame') && w>=120) blit(g,'frame',0, x,y, 192,64, w, Math.min(30,h*0.18));
  }
}
const SEAL_UV={ '상':0, '중':1, '하':2, '난세':3 };

/* ================================================================
   자료
   ================================================================ */
/* 시대 — 연도가 넘어가면 바뀐다 */
const ERAS=[
  { y:1392, nm:'조선 전기', desc:'건국. 농본과 예치의 시대.', tech:1 },
  { y:1592, nm:'임진왜란', desc:'왜란. 강토가 전장이 되었다.', tech:2 },
  { y:1637, nm:'조선 후기', desc:'전란 뒤의 재건과 붕당.', tech:3 },
  { y:1876, nm:'개항', desc:'문이 열렸다. 무엇이 들어올지는 몰랐다.', tech:4 },
  { y:1910, nm:'식민', desc:'국권이 넘어갔다.', tech:5 },
  { y:1945, nm:'해방', desc:'되찾았으나 갈라졌다.', tech:6 },
  { y:1962, nm:'산업화', desc:'굴뚝이 서기 시작한다.', tech:7 },
  { y:1988, nm:'현대', desc:'세계로 나간다.', tech:8 }
];
function eraOf(y){ let e=0; ERAS.forEach((E,i)=>{ if(y>=E.y) e=i; }); return e; }

/* 세력 */
const NATIONS={
  kor:{ nm:'조선', col:'#7186c2', col2:'#425a94', names:['조선','조선','대한제국','대한제국','조선총독부','대한민국','대한민국','대한민국'] },
  chn:{ nm:'명',   col:'#d1b65c', col2:'#927b31', names:['명','명','청','청','청','중화민국','중화인민공화국','중화인민공화국'] },
  jpn:{ nm:'일본', col:'#70967f', col2:'#466c58', names:['무로마치','도요토미','에도','메이지','일본제국','일본','일본','일본'] },
  ind:{ nm:'독립',  col:'#6f8a72', col2:'#51684f', names:['유구','유구','유구','유구','유구','유구','유구','유구'] }
};
function natName(k){ const n=NATIONS[k]; return n.names[Math.min(n.names.length-1,G.era)]; }

/* 지형 */
const TERR={
  plain:{ nm:'평야', food:1.35, trade:1.00, def:1.00, col:'#5d6b45' },
  hill: { nm:'구릉', food:0.95, trade:1.05, def:1.25, col:'#6a6247' },
  mtn:  { nm:'산지', food:0.60, trade:0.85, def:1.55, col:'#585349' },
  coast:{ nm:'연안', food:1.05, trade:1.35, def:0.95, col:'#4f6459' },
  river:{ nm:'강가', food:1.25, trade:1.30, def:0.90, col:'#546b52' }
};

/* ================================================================
   땅
   ----------------------------------------------------------------
   네모로 칠하면 한반도도 열도도 되지 않는다. 그래서
     (1) 해안선을 다각형으로 먼저 긋고
     (2) 지방마다 씨앗을 하나 놓은 뒤
     (3) 바다를 건너지 않는 물결 퍼짐으로 땅을 나눈다.
   경계가 저절로 들쭉날쭉해지고, 섬은 섬끼리만 이어진다.

   중요한 것은 '사이의 바다'다.
   황해가 없으면 조선은 중국에 붙은 혹이 되고, 현해탄이 없으면 일본이 아니다.
   ================================================================ */
const LAND=[
  /* 북방 — 몽골에서 만주까지. 조선은 여기에만 붙는다 */
  { nm:'북방', pts:[[6,2],[20,0],[34,0],[46,1],[54,3],[58,6],[57,10],[50,11],[42,10],[32,8],[20,6],[9,4]] },
  /* 중원 — 동쪽 해안이 안으로 들어와 황해를 만든다 */
  { nm:'중원', pts:[[2,9],[9,6],[17,5],[25,6],[32,8],[37,11],[39,14],
                    [36,16],[38,18],[41,21],[43,25],[41,29],[38,33],
                    [33,36],[26,38],[18,38],[11,35],[5,29],[2,20]] },
  /* 산동 반도 — 황해로 튀어나온다 */
  { nm:'산동', pts:[[37,14],[44,14],[45,16],[43,17],[38,17]] },
  /* 한반도 — 위로만 붙고 아래로 길게 내려간다 */
  { nm:'한반도', pts:[[51,10],[56,9],[58,12],[58,15],[57,18],[55,21],
                      [53,24],[51,26],[49,23],[49,18],[49,14],[50,11]] },
  /* 제주 */
  { nm:'제주', pts:[[50,28],[53,28],[53,29],[50,29]] },
  /* 대마도 — 현해탄 한가운데 */
  { nm:'대마도', pts:[[55,27],[56,27],[56,28],[55,28]] },
  /* 일본 — 남서에서 북동으로 휜 활 */
  { nm:'규슈', pts:[[59,29],[63,28],[65,31],[64,34],[61,35],[58,33]] },
  { nm:'시코쿠', pts:[[64,27],[68,27],[68,29],[64,29]] },
  { nm:'혼슈', pts:[[59,27],[63,25],[67,22],[70,18],[72,14],[73,10],
                    [72,7],[69,8],[66,12],[63,16],[61,20],[58,24],[57,26]] },
  { nm:'홋카이도', pts:[[69,2],[73,1],[73,6],[70,7],[68,5]] },
  /* 남쪽 */
  { nm:'타이완', pts:[[45,32],[47,32],[48,35],[46,36],[44,34]] },
  { nm:'유구1', pts:[[55,33],[57,33],[57,34],[55,34]] },
  { nm:'유구2', pts:[[51,35],[53,35],[53,36],[51,36]] }
];
function inPoly(x,y,pts){
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const [xi,yi]=pts[i], [xj,yj]=pts[j];
    if((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
  }
  return inside;
}

/* 고을의 병종 — 땅의 성격이 무엇을 기르는지를 정한다 */
function unitOf(p){
  const U=UNITS[Math.min(UNITS.length-1, G.era)];
  if(!p) return { nm:U.nm, atk:U.atk, def:U.def, kind:'foot' };
  if(tagVal(p,'navy',0)>1) return { nm:U.navy, atk:U.atk*1.04, def:U.def*0.96, kind:'navy' };
  if(tagVal(p,'atk',0)>0)  return { nm:U.horse, atk:U.atk*1.10, def:U.def*0.94, kind:'horse' };
  return { nm:U.nm, atk:U.atk, def:U.def, kind:'foot' };
}

const DIP_NATS=['chn','jpn'];
function dipOf(k){ return G.dip && G.dip[k]; }
/* 사이의 이름 */
function relName(v){
  return v>=70?'형제' : v>=40?'화친' : v>=10?'우호' : v>-10?'무덤덤'

}
function relCol(v){ return v>=40?'#8fa86a' : v>=10?'#9fd0e8' : v>-10?'#c9bfa8' : v>-40?'#c9a24a':'#c4534a'; }

}

/* 고을 바로 선택 — 캔버스 밖의 진짜 선택 상자.
   작은 화면이나 손가락으로는 지도를 정확히 찍기 어렵다.
   화면 읽기 프로그램에도 지금 무엇을 골랐는지 알린다. */
let provinceOptionsReady=false;
function ensureProvinceOptions(){
  if(provinceOptionsReady) return;
  PROVDEF.filter(P=>P.nat==='kor').forEach(P=>{
    const option=document.createElement('option');
    option.value=P.id; option.textContent=P.nm;
    provinceSelect.appendChild(option);
  });
  provinceOptionsReady=true;
}
function syncProvinceTool(){
  const show=SCENE==='play' && !MENU && !G.popup && !G.report;
  provinceTool.hidden=!show;
  if(!show) return;
  ensureProvinceOptions();
  const selected=G.sel&&G.provs[G.sel]&&G.provs[G.sel].nat==='kor'?G.sel:'';
  if(provinceSelect.value!==selected) provinceSelect.value=selected;
  const selectedName=G.sel&&G.provs[G.sel]?G.provs[G.sel].nm:'';
  const announcement=selectedName?selectedName+' 고을 선택됨':'선택된 고을 없음';
  if(selectionStatus.textContent!==announcement) selectionStatus.textContent=announcement;
}

let G=null;
function newGame(){
  G={ year:1392, era:0, turn:0, mode:'play', mapMode:START_MAP_MODE, mapFocus:START_MAP_FOCUS,
      mapZoom:1, mapPan:{x:0,y:0}, log:[], tab:'국정',
      sel:null, hover:null, nat:'kor', ended:false,
      grid:[], provs:{}, nations:{}, officials:[], pool:[],
      factions:{}, policies:[], polSince:{}, popup:null, ver:VERSION,
      evDone:{}, scores:[], legit:50, pendingEvent:null, evQueue:[], report:null, view:'nat',
      res:{ pt:0, done:{}, gain:0 }, dip:{}, byeol:0 };

  /* 1) 해안선을 그린다 — 다각형 안쪽이 땅이다 */
  G.land=[];
  for(let y=0;y<CFG.GH;y++){
    G.land.push(new Array(CFG.GW).fill(false));
    G.grid.push(new Array(CFG.GW).fill(null));
  }
  for(let y=0;y<CFG.GH;y++) for(let x=0;x<CFG.GW;x++){
    for(const L of LAND){ if(inPoly(x+0.5,y+0.5,L.pts)){ G.land[y][x]=true; break; } }
  }
  /* 2) 지방을 만들고 씨앗을 심는다 */
  PROVDEF.forEach(p=>{
    G.provs[p.id]={ id:p.id, nm:p.nm, nat:p.nat, t:p.t, tag:p.tag, cap:!!p.cap,
      pop:0, dev:0, farm:0, trade:0, fort:0, unrest:0, army:0, cells:[], seed:p.seed };
  });
  /* 3) 바다를 건너지 않는 물결 퍼짐으로 땅을 나눈다 */
  const q=[];
  PROVDEF.forEach(p=>{
    let [sx,sy]=p.seed;
    if(!G.land[sy] || !G.land[sy][sx]){          // 씨앗이 바다에 떨어졌으면 가장 가까운 땅으로 옮긴다
      let best=null,bd=1e9;
      for(let y=0;y<CFG.GH;y++) for(let x=0;x<CFG.GW;x++){
        if(!G.land[y][x]||G.grid[y][x]) continue;
        const d=(x-sx)*(x-sx)+(y-sy)*(y-sy);
        if(d<bd){ bd=d; best=[x,y]; }
      }
      if(best){ sx=best[0]; sy=best[1]; }
    }
    if(G.land[sy] && G.land[sy][sx] && !G.grid[sy][sx]){
      G.grid[sy][sx]=p.id; q.push([sx,sy,p.id]);
    }
  });
  for(let h=0; h<q.length; h++){
    const [x,y,id]=q[h];
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=CFG.GW||ny>=CFG.GH) return;
      if(!G.land[ny][nx] || G.grid[ny][nx]) return;
      G.grid[ny][nx]=id; q.push([nx,ny,id]);
    });
  }
  for(let y=0;y<CFG.GH;y++) for(let x=0;x<CFG.GW;x++){
    const id=G.grid[y][x]; if(id) G.provs[id].cells.push([x,y]);
  }
  /* 4) 땅 넓이에 맞춰 초기 수치 */
  Object.values(G.provs).forEach(P=>{
    const T=TERR[P.t], n=Math.max(1,P.cells.length);
    // 땅 넓이만으로는 안 된다. 1392년 명은 조선보다 열 배 넘게 살았다.
    P.den  = {kor:1, chn:2.4, jpn:1.35, ind:0.6}[P.nat]||1;   // 땅이 품는 사람의 수
    P.pop  = Math.round(n*(46000+hash2(n,P.id.length)*26000)*T.food*P.den);
    P.dev  = ri(8,18) + (P.nat==='chn'?6:0);
    P.farm = ri(10,22) + (P.tag==='곡창'?6:0);
    P.trade= ri(6,16)  + (P.tag==='상업'||P.tag==='교역'||P.tag==='중계'?7:0);
    P.fort = P.cap? ri(3,4) : ri(0,2);
    P.army = P.cap? ri(4000,7000) : ri(800,3000);
  });
  /* 5) 인접 — 땅으로 붙은 곳 */
  Object.values(G.provs).forEach(P=>{ P.adj=new Set(); });
  for(let y=0;y<CFG.GH;y++) for(let x=0;x<CFG.GW;x++){
    const a=G.grid[y][x]; if(!a) continue;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=CFG.GW||ny>=CFG.GH) return;
      const b=G.grid[ny][nx];
      if(b && b!==a) G.provs[a].adj.add(b);
    });
  }
  /* 6) 뱃길 — 좁은 바다는 건너다닌다 */
  SEA.forEach(([a,b])=>{ if(G.provs[a]&&G.provs[b]&&G.provs[a].cells.length&&G.provs[b].cells.length){
    G.provs[a].adj.add(b); G.provs[b].adj.add(a); } });
  /* 씨앗이 땅을 못 잡은 지방은 없애 둔다 */
  Object.keys(G.provs).forEach(k=>{ if(!G.provs[k].cells.length) delete G.provs[k]; });
  /* 이름을 얹을 자리 */
  Object.values(G.provs).forEach(P=>{
    let sx=0, sy=0; P.cells.forEach(([x,y])=>{ sx+=x; sy+=y; });
    P.cx=(sx/P.cells.length+.5)*CFG.CELL;
    P.cy=(sy/P.cells.length+.5)*CFG.CELL;
  });
  G.plateDirty=true; G.view='nat';
  setMapPreset(START_MAP_FOCUS);          // 보는 창은 지방을 다 만든 뒤에 잡는다

  /* 세력 */
  Object.keys(NATIONS).forEach(k=>{
    G.nations[k]={ id:k, gold: k==='kor'?600:900, food:400, tech:10,
      stab:60, manpower:0, ai:k!=='kor' };
  });
  /* 이웃과의 사이 — 1392년의 자리에서 시작한다.
     책봉을 받은 큰 나라와는 이미 가깝고, 바다 건너와는 왜구로 서먹하다. */
  G.dip={
    chn:{ rel: 25, tribute:false, trade:false, ally:false, war:false, warYears:0, truce:0, envoy:0 },
    jpn:{ rel:-10, tribute:false, trade:false, ally:false, war:false, warYears:0, truce:0, envoy:0 }
  };
  /* 붕당 */
  // 세력은 조정 자리의 몫이다 — 처음에는 고르게 나눈다 (합이 늘 100)
  FACTION_SETS[0].forEach((f,_,a)=>{ G.factions[f]=100/a.length; });
  /* 신하 — 고을 수만큼은 있어야 자리를 채울 수 있다 */
  for(let i=0;i<12;i++) G.officials.push(mkOfficial());
  for(let i=0;i<6;i++) G.pool.push(mkOfficial());

  log('임진년보다 이백 년 앞선 해. 나라를 맡는다.');
  log('연도를 넘기려면 「한 해를 보낸다」.');
  recalc();
  // 첫 해에도 손이 있어야 한다. 예전에는 여기가 비어 있어 1392년 내내
  // 명령 단추가 모두 회색이었다.
  Object.keys(G.nations).forEach(k=>{ G.nations[k].adm = admMax(); });
  G.byeol=0;
}
/* 이름에서 초상 칸을 정한다 — 같은 사람은 늘 같은 얼굴 */
function portraitOf(o){
  let h=0; for(const ch of o.nm) h=(h*31+ch.charCodeAt(0))>>>0;
  return h%16;
}
/* 신하 — 그 시대에 살았던 사람이 먼저 나온다.
   다 쓰고 나면 이름 없는 관원이 채운다. */
function mkOfficial(){
  const y=G?G.year:1392;
  const fs=FACTION_SETS[Math.min(FACTION_SETS.length-1,G?G.era:0)];
  const 쓴=G? (G.usedPeople||(G.usedPeople={})) : {};
  const 후보=PEOPLE.filter(p=>!쓴[p.nm] && y>=p.f-6 && y<=p.to+4);
  if(후보.length){
    const p=pick(후보); 쓴[p.nm]=1;
    return { id:p.nm, nm:p.nm, real:1, tr:p.tr, ln:p.ln,
      pol:p.pol, eco:p.eco, mil:p.mil, dip:p.dip,
      loy:ri(55,90), fac:pick(fs), age:Math.max(24, y-p.f), post:null };
  }
  return { id:Math.random().toString(36).slice(2,8), nm:makeName(),
    pol:ri(20,80), eco:ri(20,80), mil:ri(20,80), dip:ri(20,80),
    loy:ri(45,85), fac:pick(fs), age:ri(28,55), post:null };
}
function log(s){ G.log.unshift({ y:G.year, s }); if(G.log.length>60) G.log.pop(); }

/* 국가 합계 */
function natProvs(k){ return Object.values(G.provs).filter(p=>p.nat===k); }
function recalc(){
  Object.keys(G.nations).forEach(k=>{
    const ps=natProvs(k), N=G.nations[k];
    N.pop=ps.reduce((a,p)=>a+p.pop,0);
    N.army=ps.reduce((a,p)=>a+p.army,0);
    N.prov=ps.length;
  });
}

/* ================================================================
   한 해
   ----------------------------------------------------------------
   고친 것:
   · 정무 — 한 해에 쓸 수 있는 손이 정해져 있다.
     종전에는 돈만 있으면 한 턴에 백 번도 눌렀다. 그러면 선택이 사라진다.
   · 연말 결산 — 무엇이 얼마나 들어오고 나갔는지 보여준다.
     보이지 않으면 배울 수 없고, 배울 수 없으면 잘할 수 없다.
   · 식량과 기술이 실제로 쓰인다. 화면에 띄운 숫자는 판정에 들어가야 한다.
   · 민심이 무너지면 고을이 떨어져 나간다. 질 수 있어야 한다.
   ================================================================ */
function policyVal(id){ return G.policies.includes(id); }
function officialAt(pid){ return G.officials.find(o=>o.post===pid) || null; }
function techOf(k){ return G.nations[k].tech; }

/* 정무 — 한 해에 쓸 수 있는 손.
   조정이 커질수록 손이 는다. 고을이 많아도 늘고, 좋은 신하를 앉혀도 는다. */
function admMax(){
  let n=4;
  if(G.era>=1) n++;
  if(G.era>=3) n++;                      // 근대 관료제
  if(G.era>=5) n++;
  if(G.era>=7) n++;
  n += Math.floor(natProvs('kor').length/6);          // 고을이 여섯이면 손 하나 더
  const 유능=G.officials.filter(o=>o.post && o.pol>=70).length;
  n += Math.floor(유능/3);                            // 정치 좋은 수령 셋에 손 하나
  if(policyVal('gunjeok')) n--;                       // 군적은 조정을 군무에 묶는다
  if(policyVal('daedong')) n++;                       // 대동법은 행정을 단순하게 한다
  return clamp(n, 2, 14);
}

/* 연구 — 한 해에 쌓이는 몫.
   결산과 화면이 같은 값을 보이도록 셈하는 자리를 하나로 둔다. */
function researchGain(){
  const N=G.nations.kor;
  return +(natProvs('kor').reduce((a,p)=>a + 0.30*tagVal(p,'res',1)*(1+p.dev/70), 0)
           * (0.55 + N.stab/150) * mods().res).toFixed(2);
}

/* 별칙 — 정무를 다 쓰고도 더 하려면 국고를 태운다.
   값이 가파르게 뛰고 조정이 지치므로, 돈이 남아돌 때만 뜻이 있다. */
function byeolCount(){ return G.byeol||0; }
function byeolMul(){ return 2 + byeolCount()*1.6; }
function byeolPay(){
  G.byeol=(G.byeol||0)+1;
  G.officials.forEach(o=>{ o.loy=clamp(o.loy-3,0,100); });
  G.nations.kor.stab=clamp(G.nations.kor.stab-0.6,0,100);
}

/* ── 정책이 실제로 무엇을 하는가 ──────────────────────────────
   설명에 적힌 것과 코드가 하는 일이 달라서는 안 된다.
   여기 한 곳에서만 계산하고, 나머지는 이 값을 가져다 쓴다.
   ---------------------------------------------------------- */
const POL_CONFLICT=[['silhak','yechi'],['swaeguk','gaehwa'],['swaeguk','suchul'],
                    ['nongbon','suchul'],['toji','chagwan']];
function polYears(id){ return G.polSince && G.polSince[id]!=null ? G.year-G.polSince[id] : 0; }
/* 한 해의 모든 보정을 여기 한 곳에서 낸다 — 정책 · 기술 마디 · 조약.
   화면에 적은 설명과 계산이 어긋나지 않으려면 셈하는 자리가 하나여야 한다. */
function mods(){
  const m={ food:1, trade:1, goldMul:1, tech:0, stab:0, loy:0, pop:1,
            defKor:1, armyReg:1, upArmy:1, moCost:1, bldCost:1, fortCost:1,
            invRisk:1, facHeat:0, popMo:1,
            /* 이번 판에서 새로 생긴 것들 */
            atk:1, def:1, navy:1, exp:1, res:1, famine:1, interest:0, legit:0 };
  const has=id=>G.policies.includes(id);
  if(has('nongbon')){ m.food*=1.18; m.trade*=0.88; m.bldCost*=0.8; }
  if(has('yechi')){ m.stab+=0.6; m.loy+=1.0; m.tech-=1.0; }
  if(has('gunjeok')){ m.moCost*=0.75; m.pop*=0.90; m.stab-=0.3; }
  if(has('sadae')){ m.invRisk*=0.6; m.goldMul*=0.92; m.tech-=1.0; }
  if(has('uibyeong')){ m.defKor*=1.30; m.stab+=0.5; m.food*=0.88; }
  if(has('hunryeon')){ m.armyReg*=2; m.goldMul*=0.85; m.popMo*=0.92; }
  if(has('daedong')){ m.trade*=1.20; m.stab+=0.5; m.loy-=0.8; m.facHeat+=0.5; }
  if(has('silhak')){ m.tech+=3; m.bldCost*=0.9; m.stab-=0.4; }
  if(has('swaeguk')){ m.stab+=1.0; m.tech-=3; m.trade*=0.80; }
  if(has('gaehwa')){ m.tech+=5; m.stab-=0.8; }
  if(has('bugang')){ m.defKor*=1.18; m.fortCost*=0.8; m.upArmy*=1.15; m.food*=0.92; }
  if(has('chagwan')){ m.bldCost*=0.75; m.goldMul*=0.94; }
  if(has('mulsan')){ m.stab+=1.0; m.trade*=1.15; m.goldMul*=0.88; }
  if(has('yahak')){ m.tech+=3; m.stab+=0.5; m.goldMul*=0.90; }
  if(has('toji')){ m.stab+=1.5; m.food*=1.12; m.goldMul*=0.82; m.loy-=1.2; }
  if(has('gyoyuk')){ m.tech+= polYears('gyoyuk')>=10?3:0.5; m.pop*=1.12; m.goldMul*=0.88; }
  if(has('suchul')){ m.trade*=1.35; m.pop*=0.85; m.stab-=0.6; }
  if(has('junghwa')){ m.trade*=1.30; m.upArmy*=0.85; m.goldMul*=0.80; m.stab-=0.8; }
  if(has('bokji')){ m.stab+=1.4; m.pop*=1.08; m.goldMul*=0.85; }
  if(has('yeongu')){ m.tech+= polYears('yeongu')>=5?7:1; m.trade*=1.25; m.goldMul*=0.82; m.res*=1.35; }

  /* ── 기술 마디 — 적힌 그대로 ── */
  const T=id=>techDone(id);
  if(T('sucha'))    m.food*=1.06;
  if(T('iang'))   { m.food*=1.10; m.pop*=1.04; }
  if(T('guhwang')){ m.food*=1.06; m.famine*=0.5; }
  if(T('birio'))    m.food*=1.18;
  if(T('gigye'))  { m.food*=1.15; m.pop*=1.04; }
  if(T('sijeon'))   m.trade*=1.08;
  if(T('sangpy')) { m.trade*=1.10; m.interest+=0.004; }
  if(T('gaehang')){ m.exp*=1.40; m.trade*=1.06; }
  if(T('gongjang')){ m.trade*=1.20; m.exp*=1.20; }
  if(T('bando'))  { m.trade*=1.25; m.exp*=1.30; m.tech+=2; }
  if(T('hwacha'))   m.def*=1.10;
  if(T('geobuk')) { m.navy*=1.30; m.def*=1.06; }
  if(T('hongi'))  { m.atk*=1.12; m.fortCost*=0.85; }
  if(T('sinsik')) { m.atk*=1.15; m.upArmy*=0.88; }
  if(T('jaju'))   { m.atk*=1.22; m.def*=1.18; }
  if(T('jiphyeon')) m.res*=1.25;
  if(T('sillok')) { m.legit+=0.5; m.stab+=0.3; }
  if(T('seoyang')){ m.res*=1.30; m.tech+=1; }
  if(T('hakgyo')) { m.res*=1.30; m.pop*=1.05; }
  if(T('yeonso')) { m.res*=1.40; m.tech+=3; }

  /* ── 조약 ── */
  DIP_NATS.forEach(k=>{
    const d=dipOf(k); if(!d) return;
    if(d.tribute){ m.invRisk*=0.55; m.goldMul*=0.96; m.legit-=0.4; }
    if(d.trade)  { m.exp*=1.5; m.trade*=1.05; }
    if(d.ally)   { m.invRisk*=0.7; m.stab+=0.3; }
    if(d.war)    { m.stab-=0.8; m.upArmy*=1.10; }
  });
  /* 쇄국은 조약의 이로움을 스스로 닫는다 */
  if(has('swaeguk')) m.exp*=0.35;
  /* 방어는 우리 땅에서만 든다 */
  m.defKor*=m.def;
  return m;
}

function endTurn(){
  if(G.ended || G.popup || G.report) return;
  const N=G.nations.kor;
  const B={ gold0:N.gold, food0:N.food, pop0:N.pop, stab0:N.stab, legit0:G.legit,
            trade:0, farm:0, upkeepArmy:0, upkeepPay:0, upkeepFort:0,
            eaten:0, export:0, tribute:0, research:0, events:[] };

  G.turn++; G.year++;
  const M=mods();

  /* ── 지방 산출 ── */
  let food=0, gold=0, expPot=0;
  Object.values(G.provs).forEach(P=>{
    const T=TERR[P.t];
    const gov=officialAt(P.id);
    const govE=gov? gov.eco/100 : 0, govP=gov? gov.pol/100 : 0;
    // 고을이 커질수록 거두기는 어려워진다 — 그대로 곱하면 후반에 국고가 터진다
    const 규모=Math.pow(P.pop/100000, 0.8);
    let f=P.farm*T.food*(1+govE*0.5)*규모*tagVal(P,'farm',1);
    let t=P.trade*T.trade*(1+govE*0.6)*규모*tagVal(P,'trade',1)*goodVal(P,'trade',1);
    if(P.nat==='kor'){
      f*=M.food; t*=M.trade;
      t *= (1 - P.unrest/260);                  // 어지러운 고을은 세가 걷히지 않는다
      food+=f; gold+=t;
      // 팔 물건 — 조약이 없으면 값이 되지 않는다. 뒤에서 한꺼번에 셈한다.
      expPot += goodVal(P,'exp',0) * (1+P.trade/44) * 규모;
      // 평시 수비병은 스스로 조금씩 채워진다. 다만 상비군 수준까지만 —
      // 그 위로 불리려면 모병을 해야 하고, 불린 만큼 군량과 녹을 먹는다.
      const 수비=P.pop*0.006*(policyVal('hunryeon')?1.6:1)*tagVal(P,'garrison',1);
      if(P.army<수비) P.army=Math.round(Math.min(수비, P.army + P.pop*0.0004*M.armyReg*tagVal(P,'garrison',1)));
      // 민심 — 수령이 없다고 벌하지 않는다. 좋은 수령을 앉히면 좋아진다.
      const drift = (gov? (-1.4-govP*1.2) : 0.05) + tagVal(P,'drift',0);
      P.unrest = clamp(P.unrest + drift + (P.fort>2?-0.2:0.15), 0, 100);
      // 개성의 상인들은 국고에 이자를 붙인다
      if(tagVal(P,'interest',0)) B.interest=(B.interest||0)+N.gold*tagVal(P,'interest',0);
      // 어지러움이 오래가면 떨어져 나간다.
      // 한 해에 하나까지만 — 나라가 한꺼번에 무너지면 손 쓸 틈이 없다.
      // 조정에 명분이 서 있으면 고을은 조금 더 참는다. 없으면 먼저 등을 돌린다.
      const 등돌림 = clamp(88 + (G.legit-50)*0.12, 78, 96);
      const 참는햇수 = G.legit>=72? 6 : G.legit<32? 4 : 5;
      if(P.unrest>=등돌림){ P.rebel=(P.rebel||0)+1; } else P.rebel=Math.max(0,(P.rebel||0)-1);
      if(P.rebel>=참는햇수 && !P.cap && !B.rebelled){
        B.rebelled=1;
        P.nat='ind'; P.unrest=40; P.rebel=0; P.army=Math.round(P.army*0.6);
        G.plateDirty=true;
        log(P.nm+'이(가) 조정을 등졌다.');
        B.events.push(P.nm+' 반란');
        N.stab=clamp(N.stab-10,0,100);
      } else if(P.rebel===참는햇수-2){
        log(P.nm+'의 민심이 심상치 않다. 곧 등을 돌릴 것이다.');
      }
    }
    const cap=(P.farm*T.food*30000 + P.dev*18000)*(P.den||1)
              *(P.nat==='kor'? M.pop*tagVal(P,'popCap',1) : 1);
    let grow=0.014 + (P.dev/3000) - (P.unrest/9000);
    grow*=(1-P.pop/Math.max(50000,cap));
    P.pop=Math.max(20000, Math.round(P.pop*(1+clamp(grow,-0.02,0.05))));
  });
  B.trade=gold; B.farm=food;

  /* ── 수출 ──
     특산은 안에서도 값을 하지만, 팔 데가 생기면 그때 크게 값을 한다.
     통상 조약이 없으면 인삼도 비단도 그저 고을의 물건일 뿐이다. */
  const 통상수 = DIP_NATS.filter(k=>dipOf(k) && dipOf(k).trade && !dipOf(k).war).length;
  B.export = Math.round(expPot * 통상수 * 1.6 * M.exp);
  gold += B.export;

  /* ── 나감 ──
     시대가 갈수록 나라를 굴리는 값이 비싸진다. 조정 하나로 되던 일이
     부처 열둘이 되고, 성곽 대신 항만과 철도가 된다. */
  const 물가 = 1 + G.era*0.8;
  B.upkeepArmy = N.army*0.008*M.upArmy*(1+G.era*0.35);
  B.upkeepPay  = (G.officials.length*4 + natProvs('kor').length*8) * 물가;
  B.upkeepFort = natProvs('kor').reduce((a,p)=>a+p.fort*3,0) * 물가;
  // 군량과 백성 몫 — 곡식이 남아돌면 개간도 진휼도 뜻이 없어진다.
  B.eaten      = N.army/1000*4 + N.pop/9500;
  /* 세폐 — 조공을 바치는 나라마다 해마다 나간다. 싸구려 평화는 없다. */
  const 조공국 = DIP_NATS.filter(k=>dipOf(k) && dipOf(k).tribute);
  B.tribute    = Math.round(조공국.length * (30 + natProvs('kor').length*6) * 물가);
  B.tributeFood= Math.round(조공국.length * N.pop/90000);
  const upkeep = B.upkeepArmy + B.upkeepPay + B.upkeepFort + B.tribute;
  B.polDrain   = Math.max(0, Math.round(N.gold*(1-M.goldMul)));   // 정책이 갉아먹는 몫
  B.interest   = Math.round((B.interest||0) + N.gold*M.interest); // 개성 상인과 상평통보

  N.gold = Math.round(N.gold + gold + B.interest - upkeep - B.polDrain);
  N.food = Math.round(N.food + food - B.eaten - B.tributeFood);
  /* 곳간에도 한계가 있다. 넘치면 썩는다 — 쌓아 두기만 해서는 안 된다. */
  const 창고 = Math.round(N.pop/60 + natProvs('kor').length*2000);
  if(N.food > 창고){
    B.spoil = N.food-창고; N.food=창고;
    if(B.spoil>창고*0.1) B.events.push('묵은 곡식이 썩었다');
  }
  /* 기술 — 나라가 크고 편안할수록 는다. 한 번 얻은 것이 완전히 사라지지는 않는다. */
  const 밑 = 0.25 + 0.45*(natProvs('kor').length/16) + N.stab/400;
  const 델타 = Math.max(-0.5, 밑 + M.tech);
  N.tech = Math.max(G.era*10, +(N.tech + 델타).toFixed(1));

  /* ── 곳간이 비면 ── */
  if(N.food<0){
    // 모자란 만큼만 아프다. 조금 모자란 해에 나라가 무너져서는 안 된다.
    // 구황작물을 심어 두었으면 같은 흉년이 절반만 아프다.
    const 굶=clamp(-N.food/Math.max(200,B.eaten*0.5), 0, 1)*M.famine;
    log(굶>0.4? '곳간이 비었다. 굶는 고을이 나온다.' : '곳간이 얕다. 봄이 길겠다.');
    if(굶>0.25) B.events.push('기근');
    natProvs('kor').forEach(p=>{ p.unrest=clamp(p.unrest+2+굶*9,0,100);
      p.pop=Math.round(p.pop*(1-0.008*굶)); });
    N.army=Math.round(N.army*(1-0.05*굶));           // 군량이 없으면 군대가 흩어진다
    N.food=0;
  }
  if(N.gold<0){
    log('국고가 비었다. 녹봉이 밀린다.');
    B.events.push('국고 고갈');
    G.officials.forEach(o=>o.loy=clamp(o.loy-6,0,100));
    N.army=Math.round(N.army*0.94);
    N.gold=0;
  }

  /* ── 민심 ──
     조정이 고을을 챙기면 오르고, 버려두면 내린다.
     충성은 거들 뿐이다 — 예전에는 이게 너무 세서 한 번 미끄러지면 못 올라왔다. */
  const 우리=natProvs('kor');
  const avgUn=우리.reduce((a,p)=>a+p.unrest,0)/Math.max(1,우리.length);
  const 충성=G.officials.length? G.officials.reduce((a,o)=>a+o.loy,0)/G.officials.length : 50;
  const 배치=우리.length? 우리.filter(p=>officialAt(p.id)).length/우리.length : 0;
  // 고을이 주는 몫 — 도읍이 우리 것이면 조정이 서고, 잃으면 흔들린다
  const 고을덕 = 우리.reduce((a,p)=>a+tagVal(p,'stab',0), 0);
  // 정통 — 조정이 무슨 명분으로 서 있는가. 이제 실제로 민심을 민다.
  B.stabIn = (N.food>0? 0.7 : -4) + 배치*0.9 - avgUn*0.045 + (충성-50)*0.012
             + (G.legit-50)*0.020 + M.stab + 고을덕;
  N.stab=clamp(N.stab + B.stabIn, 0, 100);

  /* ── 정통 ──
     도읍을 쥐고 백성이 편안하면 명분이 절로 선다. 도읍을 잃으면 급히 무너진다.
     조공은 평화를 사 오지만 그 값을 여기서 치른다. */
  const 도읍우리 = !!(G.provs.hans && G.provs.hans.nat==='kor');
  const 명분기준 = clamp(46 + (N.stab-50)*0.35 + (도읍우리? 4 : -26), 5, 95);
  B.legitIn = clamp((명분기준-G.legit)*0.08, -2.5, 2.5) + M.legit;
  G.legit = clamp(G.legit + B.legitIn, 0, 100);

  /* ── 연구 ──
     학문의 고을이 여기서 값을 한다. 오래 쌓아야 마디 하나가 열린다. */
  B.research = researchGain();
  G.res.pt = +(G.res.pt + B.research).toFixed(2);
  G.res.gain = B.research;

  /* ── 신하 ──
     충성은 나라 형편을 따라 제자리를 찾아간다. 바닥으로 굴러떨어지지는 않는다. */
  const 물러남=[];
  G.officials.forEach(o=>{
    o.age++;
    const 기준 = clamp(38 + N.stab*0.45 + (o.post?4:-4) + M.loy*6, 15, 95);
    o.loy = clamp(o.loy + clamp((기준-o.loy)*0.12, -3, 3), 0, 100);
    if(o.age>74 && Math.random()<0.05) 물러남.push(o);
  });
  물러남.forEach(o=>{
    const seat=o.post;
    G.officials=G.officials.filter(x=>x!==o);
    if(seat && G.provs[seat]){
      let heir=G.officials.find(x=>!x.post);
      if(!heir){ heir=G.pool.shift()||mkOfficial(); G.officials.push(heir); }
      heir.post=seat;
      log(o.nm+'이(가) 늙어 물러나고, '+heir.nm+'이(가) '+G.provs[seat].nm+'을(를) 잇는다.');
    } else log(o.nm+'이(가) 벼슬을 내려놓았다.');
  });
  if(G.pool.length<6) G.pool.push(mkOfficial());
  while(G.officials.length < natProvs('kor').length + 2){
    const o=G.pool.shift()||mkOfficial(); G.officials.push(o);
  }

  /* ── 붕당 ──
     예전에는 자리를 쥔 신하 수만큼 해마다 더하기만 했다(n*2.2 − 1.4).
     고을이 열여섯이면 해마다 열대여섯씩 올라, 네댓 해면 두 당이 나란히 100에
     붙어 버린다. 붙고 나면 눈금이 아무것도 말하지 않는다 — 누가 조정을
     쥐었는지, 내가 무엇을 해야 하는지가 화면에서 사라진다.

     이제 세력은 '조정의 자리를 얼마나 쥐었는가'의 몫이다. 합은 늘 100이고,
     수령을 누구로 앉히느냐가 곧 붕당을 다루는 손이 된다. */
  const fs=Object.keys(G.factions);
  // 안동 같은 학문의 고을과 대동법은 다툼을 키운다 — 고른 데서 더 멀어지게 한다
  const 열기 = 우리.reduce((a,p)=>a+tagVal(p,'faction',0), 0);
  const 재직 = G.officials.filter(o=>o.post);
  const 고름 = 100/Math.max(1,fs.length);          // 고르게 나뉘었을 때의 몫
  const 증폭 = 1 + 열기*0.5 + M.facHeat*0.5;
  fs.forEach(f=>{
    const 몫 = 재직.length? 재직.filter(o=>o.fac===f).length/재직.length*100 : 고름;
    const 목표 = clamp(고름 + (몫-고름)*증폭, 0, 100);
    G.factions[f]=clamp(G.factions[f] + (목표-G.factions[f])*0.30, 0, 100);
  });
  // 명분이 얕은 조정에서 사화가 잦다 — 이길 이유가 없으면 이길 사람을 만든다
  const mx=Math.max(...fs.map(f=>G.factions[f]));
  const 사화문턱 = 고름 + 22;                       // 고른 몫보다 한참 앞선 당이 있을 때
  const 사화확률 = clamp(0.22 + (55-G.legit)*0.005, 0.06, 0.50);
  if(mx>사화문턱 && Math.random()<사화확률){
    const win=fs.find(f=>G.factions[f]===mx);
    const purged=G.officials.filter(o=>o.fac!==win && o.post);
    if(purged.length){
      const v=pick(purged), seat=v.post;
      v.post=null; v.loy=clamp(v.loy-25,0,100);
      let heir=G.officials.find(o=>o.fac===win&&!o.post)||G.officials.find(o=>!o.post);
      if(!heir){ heir=G.pool.shift()||mkOfficial(); heir.fac=win; G.officials.push(heir); }
      heir.post=seat;
      log('사화가 일어났다. '+win+'이 조정을 잡고 '+v.nm+'이(가) 쫓겨났다. '
          +G.provs[seat].nm+'은(는) '+heir.nm+'이(가) 맡는다.');
      B.events.push('사화');
      N.stab=clamp(N.stab-8,0,100);
    }
  }

  /* ── 시대 ── */
  const e=eraOf(G.year);
  if(e!==G.era){
    scoreEra(G.era);                                  // 지난 시대 성적을 매긴다
    G.era=e;
    const E=ERAS[e], nf=FACTION_SETS[Math.min(FACTION_SETS.length-1,e)];
    G.factions={}; nf.forEach(f=>G.factions[f]=100/nf.length);
    G.officials.forEach(o=>o.fac=pick(nf));
    G.popup={ kind:'era', title:E.nm, body:E.desc, y:G.year };
    log('── '+E.nm+' ──  '+E.desc);
    B.events.push(E.nm);
  }

  dipTurn(B);
  aiTurn(B);
  recalc();
  N.adm=admMax();                                     // 새해의 손
  G.byeol=0;                                          // 별칙은 해가 바뀌면 지워진다

  /* ── 사건 ──
     한 해에 두 가지가 걸린 해가 있다(1592년). 예전 코드는 find로 하나만 집어
     나머지를 영영 버렸다. 이제 줄을 세워 차례로 묻는다. */
  const evs=EVENTS.filter(x=>x.y===G.year && !G.evDone[x.y+x.t]);
  if(evs.length){
    evs.forEach(e=>{ G.evDone[e.y+e.t]=1; });
    G.evQueue=(G.evQueue||[]).concat(evs);
    G.pendingEvent=G.evQueue.shift();
  }
  else if(Math.random()<0.14) minorEvent(B);

  G.report=B;                                          // 연말 결산을 띄운다
  checkEnd();
  saveGame('auto');
}

/* 작은 일 — 큰 사건 사이를 채운다. 좋기만 하지도, 나쁘기만 하지도 않다. */
function minorEvent(B){
  const p=pick(natProvs('kor')); if(!p) return;
  const N=G.nations.kor, r=Math.random();
  if(r<0.20){ p.unrest=clamp(p.unrest+18,0,100); p.farm=Math.max(4,p.farm-2);
    log(p.nm+'에 흉년이 들었다.'); B.events.push(p.nm+' 흉년'); }
  else if(r<0.36){ p.trade+=2; p.dev=Math.min(devCap(),p.dev+1); G.plateDirty=true;
    log(p.nm+'의 장이 커졌다.'); B.events.push(p.nm+' 장시 번성'); }
  else if(r<0.50){ G.pool.push(mkOfficial());
    log('과거에서 인재가 났다.'); B.events.push('과거 급제'); }
  else if(r<0.62){ p.pop=Math.round(p.pop*0.96); p.unrest=clamp(p.unrest+6,0,100);
    log(p.nm+'에 역병이 돌았다.'); B.events.push(p.nm+' 역병'); }
  else if(r<0.72){ const g=goodOf(p)||'물건';
    B.windfall=Math.round(60*(1+G.era*0.9)); N.gold+=B.windfall;
    log(p.nm+'의 '+g+'이(가) 값을 크게 받았다.'); B.events.push(p.nm+' '+g+' 호황'); }
  else if(r<0.80){ G.res.pt=+(G.res.pt+8+G.era*4).toFixed(2);
    log('한 선비가 오래 묻힌 책을 찾아 올렸다.'); B.events.push('고서 발견'); }
  else if(r<0.88){ const k=pick(DIP_NATS), d=dipOf(k);
    if(d && !d.war){ d.rel=clamp(d.rel+6,-100,100);
      log(natName(k)+'의 사신이 예물을 가지고 왔다.'); B.events.push(natName(k)+' 사신'); } }
  else if(r<0.95){ p.unrest=clamp(p.unrest+14,0,100);
    log(p.nm+'에서 아전의 농간이 드러났다.'); B.events.push(p.nm+' 탐학'); }
  else { const o=pick(G.officials);
    if(o){ o.loy=clamp(o.loy+12,0,100);
      log(o.nm+'이(가) 사재를 털어 고을을 도왔다.'); B.events.push(o.nm+' 선정'); } }
}

/* 줄 서 있는 사건을 차례로 꺼낸다.
   이미 떠 있는 창이 있으면 그것부터 — 시대 알림이 사건에 덮이면 안 된다. */
function nextEvent(){
  if(G.popup) return false;
  if(G.pendingEvent){ G.popup={kind:'choice', ev:G.pendingEvent, y:G.year}; G.pendingEvent=null; return true; }
  if(G.evQueue && G.evQueue.length){ G.popup={kind:'choice', ev:G.evQueue.shift(), y:G.year}; return true; }
  return false;
}

/* 사건 선택지의 효과 */
function applyEffects(fx){
  const N=G.nations.kor;
  if(fx.gold)  N.gold=Math.max(0, Math.round(N.gold*(1+fx.gold/100)));
  if(fx.food)  N.food=Math.max(0, Math.round(N.food*(1+fx.food/100)));
  if(fx.stab)  N.stab=clamp(N.stab+fx.stab,0,100);
  if(fx.tech)  N.tech=Math.max(0,+(N.tech+fx.tech).toFixed(1));
  if(fx.army){ const m=1+fx.army/100;
    natProvs('kor').forEach(p=>p.army=Math.round(p.army*m)); }
  if(fx.legitimacy) G.legit=clamp((G.legit||50)+fx.legitimacy,0,100);
}

/* ================================================================
   외교의 한 해
   ----------------------------------------------------------------
   사이는 가만두면 제자리로 돌아간다. 조약이 그 제자리를 옮긴다.
   사이가 무너지면 조약은 저절로 끊어진다 — 종이는 마음을 붙들지 못한다.
   ================================================================ */
function relBase(k){
  const d=dipOf(k); let b=0;
  if(d.tribute) b+=30;
  if(d.trade)   b+=14;
  if(d.ally)    b+=28;
  if(d.war)     b-=70;
  if(k==='chn' && policyVal('sadae')) b+=18;
  if(k==='jpn' && policyVal('gaehwa')) b+=8;
  if(policyVal('swaeguk')) b-=14;
  // 큰 나라는 약한 이웃을 낮추어 본다
  const 힘 = G.nations.kor.army/Math.max(1,G.nations[k].army);
  b += clamp((힘-1)*12, -10, 12);
  return clamp(b, -100, 100);
}
function dipTurn(B){
  B.dip=[];
  DIP_NATS.forEach(k=>{
    const d=dipOf(k); if(!d) return;
    if(d.truce>0) d.truce--;
    if(d.envoy>0) d.envoy--;
    // 사신이 머무는 동안에는 사이가 제자리로 돌아가는 속도가 느리다.
    // 올려 놓은 사이를 붙들어 두려면 사람을 보내 두어야 한다.
    const 기준=relBase(k), 속도=d.envoy>0? 0.05 : 0.10;
    d.rel = clamp(d.rel + clamp((기준-d.rel)*속도, -6, 6), -100, 100);

    if(d.war){
      d.warYears++;
      // 오래 끄는 전쟁은 양쪽을 지치게 한다. 이쪽에서 먼저 손을 내밀 수도 있다.
      const 지침 = 0.06 + d.warYears*0.03;
      if(d.warYears>=3 && Math.random()<지침){
        d.war=false; d.warYears=0; d.truce=8; d.rel=clamp(d.rel+18,-100,100);
        log(natName(k)+'이(가) 싸움을 거두고 사신을 보내왔다.');
        B.events.push(natName(k)+'과 휴전');
      }
    }
    /* 종이는 마음을 붙들지 못한다 */
    if(d.trade && (d.rel<0 || d.war)){ d.trade=false;
      log(natName(k)+'과의 통상이 끊겼다.'); B.events.push(natName(k)+' 통상 파기'); }
    if(d.ally && (d.rel<35 || d.war)){ d.ally=false;
      log(natName(k)+'과의 동맹이 깨졌다.'); B.events.push(natName(k)+' 동맹 파기'); }
    if(d.tribute && d.war){ d.tribute=false; }
    B.dip.push({k, rel:Math.round(d.rel), war:d.war});
  });
  /* 이웃이 먼저 청해 오는 일 — 사이가 아주 좋으면 동맹을 제안한다 */
  DIP_NATS.forEach(k=>{
    const d=dipOf(k);
    if(d && !d.ally && !d.war && d.rel>=72 && Math.random()<0.10){
      d.ally=true; d.rel=clamp(d.rel+6,-100,100);
      log(natName(k)+'이(가) 먼저 손을 내밀어 동맹이 맺어졌다.');
      B.events.push(natName(k)+'과 동맹');
    }
  });
}
/* 전쟁을 연다 — 우리가 치거나, 저쪽이 우리를 치거나 */
function declareWar(k, 우리가){
  const d=dipOf(k); if(!d || d.war) return;
  d.war=true; d.warYears=0; d.truce=0;
  d.rel=clamp(d.rel-45,-100,100);
  d.trade=false; d.ally=false;
  if(우리가){
    G.legit=clamp(G.legit-4,0,100);
    log(natName(k)+'과(와) 전쟁이 열렸다.');
  } else {
    log(natName(k)+'이(가) 군사를 일으켰다.');
  }
}

/* ── 다른 나라 ── */
function aiTurn(B){
  const M=mods();
  ['chn','jpn'].forEach(k=>{
    const N=G.nations[k], 내땅=natProvs(k);
    N.gold += 내땅.length*14 + 40;
    // 이웃도 논다. 가만히 두면 조선만 홀로 앞서 나가 견줄 것이 없어진다.
    N.tech = +(N.tech + 0.3 + 0.6*(내땅.length/14) + G.era*0.42).toFixed(1);
    내땅.forEach(p=>{
      if(Math.random()<0.25){ p.dev=Math.min(devCap(),p.dev+1); p.army+=ri(60,240); }
      if(Math.random()<0.30) p.farm =Math.min(devCap(), p.farm +1);
      if(Math.random()<0.24) p.trade=Math.min(devCap(), p.trade+1);
      if(Math.random()<0.06 && p.fort<4+Math.floor(G.era*0.9)) p.fort++;
    });
    /* 약한 이웃을 문다. 조선도 예외가 아니다 — 종전에는 코드가 조선을 빼 놨다.
       다만 이제는 주사위가 아니라 사이를 본다. 형제와는 싸우지 않는다. */
    const d=dipOf(k);
    let 기세 = 0.04 + (G.era>=1?0.03:0) + (G.era>=3?0.04:0);
    if(d && d.war) 기세 += 0.22;
    if(Math.random()<기세){
      const mine=natProvs(k);
      let best=null, bs=0;
      mine.forEach(p=>{
        [...p.adj].forEach(id=>{
          const q=G.provs[id]; if(!q || q.nat===k) return;
          // 동맹이거나 휴전 중이면 조선을 건드리지 않는다
          if(q.nat==='kor' && d && (d.ally || d.truce>0)) return;
          const T=TERR[q.t];
          let 방어=q.army*T.def*(1+q.fort*0.16)*(1+techOf(q.nat)/220);
          if(q.nat==='kor') 방어*=M.defKor*unitOf(q).def;      // 의병·부국강병·병종
          const 공격=p.army*(1+techOf(k)/220)*(q.nat==='kor'?1:1);
          // 사대교린과 세폐는 큰 나라의 발길을 늦춘다
          const 눈치 = (q.nat==='kor')? M.invRisk : 1;
          // 사이가 나쁠수록 조선을 먼저 문다. 좋으면 다른 데를 본다.
          const 미움 = (q.nat==='kor' && d)? clamp(0.15 - d.rel/240, -0.25, 0.6) : 0;
          const s=(공격/Math.max(1,방어) + (q.unrest/100) + 미움)*눈치;
          if(공격>방어*1.25 && s>bs && s>0){ bs=s; best=[p,q]; }
        });
      });
      if(best){
        const [from,q]=best;
        const old=q.nat;
        if(old==='kor' && d && !d.war) declareWar(k, false);
        q.nat=k; q.unrest=clamp(q.unrest+40,0,100);
        q.army=Math.round(from.army*0.3); from.army=Math.round(from.army*0.7);
        G.plateDirty=true;
        log(natName(k)+'이(가) '+q.nm+'을(를) 차지했다.');
        if(old==='kor'){
          G.nations.kor.stab=clamp(G.nations.kor.stab-12,0,100);
          G.legit=clamp(G.legit-5,0,100);
          if(B) B.events.push(q.nm+' 함락');
          if(q.cap) log('도읍이 넘어갔다.');
          /* 동맹이 있으면 우리를 문 쪽을 문다 — 동맹의 값어치 */
          const 벗=DIP_NATS.find(o=>o!==k && dipOf(o) && dipOf(o).ally);
          if(벗) allyStrike(벗, k, B);
        }
      }
    }
  });
}
/* 동맹의 보복 — 우리 벗이 우리를 친 나라의 고을 하나를 문다 */
function allyStrike(friend, foe, B){
  const mine=natProvs(friend);
  let best=null, bs=0;
  mine.forEach(p=>{
    [...p.adj].forEach(id=>{
      const q=G.provs[id]; if(!q || q.nat!==foe) return;
      const s=p.army/Math.max(1,q.army*TERR[q.t].def*(1+q.fort*0.16));
      if(s>1.1 && s>bs){ bs=s; best=[p,q]; }
    });
  });
  if(!best) return;
  const [from,q]=best;
  q.nat=friend; q.unrest=clamp(q.unrest+35,0,100);
  q.army=Math.round(from.army*0.3); from.army=Math.round(from.army*0.7);
  G.plateDirty=true;
  log(natName(friend)+'이(가) 약조대로 '+natName(foe)+'의 '+q.nm+'을(를) 쳤다.');
  if(B) B.events.push('동맹의 보복');
}

/* ── 시대 성적 ── */
/* 시대 성적 — 혼자만의 숫자가 아니라 이웃과 견주어 매긴다.
   조선이 잘했는지는 결국 명·청과 일본 옆에서 어떠했는가의 문제다. */
function scoreEra(e){
  const N=G.nations.kor, E=ERAS[e];
  const 우리=natProvs('kor'), 고을=우리.length;
  const 적기술=Math.max(1, G.nations.chn.tech, G.nations.jpn.tech);
  const 적인구=Math.max(1, G.nations.chn.pop, G.nations.jpn.pop);
  const 어지=우리.reduce((a,p)=>a+p.unrest,0)/Math.max(1,고을);
  const 도읍=G.provs.hans && G.provs.hans.nat==='kor';
  const 마디=Object.keys(G.res.done).length;
  const 벗=DIP_NATS.filter(k=>dipOf(k)&&(dipOf(k).ally||dipOf(k).trade)).length;
  let pt=0;
  pt += 고을*3;                                                  // 최대 48
  pt += Math.round(N.stab/5);                                    // 최대 20
  pt += Math.round(clamp(N.tech/적기술, 0, 1.6)/1.6*34);          // 이웃과 견준 기술
  pt += Math.round(clamp(N.pop/(적인구*0.32), 0, 1.5)/1.5*20);    // 이웃과 견준 인구
  pt += Math.round(G.legit/6);                                   // 조정이 선 명분, 최대 16
  pt += 마디*2;                                                   // 열어 둔 기술 마디
  pt += 벗*4;                                                     // 등지지 않은 이웃
  pt -= Math.round(어지/3);
  if(!도읍) pt -= 30;
  pt = Math.max(0, pt);
  const 등급 = pt>=132?'상':pt>=96?'중':pt>=58?'하':'난세';
  G.scores.push({ era:E.nm, y:G.year, pt, 등급, 고을, stab:Math.round(N.stab),
                  tech:Math.round(N.tech), pop:N.pop, legit:Math.round(G.legit), 마디 });
}
function endGame(title, body){
  G.ended=true; G.mode='over'; scoreEra(G.era);
  const tot=G.scores.reduce((a,s)=>a+s.pt,0);
  const r=pushRecord(title);                        // 최고 기록에 남긴다
  G.popup={ kind:'end', title, body, y:G.year, total:tot, rank:r.rank };
}
function checkEnd(){
  if(G.ended) return;
  const 도읍=Object.values(G.provs).find(p=>p.cap && p.id==='hans');
  if(도읍 && 도읍.nat!=='kor'){
    endGame('도읍이 함락되었다','한성을 잃었다. 조정은 흩어졌다.'); return;
  }
  if(natProvs('kor').length===0){
    endGame('나라가 없어졌다','다스릴 땅이 남지 않았다.'); return;
  }
  if(G.year>=2025){
    endGame('육백 년','여기까지 왔다.');
  }
}

        + '  ('+num(Math.round(o.atk))+' 대 '+num(Math.round(o.def))+')'
        + (o.육로? '' : '  · 바닷길')
        + (d && !d.war? '  ·  '+natName(p.nat)+'과(와) 전쟁이 열린다' : ''); },

function actCost(a,p){
  const M=mods();
  let c=a.cost*(1+G.era*0.8);          // 시대가 오르면 값도 오른다
  if(a.id==='mo') c*=M.moCost*tagVal(p,'moCost',1);
  else if(a.id==='chuk') c*=M.fortCost*M.bldCost*tagVal(p,'fortCost',1);
  else if(a.id==='gaegan'||a.id==='sijang') c*=M.bldCost;
  c*=tagVal(p,'actCost',1);            // 기전은 무엇을 하든 손이 덜 든다
  // 이미 올린 만큼 비싸진다
  if(p){ const cur = a.id==='gaegan'?p.farm : a.id==='sijang'?p.trade : a.id==='chuk'?p.fort*10 : 0;
    if(cur) c*=Math.pow(1+cur/60,1.6); }
  return Math.round(c);
}
function actDesc(a,p){ return typeof a.desc==='function'? a.desc(p) : a.desc; }

function natCost(a){ return typeof a.cost==='function'? a.cost() : a.cost; }
function adjToKor(p){ return [...p.adj].some(id=>G.provs[id] && G.provs[id].nat==='kor'); }
/* 침공의 셈 — 화면에 적어 둔 것과 같은 식으로 센다.
   미리보기(warOdds)와 실제 판정(invade)이 같은 함수를 쓰게 해 두었다.
   따로 두면 언젠가 반드시 어긋난다. */
function warPower(from, target){
  const M=mods();
  const gov=officialAt(from.id);
  const mil=gov? 1+gov.mil/160 : 1;
  // 바다를 건너면 배가 있어야 한다. 경상남도·전라도에서 나가면 수군이 낫다.
  const 육로=[...from.adj].includes(target.id) && !SEA_LINK[from.id+'|'+target.id];
  const 배 = 육로? 1 : tagVal(from,'navy',0.75)*M.navy;
  const U=unitOf(from), V=unitOf(target);
  const atk=from.army*mil*(1+tagVal(from,'atk',0))*배*U.atk*M.atk
            *(1+techOf('kor')/220);
  const T=TERR[target.t];
  const def=target.army*T.def*(1+target.fort*0.14)*V.def
            *(target.nat==='kor'? M.defKor : 1)
            *(1+techOf(target.nat)/220);
  return { atk, def, 육로, U, V };
}
function warOdds(target){
  const from=invadeFrom(target);
  if(!from) return null;
  const w=warPower(from,target);
  return { from, ...w, p:clamp(w.atk/(w.atk+w.def),0,1) };
}
function invadeFrom(target){
  return [...target.adj].map(id=>G.provs[id]).filter(q=>q&&q.nat==='kor')
    .sort((a,b)=>b.army-a.army)[0] || null;
}
function invade(target){
  const from=invadeFrom(target);
  if(!from){ log('칠 만한 자리가 없다.'); return; }
  const 임자=target.nat;
  // 남의 나라 고을을 치는 것은 곧 전쟁이다. 전에는 아무 일도 아니었다.
  if(DIP_NATS.includes(임자)) declareWar(임자, true);
  const w=warPower(from,target);
  const atk=w.atk*rnd(0.85,1.15), def=w.def*rnd(0.9,1.1);
  const lossA=Math.round(from.army*clamp(def/(atk+def),0.15,0.7));
  const lossD=Math.round(target.army*clamp(atk/(atk+def),0.2,0.85));
  from.army=Math.max(0,from.army-lossA);
  target.army=Math.max(0,target.army-lossD);
  if(atk>def){
    const old=natName(임자);
    target.nat='kor'; target.unrest=clamp(target.unrest+45,0,100); G.plateDirty=true;
    target.army=Math.round(from.army*0.25); from.army=Math.round(from.army*0.75);
    log(from.nm+'의 '+w.U.nm+'이(가) '+target.nm+'을(를) 얻었다. ('+old+' 손실 '+num(lossD)+')');
    G.nations.kor.stab=clamp(G.nations.kor.stab-4,0,100);
    G.legit=clamp(G.legit+2,0,100);
  } else {
    log(target.nm+'을(를) 쳤으나 물러났다. (아군 손실 '+num(lossA)+')');
    G.nations.kor.stab=clamp(G.nations.kor.stab-6,0,100);
    G.legit=clamp(G.legit-2,0,100);
  }
  recalc();
}

/* 통상을 하나 더 열면 해마다 얼마가 들어오는지 — 어림이라도 보여 준다 */
function exportGuess(add){
  const M=mods();
  let pot=0;
  natProvs('kor').forEach(P=>{
    pot += goodVal(P,'exp',0)*(1+P.trade/44)*Math.pow(P.pop/100000,0.8);
  });
  const 지금 = DIP_NATS.filter(k=>dipOf(k)&&dipOf(k).trade&&!dipOf(k).war).length;
  return Math.max(0, Math.round(pot*(지금+add)*1.6*M.exp) - Math.round(pot*지금*1.6*M.exp));
}

/* ================================================================
   기술 마디를 연다
   ================================================================ */
function unlockTech(t){
  if(techDone(t.id)){ log('이미 열린 마디요.'); return; }
  if(G.era<t.era){ log('아직 이를 다룰 때가 아니오.'); return; }
  const prev=techPrev(t);
  if(prev && !techDone(prev.id)){ log(prev.nm+'을(를) 먼저 이루어야 하오.'); return; }
  if(G.res.pt < t.cost){ log('연구가 모자라오.'); return; }
  G.res.pt = +(G.res.pt - t.cost).toFixed(2);
  G.res.done[t.id]=G.year;
  G.nations.kor.tech = +(G.nations.kor.tech + 4 + G.era*1.5).toFixed(1);
  log('「'+t.nm+'」을(를) 이루었다.');
}

function hz(x,y,w,h,fn,tip){ HIT.push({x,y,w,h,fn,tip}); }
function inRect(p,r){ return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h; }
/* 판.
   ----------------------------------------------------------------
   머리 장식(ui_frame 0칸)은 192×64의 온전한 패쪽이다. 이것을 판 너비만큼
   가로로 늘이고 세로로 30px까지 눌러 붙이면, 글자 뒤에 찌그러진 문양이 깔린다.
   글월이 놓이는 자리에는 무늬를 깔지 않는다 — head:false 로 끈다. */
function panel(g,x,y,w,h,a,opt){
  g.fillStyle='rgba(14,16,20,'+(a||0.92)+')'; g.fillRect(x,y,w,h);
  const 머리 = !(opt && opt.head===false);
  if(머리 && hasAsset('frame') && w>=120 && h>=48){

    const dw=Math.min(w, 192*2.2), dh=Math.min(30, h*0.22);
    blit(g,'frame',0, x+(w-dw)/2, y, 192,64, dw, dh);
  }
  g.strokeStyle='rgba(190,158,96,.42)'; g.lineWidth=1; g.strokeRect(x+.5,y+.5,w-1,h-1);
}

function divider(g,x,y,w){

function bar(g,x,y,w,h,v,col){

/* 가운데가 0인 막대 — 사이(친교)처럼 음수가 있는 값에 쓴다 */
function bar2(g,x,y,w,h,v,col){

/* ── 값 치르기 ──
   정무가 남으면 정무로, 다 썼으면 별칙으로 국고를 태운다.
   여러 화면에서 같은 규칙을 쓰므로 한 곳에 모아 둔다. */
function quote(admCost, baseCost){
  const N=G.nations.kor, 손=(N.adm||0)>=admCost, 별칙=!손;
  const c=Math.round(baseCost*(별칙? byeolMul() : 1));
  return { 별칙, c, 돈:N.gold>=c, ok:N.gold>=c && !G.ended };
}
function pay(q, admCost, fn){
  const N=G.nations.kor;
  N.gold-=q.c;

  fn(); recalc();
}

/* ================================================================
   지도 그리기 — 고지도
   격자를 그대로 칠하면 네모가 보인다. 그래서
     경계 조각을 모아 고리로 잇고 → 꼭짓점을 흔들고 → 두 번 다듬어
   부드러운 해안선으로 바꾼다. 한지 위에 옅게 칠하고 먹으로 긋는다.
   지도판은 바뀔 때만 다시 굽는다.
   ================================================================ */
const PAL={ paper:'#e7ddc4', ink:'#2c2822', gold:'#8a6a2f', red:'#9d3b32' };
const WASH={ kor:'rgba(79,127,181,.26)', chn:'rgba(181,101,79,.24)',
             jpn:'rgba(138,111,174,.24)', ind:'rgba(111,138,114,.24)' };
/* 강 — 격자 좌표 폴리라인 */
const RIVERS=[
  [[47,11],[50,11],[53,10],[56,11]],                      // 압록·두만
  [[57,19],[55,19],[53,19],[51,20],[49,20]],              // 한강
  [[18,13],[24,14],[29,15],[34,15],[38,16]],              // 황하
  [[12,21],[18,22],[24,23],[30,23],[35,23],[39,23]]       // 양자강
];

function jit(x,y){ return [x+(hash2(x,y)-.5)*.5, y+(hash2(y+31,x+17)-.5)*.5]; }
function traceLoops(test){
  const out=new Map(), key=(a,b)=>a+','+b;
  const add=(ax,ay,bx,by)=>{ const k=key(ax,ay); if(!out.has(k)) out.set(k,[]); out.get(k).push([bx,by]); };
  for(let y=0;y<CFG.GH;y++) for(let x=0;x<CFG.GW;x++){
    if(!test(x,y)) continue;
    if(!test(x,y-1)) add(x,y,x+1,y);
    if(!test(x+1,y)) add(x+1,y,x+1,y+1);
    if(!test(x,y+1)) add(x+1,y+1,x,y+1);
    if(!test(x-1,y)) add(x,y+1,x,y);
  }
  const loops=[];
  while(out.size){
    const sk=out.keys().next().value, s=sk.split(',').map(Number);
    let cx=s[0], cy=s[1]; const loop=[]; let guard=0;
    while(guard++<20000){
      const k=key(cx,cy), arr=out.get(k);
      if(!arr||!arr.length){ out.delete(k); break; }
      const n=arr.pop(); if(!arr.length) out.delete(k);
      loop.push([cx,cy]); cx=n[0]; cy=n[1];
      if(cx===s[0]&&cy===s[1]) break;
    }
    if(loop.length>3) loops.push(loop);
  }
  return loops;
}
function chaikin(p,it){
  for(let k=0;k<it;k++){ const q=[];
    for(let i=0;i<p.length;i++){ const a=p[i], b=p[(i+1)%p.length];
      q.push([a[0]*.75+b[0]*.25, a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75, a[1]*.25+b[1]*.75]); }
    p=q; }
  return p;
}
function pathOf(test,iter){
  const C=CFG.CELL, path=new Path2D();
  traceLoops(test).forEach(loop=>{
    const s=chaikin(loop.map(([x,y])=>jit(x,y)), iter===undefined?3:iter);
    path.moveTo(s[0][0]*C, s[0][1]*C);
    for(let i=1;i<s.length;i++) path.lineTo(s[i][0]*C, s[i][1]*C);
    path.closePath();
  });
  return path;
}
/* 한지 */
let PAPER=null, PLATE=null;
function makePaper(w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  g.fillStyle=PAL.paper; g.fillRect(0,0,w,h);
  for(let i=0;i<220;i++){
    const x=Math.random()*w, y=Math.random()*h, r=30+Math.random()*170;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0, Math.random()<.5?'rgba(146,116,64,.045)':'rgba(255,252,240,.06)');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  g.lineWidth=1;
  for(let i=0;i<1400;i++){
    const x=Math.random()*w, y=Math.random()*h, L=5+Math.random()*24;
    const a=(Math.random()<.5?0:Math.PI/2)+(Math.random()-.5)*.45;
    g.strokeStyle=Math.random()<.5?'rgba(120,98,62,.055)':'rgba(255,253,244,.07)';
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*L, y+Math.sin(a)*L); g.stroke();
  }
  const vg=g.createRadialGradient(w/2,h/2,Math.min(w,h)*.25,w/2,h/2,Math.max(w,h)*.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(92,66,30,.20)');
  g.fillStyle=vg; g.fillRect(0,0,w,h);
  return c;
}
function seaDist(){
  const d=[]; for(let y=0;y<CFG.GH;y++) d.push(new Array(CFG.GW).fill(-1));
  const q=[];
  for(let y=0;y<CFG.GH;y++) for(let x=0;x<CFG.GW;x++) if(G.land[y][x]){ d[y][x]=0; q.push([x,y]); }
  for(let h=0;h<q.length;h++){ const [x,y]=q[h];
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{ const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=CFG.GW||ny>=CFG.GH||d[ny][nx]>=0) return;
      d[ny][nx]=d[y][x]+1; q.push([nx,ny]); }); }
  return d;
}
function terrainMarks(g,P){
  const C=CFG.CELL;
  g.save(); g.clip(P._path);
  P.cells.forEach(([x,y])=>{
    const h=hash2(x*7+3,y*13+5), h2=hash2(y*5+1,x*11+9);
    const px=(x+.15+h*.7)*C, py=(y+.15+h2*.7)*C;
    if(P.t==='mtn'){
      if(h>.42) return;
      const s=5+h2*4;
      g.beginPath(); g.moveTo(px-s*.9,py+s*.5); g.lineTo(px,py-s*.55); g.lineTo(px+s*.9,py+s*.5);
      g.closePath(); g.fillStyle='rgba(96,90,76,.30)'; g.fill();
      g.strokeStyle='rgba(40,36,30,.65)'; g.lineWidth=1; g.beginPath();
      g.moveTo(px-s*.9,py+s*.5); g.lineTo(px,py-s*.55); g.lineTo(px+s*.55,py+s*.1); g.stroke();
    } else if(P.t==='hill'){
      if(h>.34) return;
      g.strokeStyle='rgba(52,46,36,.42)'; g.lineWidth=1;
      g.beginPath(); g.arc(px,py+3,3.5+h2*2,Math.PI*1.06,Math.PI*1.94); g.stroke();
    } else if(P.t==='coast'){
      if(h>.30) return;
      g.strokeStyle='rgba(60,80,84,.35)'; g.lineWidth=1;
      for(let i=0;i<2;i++){ g.beginPath(); g.moveTo(px-4,py+i*3.5);
        g.quadraticCurveTo(px,py+i*3.5-2,px+4,py+i*3.5); g.stroke(); }
    } else {
      if(h>.30) return;
      g.strokeStyle='rgba(70,72,44,.34)'; g.lineWidth=1;
      g.beginPath(); g.moveTo(px-3.5,py); g.lineTo(px+3.5,py);
      g.moveTo(px-3.5,py+3); g.lineTo(px+3.5,py+3); g.stroke();
    }
  });
  g.restore();
}
function inkStroke(g,path,w,a,col){
  g.strokeStyle=col||PAL.ink; g.lineJoin='round'; g.lineCap='round';
  g.globalAlpha=a*.5; g.lineWidth=w*1.9; g.stroke(path);
  g.globalAlpha=a;    g.lineWidth=w;     g.stroke(path);
  g.globalAlpha=1;
}
function buildPlate(){
  const C=CFG.CELL, MW=CFG.GW*C, MH=CFG.GH*C;
  const c=document.createElement('canvas'); c.width=MW; c.height=MH;
  const g=c.getContext('2d');
  if(!PAPER) PAPER=makePaper(MW,MH);
  /* 바다 — 종이 위 옅은 청록, 해안 등거리선 */
  g.drawImage(PAPER,0,0);
  g.fillStyle='rgba(150,178,178,.34)'; g.fillRect(0,0,MW,MH);
  const D=seaDist();
  for(let k=4;k>=1;k--){
    const p=pathOf((x,y)=>x>=0&&y>=0&&x<CFG.GW&&y<CFG.GH&&D[y][x]>=0&&D[y][x]<=k,3);
    g.strokeStyle='rgba(66,96,102,'+(0.05+(5-k)*0.045)+')'; g.lineWidth=1; g.stroke(p);
  }
  /* 땅 바탕 — 이음매가 안 보이게 통째로 */
  const landPath=pathOf((x,y)=>x>=0&&y>=0&&x<CFG.GW&&y<CFG.GH&&G.land[y][x],3);
  g.save(); g.clip(landPath); g.drawImage(PAPER,0,0);
  g.fillStyle='rgba(226,214,182,.55)'; g.fillRect(0,0,MW,MH); g.restore();
  /* 지방 채색 + 지형 기호 */
  Object.values(G.provs).forEach(P=>{
    P._path=pathOf((x,y)=>x>=0&&y>=0&&x<CFG.GW&&y<CFG.GH&&G.grid[y][x]===P.id,3);
    g.save();
    g.fillStyle=WASH[P.nat]||WASH.ind; g.fill(P._path);
    g.clip(P._path);
    g.strokeStyle=NATIONS[P.nat].col; g.globalAlpha=.10; g.lineWidth=14; g.stroke(P._path);
    g.globalAlpha=.14; g.lineWidth=5; g.stroke(P._path);
    g.globalAlpha=1; g.restore();
    terrainMarks(g,P);
  });
  /* 강 */
  g.lineCap='round';
  RIVERS.forEach(r=>{
    const s=chaikin(r.map(([x,y])=>[x+.5,y+.5]),3);
    g.beginPath(); g.moveTo(s[0][0]*C,s[0][1]*C);
    for(let i=1;i<s.length;i++) g.lineTo(s[i][0]*C,s[i][1]*C);
    g.strokeStyle='rgba(84,116,124,.55)'; g.lineWidth=2.2; g.stroke();
    g.strokeStyle='rgba(150,182,186,.45)'; g.lineWidth=1; g.stroke();
  });
  /* 먹선 — 도 경계 → 국경 → 해안선 */
  Object.values(G.provs).forEach(P=>inkStroke(g,P._path,0.8,.28));
  Object.keys(NATIONS).forEach(k=>{
    const p=pathOf((x,y)=>x>=0&&y>=0&&x<CFG.GW&&y<CFG.GH&&G.grid[y][x]&&G.provs[G.grid[y][x]].nat===k,3);
    inkStroke(g,p,1.7,.62);
  });
  inkStroke(g,landPath,1.5,.75);
  g.globalCompositeOperation='multiply'; g.globalAlpha=.35; g.drawImage(PAPER,0,0);
  g.globalCompositeOperation='source-over'; g.globalAlpha=1;
  PLATE=c; G.plateDirty=false;
}
function inkText(g,t,x,y,size,col,halo){
  g.font=size+'px "Nanum Myeongjo","Batang",serif';
  g.lineJoin='round'; g.strokeStyle=halo||'rgba(231,221,196,.92)';
  g.lineWidth=3.2; g.strokeText(t,x,y);
  g.fillStyle=col||PAL.ink; g.fillText(t,x,y);
}

/* 실제 지리 + 음영기복 지도. 경제·전쟁용 G.grid는 그대로 두고 화면과 클릭만 분리한다. */
let MAPVIS=null, MAPBASE=null, MAPCLOUDS=null;
const MAP_NAMES={
  hamb:'함북',hamn:'함남',pyab:'평북',pyan:'평남',hwan:'황해',gaes:'개성',hans:'한성',
  gyeo:'경기',gang:'강원',chub:'충북',chun:'충남',gyeb:'경북',ando:'안동',gyen:'경남',
  jeon:'전라',jeju:'제주',mong:'몽골',manj:'만주',liao:'요동',hebe:'하북',shan:'산동',
  shax:'산서',shaa:'서북',hena:'하남',sich:'서남',hube:'호광',jian:'강소',zhej:'절강',
  fuji:'복건',guan:'광동',hokk:'홋카이도',toho:'도호쿠',kant:'간토',chubu:'주부',
  kans:'간사이',chug:'주고쿠',shik:'시코쿠',kyus:'규슈',sats:'사쓰마',tsus:'대마도',
  ryuk:'유구',taiw:'타이완'
};

/* ================================================================
   보는 창 — 얼마나 당겨 보고 어디를 보는가
   ----------------------------------------------------------------
   지도 창은 888×480으로 옆으로 길고, 한반도는 68×128로 세로로 길다.
   그래서 배율을 하나로 못 박아 두면 어떻게 잡아도 고을이 작다.
   배율과 자리를 플레이어에게 넘긴다 — 휠로 당기고, 끌어서 옮긴다.
   지도판·경계·이름은 그대로 두고 보는 창만 움직이므로
   전쟁·인접 판정은 하나도 달라지지 않는다.
   ================================================================ */
const MAP_ZOOM_MIN=1, MAP_ZOOM_MAX=8;
/* 한반도가 창 높이에 꼭 차는 배율. 실제 좌표에서 재어 둔 값이다. */
const KOR_BOX={x0:585,y0:154,x1:653,y1:282};
const MAP_PRESETS={
  all:  ()=>({ zoom:1, cx:MAP_GEO.width/2, cy:MAP_GEO.height/2 }),
  korea:()=>({ zoom:Math.min(MAP_ZOOM_MAX, (MAP_GEO.height/(KOR_BOX.y1-KOR_BOX.y0))*0.92),
               cx:(KOR_BOX.x0+KOR_BOX.x1)/2, cy:(KOR_BOX.y0+KOR_BOX.y1)/2 })
};
function mapZoom(){ return (G&&G.mapZoom)||1; }
function activeMapView(){ return { zoom:mapZoom(), x:(G&&G.mapPan?G.mapPan.x:0), y:(G&&G.mapPan?G.mapPan.y:0) }; }
/* 창이 지도 밖으로 나가지 않게 잡아 둔다 */
function clampPan(){
  if(!G||!G.mapPan) return;
  const z=mapZoom(), vw=MAP_GEO.width/z, vh=MAP_GEO.height/z;
  G.mapPan.x=clamp(G.mapPan.x, 0, Math.max(0, MAP_GEO.width-vw));
  G.mapPan.y=clamp(G.mapPan.y, 0, Math.max(0, MAP_GEO.height-vh));
}
/* 가운데를 정해 창을 옮긴다 */
function centerMap(cx,cy){
  const z=mapZoom();
  G.mapPan={ x:cx-MAP_GEO.width/(2*z), y:cy-MAP_GEO.height/(2*z) };
  clampPan();
}
function setMapPreset(name){
  const p=(MAP_PRESETS[name]||MAP_PRESETS.korea)();
  G.mapZoom=clamp(p.zoom, MAP_ZOOM_MIN, MAP_ZOOM_MAX);
  G.mapFocus=name;
  centerMap(p.cx, p.cy);
}
/* 짚은 자리를 붙들고 당긴다 — 커서 밑의 땅이 그대로 커서 밑에 남는다 */
function zoomAt(sx, sy, factor){
  if(!G||!G.mapPan) return;
  const before=mapScreenToLocal(sx,sy);
  const z0=mapZoom();
  G.mapZoom=clamp(z0*factor, MAP_ZOOM_MIN, MAP_ZOOM_MAX);
  if(G.mapZoom===z0) return;
  if(before){
    G.mapPan.x=before.x-(sx-CFG.GX)/G.mapZoom;
    G.mapPan.y=before.y-(sy-CFG.GY)/G.mapZoom;
  }
  G.mapFocus= G.mapZoom<=MAP_ZOOM_MIN+0.01? 'all' : 'free';
  clampPan();
}
function overMap(x,y){
  return x>=CFG.GX && y>=CFG.GY && x<=CFG.GX+MAP_GEO.width && y<=CFG.GY+MAP_GEO.height;
}
function mapScreenToLocal(x,y){
  if(!overMap(x,y)) return null;
  const V=activeMapView();
  return {x:(x-CFG.GX)/V.zoom+V.x,y:(y-CFG.GY)/V.zoom+V.y};
}
function beginMapView(g){
  const V=activeMapView();
  g.save(); g.beginPath(); g.rect(CFG.GX,CFG.GY,MAP_GEO.width,MAP_GEO.height); g.clip();
  g.translate(CFG.GX,CFG.GY); g.scale(V.zoom,V.zoom); g.translate(-CFG.GX-V.x,-CFG.GY-V.y);
  return V;
}

function ensureMapVis(){
  if(MAPVIS) return;
  if(!window.MAP_GEO) throw new Error('assets/map_geo.js를 불러오지 못했습니다.');
  const regions={}, prov={}, rect={}, provOutline={}, anchors={};
  PROVDEF.forEach(P=>{ if(!MAP_GEO.regions[P.id]) throw new Error('지도 권역 누락: '+P.id); });
  Object.entries(MAP_GEO.regions).forEach(([id,data])=>{
    const path=new Path2D(data.d);
    regions[id]={...data,path}; prov[id]=path; rect[id]=path; provOutline[id]=path;
    anchors[id]={x:CFG.GX+data.label[0],y:CFG.GY+data.label[1]};
    if(G&&G.provs[id]){ G.provs[id]._path=path; G.provs[id].cx=data.label[0]; G.provs[id].cy=data.label[1]; }
  });
  const boundaries=MAP_GEO.borders.map(b=>({...b,path:new Path2D(b.d)}));
  MAPVIS={land:new Path2D(MAP_GEO.coast),regions,prov,rect,provOutline,anchors,
    inner:new Path2D(MAP_GEO.borders.map(b=>b.d).join('')),boundaries};
}

function rebuildMapBase(){
  ensureMapVis();
  const c=document.createElement('canvas'); c.width=CFG.W; c.height=CFG.H;
  const g=c.getContext('2d'), W=MAP_GEO.width, H=MAP_GEO.height;
  const sea=g.createLinearGradient(CFG.GX,CFG.GY,CFG.GX+W,CFG.GY+H);
  sea.addColorStop(0,'#071923'); sea.addColorStop(.52,'#0b2a38'); sea.addColorStop(1,'#123d4a');
  g.fillStyle=sea; g.fillRect(CFG.GX,CFG.GY,W,H);
  g.save(); g.translate(CFG.GX,CFG.GY); g.lineJoin='round'; g.lineCap='round';
  [[24,'rgba(66,120,132,.065)'],[13,'rgba(93,146,150,.095)'],[5,'rgba(179,197,180,.15)']].forEach(([w,col])=>{
    g.strokeStyle=col; g.lineWidth=w; g.stroke(MAPVIS.land);
  }); g.restore();
  g.save(); g.beginPath(); g.rect(CFG.GX,CFG.GY,W,H); g.clip();
  for(let i=0;i<34;i++){
    const q=hash2(i,13), q2=hash2(i,29), x=CFG.GX+q*W, y=CFG.GY+q2*H;
    const len=28+hash2(i,47)*70, rise=(hash2(i,61)-.5)*5;
    g.strokeStyle='rgba(137,184,190,'+(0.018+hash2(i,73)*0.025)+')'; g.lineWidth=.65;
    g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+len*.25,y-2+rise,x+len*.5,y);
    g.quadraticCurveTo(x+len*.75,y+2-rise,x+len,y); g.stroke();
  } g.restore();
  g.save(); g.translate(CFG.GX,CFG.GY);
  g.save(); g.shadowColor='rgba(0,0,0,.52)'; g.shadowBlur=5; g.shadowOffsetY=2;
  g.fillStyle='#415042'; g.fill(MAPVIS.land,'evenodd'); g.restore();
  if(hasAsset('relief')){
    g.save(); g.clip(MAPVIS.land,'evenodd'); g.filter='saturate(.96) contrast(1.04)';
    g.drawImage(ASSETS.img.relief,0,0,W,H); g.filter='none';
    const shade=g.createLinearGradient(0,0,W,H);
    shade.addColorStop(0,'rgba(244,226,164,.035)'); shade.addColorStop(1,'rgba(8,24,27,.12)');
    g.fillStyle=shade; g.fillRect(0,0,W,H); g.restore();
  }else{
    Object.values(G.provs).forEach(P=>{ g.fillStyle=TERR[P.t].col; g.fill(MAPVIS.rect[P.id],'evenodd'); });
  }
  g.restore(); MAPBASE=c;
}

function ensureMapBase(){ ensureMapVis(); if(!MAPBASE) rebuildMapBase(); }

function ensureCloudLayer(){
  if(MAPCLOUDS) return;
  const c=document.createElement('canvas'); c.width=MAP_GEO.width; c.height=MAP_GEO.height;
  const g=c.getContext('2d');
  [[555,408,.92],[800,386,1.02]].forEach(([cx,cy,s],cluster)=>{
    for(let i=0;i<14;i++){
      const a=hash2(cluster*31+i,401)*Math.PI*2, d=hash2(cluster*31+i,409)*44*s;
      const x=cx+Math.cos(a)*d, y=cy+Math.sin(a)*d*.42, r=(16+hash2(i,cluster+419)*30)*s;
      const cloud=g.createRadialGradient(x-r*.2,y-r*.15,r*.08,x,y,r);
      cloud.addColorStop(0,'rgba(244,241,222,.18)'); cloud.addColorStop(.55,'rgba(224,231,220,.10)');
      cloud.addColorStop(1,'rgba(214,228,222,0)'); g.fillStyle=cloud; g.fillRect(x-r,y-r,r*2,r*2);
    }
  }); MAPCLOUDS=c;
}

/* 어느 고을을 짚었는가.
   좁은 섬을 손가락으로 찍기는 어렵다. 그래서 이름표에서 가장 가까운 고을을 먼저 보고,
   그것이 없을 때만 실제 경계 안쪽인지 따진다. 잡히는 반경은 손가락이냐 마우스냐와
   화면이 얼마나 줄어 있느냐에 따라 달라진다. */
function provinceAtPoint(x,y){
  const point=mapScreenToLocal(x,y); if(!point) return null;
  ensureMapVis(); const lx=point.x, ly=point.y, V=activeMapView();
  const cssScale=Math.max(.1,cv.getBoundingClientRect().width/CFG.W);
  const hitRadius=clamp((Mouse.touch?28:15)/cssScale,Mouse.touch?24:14,Mouse.touch?88:38);
  let nearest=null, nearestDistance=Infinity;
  for(const [id,R] of Object.entries(MAPVIS.regions)){
    const distance=Math.hypot(lx-R.label[0],ly-R.label[1])*V.zoom;
    const radius=hitRadius*(R.small?1.12:1);
    if(distance<=radius&&distance<nearestDistance){ nearest=id; nearestDistance=distance; }
  }
  if(nearest) return nearest;
  for(const [id,R] of Object.entries(MAPVIS.regions)){
    const b=R.bbox;
    if(lx>=b[0]&&ly>=b[1]&&lx<=b[2]&&ly<=b[3]&&ctx.isPointInPath(R.path,lx,ly,'evenodd')) return id;
  }
  return null;
}

function drawSeaRoutes(g){
  const inv=1/activeMapView().zoom;
  const routes=[['gyen','tsus'],['tsus','kyus'],['shan','hwan'],['zhej','ryuk'],['fuji','taiw']];
  g.save(); g.translate(CFG.GX,CFG.GY); g.setLineDash([4,7]); g.lineCap='round';
  g.strokeStyle=G.mapMode==='political'?'rgba(105,157,181,.52)':'rgba(123,180,196,.30)'; g.lineWidth=inv;
  routes.forEach(([a,b],i)=>{
    const p=MAPVIS.regions[a].anchor, q=MAPVIS.regions[b].anchor;
    const mx=(p[0]+q[0])/2+(hash2(i,701)-.5)*22, my=(p[1]+q[1])/2-12-hash2(i,709)*16;
    g.beginPath(); g.moveTo(p[0],p[1]); g.quadraticCurveTo(mx,my,q[0],q[1]); g.stroke();
  }); g.setLineDash([]); g.restore();
}

function drawCountryLabels(g){
  const political=G.mapMode==='political';
  const labels={chn:{x:350,y:248,size:58,angle:-.04},kor:{x:642,y:235,size:34,angle:1.08},jpn:{x:758,y:238,size:27,angle:-.58}};
  Object.entries(labels).forEach(([id,L])=>{
    const name=natName(id), size=Math.max(17,L.size-Math.max(0,name.length-3)*3.2);
    g.save(); g.translate(CFG.GX+L.x,CFG.GY+L.y); g.rotate(L.angle);
    g.textAlign='center'; g.textBaseline='middle'; g.font='700 '+size+'px serif';
    g.globalAlpha=political?.92:.10; g.shadowColor='rgba(246,231,185,.28)'; g.shadowBlur=2;
    g.lineWidth=2; g.strokeStyle='rgba(244,231,185,.26)'; g.strokeText(name,0,0);
    g.fillStyle='rgba(39,32,20,.96)'; g.fillText(name,0,0); g.restore();
  });
}

function drawMapModeControl(g){
  const x=CFG.GX+10,y=CFG.GY+10,w=57,h=23;
  panel(g,x-3,y-3,w*2+6,h+6,.97);
  btn(g,x,y,w,h,'지형',G.mapMode==='terrain',()=>{G.mapMode='terrain';});
  btn(g,x+w,y,w,h,'정치',G.mapMode==='political',()=>{G.mapMode='political';});
}

function drawMapFocusControl(g){
  const w=82,h=27,x=CFG.GX+MAP_GEO.width-w*2-10,y=CFG.GY+10;
  panel(g,x-3,y-3,w*2+6,h+6,.97);
  btn(g,x,y,w,h,'한반도',G.mapFocus==='korea',()=>{ setMapPreset('korea'); });
  btn(g,x+w,y,w,h,'동아시아',G.mapFocus==='all',()=>{ setMapPreset('all'); });
  if(inRect(Mouse,{x,y,w:w*2,h})) G.tip='F 키로 한반도와 동아시아 전체를 오간다.';

  /* 배율 — 휠로도 되지만, 눈에 보이는 손잡이가 하나는 있어야 한다 */
  const zy=y+h+9, bw=30, rw=w*2-bw*2;

  btn(g,x,zy,bw,h,'－',false, z>MAP_ZOOM_MIN+0.01? ()=>zoomAt(CFG.GX+MAP_GEO.width/2, CFG.GY+MAP_GEO.height/2, 1/1.35):null, z<=MAP_ZOOM_MIN+0.01);
  g.fillStyle='#c9bfa8'; g.font='12px serif'; g.textAlign='center';
  g.fillText(z.toFixed(1)+'배', x+bw+rw/2, zy+18); g.textAlign='left';
  btn(g,x+bw+rw,zy,bw,h,'＋',false, z<MAP_ZOOM_MAX-0.01? ()=>zoomAt(CFG.GX+MAP_GEO.width/2, CFG.GY+MAP_GEO.height/2, 1.35):null, z>=MAP_ZOOM_MAX-0.01);
  if(inRect(Mouse,{x:x,y:zy,w:w*2,h}))
    G.tip='지도 위에서 휠을 굴리면 짚은 자리를 붙들고 당긴다. 끌면 옮긴다. (＋ － 키로도 된다)';
}

function drawMap(g){
  const C=CFG.CELL, MW=MAP_GEO.width, MH=MAP_GEO.height, political=G.mapMode==='political';
  ensureMapBase(); G.hover=provinceAtPoint(Mouse.x,Mouse.y);
  const mapView=beginMapView(g), inv=1/mapView.zoom;
  g.drawImage(MAPBASE,0,0); drawSeaRoutes(g);
  g.save(); g.translate(CFG.GX,CFG.GY); g.clip(MAPVIS.land,'evenodd');
  Object.values(G.provs).forEach(P=>{
    g.globalAlpha=political?.50:.14; g.fillStyle=NATIONS[P.nat].col; g.fill(MAPVIS.rect[P.id],'evenodd');
  }); g.globalAlpha=1;
  if(G.view==='unrest') Object.values(G.provs).forEach(P=>{
    g.fillStyle='rgba(157,59,50,'+(P.unrest/100*.42)+')'; g.fill(MAPVIS.rect[P.id],'evenodd');
  });
  if(G.sel&&G.provs[G.sel]){ g.fillStyle='rgba(248,232,172,.11)'; g.fill(MAPVIS.rect[G.sel],'evenodd'); }
  if(G.hover&&G.provs[G.hover]&&G.hover!==G.sel){ g.fillStyle='rgba(244,239,220,.08)'; g.fill(MAPVIS.rect[G.hover],'evenodd'); }
  g.restore();

  g.save(); g.translate(CFG.GX,CFG.GY); g.lineCap='round'; g.lineJoin='round';
  g.strokeStyle=political?'rgba(43,39,29,.47)':'rgba(34,36,29,.34)'; g.lineWidth=.72*inv; g.stroke(MAPVIS.inner); g.restore();
  const nationEdge=new Path2D();
  MAPVIS.boundaries.forEach(e=>{ if(G.provs[e.a].nat!==G.provs[e.b].nat) nationEdge.addPath(e.path); });
  g.save(); g.translate(CFG.GX,CFG.GY); g.lineCap='round'; g.lineJoin='round';
  g.strokeStyle='rgba(5,9,11,.63)'; g.lineWidth=3.5*inv; g.stroke(nationEdge);
  g.strokeStyle='rgba(224,213,174,.63)'; g.lineWidth=1.35*inv; g.stroke(nationEdge);
  g.shadowColor='rgba(0,0,0,.42)'; g.shadowBlur=4*inv; g.strokeStyle='rgba(5,16,21,.76)'; g.lineWidth=3.3*inv; g.stroke(MAPVIS.land);
  g.shadowBlur=0; g.strokeStyle='rgba(220,211,168,.58)'; g.lineWidth=.9*inv; g.stroke(MAPVIS.land); g.restore();

  if(G.sel&&MAPVIS.provOutline[G.sel]){
    g.save(); g.translate(CFG.GX,CFG.GY); g.shadowColor='rgba(172,190,247,.35)'; g.shadowBlur=7;
    g.strokeStyle='#e7e0f0'; g.lineWidth=2*inv; g.stroke(MAPVIS.provOutline[G.sel]); g.restore();
  }
  if(G.hover&&G.hover!==G.sel&&MAPVIS.provOutline[G.hover]){
    g.save(); g.translate(CFG.GX,CFG.GY); g.strokeStyle='rgba(255,244,203,.82)'; g.lineWidth=1.1*inv;
    g.stroke(MAPVIS.provOutline[G.hover]); g.restore();
  }
  if(!political){ ensureCloudLayer(); g.save(); g.globalAlpha=.68; g.drawImage(MAPCLOUDS,CFG.GX,CFG.GY); g.restore(); }
  // 확대하면 큰 국호는 화면 밖으로 나가 조각만 보인다. 그때는 걷는다.
  const 당김 = mapView.zoom>1.2;
  if(!당김) drawCountryLabels(g);

  Object.values(G.provs).forEach(P=>{
    const R=MAPVIS.regions[P.id], a=MAPVIS.anchors[P.id], cx=a.x, cy=a.y;
    P.cx=R.label[0]; P.cy=R.label[1];
    const showName=(당김&&P.nat==='kor')||!political||P.cap||P.id===G.sel||P.id===G.hover;
    if(showName){
      const ax=CFG.GX+R.anchor[0], ay=CFG.GY+R.anchor[1];
      if(!political&&Math.hypot(cx-ax,cy-ay)>9){
        g.strokeStyle='rgba(221,214,190,.34)'; g.lineWidth=.55*inv; g.beginPath(); g.moveTo(ax,ay); g.lineTo(cx,cy-3); g.stroke();
      }
      // 글자는 확대에 그대로 딸려 커지면 안 된다 — 화면에서 늘 비슷한 크기로 보이게 줄여 둔다.
      // 확대했을 때 이웃 나라 이름까지 크게 쓰면 요동과 평북이 붙어 한 낱말로 읽힌다.
      // 우리 고을은 크게, 이웃은 화면에서 작게 — 봐야 할 것과 알아만 둘 것을 가른다.
      const 밑크기=R.small?8.5:9.5, z=mapView.zoom;
      const 화면크기 = 밑크기 * (P.nat==='kor'? clamp(1+(z-1)*0.4, 1, 1.8)
                                              : clamp(1+(z-1)*0.1, 1, 1.2));
      const labelSize = 화면크기/z;
      const label=MAP_NAMES[P.id]||P.nm;
      g.textAlign='center'; g.font=(R.small?'':'600 ')+labelSize+'px serif';
      if(P.id===G.sel){
        const labelWidth=g.measureText(label).width+labelSize*1.1;
        g.fillStyle='rgba(31,27,24,.9)'; g.fillRect(cx-labelWidth/2,cy-labelSize*1.15,labelWidth,labelSize*1.55);
        g.strokeStyle='rgba(244,224,165,.9)'; g.lineWidth=1.1*inv;
        g.strokeRect(cx-labelWidth/2,cy-labelSize*1.15,labelWidth,labelSize*1.55);
      }
      g.lineWidth=2.3*inv; g.strokeStyle='rgba(7,12,13,.84)'; g.strokeText(label,cx,cy);
      g.fillStyle=P.id===G.sel?'#fff1bc':'#eee4cd'; g.fillText(label,cx,cy);
    }
    if(P.cap){ const cap=R.capital||[R.label[0],R.label[1]-10], qx=CFG.GX+cap[0], qy=CFG.GY+cap[1];

const TABS=['국정','외교','기술','신하','정책','기록'];
const SCROLL={};                 // 탭마다 굴린 만큼 기억한다
function drawSide(g){
  const x=CFG.GX+CFG.GW*CFG.CELL+10, y=CFG.GY, w=CFG.W-x-8, h=CFG.H-y-8;
  // 맨 위가 탭이라 머리 장식은 가려지거나 삐져나온다
  panel(g,x,y,w,h,null,{head:false});
  // 탭
  const tw=(w-16)/TABS.length;
  TABS.forEach((t,i)=>{
    btn(g, x+8+i*tw, y+8, tw-4, 26, t, G.tab===t, ()=>{ G.tab=t; });
  });
  const cx=x+12, cy=y+46, cw=w-24, ch=h-46-8;

  // 굴림 — 이 패널 위에 손가락/휠이 있을 때만
  const 안 = inRect(Mouse,{x:x,y:cy-8,w:w,h:ch+8});
  const key=G.tab;
  let sc = SCROLL[key]||0;
  if(안 && Mouse.wheel){ sc += Mouse.wheel; }
  const max = Math.max(0, (SCROLL['_h_'+key]||0) - ch + 20);
  sc = clamp(sc, 0, max);
  SCROLL[key]=sc;

  const h0=HIT.length;
  g.save();
  g.beginPath(); g.rect(x+2, cy-10, w-4, ch+10); g.clip();
  const 끝 = (G.tab==='국정')? sideState(g,cx,cy-sc,cw)
           : (G.tab==='외교')? sideDiplomacy(g,cx,cy-sc,cw)
           : (G.tab==='기술')? sideTech(g,cx,cy-sc,cw)
           : (G.tab==='신하')? sideOfficials(g,cx,cy-sc,cw)
           : (G.tab==='정책')? sidePolicy(g,cx,cy-sc,cw)
           :                   sideLog(g,cx,cy-sc,cw);
  g.restore();
  SCROLL['_h_'+key] = (끝||0) - (cy-sc);      // 이번에 그린 내용의 실제 높이
  // 밖으로 밀려난 줄은 눌리지 않아야 한다
  for(let i=HIT.length-1;i>=h0;i--){
    const z=HIT[i], mid=z.y+z.h/2;
    if(mid<cy-10 || mid>cy+ch) HIT.splice(i,1);
  }

  // 굴림 막대
  if(max>0){
    const bh=Math.max(28, ch*ch/(ch+max));
    const by=cy + (ch-bh)*(sc/max);
    g.fillStyle='rgba(190,158,96,.10)'; g.fillRect(x+w-6, cy, 3, ch);
    g.fillStyle='rgba(190,158,96,.55)'; g.fillRect(x+w-6, by, 3, bh);
  }
}

function autoAssign(){
  const empty=natProvs('kor').filter(p=>!officialAt(p.id));
  if(!empty.length){ log('빈 고을이 없소.'); return; }
  let n=0;
  empty.forEach(p=>{
    let o=G.officials.find(x=>!x.post);
    if(!o){                                  // 사람이 모자라면 등용까지 알아서 (있는 돈 안에서)
      if(G.pool.length && G.nations.kor.gold>=40){
        o=G.pool.shift(); G.nations.kor.gold-=40; G.officials.push(o);
      } else return;
    }
    // 세력은 해마다 자리의 몫에서 다시 셈한다 — 여기서 따로 더하지 않는다
    o.post=p.id; n++;
  });
  log(n? (n+'개 고을에 수령을 보냈다.') : '보낼 사람이 없소.');
  if(n) Audio_ok();
}

function conflictOf(id){
  const out=[];
  POL_CONFLICT.forEach(([a,b])=>{
    if(a===id && G.policies.includes(b)) out.push(b);
    if(b===id && G.policies.includes(a)) out.push(a);
  });
  return out;
}

function togglePolicy(P){
  const N=G.nations.kor;
  if(G.policies.includes(P.id)){
    G.policies=G.policies.filter(i=>i!==P.id);
    if(G.polSince) delete G.polSince[P.id];
    log(P.nm+'을(를) 거두었다.'); return;
  }
  if(G.era<P.era){ log('아직 이를 논할 때가 아니오.'); return; }
  const clash=conflictOf(P.id);
  if(clash.length){ log(clash.map(polName).join('·')+'을(를) 두고 '+P.nm+'을(를) 함께 펼 수는 없소.'); return; }
  if(G.policies.length>=3){ log('정책은 셋까지요.'); return; }
  if(N.gold<P.cost){ log('국고가 모자라오.'); return; }
  N.gold-=P.cost; G.policies.push(P.id);
  (G.polSince||(G.polSince={}))[P.id]=G.year;
  if(P.id==='chagwan'){ N.gold+=400; log('차관을 들여왔다. 국고에 400전이 들어왔다.'); }
  log(P.nm+'을(를) 시행한다.');
}
