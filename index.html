  divider(g,x,yy-10,w); yy+=6;
  g.fillStyle='#e0bd76'; g.font='13px serif'; g.fillText('해마다', x, yy); yy+=20;
  const 통상수=DIP_NATS.filter(k=>dipOf(k)&&dipOf(k).trade&&!dipOf(k).war).length;
  const 조공수=DIP_NATS.filter(k=>dipOf(k)&&dipOf(k).tribute).length;
  const 물가=1+G.era*0.8;
  /* 실제로 들어온 값은 결산이 안다. 여기서는 지금 상태의 어림을 보인다. */
  const 지금수출 = (()=>{ const M=mods(); let pot=0;
    natProvs('kor').forEach(P=>{ pot+=goodVal(P,'exp',0)*(1+P.trade/44)*Math.pow(P.pop/100000,0.8); });
    return Math.round(pot*통상수*1.6*M.exp); })();
  const 세폐액 = Math.round(조공수*(30+natProvs('kor').length*6)*물가);
  const line=(k2,v,col)=>{
    g.fillStyle='rgba(150,145,135,.8)'; g.font='11px serif'; g.fillText(k2, x, yy);
    g.fillStyle=col||'#e8e1d1'; g.textAlign='right'; g.fillText(v, x+w, yy); g.textAlign='left';
    yy+=17;
  };
  line('수출', 통상수? '+'+num(지금수출)+' 전' : '통상 없음', 통상수?'#8fa86a':'rgba(110,105,98,.8)');
  line('세폐', 조공수? '−'+num(세폐액)+' 전' : '없음', 조공수?'#c4534a':'rgba(110,105,98,.8)');
  if(!통상수){
    g.fillStyle='rgba(150,145,135,.65)'; g.font='10px serif';
    g.fillText('통상을 하나 열면 해마다 약 '+num(exportGuess(1))+'전.', x, yy); yy+=16;
  }
  g.fillStyle='rgba(150,145,135,.65)'; g.font='10px serif';
  g.fillText('사신에 밝은 신하 — 가장 높은 외교 '+bestDip(), x, yy);
  return yy+18;
}

/* ── 기술 나무 ── */
function sideTech(g,x,y,w){
  const R=G.res;
  g.fillStyle='#e0bd76'; g.font='13px serif'; g.fillText('기술', x, y+12);
  g.font='12px serif'; g.textAlign='right';

  g.fillStyle='rgba(150,145,135,.7)'; g.font='10px serif';
  g.fillText('해마다 +'+researchGain().toFixed(1)+'.  학문의 고을과 민심이 연구를 민다.', x, y+28);
  let yy=y+50;

  Object.keys(TECH_BRANCH).forEach(br=>{
    const BR=TECH_BRANCH[br];
    g.fillStyle=BR.col; g.font='13px serif'; g.fillText(BR.nm, x, yy);
    g.fillStyle='rgba(140,135,125,.7)'; g.font='10px serif';
    g.fillText(BR.note, x+40, yy);
    yy+=8;
    TECHS.filter(t=>t.br===br).forEach(t=>{
      const done=techDone(t.id), open=techOpen(t);
      const rowH= done? 26 : (open? 42 : 26);
      if(done){
        g.fillStyle='rgba(143,168,106,.10)'; g.fillRect(x-4,yy,w+8,rowH-2);
        g.fillStyle=BR.col; g.font='12px serif'; g.fillText('● '+t.nm, x+2, yy+16);
        g.fillStyle='rgba(130,125,115,.75)'; g.font='10px serif'; g.textAlign='right';
        g.fillText(G.res.done[t.id]+'년', x+w, yy+16); g.textAlign='left';
      } else if(open){
        const 살수=R.pt>=t.cost && !G.ended;
        const hov=inRect(Mouse,{x:x-4,y:yy,w:w+8,h:rowH-2});
        if(hov&&살수){ g.fillStyle='rgba(190,150,80,.14)'; g.fillRect(x-4,yy,w+8,rowH-2); }
        g.fillStyle= 살수? '#e8e1d1' : '#8b8377'; g.font='12px serif';
        g.fillText('○ '+t.nm, x+2, yy+15);
        g.fillStyle= 살수? '#b79fe0' : 'rgba(120,115,105,.8)'; g.font='11px serif';
        g.textAlign='right'; g.fillText('연구 '+t.cost, x+w, yy+15); g.textAlign='left';
        g.fillStyle='rgba(143,168,106,.9)'; g.font='10px serif';
        g.fillText('＋ '+t.good, x+12, yy+30);
        if(살수) hz(x-4,yy,w+8,rowH-2, ()=>{ unlockTech(t); });
        if(hov) G.tip = 살수? ('「'+t.nm+'」 — 연구 '+t.cost+'을 들여 연다.')
                            : ('연구가 '+Math.ceil(t.cost-R.pt)+' 모자란다. 해마다 +'+researchGain().toFixed(1)
                               +' 이니 '+Math.ceil((t.cost-R.pt)/Math.max(0.1,researchGain()))+'해쯤 걸린다.');
      } else {
        g.fillStyle='rgba(70,66,60,.75)'; g.font='11px serif';
        const prev=techPrev(t);
        const why = G.era<t.era? (ERAS[t.era].nm+' 이후') : (prev? prev.nm+' 다음' : '');
        g.fillText('· '+t.nm+'  — '+why, x+2, yy+15);
      }
      yy+=rowH;
    });
    yy+=14;
  });
  return yy;
}

function sideLog(g,x,y,w){
  g.fillStyle='#e0bd76'; g.font='13px serif'; g.fillText('기록', x, y+12);
  let yy=y+34;
  G.log.slice(0,60).forEach(L=>{
    g.fillStyle='rgba(150,145,135,.6)'; g.font='10px serif'; g.fillText(L.y+'', x, yy);
    g.fillStyle='#c9bfa8'; g.font='12px serif';
    const words=L.s; let line='', out=[];
    for(const ch of words){ if(g.measureText(line+ch).width>w-40){ out.push(line); line=ch; } else line+=ch; }
    out.push(line);
    out.slice(0,2).forEach((t,i)=>{ g.fillText(t, x+34, yy+i*14); });
    yy+=Math.max(18, out.slice(0,2).length*14+6);
  });
  return yy+10;
}

/* 아래 — 고른 고을과 명령 */

    // 고을의 개성 — 이름 옆에 표를 달고, 자세한 것은 짚으면 나온다
    const TG=tagOf(P);
    g.font='18px serif';

    const GD=goodOf(P);
    if(GD){

      g.strokeStyle='rgba(143,168,106,.55)'; g.lineWidth=1; g.strokeRect(nx+.5, y+14.5, bw3-1, 17);
      g.fillStyle='#8fa86a'; g.fillText(GD, nx+7, y+27);
      if(inRect(Mouse,{x:nx,y:y+14,w:bw3,h:18})){
        const gd=GOODS[GD];
        const 팔곳=DIP_NATS.filter(k=>dipOf(k)&&dipOf(k).trade&&!dipOf(k).war).length;
        G.tip = gd.note + '   장사 +'+Math.round((gd.trade-1)*100)+'%'
          + (P.nat==='kor'
              ? (팔곳? '  ·  통상을 맺은 '+팔곳+'곳에 판다' : '  ·  팔 데가 없다 — 통상 조약을 맺으면 값이 된다')
              : '');
      }
      nx+=bw3+6;
    }
    if(TG){
      g.font='12px serif';
      const bw2=g.measureText(TG.nm).width+14;
      g.fillStyle='rgba(190,150,80,.22)'; g.fillRect(nx, y+14, bw2, 18);
      g.strokeStyle='rgba(224,189,118,.55)'; g.lineWidth=1; g.strokeRect(nx+.5, y+14.5, bw2-1, 17);
      g.fillStyle='#e0bd76'; g.fillText(TG.nm, nx+7, y+27);
      if(inRect(Mouse,{x:nx,y:y+14,w:bw2,h:18})){
        const 표=[['농사',TG.farm],['장사',TG.trade],['인구 상한',TG.popCap],
                  ['모병 값',TG.moCost],['축성 값',TG.fortCost],['명령 값',TG.actCost],
                  ['수비병',TG.garrison],['수군',TG.navy],['연구',TG.res]];
        const 조각=표.filter(([k,v])=>v!=null&&v!==1)
          .map(([k,v])=>k+' '+(v>1?'+':'−')+Math.round(Math.abs(v-1)*100)+'%');
        if(TG.drift) 조각.push('민심이 절로 어지러워진다');
        if(TG.interest) 조각.push('국고에 이자가 붙는다');
        if(TG.faction) 조각.push('붕당이 자란다');
        if(TG.stab) 조각.push('나라 민심 +'+TG.stab);
        if(TG.atk) 조각.push('공격 +'+Math.round(TG.atk*100)+'%');
        G.tip = TG.note + (조각.length? '   ' + 조각.join(' · ') : '');
      }
    }
    // 수치 — 이름표가 길어져도 겹치지 않게 이름표 너비도 함께 잰다
    let sx=x+230;
    [['인구',num(P.pop)],['개발',P.dev],['농지',P.farm],['상업',P.trade],
     ['성곽',P.fort],['병력 · '+unitOf(P).nm,num(P.army)]].forEach(([k,v])=>{
      g.font='10px serif'; const lw=g.measureText(k).width;
      g.fillStyle='rgba(150,145,135,.75)'; g.fillText(k, sx, y+22);
      g.font='14px serif'; const vw=g.measureText(v+'').width;
      g.fillStyle='#e8e1d1'; g.fillText(v+'', sx, y+40);
      sx+=Math.max(64, Math.max(vw,lw)+26);
    });
    g.fillStyle='rgba(150,145,135,.75)'; g.font='10px serif'; g.fillText('민심', sx, y+22);
    bar(g,sx,y+28,80,10, 1-P.unrest/100, P.unrest>50?'#c4534a':'#8fa86a');
    // 명령
    const N=G.nations.kor;
    let bx=x+16, by=y+58;

      const ok=a.need(P);
      const 손=(N.adm||0)>=a.adm;

      const c=Math.round(actCost(a,P) * (별칙? byeolMul() : 1));
      const 돈=N.gold>=c;
      const can=ok&&돈;
      btn(g, bx, by, 116, 28, a.nm+'  '+num(c), 별칙&&can,
        can? ()=>{ N.gold-=c;
          if(별칙) byeolPay(); else N.adm-=a.adm;
          a.run(P); recalc(); } : null, !can);
      g.fillStyle= !can? 'rgba(90,86,80,.5)' : (별칙?'rgba(196,140,74,.95)':'rgba(224,189,118,.7)');
      g.font='9px serif';
      g.fillText(별칙? ('별칙 x'+byeolMul().toFixed(1)) : ('정무 '+a.adm), bx+2, by+38);
      if(inRect(Mouse,{x:bx,y:by,w:116,h:28}))
        G.tip = actDesc(a,P)
          + (ok? (돈? (별칙? '  ·  정무를 다 썼다. 별칙으로 밀어붙이면 값이 '+byeolMul().toFixed(1)+'배, 신하 충성 −3, 민심 −0.6' : '')
                    : '  · 국고가 모자란다')
               : '  · 지금은 할 수 없다');
      bx+=122;
    });
  }
  // 정무와 한 해 보내기
  const N=G.nations.kor;
  const bw=170, bx=x+w-bw-14, by=y+h-40;
  const mx=admMax(), 남=N.adm||0;
  // 이름표와 구슬을 한 줄에 두면 겹치고(정무가 늘면 구슬이 이름표를 파고든다),
  // 명령 단추 줄에 두면 단추 밑의 '정무 n' 글자와 부딪힌다.
  // 그래서 명령 단추가 끝나는 오른쪽 빈자리에 두 줄로 세운다.
  const 끝=x+w-14;
  const 알=Math.min(mx,12), r=알>8?3.5:5, 간=알>8?10:14;
  const 시작=끝-알*간;
  g.textAlign='right'; g.font='11px serif';
  g.fillStyle= 남? 'rgba(150,145,135,.85)':'rgba(196,140,74,.95)';
  g.fillText(남? ('올해 남은 정무'+(mx>12? ' (+'+(mx-12)+')' : ''))
                : ('정무를 다 썼다 · 별칙 '+byeolCount()+'회'), 끝, y+66);
  g.textAlign='left';
  for(let i=0;i<알;i++){

  g.fillStyle='rgba(120,115,105,.8)'; g.font='10px serif'; g.textAlign='right';
  g.fillText('Space 로도 넘길 수 있다', x+w-14, by-6); g.textAlign='left';
}

/* 연말 결산 — 한 해에 무엇이 들어오고 나갔는지 */
function drawReport(g){
  const B=G.report, N=G.nations.kor;
  g.fillStyle='rgba(4,5,8,.74)'; g.fillRect(0,0,CFG.W,CFG.H);
  /* 창 높이는 담을 것에 맞춘다 — 빈 판을 크게 띄워 둘 까닭이 없다 */

          + (B.events.length? 31+evN*16+(B.events.length>4?14:0) : 0) + 66;
  const w=600, x=(CFG.W-w)/2, y=(CFG.H-h)/2;

  g.textAlign='center';
  g.fillStyle='#e0bd76'; g.font='22px serif'; g.fillText(G.year+'년 결산', CFG.W/2, y+42);
  g.textAlign='left';
  const 든=Math.round(B.trade), 난=Math.round(B.upkeepArmy+B.upkeepPay+B.upkeepFort
                                             +(B.tribute||0)+(B.polDrain||0));

  };

      '장시 '+num(든-(B.export||0)) + (B.export? ' · 수출 '+num(B.export) : '')
      + (B.interest? ' · 이자 '+num(B.interest) : ''));
  row('세출', '−'+num(난), '#c4534a',
      '군 '+num(B.upkeepArmy)+' · 녹봉 '+num(B.upkeepPay)+' · 성곽 '+num(B.upkeepFort)
      + (B.tribute? ' · 세폐 '+num(B.tribute) : '')
      + (B.polDrain? ' · 정책 '+num(B.polDrain) : ''));
  const 순=N.gold-B.gold0;

  yy+=4; divider(g,x+34,yy-8,w-68); yy+=8;
  row('곡식', num(N.food)+'  ('+(Math.round(B.farm-B.eaten)>=0?'+':'')+num(B.farm-B.eaten)+')',
      N.food>0?'#8fbf6a':'#c4534a',
      '거둠 '+num(B.farm)+' · 먹음 '+num(B.eaten)
      +(B.tributeFood?' · 세폐 '+num(B.tributeFood):'')+(B.spoil?' · 썩음 '+num(B.spoil):''));
  row('인구', num(N.pop)+'  ('+(N.pop-B.pop0>=0?'+':'')+num(N.pop-B.pop0)+')', '#9fd0e8');
  row('민심', Math.round(N.stab)+'  ('+(N.stab-B.stab0>=0?'+':'')+(N.stab-B.stab0).toFixed(1)+')',
      N.stab<35?'#c4534a':'#8fa86a',
      '수령 '+natProvs('kor').filter(p=>officialAt(p.id)).length+'/'+natProvs('kor').length
      +' · 어지러움 '+Math.round(natProvs('kor').reduce((a,p)=>a+p.unrest,0)/Math.max(1,natProvs('kor').length)));
  row('정통', Math.round(G.legit)+'  ('+((G.legit-(B.legit0!=null?B.legit0:G.legit))>=0?'+':'')
      +(G.legit-(B.legit0!=null?B.legit0:G.legit)).toFixed(1)+')',
      G.legit<35?'#c4534a':'#b79fe0');
  row('기술', N.tech.toFixed(1), '#b79fe0',
      '연구 '+num(G.res.pt)+'  (+'+(B.research||0).toFixed(1)+'/년)'
      + ' · 마디 '+Object.keys(G.res.done).length+'/'+TECHS.length);
  /* 이웃과의 사이 — 한 줄로 */
  if(B.dip && B.dip.length){
    const s=B.dip.map(d=>natName(d.k)+' '+(d.war?'전쟁':((d.rel>0?'+':'')+d.rel))).join('   ');
    row('이웃', '', '#c9bfa8', s);

  if(B.events.length){
    yy+=2; divider(g,x+34,yy-8,w-68); yy+=12;
    g.fillStyle='#e0bd76'; g.font='12px serif'; g.fillText('그해의 일', x+34, yy); yy+=17;

    if(B.events.length>4){ g.fillStyle='rgba(130,125,115,.8)'; g.font='10px serif';
      g.fillText('그 밖에 '+(B.events.length-4)+'가지', x+42, yy); }
  }
  btn(g, CFG.W/2-70, y+h-46, 140, 30, '다음 해로', false, ()=>{
    G.report=null;
    nextEvent();
  });
}

function wrapText(g,t,maxw){
  const out=[]; let line='';
  for(const ch of t){ if(g.measureText(line+ch).width>maxw){ out.push(line); line=ch; } else line+=ch; }
  out.push(line); return out;
}

/* ================================================================
   저장 — 칸 세 개와 자동 저장 하나
   ----------------------------------------------------------------
   자동 저장은 한 해가 지날 때마다 덮어쓴다. 손으로 저장한 칸은 건드리지 않는다.
   ================================================================ */
const SLOTS=['auto','1','2','3'];
function slotKey(s){ return CFG.SAVE+'_'+s; }
function packSave(){
  const d={ ver:VERSION, at:G.year, year:G.year, era:G.era, turn:G.turn,
    mapMode:G.mapMode, mapFocus:G.mapFocus, mapZoom:G.mapZoom, mapPan:G.mapPan,
    provs:{}, nations:G.nations, officials:G.officials, pool:G.pool,
    factions:G.factions, policies:G.policies, polSince:G.polSince,
    scores:G.scores, legit:G.legit, usedPeople:G.usedPeople, ended:G.ended,
    /* 예전 판이 흘리던 것들 — 다시 불러오면 사라져 있던 상태 */
    evDone:G.evDone, evQueue:G.evQueue, pendingEvent:G.pendingEvent,
    res:G.res, dip:G.dip, byeol:G.byeol, tab:G.tab, sel:G.sel, view:G.view,
    log:G.log.slice(0,60) };
  Object.entries(G.provs).forEach(([k,P])=>{ d.provs[k]={nat:P.nat,pop:P.pop,dev:P.dev,
    farm:P.farm,trade:P.trade,fort:P.fort,unrest:P.unrest,army:P.army,rebel:P.rebel||0}; });
  // 칸 목록에 보여줄 요약
  d.sum={ y:G.year, era:ERAS[G.era].nm, prov:natProvs('kor').length,
          pop:G.nations.kor.pop, gold:G.nations.kor.gold, ended:!!G.ended };
  return d;
}
function saveGame(slot){
  try{ localStorage.setItem(slotKey(slot||'auto'), JSON.stringify(packSave())); return true; }
  catch(e){ log('저장하지 못했다.'); return false; }
}
function slotInfo(slot){
  try{
    const d=JSON.parse(localStorage.getItem(slotKey(slot))||'null');
    if(!d) return null;
    if(d.ver!==VERSION) return { bad:true, ver:d.ver };
    return d.sum || { y:d.year, era:ERAS[d.era]?ERAS[d.era].nm:'', prov:0, pop:0, gold:0 };
  }catch(e){ return null; }
}
function deleteSlot(slot){ try{ localStorage.removeItem(slotKey(slot)); }catch(e){} }
function loadGame(slot){
  try{
    const d=JSON.parse(localStorage.getItem(slotKey(slot||'auto'))||'null');
    if(!d || d.ver!==VERSION) return false;
    newGame();
    G.year=d.year; G.era=d.era; G.turn=d.turn;
    G.mapMode=MAP_MODE_PARAM?START_MAP_MODE:(d.mapMode||'terrain');
    G.mapFocus=MAP_FOCUS_PARAM?START_MAP_FOCUS:(d.mapFocus||'korea');
    if(MAP_FOCUS_PARAM || d.mapZoom==null) setMapPreset(G.mapFocus);
    else { G.mapZoom=clamp(d.mapZoom,MAP_ZOOM_MIN,MAP_ZOOM_MAX);
           G.mapPan={x:(d.mapPan&&d.mapPan.x)||0, y:(d.mapPan&&d.mapPan.y)||0}; clampPan(); }
    G.nations=d.nations; G.officials=d.officials; G.pool=d.pool;
    G.factions=d.factions; G.policies=d.policies; G.log=d.log||[];
    G.polSince=d.polSince||{}; G.scores=d.scores||[]; G.ended=!!d.ended;
    if(d.legit!=null) G.legit=d.legit;
    if(d.usedPeople) G.usedPeople=d.usedPeople;
    /* 사건·연구·외교 — 예전에는 이것들이 저장되지 않아 불러오면 처음으로 돌아갔다 */
    G.evDone=d.evDone||{}; G.evQueue=d.evQueue||[]; G.pendingEvent=d.pendingEvent||null;
    if(d.res) G.res={ pt:d.res.pt||0, done:d.res.done||{}, gain:d.res.gain||0 };
    if(d.dip) DIP_NATS.forEach(k=>{ if(d.dip[k]) Object.assign(G.dip[k], d.dip[k]); });
    G.byeol=d.byeol||0;
    if(d.tab && TABS.includes(d.tab)) G.tab=d.tab;
    if(d.view) G.view=d.view;
    if(d.sel && d.sel in G.provs) G.sel=d.sel;
    Object.entries(d.provs).forEach(([k,v])=>{ if(G.provs[k]) Object.assign(G.provs[k],v); });
    recalc(); G.plateDirty=true;
    return true;
  }catch(e){ return false; }
}
function hasAnySave(){ return SLOTS.some(s=>!!slotInfo(s)); }

/* ================================================================
   기록 — 끝난 판만 남는다
   ----------------------------------------------------------------
   세이브는 버전이 바뀌면 버려지지만, 기록은 남는다.
   어느 판에서 어디까지 갔는지는 규칙이 바뀌어도 뜻이 있다.
   ================================================================ */
function loadRecords(){
  try{ const a=JSON.parse(localStorage.getItem(CFG.RECORDS)||'[]'); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function pushRecord(how){
  const tot=G.scores.reduce((a,s)=>a+s.pt,0);
  let at='';
  try{ at=new Date().toISOString().slice(0,10); }catch(e){}
  const r={ ver:VERSION, y:G.year, how, total:tot, at,
            prov:natProvs('kor').length, era:ERAS[G.era].nm,
            legit:Math.round(G.legit), tech:Math.round(G.nations.kor.tech),
            node:Object.keys(G.res.done).length };
  const all=loadRecords();
  all.push(r);
  all.sort((a,b)=> b.total-a.total || a.y-b.y);
  const top=all.slice(0,10);
  try{ localStorage.setItem(CFG.RECORDS, JSON.stringify(top)); }catch(e){}
  return { rank: top.indexOf(r)+1, top };
}
function clearRecords(){ try{ localStorage.removeItem(CFG.RECORDS); }catch(e){} }

    yy+=rh;
  });
  btn(g, CFG.W/2-140, y+h-46, 120, 30, '돌아간다', false, ()=>{
    MENU = (MENU && MENU.from==='title')? null : { tab:null };
    if(SCENE==='title') MENU=null;
  });
  if(recs.length) btn(g, CFG.W/2+20, y+h-46, 120, 30, '기록 지우기', false, ()=>{
    확인('기록 지우기','남은 기록이 모두 사라진다.','지운다',
      ()=>{ clearRecords(); MENU={tab:'records', from:MENU&&MENU.from}; });
  });
}

/* 놀이 중 메뉴 */
function drawMenu(g){
  if(MENU && MENU.confirm){ drawConfirm(g); return; }
  if(MENU && MENU.tab==='records'){ drawRecords(g); return; }
  if(MENU && MENU.tab){ drawSlots(g, MENU.tab); return; }
  const w=300, h=390, x=(CFG.W-w)/2, y=(CFG.H-h)/2;
  g.fillStyle='rgba(4,5,8,.78)'; g.fillRect(0,0,CFG.W,CFG.H);
  bigPanel(g,x,y,w,h);
  g.textAlign='center'; g.fillStyle='#e0bd76'; g.font='20px serif';
  g.fillText('메뉴', CFG.W/2, y+42);
  g.fillStyle='rgba(140,135,125,.75)'; g.font='11px serif';
  g.fillText(G.year+'년 · '+ERAS[G.era].nm, CFG.W/2, y+62);
  g.textAlign='left';
  let yy=y+86; const bw=w-60, bx=x+30;
  btn(g,bx,yy,bw,38,'돌아가기',false,()=>{ MENU=null; }); yy+=46;
  btn(g,bx,yy,bw,38,'저장하기',false,()=>{ MENU={tab:'save'}; }); yy+=46;
  btn(g,bx,yy,bw,38,'불러오기',false,()=>{ MENU={tab:'load'}; }); yy+=46;
  btn(g,bx,yy,bw,38,'기록',false,()=>{ MENU={tab:'records'}; }); yy+=46;
  btn(g,bx,yy,bw,38,'새로 시작',false,()=>{
    확인('새로 시작','지금 판은 사라진다. 남겨 두려면 먼저 저장하시오.','시작한다',()=>{ 새판(); });
  }); yy+=46;
  btn(g,bx,yy,bw,38,'나가기',false,()=>{
    확인('나가기','시작 화면으로 나간다. 자동 저장은 남는다.','나간다',()=>{
      saveGame('auto'); SCENE='title'; MENU=null;
    });
  });
  g.textAlign='center'; g.fillStyle='rgba(120,115,105,.6)'; g.font='10px serif';
  g.fillText('Esc 로 여닫는다', CFG.W/2, y+h-16); g.textAlign='left';
}

function drawConfirm(g){
  const C=MENU.confirm;
  const w=420, h=180, x=(CFG.W-w)/2, y=(CFG.H-h)/2;
  g.fillStyle='rgba(4,5,8,.82)'; g.fillRect(0,0,CFG.W,CFG.H);
  bigPanel(g,x,y,w,h);
  g.textAlign='center';
  g.fillStyle='#e0bd76'; g.font='20px serif'; g.fillText(C.title, CFG.W/2, y+48);
  g.fillStyle='#d9d2c2'; g.font='13px serif';
  wrapText(g,C.body,w-70).slice(0,2).forEach((t,i)=> g.fillText(t, CFG.W/2, y+82+i*19));
  g.textAlign='left';
  btn(g, x+w/2-130, y+h-52, 120, 32, '그만둔다', false, ()=>{ MENU=null; });
  btn(g, x+w/2+10,  y+h-52, 120, 32, C.ok, true, ()=>{ const f=C.fn; MENU=null; f(); });
}

/* ================================================================
   본체
   ================================================================ */
function tick(){
  const 창 = !!(G.popup || G.report || MENU);
  if(Key.pressed['Space'] && !창 && !G.ended && SCENE==='play'){ Key.pressed['Space']=false; endTurn(); }
  if(Key.pressed['KeyM'] && !창 && SCENE==='play'){
    Key.pressed['KeyM']=false; G.mapMode=G.mapMode==='terrain'?'political':'terrain';
  }
  if(Key.pressed['KeyF'] && !창 && SCENE==='play'){
    Key.pressed['KeyF']=false; setMapPreset(G.mapFocus==='all'?'korea':'all');
  }
  // ＋ － 로도 당긴다. 지도 한가운데를 붙들고 움직인다.
  if(!창 && SCENE==='play'){
    const 한가운데=[CFG.GX+MAP_GEO.width/2, CFG.GY+MAP_GEO.height/2];
    if(Key.pressed['Equal']||Key.pressed['NumpadAdd']){
      Key.pressed['Equal']=Key.pressed['NumpadAdd']=false; zoomAt(한가운데[0],한가운데[1],1.35); }
    if(Key.pressed['Minus']||Key.pressed['NumpadSubtract']){
      Key.pressed['Minus']=Key.pressed['NumpadSubtract']=false; zoomAt(한가운데[0],한가운데[1],1/1.35); }
  }
  // 오른쪽 판이 여섯 갈래가 되었으니 손으로도 넘길 수 있어야 한다
  if(!창 && SCENE==='play'){
    const 넘김=d=>{ const i=TABS.indexOf(G.tab); G.tab=TABS[(i+d+TABS.length)%TABS.length]; };
    if(Key.pressed['BracketLeft']){ Key.pressed['BracketLeft']=false; 넘김(-1); }
    if(Key.pressed['BracketRight']){ Key.pressed['BracketRight']=false; 넘김(1); }
    if(Key.pressed['Tab']){ Key.pressed['Tab']=false;
      넘김(Key.down['ShiftLeft']||Key.down['ShiftRight']? -1 : 1); }
  }
  if(Key.pressed['Escape']){ Key.pressed['Escape']=false;
    if(MENU){
      // 확인 창은 한 겹만 물러난다
      if(MENU.confirm) MENU=null;
      else if(MENU.tab) MENU = (SCENE==='title')? null : {tab:null};
      else MENU=null;
    }
    else if(G.report){ /* 결산은 도망칠 수 없다 */ }
    // 선택지와 결말도 도망칠 수 없다
    else if(G.popup && G.popup.kind!=='choice' && G.popup.kind!=='end') G.popup=null;
    else if(!G.popup && SCENE==='play') MENU={tab:null};
  }
  // 선택지 창에서는 1·2·3으로도 고른다
  if(창 && !MENU && G.popup && G.popup.kind==='choice'){
    ['Digit1','Digit2','Digit3'].forEach((k,i)=>{
      if(Key.pressed[k]){ Key.pressed[k]=false; G.pickChoice=i; }
    });
  }
  draw();
  if(G.pickChoice!=null){
    const z=HIT.filter(h=>h.choice!=null).find(h=>h.choice===G.pickChoice);
    G.pickChoice=null; if(z&&z.fn) z.fn();
  }
  if(Mouse.click){
    Mouse.click=false;
    const lo = MODAL>=0? MODAL : 0;
    for(let i=HIT.length-1;i>=lo;i--){
      const z=HIT[i];
      if(inRect(Mouse,z)){ if(z.fn) z.fn(); break; }
    }
  }
  Mouse.rclick=false; Mouse.wheel=0;
  Key.pressed={};
  requestAnimationFrame(tick);
}
loadAssets();
newGame();                 // 판은 미리 만들어 두되, 화면은 제목부터
SCENE = 'title';
requestAnimationFrame(tick);
</script>
