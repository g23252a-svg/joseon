    const mx=(p[0]+q[0])/2+(hash2(i,701)-.5)*22, my=(p[1]+q[1])/2-12-hash2(i,709)*16;
    g.beginPath(); g.moveTo(p[0],p[1]); g.quadraticCurveTo(mx,my,q[0],q[1]); g.stroke();
  }); g.setLineDash([]); g.restore();
}

/* ================================================================
   길 — 조운길 · 교역로 · 철길
   ----------------------------------------------------------------
   특산과 통상은 숫자로만 있었다. 인삼을 팔아도 지도에는 아무 일이 없고,
   세곡이 한성으로 올라와도 그 길이 어디로 나 있는지 알 수 없었다.
   나라가 무엇으로 이어져 있는지가 안 보이면, 고을 하나를 잃는 것이
   장부에서 한 줄이 빠지는 일로만 보인다.

   길 셋을 그린다.
     조운길  고을마다 거둔 것이 도읍으로 흘러간다. 도읍에 가까울수록 굵다.
     교역로  통상 조약을 맺은 나라로 물건이 나가고 돈이 들어온다.
     철길    식민 시대부터 큰 고을 사이의 줄기가 철길이 된다.

   길은 나라의 이웃 관계에서 도읍을 뿌리로 한 나무를 세워 놓는다.
   그러니 고을을 잃으면 그 너머의 길이 통째로 끊긴다 — 실제로 그렇다.
   ================================================================ */
let ROUTE=null, ROUTEKEY='';
function routeNet(){
  const cap=G.provs.hans;
  const mine=natProvs('kor');
  const key=mine.map(p=>p.id).sort().join(',')+'|'+(cap&&cap.nat==='kor'?1:0);
  if(!ROUTE || ROUTEKEY!==key){
    ROUTEKEY=key;
    ROUTE={ edges:[], parent:{}, order:[] };
    if(cap && cap.nat==='kor'){
      /* 도읍에서 뻗어 나가는 나무 — 이웃을 따라 넓이 우선으로 */
      const 봤다={hans:1}, 줄=['hans'];
      ROUTE.order.push('hans');
      for(let i=0;i<줄.length;i++){
        const a=줄[i];
        [...G.provs[a].adj].forEach(b=>{
          const q=G.provs[b];
          if(!q || q.nat!=='kor' || 봤다[b]) return;
          봤다[b]=1; ROUTE.parent[b]=a; 줄.push(b); ROUTE.order.push(b);
          ROUTE.edges.push({ a, b, sea:!!SEA_LINK[a+'|'+b] });
        });
      }
    }
  }
  /* 흐름 — 잎에서 뿌리로 더해 올라간다. 도읍 가까운 줄기가 굵어진다. */
  const 몫={};
  ROUTE.order.forEach(id=>{
    const P=G.provs[id];
    몫[id]= P? (P.farm*0.6 + P.trade*0.5) * (isCore(P)? 1 : 0.45)
                * (1 - clamp(P.unrest,0,100)/150) : 0;
  });
  const 흐름={};
  for(let i=ROUTE.order.length-1;i>=0;i--){
    const id=ROUTE.order[i];
    흐름[id]=(흐름[id]||0)+몫[id];
    const p=ROUTE.parent[id];
    if(p) 흐름[p]=(흐름[p]||0)+흐름[id];
  }
  ROUTE.flow=흐름;
  return ROUTE;
}
/* 교역로 — 어느 고을에서 나가 어느 고을로 닿는가 */
const TRADE_LANE={
  chn:[['pyab','liao'],['hwan','shan']],
  jpn:[['gyen','tsus'],['jeon','kyus']]
};
function drawRoutes(g, z){
  if(!G.provs.hans) return;
  const inv=1/z;
  const A=id=>{ const R=MAPVIS.regions[id]; return R? R.anchor : null; };
  const R2=routeNet();
  const 철길때 = G.era>=4;                       // 1910 — 실제로 그 무렵 놓였다
  g.save(); g.translate(CFG.GX,CFG.GY);
  g.lineCap='round'; g.lineJoin='round';

  /* ── 조운길 ── */
  R2.edges.forEach((e,i)=>{
    const p=A(e.a), q=A(e.b); if(!p||!q) return;
    const f=R2.flow[e.b]||0;
    if(f<0.5) return;
    const 굵기=clamp(Math.pow(f,0.42)*0.30, 0.28, 2.2);
    const 철 = 철길때 && 굵기>0.9 && !e.sea;
    // 길바닥
    g.setLineDash(e.sea? [3*inv,4*inv] : []);
    g.strokeStyle= e.sea? 'rgba(126,176,192,.42)'
                 : 철? 'rgba(40,36,32,.72)' : 'rgba(120,100,66,.46)';
    g.lineWidth=(굵기+ (철?0.5:0.25))*inv*2;
    g.beginPath(); g.moveTo(p[0],p[1]); g.lineTo(q[0],q[1]); g.stroke();
    if(!e.sea){
      g.strokeStyle= 철? 'rgba(176,168,156,.72)' : 'rgba(196,170,116,.5)';
      g.lineWidth=굵기*inv*2*0.55;
      g.beginPath(); g.moveTo(p[0],p[1]); g.lineTo(q[0],q[1]); g.stroke();
    }
    // 침목 — 철길임을 알아보게
    if(철 && z>=3.0){        // 침목은 가까이서만 — 멀리서는 선 굵기로 충분하다
      const dx=q[0]-p[0], dy=q[1]-p[1], L=Math.hypot(dx,dy);
      const nx=-dy/L, ny=dx/L, 칸=Math.max(3, 4);
      g.strokeStyle='rgba(40,36,32,.6)'; g.lineWidth=0.5*inv*2;
      g.beginPath();
      for(let t=칸/2;t<L;t+=칸){
        const cx=p[0]+dx*(t/L), cy=p[1]+dy*(t/L);
        g.moveTo(cx-nx*굵기*1.1, cy-ny*굵기*1.1);
        g.lineTo(cx+nx*굵기*1.1, cy+ny*굵기*1.1);
      }
      g.stroke();
    }
    g.setLineDash([]);
    // 흐르는 것 — 세곡이 도읍으로 올라간다
    if(z>=1.6){
      const n=clamp(Math.round(굵기*1.2),1,2);
      for(let j=0;j<n;j++){
        const t=((NOW*0.16+i*0.21+j*0.34)%1);
        const cx=lerp(q[0],p[0],t), cy=lerp(q[1],p[1],t);   // 잎 → 뿌리
        g.fillStyle= 철? 'rgba(224,196,140,.85)' : 'rgba(214,190,132,.7)';
        g.beginPath(); g.arc(cx,cy,(0.5+굵기*0.22)*inv*2,0,7); g.fill();
      }
    }
  });

  /* ── 교역로 ── */
  DIP_NATS.forEach((k,ki)=>{
    const d=dipOf(k); if(!d || !d.trade) return;
    const 끊김=d.war;
    (TRADE_LANE[k]||[]).forEach(([a,b],i)=>{
      const PA=G.provs[a], PB=G.provs[b];
      if(!PA||!PB||PA.nat!=='kor') return;
      const p=A(a), q=A(b); if(!p||!q) return;
      const mx=(p[0]+q[0])/2, my=(p[1]+q[1])/2 - Math.hypot(q[0]-p[0],q[1]-p[1])*0.18;
      g.setLineDash(끊김? [2*inv,5*inv] : [5*inv,4*inv]);
      g.strokeStyle= 끊김? 'rgba(196,83,74,.45)' : 'rgba(224,189,118,.5)';
      g.lineWidth=1.0*inv*2;
      g.beginPath(); g.moveTo(p[0],p[1]); g.quadraticCurveTo(mx,my,q[0],q[1]); g.stroke();
      g.setLineDash([]);
      if(끊김 || z<1.6) return;
      // 물건이 나가고 돈이 들어온다
      for(let j=0;j<2;j++){
        for(const 방향 of [0,1]){
          let t=((NOW*0.20+i*0.3+j*0.33+ki*0.17)%1);
          if(방향) t=1-t;
          const s=1-t, cx=s*s*p[0]+2*s*t*mx+t*t*q[0], cy=s*s*p[1]+2*s*t*my+t*t*q[1];
          g.fillStyle= 방향? 'rgba(232,206,140,.85)' : 'rgba(150,190,130,.8)';
          g.beginPath(); g.arc(cx,cy,0.9*inv*2,0,7); g.fill();
        }
      }
    });
  });
  g.restore();
}

/* ── 군을 부리는 띠 ──
   아래 판에는 자리가 없다(수치 줄과 명령 줄이 이미 꽉 찼다). 군은 지도의 것이므로
   지도 안쪽 아래에 띠로 붙인다. 세로 판에서도 같은 자리다. */
function drawArmyBar(g){
  const 우리=armyList('kor'); if(!우리.length) return;
  const A=armySel();
  // 띠는 넓게 쓴다 — 「한 해 +38 · 두 해 뒤 함락」까지 다 읽혀야 눈금 노릇을 한다
  const w=Math.min(LAY.phone? VIEW.w-12 : 640, VIEW.w-16);
  const 두줄 = !!A && LAY.phone;
  const h=A? (두줄? 46 : 30) : 26;
  const x=VIEW.x+8, y=VIEW.y+VIEW.h-h-8;
  g.fillStyle='rgba(14,16,20,.90)'; g.fillRect(x,y,w,h);
  g.strokeStyle='rgba(190,158,96,.35)'; g.lineWidth=1; g.strokeRect(x+.5,y+.5,w-1,h-1);
  if(!A){
    g.fillStyle='rgba(150,145,135,.85)'; g.font='11px serif';
    g.fillText('판 위의 군 '+우리.length+'  ·  깃발을 눌러 부린다', x+10, y+h/2+4);
    // 첫 군으로 바로 간다
    hz(x,y,w,h, ()=>{ G.armySel=우리[0].id; G.sel=우리[0].at; },
       '군을 고르면 맞닿은 고을이 빛난다. 그 고을을 누르면 그리로 간다.');
    return;
  }
  const P=G.provs[A.at];
  g.fillStyle=NATIONS.kor.col; g.fillRect(x+4, y+5, 3, h-10);
  g.fillStyle='#e8e1d1'; g.font='12px serif';
  g.fillText('우리 군 '+num(A.men)+(P? '  ·  '+P.nm : ''), x+13, 두줄? y+18 : y+h/2+4);
  /* 무엇을 하고 있는지, 그래서 몇 해가 걸리는지를 적는다.
     「성 앞에 섰다」만으로는 이기고 있는지 지고 있는지 알 수 없다.
     포위는 눈금이 도는 것이 보여야 눈금이다. */
  let 상태, 빛='#e0bd76';
  /* 고른 고을이 이 군과 맞닿은 남의 성이면, 치기 전에 먼저 셈을 보여 준다.
     「압도적인 병력으로 쳤는데 성이 안 따인다」는 대개 치고 나서야 알게 되는
     일이었다. 누르기 전에 몇 해가 걸리는지 알면 그것은 고름이 된다. */
  const 겨눔 = G.sel && G.sel!==A.at && G.provs[G.sel] && G.provs[G.sel].nat!=='kor'
               && canGo(A, G.sel) ? G.provs[G.sel] : null;
  if(겨눔 && !A.dest){
    const 함께=armiesAt(겨눔.id).filter(a=>a.nat==='kor')
                 .concat([{nat:'kor', at:겨눔.id, men:A.men}]);
    const 걸음=siegeStep(함께, 겨눔);
    상태='【'+겨눔.nm+'】 수비 '+num(Math.round(provDef(겨눔,null)))
        +(걸음>0? '  ·  한 해 +'+Math.round(걸음)+'  ·  '+Math.ceil(100/걸음)+'해면 함락'
                : '  ·  이 군으로는 못 민다');
    빛= 걸음>0? '#8fd6a0' : '#c4534a';
  } else if(A.dest && G.provs[A.dest]){
    const 끝 = (A.path&&A.path.length)? G.provs[A.path[A.path.length-1]] : null;
    상태= 끝? ('→ '+끝.nm+'  '+((A.path.length+1))+'걸음 남음')
            : ('→ '+G.provs[A.dest].nm+'  '+((A.need||1)-A.mv)+'해');
    빛='rgba(150,145,135,.85)';
  } else if(P && P.nat!=='kor'){
    const 무=siegeParty(A);                       // 이 성을 함께 미는 우리 편 모두
    const 걸음=siegeStep(무,P);
    const 남=걸음>0? Math.ceil((100-A.siege)/걸음)+'해 뒤 함락' : '이 힘으로는 못 민다 — 군을 더 보내시오';
    상태=(무.length>1? '함께 미는 군 '+무.length+'  ·  ' : '')
        +(A.siege>0? '포위 '+Math.round(A.siege)+'%  ' : '')
        +(걸음>0? '한 해 +'+Math.round(걸음)+'  ·  ' : '')+남;
    빛= 걸음>0? '#e0bd76' : '#c4534a';
  } else {
    상태='맞닿은 고을을 누르면 그리로 간다';
  }
  const bw=LAY.phone? 66 : 80;
  /* 세로 판에서는 한 줄에 다 못 들어간다. 「우리 군 30,000 · 평안북도」와
     「【요동】 수비 550,429 · 한 해 +2 …」가 한 줄에서 서로를 밀어냈다.
     좁으면 두 줄로 편다 — 잘라 낸 글은 읽어도 뜻이 없다. */
  g.font='11px serif';
  if(두줄){
    const 남폭=w-bw*2-24;
    let 글=상태;
    if(g.measureText(글).width>남폭) 글=wrapText(g,상태,Math.max(40,남폭))[0]+'…';
    g.fillStyle=빛; g.fillText(글, x+13, y+h-9);
  } else {
    g.textAlign='right';
    g.font='12px serif';
    const 왼폭=g.measureText('우리 군 '+num(A.men)+(P?'  ·  '+P.nm:'')).width+13;
    g.font='11px serif';
    const 남폭=w-bw*2-26-왼폭-18;
    let 글=상태;
    if(g.measureText(글).width>남폭) 글=wrapText(g,상태,Math.max(40,남폭))[0]+'…';
    g.fillStyle=빛; g.fillText(글, x+w-bw*2-16, y+h/2+4); g.textAlign='left';
    if(inRect(Mouse,{x:x+w-bw*2-16-남폭, y:y, w:남폭+6, h:h})) G.tip=상태;
  }

  /* 단추 이름.
     여태 「놓는다」「푼다」「흩는다」 셋이 나란히 있었다. 셋 다 '풀어 놓는다'는
     말이라 무엇이 무엇인지 알 수가 없었다 — 하나는 고르기를 그만두는 것이고,
     하나는 수비병으로 되돌리는 것이고, 하나는 군사를 영영 잃는 것인데.
     이제 이름에 결과를 적는다. */
  const 가는중 = !!A.dest;
  const by=y+4, bh=h-8;
  btn(g, x+w-bw*2-10, by, bw-4, bh, 가는중? '행군 취소':'선택 해제', false, ()=>{
    if(가는중){ A.dest=null; A.path=null; A.mv=0; log('군에 그 자리에 머물라 일렀다.'); }
    else G.armySel=null;
  });
  const 제땅 = P && P.nat==='kor';
  btn(g, x+w-bw-6, by, bw-4, bh, 제땅? '수비병으로':'군을 버린다', false, ()=>{
    확인(제땅? '수비병으로 되돌린다' : '군사를 버린다',
         제땅? (num(A.men)+'이 '+P.nm+'의 수비병으로 돌아간다. 판 위의 군은 사라진다.')
             : (num(A.men)+'이 남의 땅에서 흩어진다. 이 군사는 돌아오지 않는다.'),
         제땅? '되돌린다':'버린다',
         ()=>{ disbandArmy(A); });
  });
}

/* ── 군을 그린다 — 마을 위, 이름표 아래 ── */
function drawArmies(g, z){
  if(!G.armies || !G.armies.length) return;
  const inv=1/z;
  const A2=id=>{ const R=MAPVIS.regions[id]; return R? R.anchor : null; };
  g.save(); g.translate(CFG.GX,CFG.GY);
  /* 가는 길 — 어디로 향하는지 화살로 */
  G.armies.forEach(A=>{
    if(!A.dest) return;
    const p=A2(A.at), q=A2(A.dest); if(!p||!q) return;
    const 우리=A.nat==='kor';
    g.strokeStyle= 우리? 'rgba(240,226,190,.75)' : 'rgba(196,83,74,.6)';
    g.lineWidth=1.4*inv; g.setLineDash([4*inv,3*inv]);
    g.beginPath(); g.moveTo(p[0],p[1]); g.lineTo(q[0],q[1]); g.stroke();
    g.setLineDash([]);
    const dx=q[0]-p[0], dy=q[1]-p[1], L=Math.hypot(dx,dy)||1;
    const hx=q[0]-dx/L*4, hy=q[1]-dy/L*4, nx=-dy/L, ny=dx/L;
    g.fillStyle= 우리? 'rgba(240,226,190,.85)' : 'rgba(196,83,74,.75)';
    g.beginPath();
    g.moveTo(q[0]-dx/L*1.5, q[1]-dy/L*1.5);
    g.lineTo(hx+nx*2.2*inv*1.4, hy+ny*2.2*inv*1.4);
    g.lineTo(hx-nx*2.2*inv*1.4, hy-ny*2.2*inv*1.4);
    g.closePath(); g.fill();
  });
  /* 말 — 고을마다 나라별로 한 무더기씩.
     화면에서 늘 같은 크기로 보이게 inv 를 곱한다. 처음에 7px 로 잡았더니
     무엇이 서 있는지 알아볼 수가 없었다 — 판 위의 말은 읽혀야 말이다. */
  const 자리={};
  G.armies.forEach(A=>{ (자리[A.at]=자리[A.at]||[]).push(A); });
  Object.entries(자리).forEach(([id,list])=>{
    const a=A2(id); if(!a) return;
    list.forEach((A,i)=>{
      const 우리=A.nat==='kor', 고름=G.armySel===A.id;
      const col=NATIONS[A.nat].col;
      const u2=13*inv;                                   // 말 한 개의 크기
      const x=a[0]+(i-(list.length-1)/2)*u2*1.35, y=a[1]-u2*0.9;
      // 포위 고리 — 얼마나 갔는지. 말보다 먼저 깔린다.
      if(A.siege>0){
        g.strokeStyle='rgba(20,17,14,.8)'; g.lineWidth=3.4*inv;
        g.beginPath(); g.arc(x, y, u2*1.05, 0, 7); g.stroke();
        g.strokeStyle= 우리? '#e0bd76' : '#c4534a'; g.lineWidth=3.0*inv;
        g.beginPath(); g.arc(x, y, u2*1.05, -Math.PI/2, -Math.PI/2+Math.PI*2*(A.siege/100)); g.stroke();
      }
      // 바탕 — 어디에 있든 읽히게
      g.fillStyle='rgba(16,18,22,.82)';
      g.beginPath(); g.arc(x, y, u2*0.72, 0, 7); g.fill();
      g.strokeStyle= 고름? '#fff1bc' : 'rgba(20,17,14,.9)';
      g.lineWidth=(고름?2.2:1.2)*inv;
      g.beginPath(); g.arc(x, y, u2*0.72, 0, 7); g.stroke();
      // 깃대와 기
      const 흔=Math.sin(NOW*2.4+A.id)*0.16;
      g.strokeStyle='rgba(226,220,204,.9)'; g.lineWidth=1.5*inv;
      g.beginPath(); g.moveTo(x-u2*0.26, y+u2*0.42); g.lineTo(x-u2*0.26, y-u2*0.46); g.stroke();
      g.beginPath();
      g.moveTo(x-u2*0.26, y-u2*0.46);
      g.quadraticCurveTo(x+u2*0.24, y-u2*0.46+흔*u2, x+u2*0.50, y-u2*0.12);
      g.lineTo(x-u2*0.26, y-u2*0.02); g.closePath();
      g.fillStyle=col; g.fill();
      g.strokeStyle='rgba(20,17,14,.75)'; g.lineWidth=0.8*inv; g.stroke();
      // 사람 수 — 말 아래에 패쪽으로
      if(z>=1.4){
        const 글=numS(A.men);
        g.font=(9*inv)+'px serif'; g.textAlign='center';
        const tw2=g.measureText(글).width+7*inv;
        g.fillStyle='rgba(16,18,22,.88)';
        g.fillRect(x-tw2/2, y+u2*0.78, tw2, 11*inv);
        g.strokeStyle= 우리? 'rgba(224,189,118,.5)':'rgba(196,83,74,.5)';
        g.lineWidth=0.9*inv; g.strokeRect(x-tw2/2, y+u2*0.78, tw2, 11*inv);
        g.fillStyle= 우리? '#f2ead7' : '#e8c7c2';
        g.fillText(글, x, y+u2*0.78+8.4*inv);
        g.textAlign='left';
      }
    });
  });
  g.restore();
  /* 누르는 자리는 화면 좌표로 따로 등록한다 — 지도 변환 밖에서 */
  Object.entries(자리).forEach(([id,list])=>{
    const a=A2(id); if(!a) return;
    list.forEach((A,i)=>{
      const V=activeMapView();
      const sx=VIEW.x+(a[0]+(i-(list.length-1)/2)*13*1.35/z-V.x)*z;
      const sy=VIEW.y+(a[1]-13*0.9/z-V.y)*z;
      if(sx<VIEW.x||sx>VIEW.x+VIEW.w||sy<VIEW.y||sy>VIEW.y+VIEW.h) return;
      hz(sx-13, sy-14, 26, 30, ()=>{
        if(A.nat==='kor'){ G.armySel=(G.armySel===A.id)? null : A.id; G.sel=A.at; snd('pick'); }
        else { G.sel=A.at; snd('pick'); }
      }, natName(A.nat)+'의 군 '+num(A.men)
         +(A.dest&&G.provs[A.dest]? '  →  '+G.provs[A.dest].nm : '')
         +(A.siege>0? '  ·  포위 '+Math.round(A.siege)+'%' : ''));
    });
  });
}

function drawCountryLabels(g){
  const political=G.mapMode==='political';
  const labels={chn:{x:350,y:248,size:58,angle:-.04},kor:{x:642,y:235,size:34,angle:1.08},jpn:{x:758,y:238,size:27,angle:-.58}};
  Object.entries(labels).forEach(([id,L])=>{
    const name=natName(id), size=Math.max(17,L.size-Math.max(0,name.length-3)*3.2);
    g.save(); g.translate(CFG.GX+L.x,CFG.GY+L.y); g.rotate(L.angle);
    g.textAlign='center'; g.textBaseline='middle'; g.font='700 '+size+'px serif';
    g.globalAlpha=political?.92:.10; g.shadowColor='rgba(246,231,185,.28)'; g.shadowBlur=2;
    g.lineWidth=2; g.strokeStyle='rgba(244,231,185,.26)'; g.strokeText(name,0,0);
    g.fillStyle='rgba(39,32,20,.96)'; g.fillText(name,0,0); g.restore();
  });
}

  panel(g,x-3,y-3,w*2+6,h+6,.97);
  btn(g,x,y,w,h,'지형',G.mapMode==='terrain',()=>{G.mapMode='terrain';});
  btn(g,x+w,y,w,h,'정치',G.mapMode==='political',()=>{G.mapMode='political';});
}

function drawMapFocusControl(g){
  const w=LAY.small?66:82, h=LAY.small?24:27, x=VIEW.x+VIEW.w-w*2-10, y=VIEW.y+10;
  panel(g,x-3,y-3,w*2+6,h+6,.97);
  btn(g,x,y,w,h,'한반도',G.mapFocus==='korea',()=>{ setMapPreset('korea'); });
  btn(g,x+w,y,w,h,'동아시아',G.mapFocus==='all',()=>{ setMapPreset('all'); });
  if(inRect(Mouse,{x,y,w:w*2,h})) G.tip='F 키로 한반도와 동아시아 전체를 오간다.';

  /* 배율 — 휠로도 되지만, 눈에 보이는 손잡이가 하나는 있어야 한다 */
  const zy=y+h+9, bw=30, rw=w*2-bw*2;
  panel(g,x-3,zy-3,w*2+6,h+6,.97);
  const z=mapZoom();
  btn(g,x,zy,bw,h,'－',false, z>MAP_ZOOM_MIN+0.01? ()=>zoomAt(VIEW.x+VIEW.w/2, VIEW.y+VIEW.h/2, 1/1.35):null, z<=MAP_ZOOM_MIN+0.01);
  g.fillStyle='#c9bfa8'; g.font='12px serif'; g.textAlign='center';
  g.fillText(z.toFixed(1)+'배', x+bw+rw/2, zy+18); g.textAlign='left';
  btn(g,x+bw+rw,zy,bw,h,'＋',false, z<MAP_ZOOM_MAX-0.01? ()=>zoomAt(VIEW.x+VIEW.w/2, VIEW.y+VIEW.h/2, 1.35):null, z>=MAP_ZOOM_MAX-0.01);
  if(inRect(Mouse,{x:x,y:zy,w:w*2,h}))
    G.tip='지도 위에서 휠을 굴리면 짚은 자리를 붙들고 당긴다. 끌면 옮긴다. (＋ － 키로도 된다)';
}

function drawMap(g){
  const C=CFG.CELL, MW=VIEW.w, MH=VIEW.h, political=G.mapMode==='political';
  ensureMapBase(); G.hover=provinceAtPoint(Mouse.x,Mouse.y);
  const mapView=beginMapView(g), inv=1/mapView.zoom;
  g.drawImage(MAPBASE,0,0); drawSeaRoutes(g);
  g.save(); g.translate(CFG.GX,CFG.GY); g.clip(MAPVIS.land,'evenodd');
  Object.values(G.provs).forEach(P=>{
    g.globalAlpha=political?.50:.14; g.fillStyle=natColOf(P); g.fill(MAPVIS.rect[P.id],'evenodd');
  }); g.globalAlpha=1;
  if(G.view==='unrest') Object.values(G.provs).forEach(P=>{
    g.fillStyle='rgba(157,59,50,'+(P.unrest/100*.42)+')'; g.fill(MAPVIS.rect[P.id],'evenodd');
  });
  if(G.sel&&G.provs[G.sel]){ g.fillStyle='rgba(248,232,172,.11)'; g.fill(MAPVIS.rect[G.sel],'evenodd'); }
  {
    // 고른 군이 갈 수 있는 자리 — 누를 곳이 어디인지 보여야 한다
    const A=armySel();
    if(A && G.provs[A.at]){
      const 숨=0.10+Math.sin(NOW*3.2)*0.05;
      [...G.provs[A.at].adj].forEach(id=>{
        const q=G.provs[id]; if(!q) return;
        g.fillStyle= q.nat==='kor'? 'rgba(143,168,106,'+Math.max(0,숨).toFixed(3)+')'
                                  : 'rgba(196,83,74,'+Math.max(0,숨).toFixed(3)+')';
        g.fill(MAPVIS.rect[id],'evenodd');
      });
    }
  }
  if(G.hover&&G.provs[G.hover]&&G.hover!==G.sel){ g.fillStyle='rgba(244,239,220,.08)'; g.fill(MAPVIS.rect[G.hover],'evenodd'); }
  g.restore();

  g.save(); g.translate(CFG.GX,CFG.GY); g.lineCap='round'; g.lineJoin='round';
  g.strokeStyle=political?'rgba(43,39,29,.47)':'rgba(34,36,29,.34)'; g.lineWidth=.72*inv; g.stroke(MAPVIS.inner); g.restore();
  const nationEdge=new Path2D();
  MAPVIS.boundaries.forEach(e=>{ if(G.provs[e.a].nat!==G.provs[e.b].nat) nationEdge.addPath(e.path); });
  g.save(); g.translate(CFG.GX,CFG.GY); g.lineCap='round'; g.lineJoin='round';
  g.strokeStyle='rgba(5,9,11,.63)'; g.lineWidth=3.5*inv; g.stroke(nationEdge);
  g.strokeStyle='rgba(224,213,174,.63)'; g.lineWidth=1.35*inv; g.stroke(nationEdge);
  g.shadowColor='rgba(0,0,0,.42)'; g.shadowBlur=4*inv; g.strokeStyle='rgba(5,16,21,.76)'; g.lineWidth=3.3*inv; g.stroke(MAPVIS.land);
  g.shadowBlur=0; g.strokeStyle='rgba(220,211,168,.58)'; g.lineWidth=.9*inv; g.stroke(MAPVIS.land); g.restore();

  if(G.sel&&MAPVIS.provOutline[G.sel]){
    g.save(); g.translate(CFG.GX,CFG.GY); g.shadowColor='rgba(172,190,247,.35)'; g.shadowBlur=7;
    g.strokeStyle='#e7e0f0'; g.lineWidth=2*inv; g.stroke(MAPVIS.provOutline[G.sel]); g.restore();
  }
  if(G.hover&&G.hover!==G.sel&&MAPVIS.provOutline[G.hover]){
    g.save(); g.translate(CFG.GX,CFG.GY); g.strokeStyle='rgba(255,244,203,.82)'; g.lineWidth=1.1*inv;
    g.stroke(MAPVIS.provOutline[G.hover]); g.restore();
  }
  if(!political){ ensureCloudLayer(); g.save(); g.globalAlpha=.68; g.drawImage(MAPCLOUDS,CFG.GX,CFG.GY); g.restore(); }
  // 확대하면 큰 국호는 화면 밖으로 나가 조각만 보인다. 그때는 걷는다.
  const 당김 = mapView.zoom>1.2;
  if(!당김) drawCountryLabels(g);

  /* 길은 마을 밑으로 지나간다 */
  drawRoutes(g, activeMapView().zoom);

  /* ── 고을 — 이름표보다 먼저 선다 ──
     보이는 자리의 것만 그린다. 마흔둘을 늘 다 그리면 손전화가 버겁다. */
  {
    const V=activeMapView(), z=V.zoom;
    const x0=V.x-4, y0=V.y-4, x1=V.x+VIEW.w/z+4, y1=V.y+VIEW.h/z+4;
    // 마을은 뭍에만 선다 — 논이 바다로 흘러나가지 않게 해안선으로 자른다
    g.save(); g.translate(CFG.GX,CFG.GY); g.clip(MAPVIS.land,'evenodd'); g.translate(-CFG.GX,-CFG.GY);
    Object.values(G.provs).forEach(P=>{
      const R=MAPVIS.regions[P.id]; if(!R) return;
      const c=R.anchor;
      if(c[0]<x0||c[0]>x1||c[1]<y0||c[1]>y1) return;
      drawTown(g, P, z);
    });
    g.restore();
  }

  Object.values(G.provs).forEach(P=>{
    const R=MAPVIS.regions[P.id], a=MAPVIS.anchors[P.id], cx=a.x, cy=a.y;
    P.cx=R.label[0]; P.cy=R.label[1];
    const showName=(당김&&P.nat==='kor')||!political||P.cap||P.id===G.sel||P.id===G.hover;
    if(showName){
      const ax=CFG.GX+R.anchor[0], ay=CFG.GY+R.anchor[1];
      if(!political&&Math.hypot(cx-ax,cy-ay)>9){
        g.strokeStyle='rgba(221,214,190,.34)'; g.lineWidth=.55*inv; g.beginPath(); g.moveTo(ax,ay); g.lineTo(cx,cy-3); g.stroke();
      }
      // 글자는 확대에 그대로 딸려 커지면 안 된다 — 화면에서 늘 비슷한 크기로 보이게 줄여 둔다.
      // 확대했을 때 이웃 나라 이름까지 크게 쓰면 요동과 평북이 붙어 한 낱말로 읽힌다.
      // 우리 고을은 크게, 이웃은 화면에서 작게 — 봐야 할 것과 알아만 둘 것을 가른다.
      const 밑크기=R.small?8.5:9.5, z=mapView.zoom;
      const 화면크기 = 밑크기 * (P.nat==='kor'? clamp(1+(z-1)*0.4, 1, 1.8)
                                              : clamp(1+(z-1)*0.1, 1, 1.2));
      const labelSize = 화면크기/z;
      const label=MAP_NAMES[P.id]||P.nm;
      g.textAlign='center'; g.font=(R.small?'':'600 ')+labelSize+'px serif';
      if(P.id===G.sel){
        const labelWidth=g.measureText(label).width+labelSize*1.1;
        g.fillStyle='rgba(31,27,24,.9)'; g.fillRect(cx-labelWidth/2,cy-labelSize*1.15,labelWidth,labelSize*1.55);
        g.strokeStyle='rgba(244,224,165,.9)'; g.lineWidth=1.1*inv;
        g.strokeRect(cx-labelWidth/2,cy-labelSize*1.15,labelWidth,labelSize*1.55);
      }
      g.lineWidth=2.3*inv; g.strokeStyle='rgba(7,12,13,.84)'; g.strokeText(label,cx,cy);
      g.fillStyle = P.id===G.sel? '#fff1bc'
                  : (P.nat==='kor' && !isCore(P))? '#d8b36a'   // 점령지는 눈에 띄게
                  : '#eee4cd';
      g.fillText(label,cx,cy);
    }
    /* 도읍 표 — 마을이 보이는 배율에서는 궁의 지붕이 이미 서 있다.
       그 위에 금빛 점을 또 찍으면 애써 그린 마을을 제가 덮는다.
       멀리서 볼 때만 점으로 알린다. */
    if(P.cap && mapView.zoom<1.5){
      const cap=R.capital||[R.label[0],R.label[1]-10], qx=CFG.GX+cap[0], qy=CFG.GY+cap[1];
      g.fillStyle='#d7b66f'; g.strokeStyle='rgba(20,17,14,.95)'; g.lineWidth=1.1*inv; g.beginPath();
      g.arc(qx,qy,3.3/Math.sqrt(mapView.zoom),0,Math.PI*2); g.fill(); g.stroke();
    } else if(P.cap){
      // 가까이서는 궁 둘레에 옅은 빛만 — 숨 쉬듯 뛴다
      const q=MAPVIS.regions[P.id];
      const qx=CFG.GX+q.anchor[0], qy=CFG.GY+q.anchor[1];
      const u2=1.15*townScale(P);
      const a2=0.13+Math.sin(NOW*1.5)*0.05;
      g.fillStyle='rgba(224,189,118,'+Math.max(0,a2).toFixed(3)+')';
      g.beginPath(); g.ellipse(qx,qy,u2*2.3,u2*1.45,0,0,7); g.fill();
    }
    // 어지러움·수령 표는 이름 옆에 붙어 있어야 한다.
    // 자리까지 확대에 딸려 가면 이름에서 멀찍이 떨어져 누구 것인지 알 수 없다.
    if(showName&&P.unrest>55){ g.fillStyle=PAL.red; g.beginPath(); g.arc(cx+14*inv,cy-3*inv,2.5*inv,0,7); g.fill(); }
    if(showName&&officialAt(P.id)){ g.fillStyle='rgba(113,190,125,.9)'; g.beginPath(); g.arc(cx-14*inv,cy-3*inv,2.3*inv,0,7); g.fill(); }
    g.textAlign='left';
  });

  /* 군은 이름표 위에 선다 — 판 위에서 가장 먼저 읽혀야 하는 것이다 */
  drawArmies(g, activeMapView().zoom);
  if(FX.length) drawFX(g, inv);
  g.restore();

  hz(VIEW.x,VIEW.y,MW,MH,()=>{
    const id=provinceAtPoint(Mouse.x,Mouse.y); if(!id) return;
    /* 군을 고른 채로 맞닿은 고을을 누르면 그리로 보낸다 —
       고르고 나서 또 어디를 눌러야 하는지 묻지 않는다. */
    const A=armySel();
    if(A && A.at!==id && orderMove(A,id)){
      const q=G.provs[id];
      const 몇해=(A.path? A.path.length:0)+1;
      log(natName('kor')+'의 군에 '+q.nm+(몇해>1? ' 쪽으로 — '+몇해+'걸음 길이다.' : ' 쪽으로 가라 일렀다.'));
      snd('click'); G.sel=id; return;
    }
    G.sel=id;
    // 그 고을에 우리 군이 있으면 함께 고른다
    const 여기=armiesAt(id).filter(a=>a.nat==='kor');
    G.armySel = 여기.length? 여기[0].id : null;
    snd('pick');
  });
  /* 제목 화면의 배경으로 깔 때는 손잡이를 그리지 않는다 —
     누를 수도 없는 단추가 네 귀퉁이에 옅게 떠 있으면 눈만 어지럽다 */
  if(!MAP_DECOR){ drawMapModeControl(g); drawMapFocusControl(g); drawArmyBar(g); }
  g.strokeStyle='rgba(224,189,118,.28)'; g.lineWidth=1; g.strokeRect(VIEW.x+.5,VIEW.y+.5,MW-1,MH-1);

  /* 세력 표는 단추 앞에서 멈춘다.
     자리를 정해 놓고 밀어 넣으면 좁은 판에서 단추 밑으로 기어들어 간다. */
  const 보기w = LAY.small?116:150, 보기x = VIEW.x+MW-보기w;
  let lx=VIEW.x+6, ly=VIEW.y+MH+16, 뺀수=0; g.font='11px serif';
  /* 이웃끼리의 판을 맨 앞에 세운다 — 탭을 열지 않아도 보여야 하는 소식이고,
     고을 수보다 큰 소식이다. 좁은 판에서는 이것이 먼저 자리를 잡는다. */
  const C0=G.cj;
  if(C0 && (C0.war||C0.ally)){
    const 글=natName('chn')+'↔'+natName('jpn')+(C0.war? ' 전쟁':' 동맹');
    const 폭=g.measureText(글).width+14;
    g.fillStyle= C0.war? 'rgba(143,168,106,.95)' : '#c4534a';
    g.fillText(글, lx, ly);
    if(inRect(Mouse,{x:lx-4,y:ly-12,w:폭,h:16}))
      G.tip = C0.war? '두 나라가 서로 싸운다. 조선을 향한 발길이 뜸한 동안이다 — 지금이 틈이다.'
                    : '두 나라가 손을 잡았다. 조선이 사이에 끼었다. 외교 탭에서 이간으로 벌려 놓을 수 있다.';
    lx+=폭;
  }
  Object.keys(NATIONS).forEach(k=>{
    const n=natProvs(k).length; if(!n) return;
    const 글=natName(k)+' '+n, 폭=22+g.measureText(글).width+(LAY.small?12:22);
    if(lx+폭 > 보기x-8){ 뺀수++; return; }
    if(!blit(g,'flags',NAT_UV[k],lx,ly-11,48,32,18,12)){ g.fillStyle=NATIONS[k].col; g.fillRect(lx,ly-9,12,10); }
    g.fillStyle='#c9bfa8'; g.fillText(글,lx+22,ly); lx+=폭;
  });
  if(뺀수){
    g.fillStyle='rgba(150,145,135,.75)'; g.fillText('+'+뺀수, lx, ly);
    if(inRect(Mouse,{x:lx-4,y:ly-12,w:34,h:16}))
      G.tip='자리가 좁아 '+뺀수+'세력을 접어 두었다. 지도를 눌러 보면 어느 세력인지 나온다.';
  }
  btn(g,보기x,ly-16,보기w,22,G.view==='unrest'?'보기 · 민심':'보기 · 세력',false,
      ()=>{G.view=G.view==='unrest'?'nat':'unrest';});
}

/* 오른쪽 패널 */
const TABS=['국정','외교','기술','신하','정책','기록'];
const SCROLL={};                 // 탭마다 굴린 만큼 기억한다
function drawSide(g){
  const x=LAY.side.x, y=LAY.side.y, w=LAY.side.w, h=LAY.side.h;
  // 맨 위가 탭이라 머리 장식은 가려지거나 삐져나온다
  panel(g,x,y,w,h,null,{head:false});
  // 탭
  const tw=(w-16)/TABS.length;
  TABS.forEach((t,i)=>{
    btn(g, x+8+i*tw, y+8, tw-4, 26, t, G.tab===t, ()=>{ G.tab=t; });
  });
  const cx=x+12, cy=y+46, cw=w-24, ch=h-46-8;

  // 굴림 — 이 패널 위에 손가락/휠이 있을 때만
  const 굴점 = (Mouse.wheelX!=null)? {x:Mouse.wheelX,y:Mouse.wheelY} : Mouse;
  const 안 = inRect(굴점,{x:x,y:cy-8,w:w,h:ch+8});
  const key=G.tab;
  let sc = SCROLL[key]||0;
  if(안 && Mouse.wheel){ sc += Mouse.wheel; }
  const max = Math.max(0, (SCROLL['_h_'+key]||0) - ch + 20);
  sc = clamp(sc, 0, max);
  SCROLL[key]=sc;

  const h0=HIT.length;
  g.save();
  g.beginPath(); g.rect(x+2, cy-10, w-4, ch+10); g.clip();
  const 끝 = (G.tab==='국정')? sideState(g,cx,cy-sc,cw)
           : (G.tab==='외교')? sideDiplomacy(g,cx,cy-sc,cw)
           : (G.tab==='기술')? sideTech(g,cx,cy-sc,cw)
           : (G.tab==='신하')? sideOfficials(g,cx,cy-sc,cw)
           : (G.tab==='정책')? sidePolicy(g,cx,cy-sc,cw)
           :                   sideLog(g,cx,cy-sc,cw);
  g.restore();
  SCROLL['_h_'+key] = (끝||0) - (cy-sc);      // 이번에 그린 내용의 실제 높이
  // 밖으로 밀려난 줄은 눌리지 않아야 한다
  for(let i=HIT.length-1;i>=h0;i--){
    const z=HIT[i], mid=z.y+z.h/2;
    if(mid<cy-10 || mid>cy+ch) HIT.splice(i,1);
  }

  // 굴림 막대
  if(max>0){
    const bh=Math.max(28, ch*ch/(ch+max));
    const by=cy + (ch-bh)*(sc/max);
    g.fillStyle='rgba(190,158,96,.10)'; g.fillRect(x+w-6, cy, 3, ch);
    g.fillStyle='rgba(190,158,96,.55)'; g.fillRect(x+w-6, by, 3, bh);
  }
}

function autoAssign(){
  const empty=natProvs('kor').filter(p=>!officialAt(p.id));
  if(!empty.length){ log('빈 고을이 없소.'); return; }
  let n=0;
  empty.forEach(p=>{
    let o=빈신하();
    if(!o){                                  // 사람이 모자라면 등용까지 알아서 (있는 돈 안에서)
      if(G.pool.length && G.nations.kor.gold>=40){
        o=G.pool.shift(); G.nations.kor.gold-=40; G.officials.push(o);
      } else return;
    }
    // 세력은 해마다 자리의 몫에서 다시 셈한다 — 여기서 따로 더하지 않는다
    o.post=p.id; n++;

  log(n? (n+'개 고을에 수령을 보냈다.') : '보낼 사람이 없소.');

function assign(o){

  const P=G.provs[G.sel];
  if(P.nat!=='kor'){ log('우리 고을이 아니오.'); return; }
  const prev=officialAt(P.id); if(prev) prev.post=null;
  o.post=P.id;
  log(o.nm+을를(o.nm)+' '+P.nm+' 수령으로 보냈다.');
}
function recruit(o){
  const N=G.nations.kor;
  if(N.gold<40){ log('국고가 모자라오.'); return; }
  N.gold-=40; G.pool=G.pool.filter(x=>x!==o); G.officials.push(o);

}
function conflictOf(id){
  const out=[];
  POL_CONFLICT.forEach(([a,b])=>{
    if(a===id && G.policies.includes(b)) out.push(b);
    if(b===id && G.policies.includes(a)) out.push(a);
  });
  return out;
}

  if(G.era<P.era){ log('아직 이를 논할 때가 아니오.'); return; }
  const clash=conflictOf(P.id);
  if(clash.length){ log(clash.map(polName).join('·')+을를(clash.map(polName).join('·'))+' 두고 '+P.nm+을를(P.nm)+' 함께 펼 수는 없소.'); return; }
  if(G.policies.length>=3){ log('정책은 셋까지요.'); return; }
  if(N.gold<P.cost){ log('국고가 모자라오.'); return; }
  N.gold-=P.cost; G.policies.push(P.id);
  (G.polSince||(G.polSince={}))[P.id]=G.year;
  if(P.id==='chagwan'){ N.gold+=400; log('차관을 들여왔다. 국고에 400전이 들어왔다.'); }
  log(P.nm+을를(P.nm)+' 시행한다.'); snd('treaty');
}
/* ── 외교 ──
   이웃이 둘뿐이라 화면도 둘로 나뉜다. 사이 하나, 조약 넷, 그리고 값. */
function sideDiplomacy(g,x,y,w){
  g.fillStyle='#e0bd76'; g.font='13px serif'; g.fillText('외교', x, y+12);
  g.fillStyle='rgba(150,145,135,.7)'; g.font='10px serif';
  g.fillText('사이가 무너지면 조약은 저절로 끊어진다.', x, y+28);
  let yy=y+52;

  DIP_NATS.forEach(k=>{
    const d=dipOf(k); if(!d) return;
    const NA=NATIONS[k];
    /* 이름과 사이 */
    g.fillStyle=NA.col; g.fillRect(x, yy-11, 3, 14);
    g.fillStyle='#e8e1d1'; g.font='15px serif'; g.fillText(natName(k), x+10, yy);
    g.font='12px serif'; g.textAlign='right';
    g.fillStyle=relCol(d.rel);
    g.fillText(relName(d.rel)+'  '+(d.rel>0?'+':'')+Math.round(d.rel), x+w, yy);
    g.textAlign='left';
    bar2(g, x, yy+8, w, 10, d.rel/100, relCol(d.rel));
    if(inRect(Mouse,{x:x,y:yy+8,w:w,h:10}))
      G.tip='사이는 가만두면 '+Math.round(relBase(k))+' 쪽으로 돌아간다. 조약과 정책이 그 자리를 옮긴다.';

    /* 조약 표 */
    let cx2=x, cy2=yy+24;
    if(d.war){    cx2+=chip(g,cx2,cy2,'전쟁 '+d.warYears+'해','#c4534a');
      const sc=Math.round(d.score||0);
      cx2+=chip(g,cx2,cy2,'전세 '+(sc>0?'+':'')+sc, sc>=12?'#8fa86a': sc<=-12?'#c4534a':'#c9bfa8');
      if(inRect(Mouse,{x:x,y:cy2-12,w:220,h:18}))
        G.tip='전세 — 야전과 함락이 쌓인다. '+warScoreLabel(sc)+'. 이기고 있으면 화친에서 배상을 받는다.';
    }
    if(d.truce>0) cx2+=chip(g,cx2,cy2,'휴전 '+d.truce+'년','#9fd0e8');
    if(d.envoy>0)  cx2+=chip(g,cx2,cy2,'사신 '+d.envoy+'년','#9fd0e8');
    if(d.tribute) cx2+=chip(g,cx2,cy2,'세폐','#c9a24a');
    if(d.trade)   cx2+=chip(g,cx2,cy2,'통상','#8fa86a');
    if(d.ally)    cx2+=chip(g,cx2,cy2,'동맹','#b79fe0');
    if(cx2===x){ g.fillStyle='rgba(110,105,98,.8)'; g.font='10px serif';
      g.fillText('맺은 것 없음', x, cy2+11); }

    /* 외교의 손 */
    const acts=dipActs(k);
    const colW=(w-8)/2;
    let by=yy+46;
    acts.forEach((a,i)=>{
      const bx=x+(i%2)*(colW+8), row=Math.floor(i/2);
      const yb=by+row*42;
      actBtn(g, bx, yb, colW, 26, a.nm, a.adm, a.cost, a.can(), a.run, a.desc());
    });
    yy = by + Math.ceil(acts.length/2)*42 + 22;
  });

  /* ── 이웃끼리의 사이 ──
     조선이 남을 보는 눈만 있던 자리에, 남들이 서로를 보는 눈을 더한다. */
  const C=G.cj;
  if(C){
    divider(g,x,yy-10,w); yy+=8;
    g.fillStyle=NATIONS.chn.col; g.fillRect(x, yy-11, 3, 14);
    g.fillStyle=NATIONS.jpn.col; g.fillRect(x+3, yy-11, 3, 14);
    g.fillStyle='#e8e1d1'; g.font='14px serif';
    g.fillText(natName('chn')+' ↔ '+natName('jpn'), x+13, yy);
    g.font='12px serif'; g.textAlign='right'; g.fillStyle=relCol(C.rel);
    g.fillText(relName(C.rel)+'  '+(C.rel>0?'+':'')+Math.round(C.rel), x+w, yy);
    g.textAlign='left';
    bar2(g, x, yy+8, w, 10, C.rel/100, relCol(C.rel));
    if(inRect(Mouse,{x:x,y:yy+8,w:w,h:10}))
      G.tip='둘이 맞붙어 있는 동안은 조선을 덜 본다. 손을 잡으면 조선이 사이에 낀다. '
          + '가만두면 '+Math.round(cjBase())+' 쪽으로 돌아간다.';
    let cx3=x, cy3=yy+24;
    if(C.war)     cx3+=chip(g,cx3,cy3,'서로 전쟁','#c4534a');
    if(C.ally)    cx3+=chip(g,cx3,cy3,'서로 동맹','#c4534a');
    if(C.truce>0) cx3+=chip(g,cx3,cy3,'휴전 '+C.truce+'년','#9fd0e8');
    if(C.mediate>0) cx3+=chip(g,cx3,cy3,'중재 '+C.mediate+'년','#8fa86a');
    if(C.trade)   cx3+=chip(g,cx3,cy3,'서로 통상','#c9a24a');
    if(cx3===x){ g.fillStyle='rgba(110,105,98,.8)'; g.font='10px serif';
      g.fillText('서로 맺은 것 없음', x, cy3+11); }
    // 이 사이가 조선에 무엇인지 한 줄로
    g.fillStyle= C.war? 'rgba(143,168,106,.95)' : C.ally? '#c4534a' : 'rgba(150,145,135,.7)';
    g.font='10px serif';
    g.fillText(C.war? '둘이 싸우는 동안 조선을 향한 발길이 뜸하다 — 지금이 틈이다'
             : C.ally? '둘이 손을 잡았다. 조선이 사이에 끼었다'
             : '조용하다', x, cy3+26);
    const acts2=cjActs(), colW2=(w-8)/2;
    acts2.forEach((a,i)=>{
      actBtn(g, x+i*(colW2+8), cy3+36, colW2, 26, a.nm, a.adm, a.cost, a.can(), a.run, a.desc());
    });
    yy = cy3+36+26+34;   // 단추 아래 값 줄(+10)까지 비운다
  }

  /* 값 — 조약이 해마다 얼마를 벌고 얼마를 먹는지 */
  divider(g,x,yy-10,w); yy+=6;
  g.fillStyle='#e0bd76'; g.font='13px serif'; g.fillText('해마다', x, yy); yy+=20;

  const 조공수=DIP_NATS.filter(k=>dipOf(k)&&dipOf(k).tribute).length;
  const 물가=1+G.era*0.8;
  /* 실제로 들어온 값은 결산이 안다. 여기서는 지금 상태의 어림을 보인다. */
  const 지금수출 = (()=>{ const M=mods(); let pot=0;
    natProvs('kor').forEach(P=>{ pot+=goodVal(P,'exp',0)*(1+P.trade/44)*Math.pow(P.pop/100000,0.8); });
    return Math.round(pot*통상수*1.6*M.exp); })();
  const 세폐액 = Math.round(조공수*(30+natProvs('kor').length*6)*물가);
  const line=(k2,v,col)=>{
    g.fillStyle='rgba(150,145,135,.8)'; g.font='11px serif'; g.fillText(k2, x, yy);
    g.fillStyle=col||'#e8e1d1'; g.textAlign='right'; g.fillText(v, x+w, yy); g.textAlign='left';

  line('수출', 통상수? '+'+num(지금수출)+' 전' : '통상 없음', 통상수?'#8fa86a':'rgba(110,105,98,.8)');
  line('세폐', 조공수? '−'+num(세폐액)+' 전' : '없음', 조공수?'#c4534a':'rgba(110,105,98,.8)');
  if(!통상수){
    g.fillStyle='rgba(150,145,135,.65)'; g.font='10px serif';
    g.fillText('통상을 하나 열면 해마다 약 '+num(exportGuess(1))+'전.', x, yy); yy+=16;
  }
  g.fillStyle='rgba(150,145,135,.65)'; g.font='10px serif';
  g.fillText('사신에 밝은 신하 — 가장 높은 외교 '+bestDip(), x, yy);
  return yy+18;
}

        g.fillStyle='rgba(143,168,106,.9)'; g.font='10px serif';
        g.fillText('＋ '+t.good, x+12, yy+30);

        if(hov) G.tip = 살수? ('「'+t.nm+'」 — 연구 '+값+'을 들여 연다.'
                               +(앞섬? '  때('+ERAS[t.era].nm+')보다 앞서 여는 값이다.':''))
                            : ('연구가 '+Math.ceil(값-R.pt)+' 모자란다. 해마다 +'+researchGain().toFixed(1)
                               +' 이니 '+Math.ceil((값-R.pt)/Math.max(0.1,researchGain()))+'해쯤 걸린다.');
      } else {

/* 수비 한 줄 — 좁은 판과 넓은 판이 같은 말을 쓴다 */
function 수비말(P, 수비, 원군, 위){
  const 야전=armiesAt(P.id).filter(a=>a.nat===P.nat).reduce((s,a)=>s+a.men,0);
  let t='이 고을이 버티는 힘 '+num(Math.round(수비))
      + '  =  수비병 '+num(P.army)
      + (야전? ' + 이 자리의 우리 군 '+num(야전) : '')
      + ' + 이웃의 원군 '+num(Math.round(원군))
      + '  ×  지형 '+TERR[P.t].def.toFixed(2)+' × 성곽 '+(1+P.fort*0.16).toFixed(2)
      + ' × 병종 '+unitOf(P).def.toFixed(2);
  /* 남의 성이면 「이만큼 몰고 가면 몇 해에 넘어온다」를 함께 적는다.
     칠 곳의 힘만 알려 주고 얼마가 드는지 말하지 않으면 반쪽이다. */
  if(P.nat!=='kor'){
    const 셋=[2,3,5].map(k=>{
      const men=Math.max(1000, Math.round(수비/(unitOf(null).atk*(1+techOf('kor')/220)*mods().atk)*k/3));
      const 걸음=siegeStep({nat:'kor', at:P.id, men}, P);
      return num(men)+' → '+(걸음<=0? '못 민다' : Math.ceil(100/걸음)+'해');
    });
    return t+'    ·  이 성을 밀려면  '+셋.join('  ·  ');
  }
  if(!위) return t+'    ·  지금 이 성을 겨누는 것이 없다';
  const 때 = 위.언제===0? '이미 밀고 있다' : 위.언제===1? '한 해 거리에 와 있다' : 위.무엇;
  return t+'    ·  '+위.처.nm+' ('+num(Math.round(위.힘))+') — '+때
        + ', 밀면 '+Math.round(위.p*100)+'%로 진다';
}

        G.tip = gd.note + '   장사 +'+Math.round((gd.trade-1)*100)+'%'
          + (P.nat==='kor'
              ? (팔곳? '  ·  통상을 맺은 '+팔곳+'곳에 판다' : '  ·  팔 데가 없다 — 통상 조약을 맺으면 값이 된다')

      }
      nx+=bw3+6;
    }
    // 빼앗은 땅인가 — 표로 달아 둔다. 세가 반쯤만 걷히고 어지러움이 절로 오른다.
    if(P.nat==='kor' && !isCore(P)){
      const 남=Math.max(0, ASSIM_YEARS-Math.floor(P.assim||0));
      const t='점령지 '+남+'해';
      g.font='12px serif';
      const bw4=g.measureText(t).width+14;
      g.fillStyle='rgba(201,162,74,.20)'; g.fillRect(nx, y+14, bw4, 18);
      g.strokeStyle='rgba(201,162,74,.7)'; g.lineWidth=1; g.strokeRect(nx+.5, y+14.5, bw4-1, 17);
      g.fillStyle='#c9a24a'; g.fillText(t, nx+7, y+27);
      if(inRect(Mouse,{x:nx,y:y+14,w:bw4,h:18}))
        G.tip='본디 '+natName(P.home)+'의 땅이다. 세와 곡식이 절반만 걷히고 어지러움이 해마다 절로 오른다. '
            + '수령을 두고 어지러움을 40 아래로 눌러 두면 한 해에 한 살씩 편입이 진행되어 '+ASSIM_YEARS+'해 뒤 본토가 된다. '
            + '어지러움이 오래 높으면 제 나라로 돌아선다.';
      nx+=bw4+6;
    }
    if(TG){
      g.font='12px serif';
      const bw2=g.measureText(TG.nm).width+14;
      g.fillStyle='rgba(190,150,80,.22)'; g.fillRect(nx, y+14, bw2, 18);
      g.strokeStyle='rgba(224,189,118,.55)'; g.lineWidth=1; g.strokeRect(nx+.5, y+14.5, bw2-1, 17);
      g.fillStyle='#e0bd76'; g.fillText(TG.nm, nx+7, y+27);
      if(inRect(Mouse,{x:nx,y:y+14,w:bw2,h:18})){
        const 표=[['농사',TG.farm],['장사',TG.trade],['인구 상한',TG.popCap],
                  ['모병 값',TG.moCost],['축성 값',TG.fortCost],['명령 값',TG.actCost],
                  ['수비병',TG.garrison],['수군',TG.navy],['연구',TG.res]];
        const 조각=표.filter(([k,v])=>v!=null&&v!==1)
          .map(([k,v])=>k+' '+(v>1?'+':'−')+Math.round(Math.abs(v-1)*100)+'%');
        if(TG.drift) 조각.push('민심이 절로 어지러워진다');
        if(TG.interest) 조각.push('국고에 이자가 붙는다');
        if(TG.faction) 조각.push('붕당이 자란다');
        if(TG.stab) 조각.push('나라 민심 +'+TG.stab);
        if(TG.atk) 조각.push('공격 +'+Math.round(TG.atk*100)+'%');
        G.tip = TG.note + (조각.length? '   ' + 조각.join(' · ') : '');
      }
    }
    /* 이 고을이 실제로 얼마나 버티는가.
       위 표시줄의 '군사'는 나라 전체 합이라, 고을 하나가 얼마로 지키는지는
       어디에도 보이지 않았다. 사만을 가지고도 성이 밀리는 것처럼 보인 까닭이다. */
    let 수비=null, 위태=false, 원군=0, 위=null;
    [...P.adj].forEach(id=>{ const q=G.provs[id];
      if(q && q.nat===P.nat) 원군 += q.army*0.20; });
    /* 위협은 이제 '이웃 고을'이 아니라 '판 위의 군'에서 온다.
       지키는 힘도 야전군을 함께 세는 provDef 를 그대로 쓴다 —
       화면이 보여 주는 수와 실제로 굴러가는 수가 같아야 한다.

       남의 고을에도 이 값을 보인다. 여태는 우리 고을에만 보여 주어,
       칠 곳을 고를 때 판에 적힌 것이 '병력'뿐이었다. 병력 팔만인 성에
       십육만을 몰고 갔는데 성이 꿈쩍도 않는 까닭 — 이웃이 보태는 몫과
       성곽과 지형이 곱해져 실제 수비는 백이십육만이었다 — 을 알 길이
       없었다. 칠 곳의 힘을 모르고 치는 것은 고름이 아니다. */
    수비=provDef(P, null);
    if(P.nat==='kor'){
      위=threatOf(P);
      위태 = !!(위 && 위.p>0.5 && 위.마음>=0.5);
    }
    // 수치 — 이름표가 길어져도 겹치지 않게 이름표 너비도 함께 잰다
    const 좁=LAY.phone, 짧=LAY.phone||LAY.small;
    const 수치=[['인구',짧?numS(P.pop):num(P.pop)],['개발',P.dev],['농지',P.farm],['상업',P.trade],
                ['성곽',P.fort],[짧?('병력·'+unitOf(P).nm):('병력 · '+unitOf(P).nm), 짧?numS(P.army):num(P.army)]];
    // 우리 고을이면 '수비'를 맨 앞에 세운다 — 이 고을이 실제로 버티는 힘
    if(수비!=null) 수치.unshift(['수비', 짧?numS(수비):num(Math.round(수비)), 위태?'#e08a80':'#cfc7b6', 위태?'위태':null]);
    /* 좁은 판에서는 한 줄에 다 못 들어간다 — 넷씩 두 줄로 접는다 */
    const 열수 = 좁? 4 : 수치.length;
    const 칸너비 = 좁? (w-24)/열수 : 0;
    const 최소칸 = LAY.small? 52 : 64;
    let sx=좁? x+12 : x+(LAY.small? 196 : 226), sy0=좁? y+62 : y+22;
    수치.forEach(([k,v,col,note],i)=>{
      if(좁){
        const r=Math.floor(i/열수), c2=i%열수;
        sx=x+12+c2*칸너비; 
        const by=sy0+r*34;
        g.font='9px serif';
        g.fillStyle= col&&위태&&k==='수비'? '#c4534a' : 'rgba(150,145,135,.75)';
        g.fillText(k, sx, by);
        g.font='13px serif'; g.fillStyle= col||'#e8e1d1';
        g.fillText(v+'', sx, by+15);
        if(note){ g.font='8px serif'; g.fillStyle='#c4534a'; g.fillText(note, sx, by+24); }
        if(k==='수비' && inRect(Mouse,{x:sx-4,y:by-10,w:칸너비,h:32}))
          G.tip = 수비말(P, 수비, 원군, 위);
        return;
      }
      g.font='10px serif'; const lw=g.measureText(k).width;
      g.fillStyle= col&&위태&&k==='수비'? '#c4534a' : 'rgba(150,145,135,.75)';
      g.fillText(k, sx, y+22);
      g.font='14px serif'; const vw=g.measureText(v+'').width;
      g.fillStyle= col||'#e8e1d1'; g.fillText(v+'', sx, y+40);
      const nw=note? (g.font='9px serif', g.measureText(note).width) : 0;
      if(note){ g.fillStyle='#c4534a'; g.fillText(note, sx, y+51); }
      if(k==='수비' && inRect(Mouse,{x:sx-4,y:y+12,w:Math.max(70,vw+26),h:44}))
        G.tip = 수비말(P, 수비, 원군, 위);
      sx+=Math.max(최소칸, Math.max(vw,lw,nw)+(LAY.small?14:26));
    });
    if(좁){
      // 빈 칸 하나에 민심을 넣는다 — 따로 두면 수치 줄과 겹친다
      const r=Math.floor(수치.length/열수), c2=수치.length%열수;
      const mx2=x+12+c2*칸너비, my2=sy0+r*34;
      g.fillStyle='rgba(150,145,135,.75)'; g.font='9px serif'; g.fillText('민심', mx2, my2);
      bar(g, mx2, my2+5, Math.min(80,칸너비-14), 9, 1-P.unrest/100, P.unrest>50?'#c4534a':'#8fa86a');
    } else {
      // 판 밖으로 나가지 않게 남은 자리에 맞춘다
      const 남폭=Math.min(80, x+w-14-sx);
      if(남폭>=24){
        g.fillStyle='rgba(150,145,135,.75)'; g.font='10px serif'; g.fillText('민심', sx, y+22);
        bar(g,sx,y+28,남폭,10, 1-P.unrest/100, P.unrest>50?'#c4534a':'#8fa86a');
      }
    }
    /* 반군 고을 — 칼이 아니라 쌀로도 되찾을 수 있다 */
    if(P.nat==='reb' && P.home==='kor'){
      const N2=G.nations.kor;
      const 값=Math.round(220*(1+G.era*0.5)), 손있다=(N2.adm||0)>=1, 돈있다=N2.gold>=값;
      const 되나=손있다&&돈있다&&!G.ended;
      const by2= LAY.phone? y+h-52 : y+62;
      btn(g, x+w-176, by2, 164, 30, '사면과 회유  '+num(값)+'전', false, 되나? ()=>{
        N2.gold-=값; N2.adm--;
        P.unrest=clamp(P.unrest-24,0,100);
        log(P.nm+'에 사면장과 곡식을 보냈다. 성난 마음이 조금 가라앉는다 (어지러움 '+Math.round(P.unrest)+').');
        fxPop(P.id,'회유','#8fa86a'); snd('relief');
      } : null, !되나);
      g.fillStyle='rgba(150,145,135,.7)'; g.font='10px serif'; g.textAlign='right';
      g.fillText('어지러움 30 아래면 스스로 돌아온다 · 정무 1', x+w-14, by2+42);
      g.textAlign='left';
      if(inRect(Mouse,{x:x+w-176,y:by2,w:164,h:30}))
        G.tip='어지러움 −24. 지금 '+Math.round(P.unrest)+'. 불길이 잡힌 반군 고을은 어지러움이 30 아래로 내리면 스스로 조정에 돌아온다. 칼로 치면 빠르지만 백성이 상한다.'
             +(손있다?'':'  · 정무가 없다')+(돈있다?'':'  · 국고가 모자란다');
    }

    // 명령
    const N=G.nations.kor;
    const 열 = LAY.phone? 3 : ACTIONS.length;
    /* 판이 좁으면 단추도 같이 좁힌다. 116 을 고집하면 줄이 판을 넘어가
       오른쪽 정무 구슬 위로 올라탄다 — 눕힌 손전화가 그랬다. */
    const 단추w = LAY.phone? (w-24-(열-1)*6)/열
                           : Math.min(116, (w-30-(열-1)*6)/열);
    const 단추간 = 단추w+6;
    const 줄높이 = LAY.phone? 44 : 0;
    let bx=x+16, by=LAY.phone? y+132 : y+58;
    ACTIONS.forEach((a,ai)=>{
      if(LAY.phone){ const r=Math.floor(ai/열); bx=x+12+(ai%열)*단추간; by=(y+132)+r*줄높이; }
      const ok=a.need(P);
      const q=actQuote(a,P);
      const { 별칙, 못산다, c, 돈 } = q;
      const can=ok&&q.ok;
      btn(g, bx, by, 단추w, LAY.phone?30:28, LAY.phone? (a.nm+' '+num(c)) : (a.nm+'  '+num(c)), 별칙&&can,
        can? ()=>{ N.gold-=c;
          if(별칙) byeolPay(); else N.adm-=a.adm;
          a.run(P); recalc(); } : null, !can);
      if(!LAY.phone){
        g.fillStyle= !can? 'rgba(90,86,80,.5)' : (별칙?'rgba(196,140,74,.95)':'rgba(224,189,118,.7)');
        g.font='9px serif';
        g.fillText(못산다? ('정무 '+a.adm+' 필요') : 별칙? ('별칙 x'+byeolMul().toFixed(1)) : ('정무 '+a.adm),
                   bx+2, by+38);
      }
      if(inRect(Mouse,{x:bx,y:by,w:단추w,h:28}))
        G.tip = actDesc(a,P)
          + (못산다? '  ·  군사를 일으키는 일은 국고로 살 수 없다. 정무 '+a.adm+'이 남아 있어야 한다'
             : ok? (돈? (별칙? '  ·  정무를 다 썼다. 별칙으로 밀어붙이면 값이 '+byeolMul().toFixed(1)+'배, 신하 충성 −3, 민심 −0.6' : '')
                      : '  · 국고가 모자란다')
                 : '  · 지금은 할 수 없다');
      if(!LAY.phone) bx+=단추간;
    });
  }
  // 정무와 한 해 보내기
  const N=G.nations.kor;
  /* 좁은 판에서는 이름표와 구슬을 왼쪽 아래에 세운다.
     오른쪽 끝에 붙이면 명령 단추 줄과 겹친다. */
  const 좁2=LAY.phone||LAY.small;
  const bw=좁2?152:170, bx=x+w-bw-14, by=y+h-40;
  const mx=admMax(), 남=N.adm||0;
  /* 이름표와 구슬을 한 줄에 두면 겹친다. 좁은 판에서는 왼쪽에 세우고
     '한 해를 보낸다'는 오른쪽에 둔다 — 엄지가 닿는 자리다. */
  const 끝 = 좁2? x+12 : x+w-14;
  const 알=Math.min(mx,12), r=알>8?3.5:5, 간=좁2? 12 : (알>8?10:14);
  const 시작 = 좁2? 끝 : 끝-알*간;
  g.textAlign=좁2?'left':'right'; g.font='10px serif';
  g.fillStyle= 남? 'rgba(150,145,135,.85)':'rgba(196,140,74,.95)';
  g.fillText(남? ((좁2?'남은 정무':'올해 남은 정무')+(mx>12? ' (+'+(mx-12)+')' : ''))
                : ('정무를 다 썼다'+(좁2?'':' · 별칙 '+byeolCount()+'회')),
             끝, 좁2? y+h-32 : y+66);
  g.textAlign='left';
  for(let i2=0;i2<알;i2++){
    const on=i2<남;
    g.fillStyle= on?'#e0bd76':'rgba(90,86,80,.5)';
    g.beginPath(); g.arc(시작+i2*간+간/2, 좁2? y+h-16 : y+82, r, 0, 7); g.fill();
  }
  if(inRect(Mouse,{x:시작-6,y:(좁2? y+h-44 : y+54),w:(좁2? 알*간+12 : (끝-시작)+6),h:38}))
    G.tip='한 해에 '+mx+'번. 고을 여섯에 하나, 정치 좋은 수령 셋에 하나씩 는다.'
          + (남?'':'  ·  더 하려면 별칙으로 국고를 태운다');
  btn(g,bx,by,bw,좁2?34:32, G.ended? '끝났다' : '한 해를 보낸다  ▶', false,
      G.ended?null:()=>{ snd('year'); endTurn(); }, G.ended);
  if(!좁2){
    g.fillStyle='rgba(120,115,105,.8)'; g.font='10px serif'; g.textAlign='right';
    g.fillText('Space 로도 넘길 수 있다', x+w-14, by-6); g.textAlign='left';
  }
}

  };

      +(B.upkeepField? ' · 야전군 '+num(B.upkeepField) : '')
      + (B.tribute? ' · 세폐 '+num(B.tribute) : '')
      + (B.polDrain? ' · 정책 '+num(B.polDrain) : ''));
  const 순=N.gold-B.gold0;
  row('국고', num(N.gold)+'  ('+(순>=0?'+':'')+num(순)+')', 순>=0?'#e0bd76':'#c4534a');
  yy+=4; divider(g,x+34,yy-8,w-68); yy+=8;
  row('곡식', num(N.food)+'  ('+(Math.round(B.farm-B.eaten)>=0?'+':'')+num(B.farm-B.eaten)+')',
      N.food>0?'#8fbf6a':'#c4534a',
      '거둠 '+num(B.farm)+' · 먹음 '+num(B.eaten)
      +(B.tributeFood?' · 세폐 '+num(B.tributeFood):'')+(B.spoil?' · 썩음 '+num(B.spoil):''));
  row('인구', num(N.pop)+'  ('+(N.pop-B.pop0>=0?'+':'')+num(N.pop-B.pop0)+')', '#9fd0e8');
  row('민심', Math.round(N.stab)+'  ('+(N.stab-B.stab0>=0?'+':'')+(N.stab-B.stab0).toFixed(1)+')',
      N.stab<35?'#c4534a':'#8fa86a',
      '수령 '+natProvs('kor').filter(p=>officialAt(p.id)).length+'/'+natProvs('kor').length
      +' · 어지러움 '+Math.round(natProvs('kor').reduce((a,p)=>a+p.unrest,0)/Math.max(1,natProvs('kor').length)));
  if(B.over){
    row('과대팽창', '−'+(B.over*1.2).toFixed(1)+' 민심', '#c4534a',
        '지고 갈 수 있는 것보다 점령지가 '+B.over+' 많다');
  }
  row('정통', Math.round(G.legit)+'  ('+((G.legit-(B.legit0!=null?B.legit0:G.legit))>=0?'+':'')
      +(G.legit-(B.legit0!=null?B.legit0:G.legit)).toFixed(1)+')',
      G.legit<35?'#c4534a':'#b79fe0');

/* 한 글자씩 끊어 넘긴다. 다만 마침표나 닫는 따옴표가 줄 첫머리에 홀로 서면
   안 된다 — 「…이 판의 성적이다」 다음 줄이 「. 고을을 다 잃으면」 으로
   시작하는 꼴이 된다. 그런 글자는 앞줄 끝에 매달아 둔다(금칙). */
function wrapText(g,t,maxw){
  const 앞못옴='.,!?;:·)]}」』】〉>%…‥';
  const out=[]; let line='';
  for(const ch of t){ if(g.measureText(line+ch).width>maxw){ out.push(line); line=ch; } else line+=ch; }
  out.push(line);
  for(let i=1;i<out.length;i++){
    let n=0;
    while(n<out[i].length && 앞못옴.indexOf(out[i][n])>=0) n++;
    if(n && out[i-1]){ out[i-1]+=out[i].slice(0,n); out[i]=out[i].slice(n); }
    out[i]=out[i].replace(/^\s+/,'');       // 넘어온 줄이 빈칸으로 시작하지 않게
  }
  const 남=out.filter(s=>s.length);
  return 남.length? 남 : [''];
}

/* 재주를 사람 말로 — 숫자를 그대로 보여 주면 아무도 읽지 않는다 */
function traitLines(K){
  const 재=(K&&K.재)||{}, out=[];
  const 곱=(k,말)=>{ const v=재[k]; if(v==null||v===1) return;
    out.push([말+' '+(v>1?'+':'−')+Math.round(Math.abs(v-1)*100)+'%', v>1]); };
  const 더=(k,말)=>{ const v=재[k]; if(!v) return;
    out.push([말+' '+(v>0?'+':'−')+Math.abs(v).toFixed(1)+'/년', v>0]); };
  곱('학문','연구'); 곱('무','공격'); 곱('지킴','수비'); 곱('재정','국고');
  더('다스림','민심'); 더('그릇','정통');
  if(재.붕당) out.push(['당쟁 '+(재.붕당>0?'거세다':'잦아든다'), 재.붕당<0]);
  return out;
}

/* ================================================================
   저장 — 칸 세 개와 자동 저장 하나
   ----------------------------------------------------------------
   자동 저장은 한 해가 지날 때마다 덮어쓴다. 손으로 저장한 칸은 건드리지 않는다.
   ================================================================ */
const SLOTS=['auto','1','2','3'];
function slotKey(s){ return CFG.SAVE+'_'+s; }
function packSave(){
  const d={ ver:VERSION, at:G.year, year:G.year, era:G.era, turn:G.turn,
    mapMode:G.mapMode, mapFocus:G.mapFocus, mapZoom:G.mapZoom, mapPan:G.mapPan, diff:G.diff,
    provs:{}, nations:G.nations, officials:G.officials, pool:G.pool,
    factions:G.factions, policies:G.policies, polSince:G.polSince,
    scores:G.scores, legit:G.legit, usedPeople:G.usedPeople, ended:G.ended,
    /* 예전 판이 흘리던 것들 — 다시 불러오면 사라져 있던 상태 */
    evDone:G.evDone, evQueue:G.evQueue, pendingEvent:G.pendingEvent,
    res:G.res, dip:G.dip, cj:G.cj, byeol:G.byeol, saheWait:G.saheWait, tab:G.tab, sel:G.sel, view:G.view,
    king:G.king, gen:G.gen, genN:G.genN, edict:G.edict, reign:G.reign, reigns:G.reigns, saga:G.saga,
    pendingReign:G.pendingReign, armies:G.armies, armyId:ARMY_ID, works:G.works,
    log:G.log.slice(0,60) };
  Object.entries(G.provs).forEach(([k,P])=>{ d.provs[k]={nat:P.nat,pop:P.pop,dev:P.dev,
    farm:P.farm,trade:P.trade,fort:P.fort,unrest:P.unrest,army:P.army,rebel:P.rebel||0,
    home:P.home,assim:P.assim||0}; });
  // 칸 목록에 보여줄 요약
  d.sum={ y:G.year, era:ERAS[G.era].nm, prov:natProvs('kor').length,
          pop:G.nations.kor.pop, gold:G.nations.kor.gold, ended:!!G.ended };
  return d;
}
function saveGame(slot){
  try{ localStorage.setItem(slotKey(slot||'auto'), JSON.stringify(packSave())); return true; }
  catch(e){ log('저장하지 못했다.'); return false; }
}
function slotInfo(slot){
  try{
    const d=JSON.parse(localStorage.getItem(slotKey(slot))||'null');
    if(!d) return null;
    if(!saveUsable(d.ver)) return { bad:true, ver:d.ver };
    return d.sum || { y:d.year, era:ERAS[d.era]?ERAS[d.era].nm:'', prov:0, pop:0, gold:0 };
  }catch(e){ return null; }
}
function deleteSlot(slot){ try{ localStorage.removeItem(slotKey(slot)); }catch(e){} }
function loadGame(slot){
  try{
    const d=JSON.parse(localStorage.getItem(slotKey(slot||'auto'))||'null');
    if(!d || !saveUsable(d.ver)) return false;
    newGame();
    G.year=d.year; G.era=d.era; G.turn=d.turn;
    G.mapMode=MAP_MODE_PARAM?START_MAP_MODE:(d.mapMode||'terrain');
    G.mapFocus=MAP_FOCUS_PARAM?START_MAP_FOCUS:(d.mapFocus||'korea');
    if(MAP_FOCUS_PARAM || d.mapZoom==null) setMapPreset(G.mapFocus);
    else { G.mapZoom=clamp(d.mapZoom,MAP_ZOOM_MIN,MAP_ZOOM_MAX);
           G.mapPan={x:(d.mapPan&&d.mapPan.x)||0, y:(d.mapPan&&d.mapPan.y)||0}; clampPan(); }
    G.nations=d.nations; G.officials=d.officials; G.pool=d.pool;
    G.factions=d.factions; G.policies=d.policies; G.log=d.log||[];
    G.polSince=d.polSince||{}; G.scores=d.scores||[]; G.ended=!!d.ended;
    if(d.legit!=null) G.legit=d.legit;
    if(d.usedPeople) G.usedPeople=d.usedPeople;
    /* 사건·연구·외교 — 예전에는 이것들이 저장되지 않아 불러오면 처음으로 돌아갔다 */
    G.evDone=d.evDone||{}; G.evQueue=d.evQueue||[]; G.pendingEvent=d.pendingEvent||null;
    if(d.diff!=null) G.diff=clamp(d.diff,0,DIFFS.length-1);
    if(d.minorDone) G.minorDone=d.minorDone;
    if(d.res) G.res={ pt:d.res.pt||0, done:d.res.done||{}, gain:d.res.gain||0 };
    if(d.dip) DIP_NATS.forEach(k=>{ if(d.dip[k]) Object.assign(G.dip[k], d.dip[k]); });
    // 이웃끼리의 사이 — 0.6.0 이전 판에는 없다. 없으면 새 판의 자리에서 시작한다.
    if(d.cj) Object.assign(G.cj, d.cj);
    G.byeol=d.byeol||0; G.saheWait=d.saheWait||0;
    /* 임금과 치세 — 0.7.0 이전 판에는 없다. 없으면 그 해의 임금을 다시 앉힌다. */
    G.king = (d.king!==undefined)? d.king : (G.year<1910? kingAt(G.year) : -1);
    G.gen=d.gen||null; G.genN=d.genN||0; G.edict=d.edict||null;
    G.reign=d.reign|| { y0:G.year, prov0:natProvs('kor').length,
                        node0:Object.keys(G.res.done).length, legit0:Math.round(G.legit),
                        pop0:G.nations.kor.pop, stab:0, 해:0, 전쟁:0, 사화:0, 뺏김:0, 얻음:0 };
    G.reigns=d.reigns||[]; G.pendingReign=d.pendingReign||null;
    G.saga=Object.assign(newSaga(), d.saga||{});
    G.armies=d.armies||[]; G.armySel=null;
    G.works=d.works||{done:{},b:null};
    /* 1.3.0 앞의 저장에는 반군 세력이 없다 */
    if(!G.nations.reb) G.nations.reb={ id:'reb', gold:0, food:0, tech:G.nations.kor.tech,
      pop:0, army:0, prov:0, stab:50, adm:0 };
    ARMY_ID=d.armyId || (G.armies.reduce((m,a)=>Math.max(m,a.id),0)+1);
    if(d.tab && TABS.includes(d.tab)) G.tab=d.tab;
    if(d.view) G.view=d.view;
    if(d.sel && d.sel in G.provs) G.sel=d.sel;
    Object.entries(d.provs).forEach(([k,v])=>{ if(G.provs[k]) Object.assign(G.provs[k],v); });
    recalc(); G.plateDirty=true;
    return true;
  }catch(e){ return false; }
}
function hasAnySave(){ return SLOTS.some(s=>!!slotInfo(s)); }

/* ================================================================
   기록 — 끝난 판만 남는다
   ----------------------------------------------------------------
   세이브는 버전이 바뀌면 버려지지만, 기록은 남는다.
   어느 판에서 어디까지 갔는지는 규칙이 바뀌어도 뜻이 있다.
   ================================================================ */
function loadRecords(){
  try{ const a=JSON.parse(localStorage.getItem(CFG.RECORDS)||'[]'); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function pushRecord(how){
  const tot=G.scores.reduce((a,s)=>a+s.pt,0);
  let at='';
  try{ at=new Date().toISOString().slice(0,10); }catch(e){}
  const r={ ver:VERSION, y:G.year, how, total:tot, at,
            prov:natProvs('kor').length, era:ERAS[G.era].nm,
            legit:Math.round(G.legit), tech:Math.round(G.nations.kor.tech),
            node:Object.keys(G.res.done).length };
  const all=loadRecords();
  all.push(r);
  all.sort((a,b)=> b.total-a.total || a.y-b.y);
  const top=all.slice(0,10);
  try{ localStorage.setItem(CFG.RECORDS, JSON.stringify(top)); }catch(e){}
  return { rank: top.indexOf(r)+1, top };
}
function clearRecords(){ try{ localStorage.removeItem(CFG.RECORDS); }catch(e){} }

     아래 판번호(v…)와 맞부딪힌다 */
  const hw=Math.floor((bw-6)/2);
  btn(g,bx,y,hw,44,'일러두기',false,()=>{ openHelp(); });
  btn(g,bx+hw+6,y,bw-hw-6,44,'소리',false,()=>{ MENU={tab:'sound', from:'title'}; });
  y+=64;

  g.textAlign='center';
  g.fillStyle='rgba(120,115,105,.65)'; g.font='11px serif';
  g.fillText('v'+VERSION, CFG.W/2, CFG.H-28);
  g.textAlign='left';
}

/* 저장/불러오기 칸 목록 */
function drawSlots(g, mode){
  const w=창폭(560), h=430, x=(CFG.W-w)/2, y=(CFG.H-h)/2;
  g.fillStyle='rgba(4,5,8,.80)'; g.fillRect(0,0,CFG.W,CFG.H);
  bigPanel(g,x,y,w,h);
  g.textAlign='center'; g.fillStyle='#e0bd76'; g.font='22px serif';
  g.fillText(mode==='save'?'저장하기':'불러오기', CFG.W/2, y+44);
  g.textAlign='left';
  let yy=y+72;
  SLOTS.forEach(s=>{
    const info=slotInfo(s), 자동=(s==='auto');
    const rh=62, rx=x+30, rw=w-60;
    const hov=inRect(Mouse,{x:rx,y:yy,w:rw-70,h:rh});
    g.fillStyle= hov?'rgba(190,150,80,.18)':'rgba(24,28,34,.8)';
    g.fillRect(rx,yy,rw,rh);
    g.strokeStyle= hov?'rgba(224,189,118,.85)':'rgba(190,158,96,.25)';
    g.lineWidth=1; g.strokeRect(rx+.5,yy+.5,rw-1,rh-1);

    g.fillStyle= 자동? 'rgba(150,145,135,.9)':'#e0bd76'; g.font='13px serif';
    g.fillText(자동? '자동 저장' : ('칸 '+s), rx+16, yy+24);
    g.font='12px serif';
    if(!info){
      g.fillStyle='rgba(95,90,83,.9)'; g.fillText('비어 있다', rx+16, yy+44);
    } else if(info.bad){
      g.fillStyle='#c4534a'; g.fillText('옛 판('+info.ver+') — 쓸 수 없다', rx+16, yy+44);
    } else {
      g.fillStyle='#e8e1d1'; g.font='16px serif';
      g.fillText(info.y+'년', rx+16, yy+46);
      g.fillStyle='rgba(150,145,135,.85)'; g.font='11px serif';
      g.fillText(info.era+' · 고을 '+info.prov+' · 인구 '+num(info.pop)+' · 국고 '+num(info.gold)
                 +(info.ended?'  · 끝난 판':''), rx+72, yy+46);
    }
    // 누르는 자리
    const 쓸수있나 = mode==='save'? !자동 : (info && !info.bad);
    if(쓸수있나){
      hz(rx,yy,rw-(info&&!자동?66:0),rh, ()=>{
        if(mode==='save'){
          if(info) 확인('덮어쓰기','칸 '+s+'의 '+(info.bad?'옛 판':info.y+'년')+' 위에 덮어쓴다.','덮어쓴다',
            ()=>{ saveGame(s); MENU=null; log('칸 '+s+'에 저장했다.'); });
          else { saveGame(s); MENU=null; log('칸 '+s+'에 저장했다.'); }
        } else {
          확인('불러오기', (자동?'자동 저장':'칸 '+s)+'의 '+info.y+'년으로 돌아간다. 지금 판은 사라진다.','불러온다',
            ()=>{ if(loadGame(s)){ SCENE='play'; MENU=null; log('불러왔다.'); } else log('불러오지 못했다.'); });
        }
      });
    } else if(mode==='save' && 자동){
      g.fillStyle='rgba(95,90,83,.8)'; g.font='10px serif'; g.textAlign='right';
      g.fillText('해마다 저절로', x+w-46, yy+24); g.textAlign='left';
    }
    // 지우기
    if(info && !자동){
      btn(g, x+w-92, yy+18, 56, 26, '지우기', false, ()=>{
        확인('지우기','칸 '+s+'번을 지운다.','지운다',()=>{ deleteSlot(s); MENU={tab:mode, from:MENU&&MENU.from}; });
      });
    }
    yy+=rh+10;
  });
  btn(g, CFG.W/2-60, y+h-46, 120, 30, '돌아간다', false, ()=>{
    MENU = (MENU && MENU.from==='title')? null : { tab:null };
    if(SCENE==='title') MENU=null;
  });
}

/* 최고 기록 */
function drawRecords(g){
  const recs=loadRecords();
  const w=창폭(600), h=460, x=(CFG.W-w)/2, y=(CFG.H-h)/2;
  g.fillStyle='rgba(4,5,8,.82)'; g.fillRect(0,0,CFG.W,CFG.H);
  bigPanel(g,x,y,w,h);
  g.textAlign='center'; g.fillStyle='#e0bd76'; g.font='22px serif';
  g.fillText('기록', CFG.W/2, y+44);
  g.fillStyle='rgba(150,145,135,.75)'; g.font='11px serif';
  g.fillText('끝난 판만 남는다. 판이 바뀌어도 지워지지 않는다.', CFG.W/2, y+64);
  g.textAlign='left';
  let yy=y+94;
  if(!recs.length){
    g.fillStyle='rgba(110,105,98,.9)'; g.font='13px serif'; g.textAlign='center';
    g.fillText('아직 끝까지 간 판이 없다.', CFG.W/2, yy+40); g.textAlign='left';
  }
  recs.forEach((r,i)=>{
    const rh=30;
    if(i%2===0){ g.fillStyle='rgba(255,255,255,.025)'; g.fillRect(x+28,yy-14,w-56,rh); }
    g.fillStyle= i===0?'#e0bd76':'rgba(150,145,135,.85)'; g.font='13px serif';
    g.fillText((i+1)+'.', x+36, yy+4);
    g.fillStyle='#e8e1d1'; g.font='14px serif';
    g.fillText(String(r.total)+'점', x+62, yy+4);
    g.fillStyle='rgba(160,155,145,.9)'; g.font='11px serif';
    g.fillText(r.y+'년 · '+(r.how||''), x+134, yy+4);
    g.fillStyle='rgba(130,125,115,.8)'; g.font='10px serif'; g.textAlign='right';
    // 좁은 판에서는 뒤쪽 잔글씨를 줄인다 — 아니면 앞의 글월을 덮는다
    g.fillText(LAY.phone? ('고을 '+r.prov)
               : ('고을 '+r.prov+' · 정통 '+(r.legit!=null?r.legit:'-')
                  +' · 마디 '+(r.node!=null?r.node:'-')
                  +(r.at? '   '+r.at : '')), x+w-36, yy+4);
    g.textAlign='left';
    yy+=rh;
  });
  // 단추가 하나뿐이면 가운데에 세운다
  btn(g, recs.length? CFG.W/2-140 : CFG.W/2-60, y+h-46, 120, 30, '돌아간다', false, ()=>{
    MENU = (MENU && MENU.from==='title')? null : { tab:null };
    if(SCENE==='title') MENU=null;
  });
  if(recs.length) btn(g, CFG.W/2+20, y+h-46, 120, 30, '기록 지우기', false, ()=>{
    확인('기록 지우기','남은 기록이 모두 사라진다.','지운다',
      ()=>{ clearRecords(); MENU={tab:'records', from:MENU&&MENU.from}; });
  });
}

/* 소리 — 효과음과 배경음을 켜고 끄고, 크기를 정한다 */
function slider(g,x,y,w,v,fn){
  const h=8, hov=inRect(Mouse,{x:x-4,y:y-8,w:w+8,h:24});
  g.fillStyle='rgba(0,0,0,.5)'; g.fillRect(x,y,w,h);
  g.fillStyle= hov? '#e0bd76':'rgba(190,158,96,.75)'; g.fillRect(x,y,w*clamp(v,0,1),h);
  g.strokeStyle='rgba(224,189,118,.35)'; g.lineWidth=1; g.strokeRect(x+.5,y+.5,w-1,h-1);
  const kx=x+w*clamp(v,0,1);
  g.fillStyle= hov? '#f0e2be':'#c9bfa8';
  g.beginPath(); g.arc(kx, y+h/2, hov?7:5.5, 0, 7); g.fill();
  hz(x-4,y-8,w+8,24, ()=>{ fn(clamp((Mouse.x-x)/w, 0, 1)); });
}
function drawSound(g){
  const w=창폭(440), h=330, x=(CFG.W-w)/2, y=(CFG.H-h)/2;
  g.fillStyle='rgba(4,5,8,.82)'; g.fillRect(0,0,CFG.W,CFG.H);
  bigPanel(g,x,y,w,h);
  g.textAlign='center'; g.fillStyle='#e0bd76'; g.font='22px serif';
  g.fillText('소리', CFG.W/2, y+44);
  g.fillStyle='rgba(150,145,135,.75)'; g.font='11px serif';
  g.fillText('음원 파일 없이 그 자리에서 만들어 냅니다.', CFG.W/2, y+64);
  g.textAlign='left';

  let yy=y+96;
  const 줄=(label, key, note)=>{
    g.fillStyle='#e8e1d1'; g.font='14px serif'; g.fillText(label, x+40, yy+4);
    btn(g, x+w-150, yy-12, 52, 24, SND.on[key]? '켬':'끔', SND.on[key],
        ()=>{ sndWake(); SND.on[key]=!SND.on[key]; sndApply(); sndSave();
              if(key==='sfx' && SND.on.sfx) snd('pick'); });
    g.fillStyle='rgba(150,145,135,.7)'; g.font='10px serif';
    g.fillText(note, x+40, yy+22);
    yy+=42;
    slider(g, x+40, yy, w-160, SND.vol[key], v=>{
      sndWake(); SND.vol[key]=v; SND.on[key]=true; sndApply(); sndSave();
      if(key==='sfx') snd('click', 0);
    });
    g.fillStyle='rgba(180,175,160,.85)'; g.font='11px serif'; g.textAlign='right';
    g.fillText(Math.round(SND.vol[key]*100)+'', x+w-100, yy+8); g.textAlign='left';
    yy+=40;
  };
  줄('효과음','sfx','북 · 징 · 뜯는 줄. 명령과 싸움에 붙습니다.');
  줄('배경음','mus','시대마다 오음계에서 골라 그때그때 지어 냅니다.');

  if(!SND.ready){
    g.fillStyle='rgba(196,140,74,.9)'; g.font='11px serif';
    g.fillText(SND.failed? '이 브라우저에서는 소리를 낼 수 없습니다.'
                         : '아무 곳이나 한 번 누르면 소리가 깨어납니다.', x+40, yy+4);
  } else {
    btn(g, x+40, yy-14, 120, 26, '들어 보기', false, ()=>{ snd('era', 0); });
  }
  btn(g, CFG.W/2-60, y+h-46, 120, 30, '돌아간다', false, ()=>{
    MENU = (MENU && MENU.from==='title')? null : { tab:null };
    if(SCENE==='title') MENU=null;
  });
}

/* 놀이 중 메뉴 */
function drawMenu(g){
  if(MENU && MENU.confirm){ drawConfirm(g); return; }
  if(MENU && MENU.tab==='sound'){ drawSound(g); return; }
  if(MENU && MENU.tab==='help'){ drawHelp(g); return; }
  if(MENU && MENU.tab==='saga'){ drawSaga(g); return; }
  if(MENU && MENU.tab==='records'){ drawRecords(g); return; }
  if(MENU && MENU.tab){ drawSlots(g, MENU.tab); return; }
  const w=창폭(300), h=436, x=(CFG.W-w)/2, y=(CFG.H-h)/2;
  g.fillStyle='rgba(4,5,8,.78)'; g.fillRect(0,0,CFG.W,CFG.H);
  bigPanel(g,x,y,w,h);
  g.textAlign='center'; g.fillStyle='#e0bd76'; g.font='20px serif';
  g.fillText('메뉴', CFG.W/2, y+42);
  g.fillStyle='rgba(140,135,125,.75)'; g.font='11px serif';
  g.fillText(G.year+'년 · '+ERAS[G.era].nm, CFG.W/2, y+62);
  g.textAlign='left';
  let yy=y+86; const bw=w-60, bx=x+30;
  btn(g,bx,yy,bw,38,'돌아가기',false,()=>{ MENU=null; }); yy+=46;
  btn(g,bx,yy,bw,38,'저장하기',false,()=>{ MENU={tab:'save'}; }); yy+=46;
  btn(g,bx,yy,bw,38,'불러오기',false,()=>{ MENU={tab:'load'}; }); yy+=46;
  /* 읽는 것 넷은 둘씩 나란히 — 줄을 늘리면 낮은 판에서 창이 화면을 넘는다 */
  const hw=Math.floor((bw-6)/2);
  btn(g,bx,yy,hw,38,'실록',false,()=>{ openSaga(); });
  btn(g,bx+hw+6,yy,bw-hw-6,38,'기록',false,()=>{ MENU={tab:'records'}; }); yy+=46;
  btn(g,bx,yy,hw,38,'일러두기',false,()=>{ openHelp(); });
  btn(g,bx+hw+6,yy,bw-hw-6,38,'소리',false,()=>{ MENU={tab:'sound'}; }); yy+=46;
  btn(g,bx,yy,bw,38,'새로 시작',false,()=>{
    확인('새로 시작','지금 판은 사라진다. 남겨 두려면 먼저 저장하시오.','시작한다',()=>{ 새판(); });
  }); yy+=46;
  btn(g,bx,yy,bw,38,'나가기',false,()=>{
    확인('나가기','시작 화면으로 나간다. 자동 저장은 남는다.','나간다',()=>{
      saveGame('auto'); SCENE='title'; MENU=null;
    });
  });
  g.textAlign='center'; g.fillStyle='rgba(120,115,105,.6)'; g.font='10px serif';
  g.fillText('Esc 로 여닫는다', CFG.W/2, y+h-16); g.textAlign='left';
}

function drawConfirm(g){
  const C=MENU.confirm;
  const w=창폭(420), h=180, x=(CFG.W-w)/2, y=(CFG.H-h)/2;
  g.fillStyle='rgba(4,5,8,.82)'; g.fillRect(0,0,CFG.W,CFG.H);
  bigPanel(g,x,y,w,h);
  g.textAlign='center';
  g.fillStyle='#e0bd76'; g.font='20px serif'; g.fillText(C.title, CFG.W/2, y+48);
  g.fillStyle='#d9d2c2'; g.font='13px serif';
  wrapText(g,C.body,w-70).slice(0,2).forEach((t,i)=> g.fillText(t, CFG.W/2, y+82+i*19));
  g.textAlign='left';
  btn(g, x+w/2-130, y+h-52, 120, 32, '그만둔다', false, ()=>{ MENU=null; });
  btn(g, x+w/2+10,  y+h-52, 120, 32, C.ok, true, ()=>{ const f=C.fn; MENU=null; f(); });
}

/* ================================================================
   본체
   ================================================================ */
let LAST_T=0;
function tick(){
  // 시간 — 움직임은 프레임 수가 아니라 흐른 시간을 따라야 한다
  const t=(typeof performance!=='undefined' && performance.now)? performance.now()/1000 : 0;
  DT = LAST_T? clamp(t-LAST_T, 0, 0.1) : 0;
  LAST_T=t; NOW=t;
  fxTick(DT);
  musicTick();
  const 창 = !!(G.popup || G.report || MENU || G.pendingReign);
  if(Key.pressed['Space'] && !창 && !G.ended && SCENE==='play'){ Key.pressed['Space']=false; snd('year'); endTurn(); }
  if(Key.pressed['KeyM'] && !창 && SCENE==='play'){
    Key.pressed['KeyM']=false; G.mapMode=G.mapMode==='terrain'?'political':'terrain';
  }
  if(Key.pressed['KeyF'] && !창 && SCENE==='play'){
    Key.pressed['KeyF']=false; setMapPreset(G.mapFocus==='all'?'korea':'all');
  }
  // ＋ － 로도 당긴다. 지도 한가운데를 붙들고 움직인다.
  if(!창 && SCENE==='play'){
    const 한가운데=[CFG.GX+MAP_GEO.width/2, CFG.GY+MAP_GEO.height/2];
    if(Key.pressed['Equal']||Key.pressed['NumpadAdd']){
      Key.pressed['Equal']=Key.pressed['NumpadAdd']=false; zoomAt(한가운데[0],한가운데[1],1.35); }
    if(Key.pressed['Minus']||Key.pressed['NumpadSubtract']){
      Key.pressed['Minus']=Key.pressed['NumpadSubtract']=false; zoomAt(한가운데[0],한가운데[1],1/1.35); }
  }
  // 오른쪽 판이 여섯 갈래가 되었으니 손으로도 넘길 수 있어야 한다
  if(!창 && SCENE==='play'){
    const 넘김=d=>{ const i=TABS.indexOf(G.tab); G.tab=TABS[(i+d+TABS.length)%TABS.length]; };
    if(Key.pressed['BracketLeft']){ Key.pressed['BracketLeft']=false; 넘김(-1); }
    if(Key.pressed['BracketRight']){ Key.pressed['BracketRight']=false; 넘김(1); }
    if(Key.pressed['Tab']){ Key.pressed['Tab']=false;
      넘김(Key.down['ShiftLeft']||Key.down['ShiftRight']? -1 : 1); }
  }
  if(Key.pressed['Escape']){ Key.pressed['Escape']=false;
    if(MENU){
      // 확인 창은 한 겹만 물러난다
      if(MENU.confirm) MENU=null;
      else if(MENU.tab) MENU = (SCENE==='title')? null : {tab:null};
      else MENU=null;
    }
    else if(G.report){ /* 결산은 도망칠 수 없다 */ }
    // 선택지와 결말도 도망칠 수 없다
    // 즉위 교서도 도망칠 수 없다 — 고르지 않고 넘길 수 있으면 고름이 아니다
    else if(G.pendingReign){ /* 사관의 글은 단추로 덮는다 */ }
    else if(G.popup && G.popup.kind!=='choice' && G.popup.kind!=='end'
            && G.popup.kind!=='accede') G.popup=null;
    else if(!G.popup && SCENE==='play') MENU={tab:null};
  }
  // 실록과 일러두기에서는 ← → 로 쪽을 넘긴다
  if(MENU && MENU.tab==='saga'){
    if(Key.pressed['ArrowLeft']){ Key.pressed['ArrowLeft']=false; SAGAPG=Math.max(0,SAGAPG-1); SAGASC=0; }
    if(Key.pressed['ArrowRight']){ Key.pressed['ArrowRight']=false; SAGAPG=Math.min(SAGA_TABS.length-1,SAGAPG+1); SAGASC=0; }
  }
  if(MENU && MENU.tab==='help'){
    if(Key.pressed['ArrowLeft']){ Key.pressed['ArrowLeft']=false; HELPPG=Math.max(0,HELPPG-1); HELPSC=0; }
    if(Key.pressed['ArrowRight']){ Key.pressed['ArrowRight']=false; HELPPG=Math.min(HELP_TABS.length-1,HELPPG+1); HELPSC=0; }
  }
  // 선택지 창에서는 1·2·3으로도 고른다
  if(창 && !MENU && !G.pendingReign && G.popup
     && (G.popup.kind==='choice' || G.popup.kind==='accede')){
    ['Digit1','Digit2','Digit3'].forEach((k,i)=>{
      if(Key.pressed[k]){ Key.pressed[k]=false; G.pickChoice=i; }
    });
  }
  draw();
  if(G.pickChoice!=null){
    const z=HIT.filter(h=>h.choice!=null).find(h=>h.choice===G.pickChoice);
    G.pickChoice=null; if(z&&z.fn) z.fn();
  }
  if(Mouse.click){
    Mouse.click=false;
    sndWake();                       // 브라우저는 사람이 누른 뒤에야 소리를 내준다
    const lo = MODAL>=0? MODAL : 0;
    for(let i=HIT.length-1;i>=lo;i--){
      const z=HIT[i];
      if(inRect(Mouse,z)){ if(z.fn){ snd('click', 0.03); z.fn(); } break; }
    }
  }
  Mouse.rclick=false; Mouse.wheel=0; Mouse.wheelX=null; Mouse.wheelY=null;
  Key.pressed={};
  requestAnimationFrame(tick);
}
loadAssets();
sndLoad();
newGame();                 // 판은 미리 만들어 두되, 화면은 제목부터
SCENE = 'title';
requestAnimationFrame(tick);
</script>
