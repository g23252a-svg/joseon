function hash2(x,y){ let n=x*374761393+y*668265263; n=(n^(n>>13))*1274126177; return ((n^(n>>16))>>>0)/4294967295; }

addEventListener('mousemove',e=>{ const p=toCanvas(e); Mouse.x=p.x; Mouse.y=p.y; });
addEventListener('mousedown',e=>{ const p=toCanvas(e); Mouse.x=p.x; Mouse.y=p.y;

addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('touchstart',e=>{ if(!e.touches[0])return; const p=toCanvas(e.touches[0]);

    im.src=ASSETS.src[k]; ASSETS.img[k]=im;
  }

  if(!hasAsset(sheet)||idx==null) return false;
  const im=ASSETS.img[sheet], per=Math.max(1,Math.floor(im.width/cw));
  g.drawImage(im,(idx%per)*cw, Math.floor(idx/per)*ch, cw,ch, x,y, dw||cw, dh||ch);
  return true;
}

function inPoly(x,y,pts){
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const [xi,yi]=pts[i], [xj,yj]=pts[j];
    if((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) inside=!inside;
  }
  return inside;
}

let G=null;
function newGame(){
  G={ year:1392, era:0, turn:0, mode:'play', log:[], tab:'국정',
      sel:null, hover:null, nat:'kor', hints:[], ended:false,
      grid:[], provs:{}, nations:{}, officials:[], pool:[],
      factions:{}, policies:[], warTarget:null, popup:null, ver:VERSION };

  /* 1) 해안선을 그린다 — 다각형 안쪽이 땅이다 */
  G.land=[];
  for(let y=0;y<CFG.GH;y++){
    G.land.push(new Array(CFG.GW).fill(false));
    G.grid.push(new Array(CFG.GW).fill(null));
  }
  for(let y=0;y<CFG.GH;y++) for(let x=0;x<CFG.GW;x++){
    for(const L of LAND){ if(inPoly(x+0.5,y+0.5,L.pts)){ G.land[y][x]=true; break; } }
  }
  /* 2) 지방을 만들고 씨앗을 심는다 */
  PROVDEF.forEach(p=>{
    G.provs[p.id]={ id:p.id, nm:p.nm, nat:p.nat, t:p.t, tag:p.tag, cap:!!p.cap,
      pop:0, dev:0, farm:0, trade:0, fort:0, unrest:0, army:0, cells:[], seed:p.seed };
  });
  /* 3) 바다를 건너지 않는 물결 퍼짐으로 땅을 나눈다 */
  const q=[];
  PROVDEF.forEach(p=>{
    let [sx,sy]=p.seed;
    if(!G.land[sy] || !G.land[sy][sx]){          // 씨앗이 바다에 떨어졌으면 가장 가까운 땅으로 옮긴다
      let best=null,bd=1e9;
      for(let y=0;y<CFG.GH;y++) for(let x=0;x<CFG.GW;x++){
        if(!G.land[y][x]||G.grid[y][x]) continue;
        const d=(x-sx)*(x-sx)+(y-sy)*(y-sy);
        if(d<bd){ bd=d; best=[x,y]; }
      }
      if(best){ sx=best[0]; sy=best[1]; }
    }
    if(G.land[sy] && G.land[sy][sx] && !G.grid[sy][sx]){
      G.grid[sy][sx]=p.id; q.push([sx,sy,p.id]);
    }
  });
  for(let h=0; h<q.length; h++){
    const [x,y,id]=q[h];
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=CFG.GW||ny>=CFG.GH) return;
      if(!G.land[ny][nx] || G.grid[ny][nx]) return;
      G.grid[ny][nx]=id; q.push([nx,ny,id]);
    });
  }
  for(let y=0;y<CFG.GH;y++) for(let x=0;x<CFG.GW;x++){
    const id=G.grid[y][x]; if(id) G.provs[id].cells.push([x,y]);
  }
  /* 4) 땅 넓이에 맞춰 초기 수치 */
  Object.values(G.provs).forEach(P=>{
    const T=TERR[P.t], n=Math.max(1,P.cells.length);
    P.pop  = Math.round(n*(46000+hash2(n,P.id.length)*26000)*T.food);
    P.dev  = ri(8,18);
    P.farm = ri(10,22) + (P.tag==='곡창'?6:0);
    P.trade= ri(6,16)  + (P.tag==='상업'||P.tag==='교역'||P.tag==='중계'?7:0);
    P.fort = P.cap? ri(3,4) : ri(0,2);
    P.army = P.cap? ri(4000,7000) : ri(800,3000);
  });
  /* 5) 인접 — 땅으로 붙은 곳 */
  Object.values(G.provs).forEach(P=>{ P.adj=new Set(); });
  for(let y=0;y<CFG.GH;y++) for(let x=0;x<CFG.GW;x++){
    const a=G.grid[y][x]; if(!a) continue;
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=CFG.GW||ny>=CFG.GH) return;
      const b=G.grid[ny][nx];
      if(b && b!==a) G.provs[a].adj.add(b);
    });
  }
  /* 6) 뱃길 — 좁은 바다는 건너다닌다 */
  const sea=[['gyen','tsus'],['tsus','kyus'],['jeon','jeju'],['jeju','tsus'],
             ['shan','hwan'],['shan','liao'],['zhej','ryuk'],['fuji','taiw'],
             ['ryuk','sats'],['ryuk','taiw'],['kyus','chug'],['shik','kans'],
             ['gyen','kyus'],['guan','taiw']];
  sea.forEach(([a,b])=>{ if(G.provs[a]&&G.provs[b]&&G.provs[a].cells.length&&G.provs[b].cells.length){
    G.provs[a].adj.add(b); G.provs[b].adj.add(a); } });
  /* 씨앗이 땅을 못 잡은 지방은 없애 둔다 */
  Object.keys(G.provs).forEach(k=>{ if(!G.provs[k].cells.length) delete G.provs[k]; });
  /* 이름을 얹을 자리 */
  Object.values(G.provs).forEach(P=>{
    let sx=0, sy=0; P.cells.forEach(([x,y])=>{ sx+=x; sy+=y; });
    P.cx=(sx/P.cells.length+.5)*CFG.CELL;
    P.cy=(sy/P.cells.length+.5)*CFG.CELL;
  });
  G.plateDirty=true; G.view='nat';

  /* 세력 */
  Object.keys(NATIONS).forEach(k=>{
    G.nations[k]={ id:k, gold: k==='kor'?600:900, food:400, tech:10,
      stab:60, manpower:0, ai:k!=='kor' };
  });
  /* 붕당 */
  FACTION_SETS[0].forEach(f=>{ G.factions[f]=50; });
  /* 신하 — 고을 수만큼은 있어야 자리를 채울 수 있다 */
  for(let i=0;i<12;i++) G.officials.push(mkOfficial());
  for(let i=0;i<6;i++) G.pool.push(mkOfficial());

  log('임진년보다 이백 년 앞선 해. 나라를 맡는다.');
  log('연도를 넘기려면 「한 해를 보낸다」.');
  recalc();
}
/* 이름에서 초상 칸을 정한다 — 같은 사람은 늘 같은 얼굴 */
function portraitOf(o){
  let h=0; for(const ch of o.nm) h=(h*31+ch.charCodeAt(0))>>>0;
  return h%16;
}
function mkOfficial(){
  const fs=FACTION_SETS[Math.min(FACTION_SETS.length-1,G?G.era:0)];
  return { id:Math.random().toString(36).slice(2,8), nm:makeName(),
    pol:ri(20,90), eco:ri(20,90), mil:ri(20,90), dip:ri(20,90),
    loy:ri(45,85), fac:pick(fs), age:ri(28,55), post:null };
}
function log(s){ G.log.unshift({ y:G.year, s }); if(G.log.length>60) G.log.pop(); }

/* 국가 합계 */
function natProvs(k){ return Object.values(G.provs).filter(p=>p.nat===k); }
function recalc(){
  Object.keys(G.nations).forEach(k=>{
    const ps=natProvs(k), N=G.nations[k];
    N.pop=ps.reduce((a,p)=>a+p.pop,0);
    N.army=ps.reduce((a,p)=>a+p.army,0);
    N.prov=ps.length;
  });
}

/* ================================================================
   한 해
   ================================================================ */
function policyVal(id){ return G.policies.includes(id); }
function officialAt(pid){ return G.officials.find(o=>o.post===pid) || null; }

function endTurn(){
  if(G.ended) return;
  G.turn++; G.year++;
  const N=G.nations.kor;

  /* 지방별 산출 */
  let food=0, gold=0;
  Object.values(G.provs).forEach(P=>{
    const T=TERR[P.t];
    const gov=officialAt(P.id);
    const govE=gov? gov.eco/100 : 0, govP=gov? gov.pol/100 : 0;
    let f=P.farm*T.food*(1+govE*0.5)*(P.pop/100000);
    let t=P.trade*T.trade*(1+govE*0.6)*(P.pop/100000);
    if(P.nat==='kor'){
      if(policyVal('nong')){ f*=1.18; t*=0.94; }
      if(policyVal('sang')){ t*=1.20; f*=0.92; }
      if(policyVal('bug'))  t*=1.12;
      if(policyVal('sut'))  t*=1.35;
      if(policyVal('bok'))  t*=0.90;
      food+=f; gold+=t;
      // 민심 — 수령이 없다고 벌하지 않는다.
      // 없으면 향리가 그럭저럭 굴리고(제자리), 좋은 수령을 앉히면 좋아진다.
      // 이렇게 해야 임명이 '해야만 하는 일'이 아니라 '하면 좋은 일'이 된다.
      const drift = gov? (-1.4-govP*1.2) : 0.05;
      P.unrest = clamp(P.unrest + drift + (P.fort>2?-0.2:0.15), 0, 100);
    }
    // 인구 — 복리로만 두면 육백 년 뒤 오백억이 된다.
    // 땅이 먹여 살릴 수 있는 만큼에서 멈추게 한다(부양 한계).
    const cap = (P.farm*T.food*46000 + P.dev*26000) * (1 + (P.nat==='kor'&&policyVal('gyo')?0.25:0));
    let grow = 0.014 + (P.dev/3000) - (P.unrest/9000);
    grow *= (1 - P.pop/Math.max(50000,cap));          // 한계에 가까울수록 더디다
    P.pop = Math.max(20000, Math.round(P.pop*(1+clamp(grow,-0.02,0.05))));
  });

  const upkeep = N.army*0.008 + G.officials.length*4;
  N.gold = Math.round(N.gold + gold - upkeep);
  N.food = Math.round(N.food + food - N.pop/26000);
  N.tech += 0.4 + (policyVal('sil')?0.8:0) + (policyVal('gae')?1.6:0) + (policyVal('gyo')?1.2:0);

  /* 민심 */
  const avgUn = natProvs('kor').reduce((a,p)=>a+p.unrest,0)/Math.max(1,natProvs('kor').length);
  N.stab = clamp(N.stab + (N.food>0? 0.8 : -4) - avgUn*0.06
    + (policyVal('ye')?0.6:0) + (policyVal('bok')?1.2:0)
    - (policyVal('gae')?0.4:0) - (policyVal('sut')?0.3:0), 0, 100);

  if(N.food<0){ log('창고가 비었다. 굶는 고을이 나온다.'); N.food=0;
    natProvs('kor').forEach(p=>p.unrest=clamp(p.unrest+6,0,100)); }
  if(N.gold<0){ log('국고가 비었다. 녹봉이 밀린다.');
    G.officials.forEach(o=>o.loy=clamp(o.loy-6,0,100)); N.gold=0; }

  /* 신하 — 나이·충성.
     종전에는 예순여섯부터 해마다 14%씩 물러나 조정이 늘 비었고,
     그때마다 수령을 손으로 다시 앉혀야 했다. 그게 일이 되어선 안 된다.
     이제 오래 일하고, 물러나면 후임이 그 자리를 이어받는다. */
  const retired=[];
  G.officials.forEach(o=>{
    o.age++;
    o.loy=clamp(o.loy + (policyVal('ye')?0.8:0) + (N.stab>60?0.5:-0.8), 0, 100);
    if(o.age>74 && Math.random()<0.05) retired.push(o);
  });
  retired.forEach(o=>{
    const seat=o.post;
    G.officials=G.officials.filter(x=>x!==o);
    if(seat && G.provs[seat]){
      // 자리를 비워 두지 않는다. 대기 인재나 놀고 있는 신하가 곧바로 이어받는다.
      let heir=G.officials.find(x=>!x.post);
      if(!heir){ heir=G.pool.shift()||mkOfficial(); G.officials.push(heir); }
      heir.post=seat;
      log(o.nm+'이(가) 늙어 물러나고, '+heir.nm+'이(가) '+G.provs[seat].nm+'을(를) 잇는다.');
    } else {
      log(o.nm+'이(가) 벼슬을 내려놓았다.');
    }
  });
  if(G.pool.length<6) G.pool.push(mkOfficial());   // 과거는 해마다 열린다
  // 조정이 텅 비는 일은 없다. 사람이 모자라면 알아서 채워진다.
  while(G.officials.length < natProvs('kor').length + 2){
    const o=G.pool.shift()||mkOfficial();
    G.officials.push(o); log(o.nm+'이(가) 조정에 들었다.');
  }

  /* 붕당 균형 */
  const fs=Object.keys(G.factions);
  fs.forEach(f=>{
    const n=G.officials.filter(o=>o.fac===f && o.post).length;
    G.factions[f]=clamp(G.factions[f] + (n*2.2) - 1.4, 0, 100);
  });
  const mx=Math.max(...fs.map(f=>G.factions[f]));
  if(mx>88 && Math.random()<0.25){
    const win=fs.find(f=>G.factions[f]===mx);
    const purged=G.officials.filter(o=>o.fac!==win && o.post);
    if(purged.length){
      const v=pick(purged), seat=v.post;
      v.post=null; v.loy=clamp(v.loy-25,0,100);
      // 사화는 자리를 비우는 것이 아니라 자리를 빼앗는 것이다.
      // 이긴 쪽 사람이 그 고을을 이어받는다. 빈자리로 남겨 두면 손이 가는 일만 는다.
      let heir=G.officials.find(o=>o.fac===win && !o.post)
            || G.officials.find(o=>!o.post);
      if(!heir){ heir=G.pool.shift()||mkOfficial(); heir.fac=win; G.officials.push(heir); }
      heir.post=seat;
      log('사화가 일어났다. '+win+'이 조정을 잡고 '+v.nm+'이(가) 쫓겨났다. '
          +G.provs[seat].nm+'은(는) '+heir.nm+'이(가) 맡는다.');
      N.stab=clamp(N.stab-8,0,100);
    }
  }

  /* 시대 전환 */
  const e=eraOf(G.year);
  if(e!==G.era){
    G.era=e;
    const E=ERAS[e];
    const nf=FACTION_SETS[Math.min(FACTION_SETS.length-1,e)];
    G.factions={}; nf.forEach(f=>G.factions[f]=50);
    G.officials.forEach(o=>o.fac=pick(nf));
    G.popup={ title:E.nm, body:E.desc, y:G.year };
    log('── '+E.nm+' ──  '+E.desc);
  }

  /* 역사 사건 */
  historyEvent();
  /* 다른 나라 */
  aiTurn();
  recalc();
  checkEnd();
  saveGame();
}

function historyEvent(){
  const y=G.year;
  const once=(k,fn)=>{ if(!G['ev_'+k]){ G['ev_'+k]=1; fn(); } };
  if(y===1592) once('imjin',()=>{
    G.popup={title:'임진왜란',body:'왜군이 부산에 상륙했다. 남쪽 고을이 흔들린다.',y};
    ['gyen','jeon','chun'].forEach(id=>{ const p=G.provs[id]; if(p){ p.unrest=clamp(p.unrest+40,0,100); p.army=Math.round(p.army*0.5); } });
    log('임진왜란이 터졌다.');
  });
  if(y===1636) once('byeong',()=>{
    G.popup={title:'병자호란',body:'북방에서 청이 내려왔다.',y};
    ['pyan','hwan','gyeo'].forEach(id=>{ const p=G.provs[id]; if(p) p.unrest=clamp(p.unrest+30,0,100); });
    log('병자호란.');
  });
  if(y===1876) once('gang',()=>{
    G.popup={title:'강화도 조약',body:'항구를 연다. 관세도, 재판권도 남의 손에 있다.',y};
    G.nations.kor.stab=clamp(G.nations.kor.stab-10,0,100); log('개항했다.');
  });
  if(y===1910) once('colony',()=>{
    G.popup={title:'경술국치',body:'국권이 넘어갔다.',y}; log('국권을 잃었다.');
    G.nations.kor.stab=clamp(G.nations.kor.stab-25,0,100);
  });
  if(y===1945) once('lib',()=>{
    G.popup={title:'해방',body:'되찾았다. 그리고 곧 갈라진다.',y}; log('해방.');
    G.nations.kor.stab=clamp(G.nations.kor.stab+20,0,100);
  });
  if(y===1950) once('war',()=>{
    G.popup={title:'전쟁',body:'같은 말을 쓰는 사람들끼리 싸운다.',y};
    natProvs('kor').forEach(p=>{ p.unrest=clamp(p.unrest+35,0,100); p.army=Math.round(p.army*0.6); });
    log('전쟁이 났다.');
  });
  if(y===1988) once('seoul',()=>{
    G.popup={title:'서울 올림픽',body:'세계가 들어왔다.',y};
    G.nations.kor.stab=clamp(G.nations.kor.stab+12,0,100);
  });
  /* 잡사건 */
  if(Math.random()<0.10){
    const p=pick(natProvs('kor'));
    const r=Math.random();
    if(r<0.3){ p.unrest=clamp(p.unrest+18,0,100); log(p.nm+'에 흉년이 들었다.'); p.farm=Math.max(4,p.farm-2); }
    else if(r<0.6){ p.trade+=2; log(p.nm+'의 장이 커졌다.'); }
    else if(r<0.8){ G.pool.push(mkOfficial()); log('과거에서 인재가 났다.'); }
    else { p.pop=Math.round(p.pop*0.96); log(p.nm+'에 역병이 돌았다.'); }
  }
}

function aiTurn(){
  ['chn','jpn'].forEach(k=>{
    const N=G.nations[k];
    N.gold += natProvs(k).length*14 + 40;
    natProvs(k).forEach(p=>{ if(Math.random()<0.25){ p.dev++; p.army+=ri(60,240); } });
    // 드물게 침공
    if(G.year>1500 && Math.random()<0.05){
      const mine=natProvs(k);
      for(const p of mine){
        const tgt=[...p.adj].map(id=>G.provs[id]).find(q=>q && q.nat!==k && q.nat!=='kor');
        if(tgt && p.army>tgt.army*1.6){
          tgt.nat=k; tgt.army=Math.round(p.army*0.3); p.army=Math.round(p.army*0.7); G.plateDirty=true;
          log(natName(k)+'이(가) '+tgt.nm+'을(를) 차지했다.');
          break;
        }
      }
    }
  });
}
function checkEnd(){
  if(natProvs('kor').length===0){ G.ended=true; G.mode='over';
    G.popup={title:'나라가 없어졌다',body:'다스릴 땅이 남지 않았다.',y:G.year}; }
  if(G.year>=2025 && !G.ended){ G.ended=true; G.mode='over';
    G.popup={title:'여기까지',body:'육백 년을 지났다.',y:G.year}; }
}

  { id:'gaegan', nm:'개간',   cost:80,  need:p=>p.nat==='kor',
    desc:'농지를 넓힌다. 농지 +3', run:p=>{ p.farm+=3; G.plateDirty=true; log(p.nm+'의 농지를 넓혔다.'); } },
  { id:'sijang', nm:'장을 연다', cost:70, need:p=>p.nat==='kor',
    desc:'상업을 키운다. 상업 +3', run:p=>{ p.trade+=3; log(p.nm+'에 장을 열었다.'); } },
  { id:'chuk',   nm:'축성',   cost:140, need:p=>p.nat==='kor'&&p.fort<6,
    desc:'성을 쌓는다. 성곽 +1', run:p=>{ p.fort++; log(p.nm+'의 성을 쌓았다.'); } },
  { id:'mo',     nm:'모병',   cost:100, need:p=>p.nat==='kor',
    desc:'군사를 모은다. 병력 +2,000', run:p=>{ p.army+=2000; log(p.nm+'에서 군사를 모았다.'); } },
  { id:'jin',    nm:'진휼',   cost:90,  need:p=>p.nat==='kor'&&p.unrest>0,
    desc:'곡식을 푼다. 민심 개선', run:p=>{ p.unrest=clamp(p.unrest-25,0,100); log(p.nm+'에 곡식을 풀었다.'); } },
  { id:'gong',   nm:'친다',   cost:120, need:p=>p.nat!=='kor'&&adjToKor(p),
    desc:'인접한 우리 고을에서 친다', run:p=>{ invade(p); } }
];
function actCost(a){ let c=a.cost; if(a.id==='mo'&&policyVal('gun')) c=Math.round(c*0.8); return c; }
function adjToKor(p){ return [...p.adj].some(id=>G.provs[id] && G.provs[id].nat==='kor'); }
function invade(target){
  const from=[...target.adj].map(id=>G.provs[id]).filter(q=>q&&q.nat==='kor')
    .sort((a,b)=>b.army-a.army)[0];
  if(!from){ log('칠 만한 자리가 없다.'); return; }
  const gov=officialAt(from.id);
  const mil=gov? 1+gov.mil/160 : 1;
  const atk=from.army*mil*rnd(0.85,1.15);
  const T=TERR[target.t];
  const def=target.army*T.def*(1+target.fort*0.14)*rnd(0.9,1.1);
  const lossA=Math.round(from.army*clamp(def/(atk+def),0.15,0.7));
  const lossD=Math.round(target.army*clamp(atk/(atk+def),0.2,0.85));
  from.army=Math.max(0,from.army-lossA);
  target.army=Math.max(0,target.army-lossD);
  if(atk>def){
    const old=natName(target.nat);
    target.nat='kor'; target.unrest=clamp(target.unrest+45,0,100); G.plateDirty=true;
    target.army=Math.round(from.army*0.25); from.army=Math.round(from.army*0.75);
    log(from.nm+'에서 쳐서 '+target.nm+'을(를) 얻었다. ('+old+' 손실 '+num(lossD)+')');
    G.nations.kor.stab=clamp(G.nations.kor.stab-4,0,100);
  } else {
    log(target.nm+'을(를) 쳤으나 물러났다. (아군 손실 '+num(lossA)+')');
    G.nations.kor.stab=clamp(G.nations.kor.stab-6,0,100);
  }
  recalc();
}

const HIT=[];

function inRect(p,r){ return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h; }
function panel(g,x,y,w,h,a){
  g.fillStyle='rgba(14,16,20,'+(a||0.92)+')'; g.fillRect(x,y,w,h);
  // 판 머리 장식 — 그림이 있으면 얹는다 (없으면 그냥 테두리)
  if(hasAsset('frame') && w>=120 && h>=48){
    const hh=Math.min(30, h*0.22);
    blit(g,'frame',0, x, y, 192,64, w, hh);
  }
  g.strokeStyle='rgba(190,158,96,.42)'; g.lineWidth=1; g.strokeRect(x+.5,y+.5,w-1,h-1);
}
/* 구분선 */
function divider(g,x,y,w){

    g.strokeStyle='rgba(190,158,96,.22)'; g.lineWidth=1;
    g.beginPath(); g.moveTo(x,y+.5); g.lineTo(x+w,y+.5); g.stroke();

}
function btn(g,x,y,w,h,label,on,fn,dim){
  const hov=inRect(Mouse,{x,y,w,h});

/* ================================================================
   지도 그리기 — 고지도
   격자를 그대로 칠하면 네모가 보인다. 그래서
     경계 조각을 모아 고리로 잇고 → 꼭짓점을 흔들고 → 두 번 다듬어
   부드러운 해안선으로 바꾼다. 한지 위에 옅게 칠하고 먹으로 긋는다.
   지도판은 바뀔 때만 다시 굽는다.
   ================================================================ */
const PAL={ paper:'#e7ddc4', ink:'#2c2822', gold:'#8a6a2f', red:'#9d3b32' };
const WASH={ kor:'rgba(79,127,181,.26)', chn:'rgba(181,101,79,.24)',
             jpn:'rgba(138,111,174,.24)', ind:'rgba(111,138,114,.24)' };
/* 강 — 격자 좌표 폴리라인 */
const RIVERS=[
  [[47,11],[50,11],[53,10],[56,11]],                      // 압록·두만
  [[57,19],[55,19],[53,19],[51,20],[49,20]],              // 한강
  [[18,13],[24,14],[29,15],[34,15],[38,16]],              // 황하
  [[12,21],[18,22],[24,23],[30,23],[35,23],[39,23]]       // 양자강
];

function jit(x,y){ return [x+(hash2(x,y)-.5)*.5, y+(hash2(y+31,x+17)-.5)*.5]; }
function traceLoops(test){
  const out=new Map(), key=(a,b)=>a+','+b;
  const add=(ax,ay,bx,by)=>{ const k=key(ax,ay); if(!out.has(k)) out.set(k,[]); out.get(k).push([bx,by]); };
  for(let y=0;y<CFG.GH;y++) for(let x=0;x<CFG.GW;x++){
    if(!test(x,y)) continue;
    if(!test(x,y-1)) add(x,y,x+1,y);
    if(!test(x+1,y)) add(x+1,y,x+1,y+1);
    if(!test(x,y+1)) add(x+1,y+1,x,y+1);
    if(!test(x-1,y)) add(x,y+1,x,y);
  }
  const loops=[];
  while(out.size){
    const sk=out.keys().next().value, s=sk.split(',').map(Number);
    let cx=s[0], cy=s[1]; const loop=[]; let guard=0;
    while(guard++<20000){
      const k=key(cx,cy), arr=out.get(k);
      if(!arr||!arr.length){ out.delete(k); break; }
      const n=arr.pop(); if(!arr.length) out.delete(k);
      loop.push([cx,cy]); cx=n[0]; cy=n[1];
      if(cx===s[0]&&cy===s[1]) break;
    }
    if(loop.length>3) loops.push(loop);
  }
  return loops;
}
function chaikin(p,it){
  for(let k=0;k<it;k++){ const q=[];
    for(let i=0;i<p.length;i++){ const a=p[i], b=p[(i+1)%p.length];
      q.push([a[0]*.75+b[0]*.25, a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75, a[1]*.25+b[1]*.75]); }
    p=q; }
  return p;
}
function pathOf(test,iter){
  const C=CFG.CELL, path=new Path2D();
  traceLoops(test).forEach(loop=>{
    const s=chaikin(loop.map(([x,y])=>jit(x,y)), iter===undefined?3:iter);
    path.moveTo(s[0][0]*C, s[0][1]*C);
    for(let i=1;i<s.length;i++) path.lineTo(s[i][0]*C, s[i][1]*C);
    path.closePath();
  });
  return path;
}
/* 한지 */
let PAPER=null, PLATE=null;
function makePaper(w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d');
  g.fillStyle=PAL.paper; g.fillRect(0,0,w,h);
  for(let i=0;i<220;i++){
    const x=Math.random()*w, y=Math.random()*h, r=30+Math.random()*170;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0, Math.random()<.5?'rgba(146,116,64,.045)':'rgba(255,252,240,.06)');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  g.lineWidth=1;
  for(let i=0;i<1400;i++){
    const x=Math.random()*w, y=Math.random()*h, L=5+Math.random()*24;
    const a=(Math.random()<.5?0:Math.PI/2)+(Math.random()-.5)*.45;
    g.strokeStyle=Math.random()<.5?'rgba(120,98,62,.055)':'rgba(255,253,244,.07)';
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*L, y+Math.sin(a)*L); g.stroke();
  }
  const vg=g.createRadialGradient(w/2,h/2,Math.min(w,h)*.25,w/2,h/2,Math.max(w,h)*.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(92,66,30,.20)');
  g.fillStyle=vg; g.fillRect(0,0,w,h);
  return c;
}
function seaDist(){
  const d=[]; for(let y=0;y<CFG.GH;y++) d.push(new Array(CFG.GW).fill(-1));
  const q=[];
  for(let y=0;y<CFG.GH;y++) for(let x=0;x<CFG.GW;x++) if(G.land[y][x]){ d[y][x]=0; q.push([x,y]); }
  for(let h=0;h<q.length;h++){ const [x,y]=q[h];
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{ const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=CFG.GW||ny>=CFG.GH||d[ny][nx]>=0) return;
      d[ny][nx]=d[y][x]+1; q.push([nx,ny]); }); }
  return d;
}
function terrainMarks(g,P){
  const C=CFG.CELL;
  g.save(); g.clip(P._path);
  P.cells.forEach(([x,y])=>{
    const h=hash2(x*7+3,y*13+5), h2=hash2(y*5+1,x*11+9);
    const px=(x+.15+h*.7)*C, py=(y+.15+h2*.7)*C;
    if(P.t==='mtn'){
      if(h>.42) return;
      const s=5+h2*4;
      g.beginPath(); g.moveTo(px-s*.9,py+s*.5); g.lineTo(px,py-s*.55); g.lineTo(px+s*.9,py+s*.5);
      g.closePath(); g.fillStyle='rgba(96,90,76,.30)'; g.fill();
      g.strokeStyle='rgba(40,36,30,.65)'; g.lineWidth=1; g.beginPath();
      g.moveTo(px-s*.9,py+s*.5); g.lineTo(px,py-s*.55); g.lineTo(px+s*.55,py+s*.1); g.stroke();
    } else if(P.t==='hill'){
      if(h>.34) return;
      g.strokeStyle='rgba(52,46,36,.42)'; g.lineWidth=1;
      g.beginPath(); g.arc(px,py+3,3.5+h2*2,Math.PI*1.06,Math.PI*1.94); g.stroke();
    } else if(P.t==='coast'){
      if(h>.30) return;
      g.strokeStyle='rgba(60,80,84,.35)'; g.lineWidth=1;
      for(let i=0;i<2;i++){ g.beginPath(); g.moveTo(px-4,py+i*3.5);
        g.quadraticCurveTo(px,py+i*3.5-2,px+4,py+i*3.5); g.stroke(); }
    } else {
      if(h>.30) return;
      g.strokeStyle='rgba(70,72,44,.34)'; g.lineWidth=1;
      g.beginPath(); g.moveTo(px-3.5,py); g.lineTo(px+3.5,py);
      g.moveTo(px-3.5,py+3); g.lineTo(px+3.5,py+3); g.stroke();
    }
  });
  g.restore();
}
function inkStroke(g,path,w,a,col){
  g.strokeStyle=col||PAL.ink; g.lineJoin='round'; g.lineCap='round';
  g.globalAlpha=a*.5; g.lineWidth=w*1.9; g.stroke(path);
  g.globalAlpha=a;    g.lineWidth=w;     g.stroke(path);
  g.globalAlpha=1;
}
function buildPlate(){
  const C=CFG.CELL, MW=CFG.GW*C, MH=CFG.GH*C;
  const c=document.createElement('canvas'); c.width=MW; c.height=MH;
  const g=c.getContext('2d');
  if(!PAPER) PAPER=makePaper(MW,MH);
  /* 바다 — 종이 위 옅은 청록, 해안 등거리선 */
  g.drawImage(PAPER,0,0);
  g.fillStyle='rgba(150,178,178,.34)'; g.fillRect(0,0,MW,MH);
  const D=seaDist();
  for(let k=4;k>=1;k--){
    const p=pathOf((x,y)=>x>=0&&y>=0&&x<CFG.GW&&y<CFG.GH&&D[y][x]>=0&&D[y][x]<=k,3);
    g.strokeStyle='rgba(66,96,102,'+(0.05+(5-k)*0.045)+')'; g.lineWidth=1; g.stroke(p);
  }
  /* 땅 바탕 — 이음매가 안 보이게 통째로 */
  const landPath=pathOf((x,y)=>x>=0&&y>=0&&x<CFG.GW&&y<CFG.GH&&G.land[y][x],3);
  g.save(); g.clip(landPath); g.drawImage(PAPER,0,0);
  g.fillStyle='rgba(226,214,182,.55)'; g.fillRect(0,0,MW,MH); g.restore();
  /* 지방 채색 + 지형 기호 */
  Object.values(G.provs).forEach(P=>{
    P._path=pathOf((x,y)=>x>=0&&y>=0&&x<CFG.GW&&y<CFG.GH&&G.grid[y][x]===P.id,3);
    g.save();
    g.fillStyle=WASH[P.nat]||WASH.ind; g.fill(P._path);
    g.clip(P._path);
    g.strokeStyle=NATIONS[P.nat].col; g.globalAlpha=.10; g.lineWidth=14; g.stroke(P._path);
    g.globalAlpha=.14; g.lineWidth=5; g.stroke(P._path);
    g.globalAlpha=1; g.restore();
    terrainMarks(g,P);
  });
  /* 강 */
  g.lineCap='round';
  RIVERS.forEach(r=>{
    const s=chaikin(r.map(([x,y])=>[x+.5,y+.5]),3);
    g.beginPath(); g.moveTo(s[0][0]*C,s[0][1]*C);
    for(let i=1;i<s.length;i++) g.lineTo(s[i][0]*C,s[i][1]*C);
    g.strokeStyle='rgba(84,116,124,.55)'; g.lineWidth=2.2; g.stroke();
    g.strokeStyle='rgba(150,182,186,.45)'; g.lineWidth=1; g.stroke();
  });
  /* 먹선 — 도 경계 → 국경 → 해안선 */
  Object.values(G.provs).forEach(P=>inkStroke(g,P._path,0.8,.28));
  Object.keys(NATIONS).forEach(k=>{
    const p=pathOf((x,y)=>x>=0&&y>=0&&x<CFG.GW&&y<CFG.GH&&G.grid[y][x]&&G.provs[G.grid[y][x]].nat===k,3);
    inkStroke(g,p,1.7,.62);
  });
  inkStroke(g,landPath,1.5,.75);
  g.globalCompositeOperation='multiply'; g.globalAlpha=.35; g.drawImage(PAPER,0,0);
  g.globalCompositeOperation='source-over'; g.globalAlpha=1;
  PLATE=c; G.plateDirty=false;
}
function inkText(g,t,x,y,size,col,halo){
  g.font=size+'px "Nanum Myeongjo","Batang",serif';
  g.lineJoin='round'; g.strokeStyle=halo||'rgba(231,221,196,.92)';
  g.lineWidth=3.2; g.strokeText(t,x,y);
  g.fillStyle=col||PAL.ink; g.fillText(t,x,y);
}

function drawMap(g){
  const C=CFG.CELL, MW=CFG.GW*C, MH=CFG.GH*C;
  if(G.plateDirty || !PLATE) buildPlate();
  g.fillStyle='rgba(0,0,0,.5)'; g.fillRect(CFG.GX+4, CFG.GY+6, MW, MH);   // 종이 그림자
  g.drawImage(PLATE, CFG.GX, CFG.GY);

  g.save(); g.translate(CFG.GX, CFG.GY);
  const S=G.sel?G.provs[G.sel]:null, Hv=G.hover?G.provs[G.hover]:null;
  if(G.view==='unrest'){
    Object.values(G.provs).forEach(p=>{
      g.fillStyle='rgba(157,59,50,'+(p.unrest/100*.45)+')'; g.fill(p._path); });
  }
  if(Hv&&Hv!==S){ g.fillStyle='rgba(255,255,255,.16)'; g.fill(Hv._path); }
  if(S){
    g.fillStyle='rgba(255,246,214,.22)'; g.fill(S._path);
    g.setLineDash([6,4]); g.lineDashOffset=-performance.now()/60;
    g.strokeStyle='rgba(60,50,30,.9)'; g.lineWidth=2; g.stroke(S._path); g.setLineDash([]);
  }
  Object.values(G.provs).forEach(p=>{
    const own=p.nat==='kor';
    if(p.cap){
      g.strokeStyle=PAL.ink; g.lineWidth=1.4;
      g.beginPath(); g.arc(p.cx,p.cy-13,5,0,7); g.stroke();
      g.beginPath(); g.arc(p.cx,p.cy-13,2.2,0,7); g.fillStyle=PAL.ink; g.fill();
    } else if(own){
      g.fillStyle='rgba(44,40,34,.8)'; g.beginPath(); g.arc(p.cx,p.cy-11,2,0,7); g.fill();
    }
    g.textAlign='center';
    inkText(g,p.nm,p.cx,p.cy+(p.cap?6:4), (p.cap||own)?13:12,
      own?'#2c2822':'rgba(58,52,44,.72)');
    if(p.unrest>55){
      g.fillStyle=PAL.red; g.beginPath();
      g.arc(p.cx+g.measureText(p.nm).width/2+8, p.cy, 3.2, 0, 7); g.fill();
    }
    if(officialAt(p.id)){
      g.fillStyle='rgba(60,110,70,.85)'; g.beginPath();
      g.arc(p.cx-g.measureText(p.nm).width/2-8, p.cy-3, 2.6, 0, 7); g.fill();
    }
    g.textAlign='left';
  });
  g.restore();

  /* 고을 누르기 */
  G.hover=null;
  const gx=Math.floor((Mouse.x-CFG.GX)/C), gy=Math.floor((Mouse.y-CFG.GY)/C);
  if(gx>=0&&gy>=0&&gx<CFG.GW&&gy<CFG.GH && G.grid[gy][gx]) G.hover=G.grid[gy][gx];
  hz(CFG.GX, CFG.GY, MW, MH, ()=>{ if(G.hover) G.sel=G.hover; });

  /* 범례와 보기 전환 */
  let lx=CFG.GX+6, ly=CFG.GY+MH+16;
  g.font='11px serif';
  Object.keys(NATIONS).forEach(k=>{
    if(!natProvs(k).length) return;
    if(!blit(g,'flags',NAT_UV[k],lx,ly-11,48,32,18,12)){
      g.fillStyle=NATIONS[k].col; g.fillRect(lx,ly-9,12,10); }
    g.fillStyle='#c9bfa8'; g.fillText(natName(k)+' '+natProvs(k).length, lx+22, ly);
    lx+=104;
  });
  btn(g, CFG.GX+MW-150, ly-16, 150, 22,
      G.view==='unrest'?'보기 · 민심':'보기 · 세력', false,
      ()=>{ G.view = G.view==='unrest'?'nat':'unrest'; });
}

/* 오른쪽 패널 */

function drawSide(g){

function sideState(g,x,y,w){

function autoAssign(){
  const empty=natProvs('kor').filter(p=>!officialAt(p.id));
  if(!empty.length){ log('빈 고을이 없소.'); return; }
  let n=0;
  empty.forEach(p=>{
    let o=G.officials.find(x=>!x.post);
    if(!o){                                  // 사람이 모자라면 등용까지 알아서 (있는 돈 안에서)
      if(G.pool.length && G.nations.kor.gold>=40){
        o=G.pool.shift(); G.nations.kor.gold-=40; G.officials.push(o);
      } else return;
    }
    o.post=p.id; G.factions[o.fac]=clamp(G.factions[o.fac]+2,0,100); n++;
  });
  log(n? (n+'개 고을에 수령을 보냈다.') : '보낼 사람이 없소.');
  if(n) Audio_ok();
}
function Audio_ok(){}
function sideOfficials(g,x,y,w){
  g.fillStyle='#e0bd76'; g.font='13px serif'; g.fillText('조정 ('+G.officials.length+')', x, y+12);
  const empty=natProvs('kor').filter(p=>!officialAt(p.id)).length;
  btn(g, x+w-104, y+2, 104, 22, empty? ('빈 고을 '+empty+' 채우기') : '모두 배치됨',
      false, empty? autoAssign : null, !empty);
  g.fillStyle='rgba(150,145,135,.7)'; g.font='10px serif';
  g.fillText('고을을 고른 뒤 이름을 누르면 수령으로 보낸다', x, y+28);
  let yy=y+44;
  G.officials.slice(0,10).forEach(o=>{
    const rowH=38, hovr=inRect(Mouse,{x:x-4,y:yy-14,w:w+8,h:rowH});
    if(hovr){ g.fillStyle='rgba(190,150,80,.14)'; g.fillRect(x-4,yy-14,w+8,rowH); }
    // 초상 — 이름으로 칸을 정해 늘 같은 얼굴이 나오게 한다
    const face=portraitOf(o), fx=x, fs=32;
    if(blit(g,'portraits',face,fx,yy-13,64,64,fs,fs)){
      if(o.post){ g.strokeStyle='rgba(143,208,150,.8)'; g.lineWidth=1.5;
        g.strokeRect(fx+.5,yy-12.5,fs-1,fs-1); }
    }
    const tx=hasAsset('portraits')? x+fs+8 : x;
    g.fillStyle= o.post? '#8fd6a0':'#e8e1d1'; g.font='13px serif';
    g.fillText(o.nm, tx, yy);
    g.fillStyle='rgba(150,145,135,.75)'; g.font='10px serif';
    g.fillText(o.fac+' · '+o.age+'세'+(o.post? ' · '+G.provs[o.post].nm+' 수령':''), tx, yy+13);
    g.font='10px serif'; g.textAlign='right';
    g.fillStyle='#9fd0e8'; g.fillText('정 '+o.pol+'  경 '+o.eco+'  군 '+o.mil+'  외 '+o.dip, x+w, yy);
    g.fillStyle= o.loy<40? '#c4534a':'rgba(180,175,160,.8)';
    g.fillText('충 '+Math.round(o.loy), x+w, yy+13);
    g.textAlign='left';
    hz(x-4,yy-14,w+8,rowH, ()=>{ assign(o); });
    yy+=rowH;
  });
  yy+=8; divider(g,x,yy-4,w); yy+=6;
  g.fillStyle='#e0bd76'; g.font='13px serif'; g.fillText('등용 대기', x, yy); yy+=18;
  G.pool.slice(0,4).forEach(o=>{
    const rowH=28;
    if(inRect(Mouse,{x:x-4,y:yy-13,w:w+8,h:rowH})){ g.fillStyle='rgba(190,150,80,.14)'; g.fillRect(x-4,yy-13,w+8,rowH); }
    g.fillStyle='#c9bfa8'; g.font='12px serif'; g.fillText(o.nm, x, yy);
    g.fillStyle='rgba(150,145,135,.7)'; g.font='10px serif';
    g.fillText(o.fac+' · 정 '+o.pol+' 경 '+o.eco+' 군 '+o.mil, x+52, yy);
    g.fillStyle='#e0bd76'; g.font='10px serif'; g.textAlign='right';
    g.fillText('등용 40', x+w, yy); g.textAlign='left';
    hz(x-4,yy-13,w+8,rowH, ()=>{ recruit(o); });
    yy+=rowH;
  });
}
function assign(o){
  if(!G.sel){ log('먼저 고을을 고르시오.'); return; }
  const P=G.provs[G.sel];
  if(P.nat!=='kor'){ log('우리 고을이 아니오.'); return; }
  const prev=officialAt(P.id); if(prev) prev.post=null;
  o.post=P.id;
  log(o.nm+'을(를) '+P.nm+' 수령으로 보냈다.');
  G.factions[o.fac]=clamp(G.factions[o.fac]+3,0,100);
}
function recruit(o){
  const N=G.nations.kor;
  if(N.gold<40){ log('국고가 모자라오.'); return; }
  N.gold-=40; G.pool=G.pool.filter(x=>x!==o); G.officials.push(o);
  log(o.nm+'을(를) 등용했다.');
}
function sidePolicy(g,x,y,w){
  const N=G.nations.kor;
  g.fillStyle='#e0bd76'; g.font='13px serif';
  g.fillText('정책  ('+G.policies.length+' / 3)', x, y+12);
  g.fillStyle='rgba(150,145,135,.7)'; g.font='10px serif';
  g.fillText('세 가지까지 동시에 시행할 수 있다', x, y+28);
  let yy=y+44;
  POLICIES.forEach(P=>{
    const open=G.era>=P.era, on=G.policies.includes(P.id);
    const rowH=40;
    if(!open){
      g.fillStyle='rgba(60,58,54,.5)'; g.font='12px serif';
      g.fillText(P.nm+'  — '+ERAS[P.era].nm+' 이후', x, yy+8);
      yy+=rowH; return;
    }
    if(inRect(Mouse,{x:x-4,y:yy-10,w:w+8,h:rowH})){ g.fillStyle='rgba(190,150,80,.12)'; g.fillRect(x-4,yy-10,w+8,rowH); }
    g.fillStyle= on? '#8fa86a':'#e8e1d1'; g.font='13px serif';
    g.fillText((on?'● ':'○ ')+P.nm, x, yy+6);
    g.fillStyle='rgba(150,145,135,.8)'; g.font='10px serif';
    g.fillText(P.desc, x, yy+21);
    g.fillStyle= on?'#8fa86a':'#e0bd76'; g.font='11px serif'; g.textAlign='right';
    g.fillText(on? '시행 중' : (P.cost+' 전'), x+w, yy+6); g.textAlign='left';
    hz(x-4,yy-10,w+8,rowH, ()=>{ togglePolicy(P); });
    yy+=rowH;
  });
}
function togglePolicy(P){
  const N=G.nations.kor;
  if(G.policies.includes(P.id)){
    G.policies=G.policies.filter(i=>i!==P.id); log(P.nm+'을(를) 거두었다.'); return;
  }
  if(G.policies.length>=3){ log('정책은 셋까지요.'); return; }
  if(N.gold<P.cost){ log('국고가 모자라오.'); return; }
  N.gold-=P.cost; G.policies.push(P.id); log(P.nm+'을(를) 시행한다.');
}
function sideLog(g,x,y,w){
  g.fillStyle='#e0bd76'; g.font='13px serif'; g.fillText('기록', x, y+12);
  let yy=y+34;
  G.log.slice(0,20).forEach(L=>{
    g.fillStyle='rgba(150,145,135,.6)'; g.font='10px serif'; g.fillText(L.y+'', x, yy);
    g.fillStyle='#c9bfa8'; g.font='12px serif';
    const words=L.s; let line='', out=[];
    for(const ch of words){ if(g.measureText(line+ch).width>w-40){ out.push(line); line=ch; } else line+=ch; }
    out.push(line);
    out.slice(0,2).forEach((t,i)=>{ g.fillText(t, x+34, yy+i*14); });
    yy+=Math.max(18, out.slice(0,2).length*14+6);
  });
}

/* 아래 — 고른 고을과 명령 */
function drawBottom(g){
  const y=CFG.GY+CFG.GH*CFG.CELL+26, h=CFG.H-y-8, x=CFG.GX, w=CFG.GW*CFG.CELL;
  panel(g,x,y,w,h);
  const P=G.sel? G.provs[G.sel]:null;
  if(!P){
    g.fillStyle='#5f5a53'; g.font='13px serif';
    g.fillText('지도에서 고을을 고르시오.', x+16, y+28);
  } else {
    const T=TERR[P.t], NA=NATIONS[P.nat];
    g.fillStyle=NA.col; g.fillRect(x+12,y+12,4,34);
    g.fillStyle='#f2ead7'; g.font='18px serif'; g.fillText(P.nm, x+24, y+28);
    g.fillStyle='rgba(150,145,135,.85)'; g.font='11px serif';
    g.fillText(natName(P.nat)+' · '+T.nm+(P.cap?' · 도읍':''), x+24, y+44);
    const gov=officialAt(P.id);
    g.fillStyle= gov?'#8fd6a0':'#5f5a53'; g.font='11px serif';
    g.fillText(gov? ('수령 '+gov.nm) : '수령 없음', x+120, y+44);
    // 수치
    let sx=x+230;
    [['인구',num(P.pop)],['개발',P.dev],['농지',P.farm],['상업',P.trade],
     ['성곽',P.fort],['병력',num(P.army)]].forEach(([k,v])=>{
      g.fillStyle='rgba(150,145,135,.75)'; g.font='10px serif'; g.fillText(k, sx, y+22);
      g.fillStyle='#e8e1d1'; g.font='14px serif'; g.fillText(v+'', sx, y+40);
      sx+=Math.max(64, g.measureText(v+'').width+26);
    });
    g.fillStyle='rgba(150,145,135,.75)'; g.font='10px serif'; g.fillText('민심', sx, y+22);
    bar(g,sx,y+28,80,10, 1-P.unrest/100, P.unrest>50?'#c4534a':'#8fa86a');
    // 명령
    let bx=x+16, by=y+56;
    ACTIONS.forEach(a=>{
      const ok=a.need(P), c=actCost(a), afford=G.nations.kor.gold>=c;
      btn(g, bx, by, 108, 26, a.nm+'  '+c, false,
        (ok&&afford)? ()=>{ G.nations.kor.gold-=c; a.run(P); recalc(); } : null,
        !(ok&&afford));
      if(inRect(Mouse,{x:bx,y:by,w:108,h:26})) G.tip=a.desc+(ok?'':'  (지금은 할 수 없다)');
      bx+=114;
    });
  }
  // 한 해 보내기
  const bw=170, bx=x+w-bw-14, by=y+h-40;
  btn(g,bx,by,bw,32, G.ended? '끝났다' : '한 해를 보낸다  ▶', false, G.ended?null:()=>endTurn(), G.ended);
  g.fillStyle='rgba(120,115,105,.8)'; g.font='10px serif'; g.textAlign='right';
  g.fillText('Space 로도 넘길 수 있다', x+w-14, by-6); g.textAlign='left';
}

function drawPopup(g){
  const P=G.popup;
  g.fillStyle='rgba(4,5,8,.72)'; g.fillRect(0,0,CFG.W,CFG.H);
  const w=560,h=190,x=(CFG.W-w)/2,y=(CFG.H-h)/2;
  panel(g,x,y,w,h,0.97);
  g.textAlign='center';
  g.fillStyle='rgba(150,145,135,.8)'; g.font='12px serif';
  g.fillText(P.y+'년', CFG.W/2, y+38);
  g.fillStyle='#e0bd76'; g.font='30px serif';
  g.fillText(P.title, CFG.W/2, y+82);
  g.fillStyle='#e8e1d1'; g.font='15px serif';
  g.fillText(P.body, CFG.W/2, y+120);
  g.textAlign='left';
  btn(g, CFG.W/2-70, y+h-52, 140, 32, '알겠다', false, ()=>{ G.popup=null; });
}
function drawTip(g){
  if(!G.tip) return;
  const t=G.tip; G.tip=null;
  g.font='12px serif';
  const w=g.measureText(t).width+20;
  let x=Mouse.x+14, y=Mouse.y-30;
  if(x+w>CFG.W) x=CFG.W-w-6;
  if(y<0) y=Mouse.y+20;
  panel(g,x,y,w,26,0.96);
  g.fillStyle='#e8e1d1'; g.fillText(t, x+10, y+18);
}

/* ================================================================
   저장
   ================================================================ */
function saveGame(){
  try{
    const d={ ver:VERSION, year:G.year, era:G.era, turn:G.turn,
      provs:{}, nations:G.nations, officials:G.officials, pool:G.pool,
      factions:G.factions, policies:G.policies, log:G.log.slice(0,30), ev:{} };
    Object.entries(G.provs).forEach(([k,P])=>{ d.provs[k]={nat:P.nat,pop:P.pop,dev:P.dev,
      farm:P.farm,trade:P.trade,fort:P.fort,unrest:P.unrest,army:P.army}; });
    Object.keys(G).filter(k=>k.startsWith('ev_')).forEach(k=>d.ev[k]=1);
    localStorage.setItem(CFG.SAVE, JSON.stringify(d));
  }catch(e){}
}
function loadGame(){
  try{
    const d=JSON.parse(localStorage.getItem(CFG.SAVE)||'null');
    if(!d || d.ver!==VERSION) return false;
    newGame();
    G.year=d.year; G.era=d.era; G.turn=d.turn;
    G.nations=d.nations; G.officials=d.officials; G.pool=d.pool;
    G.factions=d.factions; G.policies=d.policies; G.log=d.log||[];
    Object.entries(d.provs).forEach(([k,v])=>{ if(G.provs[k]) Object.assign(G.provs[k],v); });
    Object.keys(d.ev||{}).forEach(k=>G[k]=1);
    recalc(); G.plateDirty=true;
    return true;
  }catch(e){ return false; }
}

/* ================================================================
   본체
   ================================================================ */
function tick(){
  if(Key.pressed['Space'] && !G.popup && !G.ended){ Key.pressed['Space']=false; endTurn(); }
  if(Key.pressed['Escape']){ Key.pressed['Escape']=false; G.popup=null; }
  draw();
  if(Mouse.click){
    Mouse.click=false;
    if(G.popup){ G.popup=null; }
    else {
      for(let i=HIT.length-1;i>=0;i--){
        const z=HIT[i];
        if(inRect(Mouse,z)){ if(z.fn) z.fn(); break; }
      }
    }
  }
  Mouse.rclick=false;
  Key.pressed={};
  requestAnimationFrame(tick);
}
loadAssets();
if(!loadGame()) newGame();
requestAnimationFrame(tick);
</script>
