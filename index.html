  out.sort((a,b)=>b.급함-a.급함);

}

/* ================================================================
   소리
   ----------------------------------------------------------------
   음원 파일을 두지 않는다. 이 놀이는 파일 하나로 돌아가는 것이 규칙이므로,
   소리도 그 자리에서 만들어 쓴다(Web Audio).
   악기는 셋이면 넉넉하다 — 북, 징, 그리고 뜯는 줄.
   여기에 숨소리 섞인 피리를 더해 시대마다 빛깔을 달리한다.

   브라우저는 사람이 한 번 누르기 전에는 소리를 내주지 않는다.
   그래서 첫 누름에서 깨운다. 깨우지 못해도 놀이는 그대로 돈다.
   ================================================================ */
const SND={
  ctx:null, master:null, busSfx:null, busMus:null, comp:null,
  on:{ sfx:true, mus:true }, vol:{ sfx:0.55, mus:0.30 },
  ready:false, failed:false
};
function sndLoad(){
  try{
    const d=JSON.parse(localStorage.getItem(CFG.SOUND)||'null');
    if(d){ if(d.on) Object.assign(SND.on,d.on); if(d.vol) Object.assign(SND.vol,d.vol); }
  }catch(e){}
}
function sndSave(){
  try{ localStorage.setItem(CFG.SOUND, JSON.stringify({on:SND.on, vol:SND.vol})); }catch(e){}
}
function sndInit(){
  if(SND.ctx || SND.failed) return;
  const AC = (typeof AudioContext!=='undefined')? AudioContext
           : (typeof webkitAudioContext!=='undefined')? webkitAudioContext : null;
  if(!AC){ SND.failed=true; return; }
  try{
    const c=new AC();
    SND.ctx=c;
    // 여러 소리가 겹쳐도 찢어지지 않게 눌러 준다
    SND.comp=c.createDynamicsCompressor();
    SND.comp.threshold.value=-14; SND.comp.ratio.value=6; SND.comp.attack.value=0.005;
    SND.master=c.createGain(); SND.master.gain.value=0.9;
    SND.busSfx=c.createGain(); SND.busSfx.gain.value=SND.vol.sfx;
    SND.busMus=c.createGain(); SND.busMus.gain.value=SND.vol.mus;
    SND.busSfx.connect(SND.comp); SND.busMus.connect(SND.comp);
    SND.comp.connect(SND.master); SND.master.connect(c.destination);
    SND.ready=true;
  }catch(e){ SND.failed=true; }
}
/* 사람이 처음 누를 때 깨운다 */
function sndWake(){
  sndInit();
  if(SND.ctx && SND.ctx.state==='suspended'){ try{ SND.ctx.resume(); }catch(e){} }
}
function sndApply(){
  if(!SND.ready) return;
  SND.busSfx.gain.value = SND.on.sfx? SND.vol.sfx : 0;
  SND.busMus.gain.value = SND.on.mus? SND.vol.mus : 0;
}

/* ── 악기 ── */
function sEnv(t0, a, d, peak, bus){
  const c=SND.ctx, g=c.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak), t0+a);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+a+d);
  g.connect(bus||SND.busSfx);
  return g;
}
/* 뜯는 줄 — 가야금·거문고. 톱니를 낮은 거름으로 훑어 내린다. */
function sPluck(freq, t0, dur, peak, bus){
  const c=SND.ctx;
  const o=c.createOscillator(); o.type='sawtooth'; o.frequency.value=freq;
  const f=c.createBiquadFilter(); f.type='lowpass';
  f.frequency.setValueAtTime(freq*7+900, t0);
  f.frequency.exponentialRampToValueAtTime(Math.max(220,freq*1.6), t0+dur*0.85);
  f.Q.value=1.2;
  const g=sEnv(t0, 0.006, dur, peak, bus);
  o.connect(f); f.connect(g);
  o.start(t0); o.stop(t0+dur+0.05);
}
/* 피리·대금 — 숨소리를 조금 섞고 떨림을 준다 */
function sFlute(freq, t0, dur, peak, bus){
  const c=SND.ctx;
  const o=c.createOscillator(); o.type='triangle'; o.frequency.value=freq;
  const lfo=c.createOscillator(); lfo.frequency.value=5.2;
  const lg=c.createGain(); lg.gain.value=freq*0.008;
  lfo.connect(lg); lg.connect(o.frequency);
  const g=c.createGain();
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(peak, t0+dur*0.25);
  g.gain.setValueAtTime(peak, t0+dur*0.7);
  g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  g.connect(bus||SND.busSfx);
  o.connect(g);
  o.start(t0); o.stop(t0+dur+0.05);
  lfo.start(t0); lfo.stop(t0+dur+0.05);
}
/* 북 — 낮은 소리가 뚝 떨어지고, 가죽 소리를 얹는다 */
function sDrum(t0, peak, pitch, bus){
  const c=SND.ctx;
  const o=c.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(pitch||140, t0);
  o.frequency.exponentialRampToValueAtTime((pitch||140)*0.35, t0+0.16);
  const g=sEnv(t0, 0.004, 0.30, peak, bus);
  o.connect(g); o.start(t0); o.stop(t0+0.4);
  sNoise(t0, 0.05, peak*0.5, 1400, bus);
}
/* 징 — 어울리지 않는 배음을 겹쳐 길게 끈다 */
function sGong(t0, peak, base, bus){
  const c=SND.ctx, f0=base||196;
  [1, 2.37, 3.41, 4.72, 6.1].forEach((r,i)=>{
    const o=c.createOscillator(); o.type='sine'; o.frequency.value=f0*r;
    const g=sEnv(t0+i*0.008, 0.01, 2.6-i*0.28, peak/(1.6+i*1.5), bus);
    o.connect(g); o.start(t0); o.stop(t0+3.2);
  });
  sNoise(t0, 0.25, peak*0.28, 2600, bus);
}
/* 바람·쇳소리 — 잡음을 걸러 쓴다 */
function sNoise(t0, dur, peak, cut, bus){
  const c=SND.ctx;
  const n=Math.max(1,Math.floor(c.sampleRate*dur));
  const buf=c.createBuffer(1,n,c.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const src=c.createBufferSource(); src.buffer=buf;
  const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=cut||3000;
  const g=sEnv(t0, 0.004, dur, peak, bus);
  src.connect(f); f.connect(g); src.start(t0); src.stop(t0+dur+0.05);
}

/* ── 무슨 소리를 낼 것인가 ── */
const SFX={
  click:   t=>{ sNoise(t,0.035,0.16,2200); sPluck(880,t,0.07,0.05); },
  pick:    t=>{ sPluck(587,t,0.16,0.10); },
  build:   t=>{ sDrum(t,0.16,190); sPluck(392,t+0.05,0.3,0.09); },
  market:  t=>{ sPluck(523,t,0.22,0.11); sPluck(784,t+0.07,0.26,0.08); },
  fort:    t=>{ sDrum(t,0.22,110); sNoise(t+0.04,0.14,0.12,900); },
  levy:    t=>{ sDrum(t,0.20,150); sDrum(t+0.15,0.16,150); },
  relief:  t=>{ sFlute(523,t,0.5,0.09); sFlute(659,t+0.18,0.5,0.07); },
  year:    t=>{ sDrum(t,0.26,120); sNoise(t+0.02,0.3,0.05,600); },
  battle:  t=>{ for(let i=0;i<5;i++) sDrum(t+i*0.11,0.24-i*0.02,132);
                sNoise(t+0.1,0.5,0.16,3600); sNoise(t+0.3,0.4,0.12,5200); },
  win:     t=>{ sGong(t,0.34,262); [0,4,7,12].forEach((n,i)=>sPluck(262*Math.pow(2,n/12),t+0.1+i*0.09,0.5,0.10)); },
  lose:    t=>{ sGong(t,0.30,131); sFlute(196,t+0.2,1.1,0.08); },
  event:   t=>{ sGong(t,0.24,247); },
  era:     t=>{ sGong(t,0.40,165); sGong(t+0.5,0.26,247); },
  tech:    t=>{ [0,4,7,11].forEach((n,i)=>sPluck(523*Math.pow(2,n/12),t+i*0.07,0.45,0.09)); },
  treaty:  t=>{ sFlute(440,t,0.4,0.09); sFlute(587,t+0.2,0.5,0.08); },
  war:     t=>{ sGong(t,0.34,110); for(let i=0;i<3;i++) sDrum(t+0.25+i*0.18,0.24,96); },
  revolt:  t=>{ sDrum(t,0.28,90); sNoise(t+0.05,0.7,0.16,700); sGong(t+0.2,0.20,147); },
  fall:    t=>{ sGong(t,0.42,98); sNoise(t+0.1,1.2,0.18,500); sFlute(147,t+0.4,1.6,0.09); },
  bad:     t=>{ sPluck(233,t,0.25,0.10); sPluck(220,t+0.09,0.3,0.08); }
};
let SFX_LAST={};
function snd(name, gap){
  if(!SND.ready || !SND.on.sfx || !SFX[name]) return;
  const c=SND.ctx, t=c.currentTime+0.01;
  // 같은 소리가 한꺼번에 몰리면 귀가 아프다
  if(SFX_LAST[name] && t-SFX_LAST[name] < (gap==null?0.06:gap)) return;
  SFX_LAST[name]=t;
  try{ SFX[name](t); }catch(e){}
}

/* ================================================================
   배경음 — 시대마다 다른 가락
   ----------------------------------------------------------------
   가락을 미리 적어 두지 않는다. 오음계에서 몇 음을 골라 느리게 놓고,
   나라 형편(전쟁·민심)에 따라 빛깔을 바꾼다. 같은 판이 두 번 나오지 않는다.
   ================================================================ */
const MUS={ next:0, step:0, root:0 };
/* 평조·계면조 — 조선 음악의 다섯 음 */
const SCALE_PYEONG=[0,2,4,7,9], SCALE_GYEMYEON=[0,3,5,7,10];
function musEra(){
  const e=G? G.era : 0;
  //      빠르기   높이   피리 섞임   북
  const T=[[2.05,  -5, 0.30, 0.00],   // 조선 전기 — 성기고 느리다
           [1.55, -12, 0.20, 0.55],   // 임진왜란 — 북이 들어온다
           [1.90,  -7, 0.34, 0.10],   // 조선 후기
           [1.70,  -3, 0.40, 0.14],   // 개항
           [1.60,  -8, 0.26, 0.20],   // 식민 — 낮고 어둡다
           [1.65,   0, 0.42, 0.12],   // 해방
           [1.35,   2, 0.30, 0.26],   // 산업화 — 걸음이 빨라진다
           [1.25,   4, 0.36, 0.18]];  // 현대
  return T[Math.min(T.length-1, e)];
}
function musicTick(){
  if(!SND.ready || !SND.on.mus || !G) return;
  const c=SND.ctx;
  if(c.state!=='running') return;
  const [beat, shift, breath, drum] = musEra();
  if(!MUS.next) MUS.next=c.currentTime+0.2;
  let guard=0;
  while(MUS.next < c.currentTime+1.2 && guard++<8){
    const t=MUS.next, s=MUS.step;
    const 전쟁 = DIP_NATS.some(k=>dipOf(k)&&dipOf(k).war);
    const 어렵 = G.nations.kor.stab<35 || G.ended;
    // 어지러운 때에는 계면조로 내려앉는다
    const sc = (전쟁||어렵)? SCALE_GYEMYEON : SCALE_PYEONG;
    const base = 220*Math.pow(2,(shift+(어렵?-2:0))/12);
    const f = n => base*Math.pow(2, n/12);
    // 여덟 걸음마다 한 번, 낮은 줄로 바닥을 깐다
    if(s%8===0) sPluck(f(sc[0]-12), t, beat*3.2, 0.055, SND.busMus);
    // 가락 — 늘 울리지 않는다. 빈 곳이 있어야 가락이 된다.
    if(Math.random()<0.62){
      const n=sc[Math.floor(Math.random()*sc.length)] + (Math.random()<0.25?12:0);
      sPluck(f(n), t, beat*1.5, 0.075, SND.busMus);
      if(Math.random()<breath) sFlute(f(n)*2, t+beat*0.35, beat*0.9, 0.030, SND.busMus);
    }
    // 북 — 전쟁이면 반드시 울린다
    const 북확률 = 전쟁? Math.max(0.5,drum+0.35) : drum;
    if(s%4===0 && Math.random()<북확률) sDrum(t, 전쟁?0.13:0.085, 전쟁?104:120, SND.busMus);
    MUS.step++; MUS.next += beat*(0.9+Math.random()*0.2);
  }
}

/* ================================================================
   움직임
   ----------------------------------------------------------------
   예전에는 고을을 빼앗아도 칠이 한 번 바뀔 뿐이었다. 육백 년이 걸린
   전쟁이 눈금 하나로 끝나면, 그 전쟁은 일어나지 않은 것과 같다.

   여기서는 화면을 한 겹 더 얹는다. 군사가 건너가고, 부딪히고, 먹이 튀고,
   화면이 흔들리고, 빼앗긴 땅의 빛이 천천히 넘어온다.
   판정은 이미 끝난 뒤다 — 이 겹은 규칙에 손대지 않고 보여 주기만 한다.
   ================================================================ */
const FX=[];
let NOW=0, DT=0, SHAKE=0;
function fx(o){ FX.push(Object.assign({t:0, life:1}, o)); }
function fxTick(dt){
  for(let i=FX.length-1;i>=0;i--){
    const f=FX[i]; f.t+=dt;
    // 늦게 시작하는 겹 — 군사가 닿은 뒤에 부딪히는 소리가 나야 한다
    if(!f.fired && f.t>=(f.delay||0)){
      f.fired=true;
      if(f.shake) shake(f.shake);
      if(f.snd) snd(f.snd, 0);
    }
    if(f.t>=f.life+(f.delay||0)) FX.splice(i,1);
  }
  SHAKE=Math.max(0, SHAKE - dt*2.6);
  // 임자가 바뀐 고을의 빛이 넘어오는 중
  if(G && G.provs) for(const k in G.provs){
    const P=G.provs[k];
    if(P.fxNat && P.fxNat.t<1) P.fxNat.t=Math.min(1, P.fxNat.t + dt*0.9);
  }
}
function shake(v){ SHAKE=Math.min(1.4, SHAKE+v); }
/* 고을의 자리.
   지도 안쪽에서 그리는 좌표계는 순수한 지도 좌표가 아니라 CFG.GX/GY 만큼
   밀려 있다(beginMapView 를 보라). 이름표도 그 자리에 놓이므로 여기서도 맞춘다.
   — 처음에 이 몫을 빼먹어 효과가 지도 왼쪽 위로 백여 픽셀 달아났다. */
function fxAt(id){
  const R=MAPVIS && MAPVIS.regions[id];
  return R? {x:CFG.GX+R.anchor[0], y:CFG.GY+R.anchor[1]} : null;
}
/* 두 빛깔을 섞는다 — 임자가 바뀔 때 천천히 넘어가게 */
function hex2rgb(h){
  const v=parseInt(h.slice(1),16);
  return [(v>>16)&255,(v>>8)&255,v&255];
}
function mixCol(a,b,t){
  const A=hex2rgb(a), B=hex2rgb(b);
  return 'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')';
}
/* 지금 이 고을을 어떤 빛으로 칠할 것인가 */
function natColOf(P){
  const now=NATIONS[P.nat].col;
  if(P.fxNat && P.fxNat.t<1){
    return mixCol(NATIONS[P.fxNat.prev].col, now, clamp(P.fxNat.t,0,1));
  }
  return now;
}

/* ── 싸움을 보여 준다 ──
   판정이 끝난 뒤에 부른다. 이겼는지 졌는지에 따라 다르게 그린다. */
function fxBattle(from, to, won, lossA, lossD){
  if(!from || !to) return;
  const a=fxAt(from.id), b=fxAt(to.id);
  if(!a||!b) return;
  /* 차례가 있다. 건너가고 — 부딪히고 — 그제야 임자가 바뀐다.
     한꺼번에 터뜨리면 무슨 일이 일어났는지 읽을 틈이 없다. */
  fx({ kind:'march', life:1.5, a, b, col: NATIONS[from.nat].col, snd:'battle' });
  fx({ kind:'clash', delay:0.62, life:1.3, at:b, won, shake: won?1.0:0.7 });
  fx({ kind:'ring',  delay:0.62, life:1.2, at:b, col: won? '#f0e2be' : '#c4534a' });
  fx({ kind:'provFlash', delay:0.62, life:1.5, id:to.id, won });
  if(won){
    fx({ kind:'float', delay:0.85, life:2.4, at:{x:b.x,y:b.y-10}, text:to.nm+' 함락',
         col:'#f7ecc8', size:17, rise:26 });
    to.fxNat={ prev:to.nat==='kor'? (to.home||'chn') : 'kor', t:-0.62 };   // 넘어오는 빛
  } else {
    fx({ kind:'float', delay:0.85, life:2.0, at:{x:b.x,y:b.y-10}, text:'물러났다',
         col:'#e08a80', size:15, rise:22 });
  }
  if(lossD) fx({ kind:'float', delay:1.0, life:2.2, at:{x:b.x+16,y:b.y+8}, text:'−'+num(lossD), col:'#e08a80', size:11, rise:20 });
  if(lossA) fx({ kind:'float', delay:1.0, life:2.2, at:{x:a.x-16,y:a.y+8}, text:'−'+num(lossA), col:'#e08a80', size:11, rise:20 });
  fx({ kind:'smoke', delay:0.7, life:6.0, at:b });
}
/* 임자가 바뀌었다 — 싸움 없이 넘어간 때(반란·편입)에도 쓴다 */
function fxFlip(P, prevNat, text, col){
  const a=fxAt(P.id); if(!a) return;
  P.fxNat={ prev:prevNat, t:0 };
  fx({ kind:'ring', life:1.0, at:a, col:col||'#c9a24a' });
  if(text) fx({ kind:'float', life:1.9, at:{x:a.x,y:a.y-8}, text, col:col||'#c9a24a', size:12 });
}
/* 흙먼지 — 무엇을 지으면 그 자리에서 인다 */
function fxDust(id, col, n){
  const a=fxAt(id); if(!a) return;
  for(let i=0;i<(n||6);i++){
    const ang=Math.random()*Math.PI*2, sp=6+Math.random()*16;
    fx({ kind:'dust', life:0.9+Math.random()*0.6, at:{x:a.x,y:a.y},
         vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp*0.5-10-Math.random()*10,
         r:1.2+Math.random()*1.8, col:col||'#cfc7b6' });
  }
}
/* 고을에서 뭔가 좋은 일이 일어났다 */
function fxPop(id, text, col){
  const a=fxAt(id); if(!a) return;
  fx({ kind:'float', life:1.4, at:{x:a.x,y:a.y-6}, text, col:col||'#8fa86a', size:11 });
}

/* ── 효과를 그린다 — 지도 안쪽 좌표계에서 ── */
function drawFX(g, inv){
  FX.forEach(f=>{
    const tt=f.t-(f.delay||0);
    if(tt<0) return;                       // 아직 차례가 아니다
    const k=clamp(tt/f.life,0,1);
    g.save();
    if(f.kind==='yearSweep'){
      // 지도 위를 왼쪽에서 오른쪽으로 지나가는 빛
      const V=activeMapView(), z=V.zoom;
      const x0=V.x, x1=V.x+VIEW.w/z, y0=V.y, y1=V.y+VIEW.h/z;
      const w=(x1-x0)*0.22, cx=lerp(x0-w, x1+w, k);
      const gr=g.createLinearGradient(CFG.GX+cx-w, 0, CFG.GX+cx+w, 0);
      const a2=(1-Math.abs(k*2-1))*0.16;
      gr.addColorStop(0,'rgba(255,244,206,0)');
      gr.addColorStop(0.5,'rgba(255,244,206,'+a2.toFixed(3)+')');
      gr.addColorStop(1,'rgba(255,244,206,0)');
      g.fillStyle=gr;
      g.fillRect(CFG.GX+cx-w, CFG.GY+y0, w*2, y1-y0);
      g.restore(); return;
    }
    if(f.kind==='dust'){
      // 흙먼지 — 지은 자리에서 튀어 오르다 가라앉는다
      const px=f.at.x+f.vx*tt, py=f.at.y+f.vy*tt+38*tt*tt;
      g.globalAlpha=(1-k)*0.8;
      g.fillStyle=f.col;
      g.beginPath(); g.arc(px,py,f.r*(1-k*0.4)*inv,0,7); g.fill();
      g.restore(); return;
    }
    if(f.kind==='march'){
      // 군사가 건너간다 — 점선이 흘러가고 화살촉이 앞선다
      const e=clamp(k/0.55,0,1);
      const x=lerp(f.a.x,f.b.x,e), y=lerp(f.a.y,f.b.y,e);
      const mx=(f.a.x+f.b.x)/2, my=(f.a.y+f.b.y)/2 - Math.hypot(f.b.x-f.a.x,f.b.y-f.a.y)*0.22;
      g.globalAlpha=(1-k*k)*0.95;
      g.lineCap='round';
      g.strokeStyle='rgba(8,10,12,.55)'; g.lineWidth=5.2*inv;
      g.beginPath(); g.moveTo(f.a.x,f.a.y); g.quadraticCurveTo(mx,my,x,y); g.stroke();
      g.strokeStyle=f.col; g.lineWidth=2.8*inv; g.setLineDash([6*inv,5*inv]);
      g.lineDashOffset=-tt*54*inv;
      g.beginPath(); g.moveTo(f.a.x,f.a.y); g.quadraticCurveTo(mx,my,x,y); g.stroke();
      g.setLineDash([]);
      const ang=Math.atan2(f.b.y-f.a.y, f.b.x-f.a.x), sz=8*inv;
      g.fillStyle=f.col; g.strokeStyle='rgba(8,10,12,.7)'; g.lineWidth=1.2*inv;
      g.beginPath(); g.moveTo(x+Math.cos(ang)*sz*1.8, y+Math.sin(ang)*sz*1.8);
      g.lineTo(x+Math.cos(ang+2.5)*sz, y+Math.sin(ang+2.5)*sz);
      g.lineTo(x+Math.cos(ang-2.5)*sz, y+Math.sin(ang-2.5)*sz);
      g.closePath(); g.fill(); g.stroke();
    }
    else if(f.kind==='provFlash'){
      // 고을 자체가 번쩍인다 — 어디서 일어난 일인지 한눈에 든다
      const p=MAPVIS && MAPVIS.rect[f.id];
      if(p){
        const pulse=Math.max(0, Math.sin(k*Math.PI))*(1-k*0.4);
        g.globalAlpha=pulse*0.55;
        g.fillStyle= f.won? 'rgba(248,236,190,1)' : 'rgba(196,83,74,1)';
        g.save(); g.translate(CFG.GX,CFG.GY); g.fill(p,'evenodd'); g.restore();
      }
    }
    else if(f.kind==='clash'){
      // 부딪힘 — 먹이 튀듯 갈래로 뻗는다
      const n=14;
      for(let i=0;i<n;i++){
        const a2=(i/n)*Math.PI*2 + f.at.x*0.7;
        const d=(10+hash2(i,3)*44)*Math.sqrt(k)*inv;
        g.globalAlpha=(1-k)*0.95;
        g.strokeStyle= f.won? 'rgba(250,238,196,.98)' : 'rgba(214,92,80,.98)';
        g.lineWidth=(1-k)*3.4*inv; g.lineCap='round';
        g.beginPath();
        g.moveTo(f.at.x+Math.cos(a2)*d*0.30, f.at.y+Math.sin(a2)*d*0.30);
        g.lineTo(f.at.x+Math.cos(a2)*d, f.at.y+Math.sin(a2)*d);
        g.stroke();
      }
      g.globalAlpha=(1-k)*0.75;
      g.fillStyle= f.won? 'rgba(255,246,214,.95)':'rgba(214,92,80,.95)';
      g.beginPath(); g.arc(f.at.x,f.at.y,(3+16*(1-k))*inv,0,7); g.fill();
    }
    else if(f.kind==='ring'){
      g.globalAlpha=(1-k)*0.9;
      g.strokeStyle=f.col; g.lineWidth=(3.4*(1-k)+0.5)*inv;
      g.beginPath(); g.arc(f.at.x,f.at.y,(6+56*k)*inv,0,7); g.stroke();
      g.globalAlpha=(1-k)*0.45;
      g.beginPath(); g.arc(f.at.x,f.at.y,(6+34*k)*inv,0,7); g.stroke();
    }
    else if(f.kind==='smoke'){
      // 불탄 자리 — 연기가 천천히 오른다
      for(let i=0;i<4;i++){
        const p=(k+i*0.25)%1;
        g.globalAlpha=(1-p)*0.34*(1-k);
        g.fillStyle='rgba(64,60,54,1)';
        g.beginPath();
        g.arc(f.at.x+Math.sin(p*4+i)*6*inv, f.at.y-p*30*inv, (4+p*11)*inv, 0, 7);
        g.fill();
      }
    }
    else if(f.kind==='float'){
      // 떠오르는 글자 — 화면에서 늘 같은 크기로 읽히게 한다
      const size=(f.size||11)*inv;
      g.globalAlpha=k<0.12? k/0.12 : Math.min(1,(1-k)*2.2);
      g.font='700 '+size+'px serif'; g.textAlign='center';
      g.lineWidth=3.4*inv; g.strokeStyle='rgba(8,10,12,.92)';
      const y=f.at.y - k*(f.rise||16)*inv;
      g.strokeText(f.text, f.at.x, y); g.fillStyle=f.col; g.fillText(f.text, f.at.x, y);
      g.textAlign='left';
    }
    g.restore();
  });
  g.globalAlpha=1;
}

/* ================================================================
   그리기
   ================================================================ */
const HIT=[];
let MODAL=-1;   // 이 번호보다 뒤에 등록된 것만 누를 수 있다 (창이 떠 있을 때)
let MODAL_REF=null, MODAL_T=0;   // 어떤 창이 언제부터 떠 있는가
function hz(x,y,w,h,fn,tip){ HIT.push({x,y,w,h,fn,tip}); }
function inRect(p,r){ return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h; }
/* 판.
   ----------------------------------------------------------------
   머리 장식(ui_frame 0칸)은 192×64의 온전한 패쪽이다. 이것을 판 너비만큼
   가로로 늘이고 세로로 30px까지 눌러 붙이면, 글자 뒤에 찌그러진 문양이 깔린다.
   글월이 놓이는 자리에는 무늬를 깔지 않는다 — head:false 로 끈다. */
function panel(g,x,y,w,h,a,opt){
  g.fillStyle='rgba(14,16,20,'+(a||0.92)+')'; g.fillRect(x,y,w,h);
  const 머리 = !(opt && opt.head===false);
  if(머리 && hasAsset('frame') && w>=120 && h>=48){
    // 가로로 너무 늘어나면 문양이 뭉개진다. 늘일 수 있는 만큼만 늘이고 가운데 둔다.
    const dw=Math.min(w, 192*2.2), dh=Math.min(30, h*0.22);
    blit(g,'frame',0, x+(w-dw)/2, y, 192,64, dw, dh);
  }
  g.strokeStyle='rgba(190,158,96,.42)'; g.lineWidth=1; g.strokeRect(x+.5,y+.5,w-1,h-1);
}
/* 구분선 */
function divider(g,x,y,w){
  if(!blit(g,'frame',2, x, y-8, 192,64, w, 16)){
    g.strokeStyle='rgba(190,158,96,.22)'; g.lineWidth=1;
    g.beginPath(); g.moveTo(x,y+.5); g.lineTo(x+w,y+.5); g.stroke();
  }
}
function btn(g,x,y,w,h,label,on,fn,dim){
  const hov=inRect(Mouse,{x,y,w,h});
  g.fillStyle= dim? 'rgba(24,26,30,.7)' : (on?'rgba(190,150,80,.30)': hov?'rgba(60,64,72,.85)':'rgba(24,28,34,.85)');
  g.fillRect(x,y,w,h);
  g.strokeStyle= on?'rgba(224,189,118,.9)': dim?'rgba(90,86,80,.3)':'rgba(190,158,96,.30)';

/* ── 값 치르기 ──

   여러 화면에서 같은 규칙을 쓰므로 한 곳에 모아 둔다. */
function quote(admCost, baseCost){
  const N=G.nations.kor, 손=(N.adm||0)>=admCost, 별칙=!손;
  const c=Math.round(baseCost*(별칙? byeolMul() : 1));
  return { 별칙, c, 돈:N.gold>=c, ok:N.gold>=c && !G.ended };
}
function pay(q, admCost, fn){
  const N=G.nations.kor;
  N.gold-=q.c;
  if(q.별칙) byeolPay(); else N.adm-=admCost;
  fn(); recalc();
}
/* 명령 하나의 값 — 화면과 시뮬레이터가 같은 규칙을 쓰도록 한 자리에 둔다.
   싸움(noByeol)은 정무가 남아 있어야만 할 수 있다. */
function actQuote(a, p){
  const base=actCost(a,p);
  const N=G.nations.kor, 손=(N.adm||0)>=a.adm, 별칙=!손;
  const 못산다 = !!(a.noByeol && 별칙);
  const c = Math.round(base * (별칙 && !a.noByeol ? byeolMul() : 1));
  return { 별칙, 못산다, c, 돈:N.gold>=c, ok: N.gold>=c && !못산다 && !G.ended };
}

   격자를 그대로 칠하면 네모가 보인다. 그래서

   부드러운 해안선으로 바꾼다. 한지 위에 옅게 칠하고 먹으로 긋는다.
   지도판은 바뀔 때만 다시 굽는다.
   ================================================================ */
const PAL={ paper:'#e7ddc4', ink:'#2c2822', gold:'#8a6a2f', red:'#9d3b32' };
const WASH={ kor:'rgba(79,127,181,.26)', chn:'rgba(181,101,79,.24)',
             jpn:'rgba(138,111,174,.24)', ind:'rgba(111,138,114,.24)' };
/* 강 — 격자 좌표 폴리라인 */
const RIVERS=[
  [[47,11],[50,11],[53,10],[56,11]],                      // 압록·두만
  [[57,19],[55,19],[53,19],[51,20],[49,20]],              // 한강
  [[18,13],[24,14],[29,15],[34,15],[38,16]],              // 황하
  [[12,21],[18,22],[24,23],[30,23],[35,23],[39,23]]       // 양자강
];

function jit(x,y){ return [x+(hash2(x,y)-.5)*.5, y+(hash2(y+31,x+17)-.5)*.5]; }
function traceLoops(test){
  const out=new Map(), key=(a,b)=>a+','+b;
  const add=(ax,ay,bx,by)=>{ const k=key(ax,ay); if(!out.has(k)) out.set(k,[]); out.get(k).push([bx,by]); };
  for(let y=0;y<CFG.GH;y++) for(let x=0;x<CFG.GW;x++){
    if(!test(x,y)) continue;
    if(!test(x,y-1)) add(x,y,x+1,y);
    if(!test(x+1,y)) add(x+1,y,x+1,y+1);
    if(!test(x,y+1)) add(x+1,y+1,x,y+1);
    if(!test(x-1,y)) add(x,y+1,x,y);
  }
  const loops=[];
  while(out.size){
    const sk=out.keys().next().value, s=sk.split(',').map(Number);
    let cx=s[0], cy=s[1]; const loop=[]; let guard=0;
    while(guard++<20000){
      const k=key(cx,cy), arr=out.get(k);
      if(!arr||!arr.length){ out.delete(k); break; }
      const n=arr.pop(); if(!arr.length) out.delete(k);
      loop.push([cx,cy]); cx=n[0]; cy=n[1];
      if(cx===s[0]&&cy===s[1]) break;
    }
    if(loop.length>3) loops.push(loop);
  }
  return loops;
}
function chaikin(p,it){
  for(let k=0;k<it;k++){ const q=[];
    for(let i=0;i<p.length;i++){ const a=p[i], b=p[(i+1)%p.length];
      q.push([a[0]*.75+b[0]*.25, a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75, a[1]*.25+b[1]*.75]); }
    p=q; }
  return p;
}
function pathOf(test,iter){
  const C=CFG.CELL, path=new Path2D();
  traceLoops(test).forEach(loop=>{
    const s=chaikin(loop.map(([x,y])=>jit(x,y)), iter===undefined?3:iter);
    path.moveTo(s[0][0]*C, s[0][1]*C);
    for(let i=1;i<s.length;i++) path.lineTo(s[i][0]*C, s[i][1]*C);
    path.closePath();
  });
  return path;
}
/* 한지 */
let PAPER=null, PLATE=null;
function makePaper(w,h){

  const g=c.getContext('2d');

    gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  g.lineWidth=1;
  for(let i=0;i<1400;i++){
    const x=Math.random()*w, y=Math.random()*h, L=5+Math.random()*24;
    const a=(Math.random()<.5?0:Math.PI/2)+(Math.random()-.5)*.45;

    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.cos(a)*L, y+Math.sin(a)*L); g.stroke();
  }

  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(92,66,30,.20)');
  g.fillStyle=vg; g.fillRect(0,0,w,h);
  return c;
}
function seaDist(){
  const d=[]; for(let y=0;y<CFG.GH;y++) d.push(new Array(CFG.GW).fill(-1));
  const q=[];
  for(let y=0;y<CFG.GH;y++) for(let x=0;x<CFG.GW;x++) if(G.land[y][x]){ d[y][x]=0; q.push([x,y]); }
  for(let h=0;h<q.length;h++){ const [x,y]=q[h];
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{ const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=CFG.GW||ny>=CFG.GH||d[ny][nx]>=0) return;
      d[ny][nx]=d[y][x]+1; q.push([nx,ny]); }); }
  return d;
}
/* ================================================================
   고을 — 지도 위에 실제로 서는 마을
   ----------------------------------------------------------------
   여태 개발 4인 고을과 40인 고을이 똑같이 생겼다. 다각형에 빛깔을 칠하고
   이름을 얹은 것이 전부였으니, 삼백 해를 개간하고 축성해도 지도는 첫해와
   같은 그림이었다. 눈금이 오르는 것을 숫자로만 알 수 있으면 그것은
   장부이지 지도가 아니다.

   이제 고을마다 마을을 그린다. 자리는 고을 이름을 씨앗으로 한 번 정해
   두고(TOWNLAY), 몇 채를 그릴지만 지금 눈금에서 가져온다. 그러면
     개간하면  논이 한 뙈기 는다
     장을 열면 저자에 깃발이 하나 선다
     축성하면  성벽이 한 칸 오른다
     모병하면  창대가 하나 는다
   자리가 늘 같으므로 '자란다'로 보이고, 새로 선 것만 솟아오른다.
   ================================================================ */
const TOWNLAY={};
/* 한 번만 정하는 자리들. 씨앗은 고을 id — 판을 다시 열어도 같은 마을이다. */
function townLayout(P){
  if(TOWNLAY[P.id]) return TOWNLAY[P.id];
  let n=0; for(let i=0;i<P.id.length;i++) n=(n*131+P.id.charCodeAt(i))>>>0;
  let s=n||1;
  const r=()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s/4294967296; };
  const 집=[], 논=[], 저자=[], 배=[], 창=[];
  // 집 — 가운데에 모이고 바깥으로 퍼진다
  for(let i=0;i<16;i++){
    const a=r()*Math.PI*2, d=(0.35+Math.sqrt(i/16)*1.5)*(0.8+r()*0.5);
    /* 넷째 값은 '기와냐'가 아니라 그냥 주사위 하나다 —
       무슨 지붕을 일지는 시대가 정한다(eraFace). 자리는 그대로 두고 얼굴만 바뀐다. */
    집.push([Math.cos(a)*d, Math.sin(a)*d*0.62, 0.8+r()*0.5, r()]);
  }
  // 논 — 마을 바깥의 네모난 뙈기
  for(let i=0;i<14;i++){
    const a=r()*Math.PI*2, d=1.9+r()*2.3;
    논.push([Math.cos(a)*d, Math.sin(a)*d*0.6, 0.9+r()*0.7, r()*0.5-0.25]);
  }
  for(let i=0;i<8;i++){ const a=r()*Math.PI*2, d=0.9+r()*0.7;
    저자.push([Math.cos(a)*d, Math.sin(a)*d*0.6, r()]); }
  for(let i=0;i<5;i++){ const a=(r()*0.9+0.3)*Math.PI, d=3.0+r()*1.6;
    배.push([Math.cos(a)*d, Math.sin(a)*d*0.7, r()]); }
  for(let i=0;i<10;i++){ const a=r()*Math.PI*2, d=1.3+r()*0.9;
    창.push([Math.cos(a)*d, Math.sin(a)*d*0.6, r()]); }
  return (TOWNLAY[P.id]={집,논,저자,배,창});
}
/* ================================================================
   시대의 얼굴
   ----------------------------------------------------------------
   1392년 지도와 1988년 지도가 초가 지붕 말고는 똑같았다. 육백 년을 지났다는
   실감이 나려면 지도가 늙어야 한다.

   자리는 건드리지 않는다. 같은 집이 초가에서 기와로, 벽돌로, 콘크리트로
   바뀔 뿐이다. 성벽은 개항 뒤에 헐리고, 그 자리에 굴뚝이 선다.
   ================================================================ */
function eraFace(){
  const e=(G&&G.era)||0;
  return {
    e,
    초가: e<=1? 0.62 : e===2? 0.42 : e===3? 0.22 : e===4? 0.08 : 0,
    양옥: e>=3,          // 벽돌·양식 건물이 섞이기 시작한다
    상자: e>=5,          // 네모난 콘크리트
    굴뚝: e>=4,          // 공장 굴뚝
    기선: e>=3,          // 돛 대신 연통
    성헐림: e>=4,        // 성벽이 헐린다 — 그림만 그렇고 셈은 그대로다
    논빛: e>=6? 'rgba(120,140,86,.5)' : 'rgba(126,148,74,.62)',
    몸빛: e>=5? 'rgba(104,100,96,.92)' : 'rgba(64,56,46,.92)'
  };
}
/* 이 집은 무슨 지붕을 이었는가 — 주사위 하나와 시대로 정한다 */
function roofKind(r, F){
  if(F.상자 && r>0.42) return '평';       // 평지붕 콘크리트
  if(F.양옥 && r>0.74) return '벽';       // 벽돌 양옥
  if(r < F.초가) return '초';
  return '와';
}
/* 마을의 크기 — 사람과 개발이 정한다 */
function townScale(P){
  return clamp(Math.pow(Math.max(1,P.pop)/260000, 0.34) * (0.62 + (P.dev||0)/46), 0.45, 2.4);
}
/* 새로 선 것은 솟아오른다 — 무엇을 지었는지 P.built 에 적어 둔다 */
function townBuilt(P, 무엇){
  P.built={ k:무엇, t:NOW };
  G.plateDirty=G.plateDirty;   // 판은 다시 굽지 않는다 — 마을은 실시간으로 그린다
}
function 솟음(P, 무엇){
  if(!P.built || P.built.k!==무엇) return 1;
  const t=(NOW-P.built.t)/0.9;
  return t>=1? 1 : clamp(t,0,1);
}
/* 고을 하나를 그린다. 지도 안쪽 좌표계에서 부른다. */
function drawTown(g, P, z){

  const x=CFG.GX+R.anchor[0], y=CFG.GY+R.anchor[1];
  const S=townScale(P), L=townLayout(P), F=eraFace();
  const 우리=P.nat==='kor';
  const col=NATIONS[P.nat].col, col2=NATIONS[P.nat].col2;
  /* 확대에 따라 보이는 것이 달라진다 —
     멀리서는 점 하나, 다가가면 지붕과 성벽, 더 다가가면 논과 저자가 나온다.
     한반도를 통째로 보는 자리에서 논두렁까지 그리면 마흔둘을 다 그리느라
     한 프레임이 31ms 로 늘어졌다(60프레임은 16.7ms 안에 끝나야 한다).

  if(u*z < 2.4){

    g.beginPath(); g.arc(x,y,Math.max(0.8,u*0.6),0,7); g.fill();
    return;
  }
  if(!자세히){

    g.beginPath(); g.ellipse(x,y+u*0.2,u*1.15,u*0.62,0,0,7); g.fill();
    g.fillStyle=col;
    g.beginPath(); g.arc(x,y,Math.max(1.1,u*0.42),0,7); g.fill();
    return;
  }
  g.save();
  /* ── 논밭 ── */
  if(아주자세히 && P.farm>0){
    const n=Math.min(L.논.length, Math.round(P.farm/3.4));
    const 새=솟음(P,'farm');
    const 뙈기=new Path2D(), 이랑=new Path2D();
    for(let i=0;i<n;i++){
      const [dx,dy,sz,tilt]=L.논[i];
      const k = (i===n-1)? 새 : 1;
      if(k<=0.02) continue;
      const w=u*1.05*sz*k, h=u*0.55*sz*k;
      const m=new DOMMatrix().translate(x+dx*u, y+dy*u).rotate(tilt*57.2958);
      const one=new Path2D(); one.rect(-w/2,-h/2,w,h);
      뙈기.addPath(one, m);
      const two=new Path2D();
      for(let j=1;j<3;j++){ two.moveTo(-w/2, -h/2+h*j/3); two.lineTo(w/2, -h/2+h*j/3); }
      이랑.addPath(two, m);
    }
    g.fillStyle= 우리? F.논빛 : 'rgba(104,118,72,.42)';
    g.fill(뙈기);
    g.lineWidth=Math.max(0.3,0.5/z);
    g.strokeStyle='rgba(52,58,34,.5)'; g.stroke(뙈기);
    g.strokeStyle='rgba(70,86,44,.45)'; g.stroke(이랑);
  }
  /* ── 성벽 — 남문을 비운 고리.
     개항 뒤로는 헐린다. 셈에서 성곽은 그대로 값을 하지만(규칙은 건드리지 않는다)
     그림으로는 끊긴 토막과 남은 문루만 남는다 — 실제로 그러했다. */
  if(P.fort>0){

    const rad=u*(1.05+P.fort*0.055);
    const 두께=Math.max(0.5, (0.5+P.fort*0.15)*(F.성헐림? 0.62 : 1));
    const 문=0.32;                                   // 남쪽으로 열린 문

    g.beginPath(); g.arc(0,0,rad, Math.PI/2+문, Math.PI/2-문+Math.PI*2); g.stroke();
    g.strokeStyle= 우리? 'rgba(176,162,132,'+(0.95*흐림).toFixed(2)+')'
                       : 'rgba(136,128,112,'+(0.8*흐림).toFixed(2)+')';
    g.lineWidth=두께;
    g.beginPath(); g.arc(0,0,rad, Math.PI/2+문, Math.PI/2-문+Math.PI*2); g.stroke();
    g.setLineDash([]);
    // 망루 — 성곽 수만큼. 마지막 하나는 새로 쌓은 것이라 솟아오른다.

    }

    g.fillStyle='rgba(34,30,25,.92)';
    g.fillRect(-u*0.19, rad-u*0.09, u*0.38, u*0.24);
    g.fillStyle= 우리? '#8d7b58' : '#7a7364';
    g.fillRect(-u*0.15, rad-u*0.07, u*0.30, u*0.18);
    g.restore();
  }
  /* ── 집 ──
     한 채마다 fill 을 부르면 마흔두 고을에 오백 번이 넘는다. 빛깔이 같은 것끼리
     한 길(path)에 모아 세 번만 부른다 — 한 프레임에서 수 밀리초가 걸린 자리였다. */
  {
    const n=Math.min(L.집.length, 2+Math.round((P.dev||0)/3.4));
    const 새=솟음(P,'house');
    /* 몸체 — 콘크리트 시대의 것은 높이 선다 */
    g.beginPath();
    for(let i=0;i<n;i++){
      const [dx,dy,sz,rr]=L.집[i];
      const k=(i===n-1)? 새 : 1; if(k<=0.02) continue;
      const 꼴=roofKind(rr,F);
      const w=u*0.42*sz, h=u*0.30*sz*k*(꼴==='평'? 2.1 : 1);
      g.rect(x+dx*u-w/2, y+dy*u-h*(꼴==='평'? 0.75 : 0.2), w, h*(꼴==='평'? 1.0 : 0.75));
    }

      g.beginPath();
      for(let i=0;i<n;i++){
        const [dx,dy,sz,rr]=L.집[i];
        if(roofKind(rr,F)!=='평') continue;
        const k=(i===n-1)? 새 : 1; if(k<=0.6) continue;
        const w=u*0.42*sz, h=u*0.30*sz*2.1;
        const hx=x+dx*u-w/2, hy=y+dy*u-h*0.75;
        for(let ry=0;ry<3;ry++) for(let cx2=0;cx2<2;cx2++){
          if(((i*7+ry*3+cx2)%5)===0) continue;      // 몇 집은 불이 꺼져 있다
          g.rect(hx+w*(0.20+cx2*0.42), hy+h*(0.16+ry*0.26), w*0.20, h*0.14);
        }

      g.fillStyle='rgba(238,214,150,.62)'; g.fill();
    }
    /* 지붕 — 종류별로 한 길에 모아 칠한다 */
    const 지붕빛={ '초':'rgba(150,128,84,.9)',
                  '와': 우리? 'rgba(92,88,96,.95)' : 'rgba(82,80,86,.9)',
                  '벽':'rgba(134,86,68,.92)',
                  '평':'rgba(126,124,120,.95)' };
    for(const 꼴 of ['초','와','벽','평']){
      let 있다=false; g.beginPath();
      for(let i=0;i<n;i++){
        const [dx,dy,sz,rr]=L.집[i];
        if(roofKind(rr,F)!==꼴) continue;
        const k=(i===n-1)? 새 : 1; if(k<=0.02) continue;
        const w=u*0.42*sz, h=u*0.30*sz*k, hx=x+dx*u, hy=y+dy*u;

    if(F.굴뚝 && P.trade>=12){

    if(F.상자){

      g.fillRect(x-u*0.16, y-u*2.5, u*0.32, u*1.9);

  if(아주자세히 && P.trade>0){

      const 흔들=Math.sin(NOW*2.2+ph*7)*0.10;

  if(아주자세히 && 우리 && P.army>0){

    for(let i=0;i<n;i++){

      g.beginPath(); g.moveTo(sx,sy); g.lineTo(sx+흔들*u, sy-u*0.62*k); g.stroke();
      g.fillStyle=col;

  if(아주자세히 && tagVal(P,'navy',0)>0.9){

      g.fillStyle='rgba(56,48,38,.9)';

      if(F.기선){

        g.beginPath(); g.moveTo(bx,by); g.lineTo(bx,by-u*0.34); g.stroke();
        g.fillStyle='rgba(214,206,182,.8)';
        g.beginPath(); g.moveTo(bx,by-u*0.34); g.lineTo(bx+u*0.19,by-u*0.10); g.lineTo(bx,by-u*0.06);
        g.closePath(); g.fill();
      }
    }
  }
  /* ── 연기 — 사람이 사는 표 ── */
  if(자세히 && P.pop>60000){
    const n=clamp(Math.round((P.dev||0)/16)+1, 1, 2);
    for(let i=0;i<n;i++){
      const [dx,dy]=L.집[i*3%L.집.length];
      const sx=x+dx*u, sy=y+dy*u-u*0.30;
      for(let j=0;j<2;j++){
        const t=(NOW*0.32+i*0.4+j*0.5)%1;
        const a=(1-t)*0.30*(우리?1:0.7);
        if(a<=0.01) continue;
        g.fillStyle='rgba(206,200,188,'+a.toFixed(3)+')';
        g.beginPath();
        g.arc(sx+Math.sin((t+i)*3.1)*u*0.22, sy-t*u*1.5, u*(0.09+t*0.16), 0, 7);
        g.fill();
      }
    }
  }
  /* ── 어지러운 고을은 붉은 기운이 돈다 ── */
  if(자세히 && 우리 && P.unrest>55){
    const a=0.10+Math.sin(NOW*2.4)*0.05;
    g.fillStyle='rgba(196,83,74,'+Math.max(0,a).toFixed(3)+')';
    g.beginPath(); g.ellipse(x,y,u*1.9,u*1.15,0,0,7); g.fill();
  }
  g.restore();
}

function terrainMarks(g,P){
  const C=CFG.CELL;
  g.save(); g.clip(P._path);
  P.cells.forEach(([x,y])=>{
    const h=hash2(x*7+3,y*13+5), h2=hash2(y*5+1,x*11+9);
    const px=(x+.15+h*.7)*C, py=(y+.15+h2*.7)*C;
    if(P.t==='mtn'){
      if(h>.42) return;
      const s=5+h2*4;
      g.beginPath(); g.moveTo(px-s*.9,py+s*.5); g.lineTo(px,py-s*.55); g.lineTo(px+s*.9,py+s*.5);
      g.closePath(); g.fillStyle='rgba(96,90,76,.30)'; g.fill();
      g.strokeStyle='rgba(40,36,30,.65)'; g.lineWidth=1; g.beginPath();
      g.moveTo(px-s*.9,py+s*.5); g.lineTo(px,py-s*.55); g.lineTo(px+s*.55,py+s*.1); g.stroke();
    } else if(P.t==='hill'){
      if(h>.34) return;
      g.strokeStyle='rgba(52,46,36,.42)'; g.lineWidth=1;
      g.beginPath(); g.arc(px,py+3,3.5+h2*2,Math.PI*1.06,Math.PI*1.94); g.stroke();
    } else if(P.t==='coast'){
      if(h>.30) return;
      g.strokeStyle='rgba(60,80,84,.35)'; g.lineWidth=1;
      for(let i=0;i<2;i++){ g.beginPath(); g.moveTo(px-4,py+i*3.5);
        g.quadraticCurveTo(px,py+i*3.5-2,px+4,py+i*3.5); g.stroke(); }
    } else {
      if(h>.30) return;
      g.strokeStyle='rgba(70,72,44,.34)'; g.lineWidth=1;
      g.beginPath(); g.moveTo(px-3.5,py); g.lineTo(px+3.5,py);
      g.moveTo(px-3.5,py+3); g.lineTo(px+3.5,py+3); g.stroke();
    }
  });
  g.restore();
}
function inkStroke(g,path,w,a,col){
  g.strokeStyle=col||PAL.ink; g.lineJoin='round'; g.lineCap='round';
  g.globalAlpha=a*.5; g.lineWidth=w*1.9; g.stroke(path);
  g.globalAlpha=a;    g.lineWidth=w;     g.stroke(path);
  g.globalAlpha=1;
}
function buildPlate(){
  const C=CFG.CELL, MW=CFG.GW*C, MH=CFG.GH*C;
  const c=document.createElement('canvas'); c.width=MW; c.height=MH;
  const g=c.getContext('2d');
  if(!PAPER) PAPER=makePaper(MW,MH);
  /* 바다 — 종이 위 옅은 청록, 해안 등거리선 */
  g.drawImage(PAPER,0,0);
  g.fillStyle='rgba(150,178,178,.34)'; g.fillRect(0,0,MW,MH);
  const D=seaDist();
  for(let k=4;k>=1;k--){
    const p=pathOf((x,y)=>x>=0&&y>=0&&x<CFG.GW&&y<CFG.GH&&D[y][x]>=0&&D[y][x]<=k,3);
    g.strokeStyle='rgba(66,96,102,'+(0.05+(5-k)*0.045)+')'; g.lineWidth=1; g.stroke(p);
  }
  /* 땅 바탕 — 이음매가 안 보이게 통째로 */
  const landPath=pathOf((x,y)=>x>=0&&y>=0&&x<CFG.GW&&y<CFG.GH&&G.land[y][x],3);
  g.save(); g.clip(landPath); g.drawImage(PAPER,0,0);
  g.fillStyle='rgba(226,214,182,.55)'; g.fillRect(0,0,MW,MH); g.restore();
  /* 지방 채색 + 지형 기호 */
  Object.values(G.provs).forEach(P=>{
    P._path=pathOf((x,y)=>x>=0&&y>=0&&x<CFG.GW&&y<CFG.GH&&G.grid[y][x]===P.id,3);
    g.save();
    g.fillStyle=WASH[P.nat]||WASH.ind; g.fill(P._path);
    g.clip(P._path);
    g.strokeStyle=NATIONS[P.nat].col; g.globalAlpha=.10; g.lineWidth=14; g.stroke(P._path);
    g.globalAlpha=.14; g.lineWidth=5; g.stroke(P._path);
    g.globalAlpha=1; g.restore();
    terrainMarks(g,P);
  });
  /* 강 */
  g.lineCap='round';
  RIVERS.forEach(r=>{
    const s=chaikin(r.map(([x,y])=>[x+.5,y+.5]),3);
    g.beginPath(); g.moveTo(s[0][0]*C,s[0][1]*C);
    for(let i=1;i<s.length;i++) g.lineTo(s[i][0]*C,s[i][1]*C);
    g.strokeStyle='rgba(84,116,124,.55)'; g.lineWidth=2.2; g.stroke();
    g.strokeStyle='rgba(150,182,186,.45)'; g.lineWidth=1; g.stroke();
  });
  /* 먹선 — 도 경계 → 국경 → 해안선 */
  Object.values(G.provs).forEach(P=>inkStroke(g,P._path,0.8,.28));
  Object.keys(NATIONS).forEach(k=>{
    const p=pathOf((x,y)=>x>=0&&y>=0&&x<CFG.GW&&y<CFG.GH&&G.grid[y][x]&&G.provs[G.grid[y][x]].nat===k,3);
    inkStroke(g,p,1.7,.62);
  });
  inkStroke(g,landPath,1.5,.75);
  g.globalCompositeOperation='multiply'; g.globalAlpha=.35; g.drawImage(PAPER,0,0);
  g.globalCompositeOperation='source-over'; g.globalAlpha=1;
  PLATE=c; G.plateDirty=false;
}
function inkText(g,t,x,y,size,col,halo){
  g.font=size+'px "Nanum Myeongjo","Batang",serif';
  g.lineJoin='round'; g.strokeStyle=halo||'rgba(231,221,196,.92)';
  g.lineWidth=3.2; g.strokeText(t,x,y);
  g.fillStyle=col||PAL.ink; g.fillText(t,x,y);
}

/* 실제 지리 + 음영기복 지도. 경제·전쟁용 G.grid는 그대로 두고 화면과 클릭만 분리한다. */

/* ================================================================
   보는 창 — 얼마나 당겨 보고 어디를 보는가
   ----------------------------------------------------------------
   지도 창은 888×480으로 옆으로 길고, 한반도는 68×128로 세로로 길다.
   그래서 배율을 하나로 못 박아 두면 어떻게 잡아도 고을이 작다.
   배율과 자리를 플레이어에게 넘긴다 — 휠로 당기고, 끌어서 옮긴다.
   지도판·경계·이름은 그대로 두고 보는 창만 움직이므로
   전쟁·인접 판정은 하나도 달라지지 않는다.
   ================================================================ */
const MAP_ZOOM_MIN=1, MAP_ZOOM_MAX=8;
/* 한반도가 창 높이에 꼭 차는 배율. 실제 좌표에서 재어 둔 값이다. */
const KOR_BOX={x0:585,y0:154,x1:653,y1:282};
const MAP_PRESETS={
  all:  ()=>({ zoom:Math.min(VIEW.w/MAP_GEO.width, VIEW.h/MAP_GEO.height),
               cx:MAP_GEO.width/2, cy:MAP_GEO.height/2 }),
  korea:()=>({ zoom:Math.min(MAP_ZOOM_MAX, (VIEW.h/(KOR_BOX.y1-KOR_BOX.y0))*0.92),
               cx:(KOR_BOX.x0+KOR_BOX.x1)/2, cy:(KOR_BOX.y0+KOR_BOX.y1)/2 })
};
function mapZoom(){ return (G&&G.mapZoom)||1; }
function activeMapView(){ return { zoom:mapZoom(), x:(G&&G.mapPan?G.mapPan.x:0), y:(G&&G.mapPan?G.mapPan.y:0) }; }
/* 창이 지도 밖으로 나가지 않게 잡아 둔다 */
function clampPan(){
  if(!G||!G.mapPan) return;
  const z=mapZoom(), vw=VIEW.w/z, vh=VIEW.h/z;
  G.mapPan.x=clamp(G.mapPan.x, Math.min(0, MAP_GEO.width-vw), Math.max(0, MAP_GEO.width-vw));
  G.mapPan.y=clamp(G.mapPan.y, Math.min(0, MAP_GEO.height-vh), Math.max(0, MAP_GEO.height-vh));
}
/* 가운데를 정해 창을 옮긴다 */
function centerMap(cx,cy){
  const z=mapZoom();
  G.mapPan={ x:cx-VIEW.w/(2*z), y:cy-VIEW.h/(2*z) };
  clampPan();
}
function setMapPreset(name){
  const p=(MAP_PRESETS[name]||MAP_PRESETS.korea)();
  G.mapZoom=clamp(p.zoom, MAP_ZOOM_MIN, MAP_ZOOM_MAX);
  G.mapFocus=name;
  centerMap(p.cx, p.cy);
}
/* 짚은 자리를 붙들고 당긴다 — 커서 밑의 땅이 그대로 커서 밑에 남는다 */
function zoomAt(sx, sy, factor){
  if(!G||!G.mapPan) return;
  const before=mapScreenToLocal(sx,sy);
  const z0=mapZoom();
  G.mapZoom=clamp(z0*factor, MAP_ZOOM_MIN, MAP_ZOOM_MAX);
  if(G.mapZoom===z0) return;
  if(before){
    G.mapPan.x=before.x-(sx-VIEW.x)/G.mapZoom;
    G.mapPan.y=before.y-(sy-VIEW.y)/G.mapZoom;
  }
  G.mapFocus= G.mapZoom<=MAP_ZOOM_MIN+0.02? 'all' : 'free';
  clampPan();
}
function overMap(x,y){
  return x>=VIEW.x && y>=VIEW.y && x<=VIEW.x+VIEW.w && y<=VIEW.y+VIEW.h;
}
function mapScreenToLocal(x,y){
  if(!overMap(x,y)) return null;
  const V=activeMapView();
  return {x:(x-VIEW.x)/V.zoom+V.x,y:(y-VIEW.y)/V.zoom+V.y};
}
function beginMapView(g){
  const V=activeMapView();
  g.save(); g.beginPath(); g.rect(VIEW.x,VIEW.y,VIEW.w,VIEW.h); g.clip();
  // 흔들림 — 싸움이 붙으면 지도만 흔든다. 판과 단추까지 흔들면 누르기가 어렵다.
  if(SHAKE>0.001){
    const a=SHAKE*SHAKE*5;
    g.translate((Math.random()-0.5)*a, (Math.random()-0.5)*a);
  }
  // 창은 화면 어디에나 놓일 수 있지만, 그 안의 좌표계는 늘 MAP_O 를 원점으로 한다
  g.translate(VIEW.x,VIEW.y); g.scale(V.zoom,V.zoom); g.translate(-MAP_O.x-V.x,-MAP_O.y-V.y);
  return V;
}

function ensureMapVis(){
  if(MAPVIS) return;
  if(!window.MAP_GEO) throw new Error('assets/map_geo.js를 불러오지 못했습니다.');
  const regions={}, prov={}, rect={}, provOutline={}, anchors={};
  PROVDEF.forEach(P=>{ if(!MAP_GEO.regions[P.id]) throw new Error('지도 권역 누락: '+P.id); });
  Object.entries(MAP_GEO.regions).forEach(([id,data])=>{
    const path=new Path2D(data.d);
    regions[id]={...data,path}; prov[id]=path; rect[id]=path; provOutline[id]=path;
    anchors[id]={x:CFG.GX+data.label[0],y:CFG.GY+data.label[1]};
    if(G&&G.provs[id]){ G.provs[id]._path=path; G.provs[id].cx=data.label[0]; G.provs[id].cy=data.label[1]; }
  });
  const boundaries=MAP_GEO.borders.map(b=>({...b,path:new Path2D(b.d)}));
  MAPVIS={land:new Path2D(MAP_GEO.coast),regions,prov,rect,provOutline,anchors,
    inner:new Path2D(MAP_GEO.borders.map(b=>b.d).join('')),boundaries};
}

function rebuildMapBase(){
  ensureMapVis();
  const c=document.createElement('canvas'); c.width=CFG.W; c.height=CFG.H;
  const g=c.getContext('2d'), W=MAP_GEO.width, H=MAP_GEO.height;
  const sea=g.createLinearGradient(CFG.GX,CFG.GY,CFG.GX+W,CFG.GY+H);
  sea.addColorStop(0,'#071923'); sea.addColorStop(.52,'#0b2a38'); sea.addColorStop(1,'#123d4a');
  g.fillStyle=sea; g.fillRect(CFG.GX,CFG.GY,W,H);
  g.save(); g.translate(CFG.GX,CFG.GY); g.lineJoin='round'; g.lineCap='round';
  [[24,'rgba(66,120,132,.065)'],[13,'rgba(93,146,150,.095)'],[5,'rgba(179,197,180,.15)']].forEach(([w,col])=>{
    g.strokeStyle=col; g.lineWidth=w; g.stroke(MAPVIS.land);
  }); g.restore();
  g.save(); g.beginPath(); g.rect(CFG.GX,CFG.GY,W,H); g.clip();
  for(let i=0;i<34;i++){
    const q=hash2(i,13), q2=hash2(i,29), x=CFG.GX+q*W, y=CFG.GY+q2*H;
    const len=28+hash2(i,47)*70, rise=(hash2(i,61)-.5)*5;
    g.strokeStyle='rgba(137,184,190,'+(0.018+hash2(i,73)*0.025)+')'; g.lineWidth=.65;
    g.beginPath(); g.moveTo(x,y); g.quadraticCurveTo(x+len*.25,y-2+rise,x+len*.5,y);
    g.quadraticCurveTo(x+len*.75,y+2-rise,x+len,y); g.stroke();
  } g.restore();
  g.save(); g.translate(CFG.GX,CFG.GY);
  g.save(); g.shadowColor='rgba(0,0,0,.52)'; g.shadowBlur=5; g.shadowOffsetY=2;
  g.fillStyle='#415042'; g.fill(MAPVIS.land,'evenodd'); g.restore();
  if(hasAsset('relief')){
    g.save(); g.clip(MAPVIS.land,'evenodd'); g.filter='saturate(.96) contrast(1.04)';
    g.drawImage(ASSETS.img.relief,0,0,W,H); g.filter='none';
    const shade=g.createLinearGradient(0,0,W,H);
    shade.addColorStop(0,'rgba(244,226,164,.035)'); shade.addColorStop(1,'rgba(8,24,27,.12)');
    g.fillStyle=shade; g.fillRect(0,0,W,H); g.restore();
  }else{
    Object.values(G.provs).forEach(P=>{ g.fillStyle=TERR[P.t].col; g.fill(MAPVIS.rect[P.id],'evenodd'); });
  }
  g.restore(); MAPBASE=c;
}

function ensureCloudLayer(){
  if(MAPCLOUDS) return;
  const c=document.createElement('canvas'); c.width=MAP_GEO.width; c.height=MAP_GEO.height;
  const g=c.getContext('2d');
  [[555,408,.92],[800,386,1.02]].forEach(([cx,cy,s],cluster)=>{
    for(let i=0;i<14;i++){
      const a=hash2(cluster*31+i,401)*Math.PI*2, d=hash2(cluster*31+i,409)*44*s;
      const x=cx+Math.cos(a)*d, y=cy+Math.sin(a)*d*.42, r=(16+hash2(i,cluster+419)*30)*s;
      const cloud=g.createRadialGradient(x-r*.2,y-r*.15,r*.08,x,y,r);
      cloud.addColorStop(0,'rgba(244,241,222,.18)'); cloud.addColorStop(.55,'rgba(224,231,220,.10)');
      cloud.addColorStop(1,'rgba(214,228,222,0)'); g.fillStyle=cloud; g.fillRect(x-r,y-r,r*2,r*2);
    }
  }); MAPCLOUDS=c;
}

/* 어느 고을을 짚었는가.
   좁은 섬을 손가락으로 찍기는 어렵다. 그래서 이름표에서 가장 가까운 고을을 먼저 보고,
   그것이 없을 때만 실제 경계 안쪽인지 따진다. 잡히는 반경은 손가락이냐 마우스냐와
   화면이 얼마나 줄어 있느냐에 따라 달라진다. */
function provinceAtPoint(x,y){
  const point=mapScreenToLocal(x,y); if(!point) return null;
  ensureMapVis(); const lx=point.x, ly=point.y, V=activeMapView();
  const cssScale=Math.max(.1,cv.getBoundingClientRect().width/CFG.W);
  const hitRadius=clamp((Mouse.touch?28:15)/cssScale,Mouse.touch?24:14,Mouse.touch?88:38);
  let nearest=null, nearestDistance=Infinity;
  for(const [id,R] of Object.entries(MAPVIS.regions)){
    const distance=Math.hypot(lx-R.label[0],ly-R.label[1])*V.zoom;
    const radius=hitRadius*(R.small?1.12:1);
    if(distance<=radius&&distance<nearestDistance){ nearest=id; nearestDistance=distance; }
  }
  if(nearest) return nearest;
  for(const [id,R] of Object.entries(MAPVIS.regions)){
    const b=R.bbox;
    if(lx>=b[0]&&ly>=b[1]&&lx<=b[2]&&ly<=b[3]&&ctx.isPointInPath(R.path,lx,ly,'evenodd')) return id;
  }
  return null;
}

function drawMap(g){
  const C=CFG.CELL, MW=VIEW.w, MH=VIEW.h, political=G.mapMode==='political';
  ensureMapBase(); G.hover=provinceAtPoint(Mouse.x,Mouse.y);
  const mapView=beginMapView(g), inv=1/mapView.zoom;
  g.drawImage(MAPBASE,0,0); drawSeaRoutes(g);
  g.save(); g.translate(CFG.GX,CFG.GY); g.clip(MAPVIS.land,'evenodd');
  Object.values(G.provs).forEach(P=>{
    g.globalAlpha=political?.50:.14; g.fillStyle=natColOf(P); g.fill(MAPVIS.rect[P.id],'evenodd');
  }); g.globalAlpha=1;
  if(G.view==='unrest') Object.values(G.provs).forEach(P=>{
    g.fillStyle='rgba(157,59,50,'+(P.unrest/100*.42)+')'; g.fill(MAPVIS.rect[P.id],'evenodd');
  });
  if(G.sel&&G.provs[G.sel]){ g.fillStyle='rgba(248,232,172,.11)'; g.fill(MAPVIS.rect[G.sel],'evenodd'); }
  if(G.hover&&G.provs[G.hover]&&G.hover!==G.sel){ g.fillStyle='rgba(244,239,220,.08)'; g.fill(MAPVIS.rect[G.hover],'evenodd'); }
  g.restore();

  g.save(); g.translate(CFG.GX,CFG.GY); g.lineCap='round'; g.lineJoin='round';
  g.strokeStyle=political?'rgba(43,39,29,.47)':'rgba(34,36,29,.34)'; g.lineWidth=.72*inv; g.stroke(MAPVIS.inner); g.restore();
  const nationEdge=new Path2D();
  MAPVIS.boundaries.forEach(e=>{ if(G.provs[e.a].nat!==G.provs[e.b].nat) nationEdge.addPath(e.path); });
  g.save(); g.translate(CFG.GX,CFG.GY); g.lineCap='round'; g.lineJoin='round';
  g.strokeStyle='rgba(5,9,11,.63)'; g.lineWidth=3.5*inv; g.stroke(nationEdge);
  g.strokeStyle='rgba(224,213,174,.63)'; g.lineWidth=1.35*inv; g.stroke(nationEdge);
  g.shadowColor='rgba(0,0,0,.42)'; g.shadowBlur=4*inv; g.strokeStyle='rgba(5,16,21,.76)'; g.lineWidth=3.3*inv; g.stroke(MAPVIS.land);
  g.shadowBlur=0; g.strokeStyle='rgba(220,211,168,.58)'; g.lineWidth=.9*inv; g.stroke(MAPVIS.land); g.restore();

  if(G.sel&&MAPVIS.provOutline[G.sel]){
    g.save(); g.translate(CFG.GX,CFG.GY); g.shadowColor='rgba(172,190,247,.35)'; g.shadowBlur=7;
    g.strokeStyle='#e7e0f0'; g.lineWidth=2*inv; g.stroke(MAPVIS.provOutline[G.sel]); g.restore();
  }
  if(G.hover&&G.hover!==G.sel&&MAPVIS.provOutline[G.hover]){
    g.save(); g.translate(CFG.GX,CFG.GY); g.strokeStyle='rgba(255,244,203,.82)'; g.lineWidth=1.1*inv;
    g.stroke(MAPVIS.provOutline[G.hover]); g.restore();
  }
  if(!political){ ensureCloudLayer(); g.save(); g.globalAlpha=.68; g.drawImage(MAPCLOUDS,CFG.GX,CFG.GY); g.restore(); }
  // 확대하면 큰 국호는 화면 밖으로 나가 조각만 보인다. 그때는 걷는다.
  const 당김 = mapView.zoom>1.2;
  if(!당김) drawCountryLabels(g);

  /* ── 고을 — 이름표보다 먼저 선다 ──
     보이는 자리의 것만 그린다. 마흔둘을 늘 다 그리면 손전화가 버겁다. */
  {
    const V=activeMapView(), z=V.zoom;
    const x0=V.x-4, y0=V.y-4, x1=V.x+VIEW.w/z+4, y1=V.y+VIEW.h/z+4;
    // 마을은 뭍에만 선다 — 논이 바다로 흘러나가지 않게 해안선으로 자른다
    g.save(); g.translate(CFG.GX,CFG.GY); g.clip(MAPVIS.land,'evenodd'); g.translate(-CFG.GX,-CFG.GY);
    Object.values(G.provs).forEach(P=>{
      const R=MAPVIS.regions[P.id]; if(!R) return;
      const c=R.anchor;
      if(c[0]<x0||c[0]>x1||c[1]<y0||c[1]>y1) return;
      drawTown(g, P, z);
    });
    g.restore();
  }

  Object.values(G.provs).forEach(P=>{
    const R=MAPVIS.regions[P.id], a=MAPVIS.anchors[P.id], cx=a.x, cy=a.y;
    P.cx=R.label[0]; P.cy=R.label[1];
    const showName=(당김&&P.nat==='kor')||!political||P.cap||P.id===G.sel||P.id===G.hover;
    if(showName){
      const ax=CFG.GX+R.anchor[0], ay=CFG.GY+R.anchor[1];
      if(!political&&Math.hypot(cx-ax,cy-ay)>9){
        g.strokeStyle='rgba(221,214,190,.34)'; g.lineWidth=.55*inv; g.beginPath(); g.moveTo(ax,ay); g.lineTo(cx,cy-3); g.stroke();
      }
      // 글자는 확대에 그대로 딸려 커지면 안 된다 — 화면에서 늘 비슷한 크기로 보이게 줄여 둔다.
      // 확대했을 때 이웃 나라 이름까지 크게 쓰면 요동과 평북이 붙어 한 낱말로 읽힌다.
      // 우리 고을은 크게, 이웃은 화면에서 작게 — 봐야 할 것과 알아만 둘 것을 가른다.
      const 밑크기=R.small?8.5:9.5, z=mapView.zoom;
      const 화면크기 = 밑크기 * (P.nat==='kor'? clamp(1+(z-1)*0.4, 1, 1.8)
                                              : clamp(1+(z-1)*0.1, 1, 1.2));
      const labelSize = 화면크기/z;
      const label=MAP_NAMES[P.id]||P.nm;
      g.textAlign='center'; g.font=(R.small?'':'600 ')+labelSize+'px serif';
      if(P.id===G.sel){
        const labelWidth=g.measureText(label).width+labelSize*1.1;
        g.fillStyle='rgba(31,27,24,.9)'; g.fillRect(cx-labelWidth/2,cy-labelSize*1.15,labelWidth,labelSize*1.55);
        g.strokeStyle='rgba(244,224,165,.9)'; g.lineWidth=1.1*inv;
        g.strokeRect(cx-labelWidth/2,cy-labelSize*1.15,labelWidth,labelSize*1.55);
      }
      g.lineWidth=2.3*inv; g.strokeStyle='rgba(7,12,13,.84)'; g.strokeText(label,cx,cy);
      g.fillStyle = P.id===G.sel? '#fff1bc'
                  : (P.nat==='kor' && !isCore(P))? '#d8b36a'   // 점령지는 눈에 띄게
                  : '#eee4cd';
      g.fillText(label,cx,cy);
    }
    /* 도읍 표 — 마을이 보이는 배율에서는 궁의 지붕이 이미 서 있다.
       그 위에 금빛 점을 또 찍으면 애써 그린 마을을 제가 덮는다.
       멀리서 볼 때만 점으로 알린다. */
    if(P.cap && mapView.zoom<1.5){
      const cap=R.capital||[R.label[0],R.label[1]-10], qx=CFG.GX+cap[0], qy=CFG.GY+cap[1];
      g.fillStyle='#d7b66f'; g.strokeStyle='rgba(20,17,14,.95)'; g.lineWidth=1.1*inv; g.beginPath();
      g.arc(qx,qy,3.3/Math.sqrt(mapView.zoom),0,Math.PI*2); g.fill(); g.stroke();
    } else if(P.cap){
      // 가까이서는 궁 둘레에 옅은 빛만 — 숨 쉬듯 뛴다
      const q=MAPVIS.regions[P.id];
      const qx=CFG.GX+q.anchor[0], qy=CFG.GY+q.anchor[1];
      const u2=1.15*townScale(P);
      const a2=0.13+Math.sin(NOW*1.5)*0.05;
      g.fillStyle='rgba(224,189,118,'+Math.max(0,a2).toFixed(3)+')';
      g.beginPath(); g.ellipse(qx,qy,u2*2.3,u2*1.45,0,0,7); g.fill();
    }
    // 어지러움·수령 표는 이름 옆에 붙어 있어야 한다.
    // 자리까지 확대에 딸려 가면 이름에서 멀찍이 떨어져 누구 것인지 알 수 없다.
    if(showName&&P.unrest>55){ g.fillStyle=PAL.red; g.beginPath(); g.arc(cx+14*inv,cy-3*inv,2.5*inv,0,7); g.fill(); }
    if(showName&&officialAt(P.id)){ g.fillStyle='rgba(113,190,125,.9)'; g.beginPath(); g.arc(cx-14*inv,cy-3*inv,2.3*inv,0,7); g.fill(); }
    g.textAlign='left';
  });

  if(FX.length) drawFX(g, inv);
  g.restore();

  hz(VIEW.x,VIEW.y,MW,MH,()=>{ const id=provinceAtPoint(Mouse.x,Mouse.y); if(id){ G.sel=id; snd('pick'); } });
  drawMapModeControl(g);
  drawMapFocusControl(g);
  g.strokeStyle='rgba(224,189,118,.28)'; g.lineWidth=1; g.strokeRect(VIEW.x+.5,VIEW.y+.5,MW-1,MH-1);

  /* 세력 표는 단추 앞에서 멈춘다.
     자리를 정해 놓고 밀어 넣으면 좁은 판에서 단추 밑으로 기어들어 간다. */
  const 보기w = LAY.small?116:150, 보기x = VIEW.x+MW-보기w;
  let lx=VIEW.x+6, ly=VIEW.y+MH+16, 뺀수=0; g.font='11px serif';
  /* 이웃끼리의 판을 맨 앞에 세운다 — 탭을 열지 않아도 보여야 하는 소식이고,
     고을 수보다 큰 소식이다. 좁은 판에서는 이것이 먼저 자리를 잡는다. */
  const C0=G.cj;
  if(C0 && (C0.war||C0.ally)){
    const 글=natName('chn')+'↔'+natName('jpn')+(C0.war? ' 전쟁':' 동맹');
    const 폭=g.measureText(글).width+14;
    g.fillStyle= C0.war? 'rgba(143,168,106,.95)' : '#c4534a';
    g.fillText(글, lx, ly);
    if(inRect(Mouse,{x:lx-4,y:ly-12,w:폭,h:16}))
      G.tip = C0.war? '두 나라가 서로 싸운다. 조선을 향한 발길이 뜸한 동안이다 — 지금이 틈이다.'
                    : '두 나라가 손을 잡았다. 조선이 사이에 끼었다. 외교 탭에서 이간으로 벌려 놓을 수 있다.';
    lx+=폭;
  }
  Object.keys(NATIONS).forEach(k=>{
    const n=natProvs(k).length; if(!n) return;
    const 글=natName(k)+' '+n, 폭=22+g.measureText(글).width+(LAY.small?12:22);
    if(lx+폭 > 보기x-8){ 뺀수++; return; }
    if(!blit(g,'flags',NAT_UV[k],lx,ly-11,48,32,18,12)){ g.fillStyle=NATIONS[k].col; g.fillRect(lx,ly-9,12,10); }
    g.fillStyle='#c9bfa8'; g.fillText(글,lx+22,ly); lx+=폭;
  });
  if(뺀수){
    g.fillStyle='rgba(150,145,135,.75)'; g.fillText('+'+뺀수, lx, ly);
    if(inRect(Mouse,{x:lx-4,y:ly-12,w:34,h:16}))
      G.tip='자리가 좁아 '+뺀수+'세력을 접어 두었다. 지도를 눌러 보면 어느 세력인지 나온다.';
  }
  btn(g,보기x,ly-16,보기w,22,G.view==='unrest'?'보기 · 민심':'보기 · 세력',false,
      ()=>{G.view=G.view==='unrest'?'nat':'unrest';});
}

/* 오른쪽 패널 */
const TABS=['국정','외교','기술','신하','정책','기록'];
const SCROLL={};                 // 탭마다 굴린 만큼 기억한다
function drawSide(g){
  const x=LAY.side.x, y=LAY.side.y, w=LAY.side.w, h=LAY.side.h;
  // 맨 위가 탭이라 머리 장식은 가려지거나 삐져나온다
  panel(g,x,y,w,h,null,{head:false});
  // 탭
  const tw=(w-16)/TABS.length;
  TABS.forEach((t,i)=>{
    btn(g, x+8+i*tw, y+8, tw-4, 26, t, G.tab===t, ()=>{ G.tab=t; });
  });
  const cx=x+12, cy=y+46, cw=w-24, ch=h-46-8;

  // 굴림 — 이 패널 위에 손가락/휠이 있을 때만
  const 굴점 = (Mouse.wheelX!=null)? {x:Mouse.wheelX,y:Mouse.wheelY} : Mouse;
  const 안 = inRect(굴점,{x:x,y:cy-8,w:w,h:ch+8});
  const key=G.tab;
  let sc = SCROLL[key]||0;
  if(안 && Mouse.wheel){ sc += Mouse.wheel; }
  const max = Math.max(0, (SCROLL['_h_'+key]||0) - ch + 20);
  sc = clamp(sc, 0, max);
  SCROLL[key]=sc;

  const h0=HIT.length;
  g.save();
  g.beginPath(); g.rect(x+2, cy-10, w-4, ch+10); g.clip();
  const 끝 = (G.tab==='국정')? sideState(g,cx,cy-sc,cw)
           : (G.tab==='외교')? sideDiplomacy(g,cx,cy-sc,cw)
           : (G.tab==='기술')? sideTech(g,cx,cy-sc,cw)
           : (G.tab==='신하')? sideOfficials(g,cx,cy-sc,cw)
           : (G.tab==='정책')? sidePolicy(g,cx,cy-sc,cw)
           :                   sideLog(g,cx,cy-sc,cw);
  g.restore();
  SCROLL['_h_'+key] = (끝||0) - (cy-sc);      // 이번에 그린 내용의 실제 높이
  // 밖으로 밀려난 줄은 눌리지 않아야 한다
  for(let i=HIT.length-1;i>=h0;i--){
    const z=HIT[i], mid=z.y+z.h/2;
    if(mid<cy-10 || mid>cy+ch) HIT.splice(i,1);
  }

  // 굴림 막대
  if(max>0){
    const bh=Math.max(28, ch*ch/(ch+max));
    const by=cy + (ch-bh)*(sc/max);
    g.fillStyle='rgba(190,158,96,.10)'; g.fillRect(x+w-6, cy, 3, ch);
    g.fillStyle='rgba(190,158,96,.55)'; g.fillRect(x+w-6, by, 3, bh);
  }
}
function sideState(g,x,y,w){

  /* ── 이번 해에 할 일 ── */

    yy+=20;
  });
  yy+=10;
  /* 조정의 일 — 고을을 고르지 않아도 되는 명령 */

  NATIONALS.forEach(a=>{
    const 손=(N.adm||0)>=a.adm, 별칙=!손;

    const 돈=N.gold>=c, can=돈&&!G.ended;

      can? ()=>{ N.gold-=c; if(별칙) byeolPay(); else N.adm-=a.adm; a.run(); recalc(); } : null, !can);
    g.fillStyle= can?(별칙?'#c48c4a':'#e0bd76'):'rgba(90,86,80,.6)'; g.font='11px serif'; g.textAlign='right';

    g.fillStyle='rgba(120,115,105,.8)'; g.font='9px serif';
    g.fillText(별칙? ('별칙 x'+byeolMul().toFixed(1)) : ('정무 '+a.adm), x+w, yy+24); g.textAlign='left';
    if(inRect(Mouse,{x:x,y:yy,w:w-72,h:26}))
      G.tip = a.desc() + (돈? (별칙? '  ·  별칙 — 값 '+byeolMul().toFixed(1)+'배, 신하 충성 −3' : '') : '  · 국고가 모자란다');
    yy+=32;

  const 재직=G.officials.filter(o=>o.post);

  g.fillText('조정 자리의 몫', x+w, yy); g.textAlign='left';
  yy+=8;
  붕당.forEach(f=>{
    yy+=20;
    const 자리=재직.filter(o=>o.fac===f).length;
    const 센가=G.factions[f]>고름+22;
    g.fillStyle='#c9bfa8'; g.font='12px serif'; g.fillText(f, x, yy);
    bar(g, x+50, yy-9, w-104, 10, G.factions[f]/100, 센가?'#c4534a':'#7d94b8');
    g.fillStyle='rgba(180,175,160,.8)'; g.font='10px serif'; g.textAlign='right';
    g.fillText(Math.round(G.factions[f])+'', x+w, yy);

function autoAssign(){
  const empty=natProvs('kor').filter(p=>!officialAt(p.id));
  if(!empty.length){ log('빈 고을이 없소.'); return; }
  let n=0;
  empty.forEach(p=>{
    let o=G.officials.find(x=>!x.post);
    if(!o){                                  // 사람이 모자라면 등용까지 알아서 (있는 돈 안에서)
      if(G.pool.length && G.nations.kor.gold>=40){
        o=G.pool.shift(); G.nations.kor.gold-=40; G.officials.push(o);
      } else return;
    }
    // 세력은 해마다 자리의 몫에서 다시 셈한다 — 여기서 따로 더하지 않는다
    o.post=p.id; n++;
  });
  log(n? (n+'개 고을에 수령을 보냈다.') : '보낼 사람이 없소.');
  if(n) snd('pick');
}

function assign(o){
  if(!G.sel){ log('먼저 고을을 고르시오.'); return; }

  if(P.nat!=='kor'){ log('우리 고을이 아니오.'); return; }

  o.post=P.id;

}
function recruit(o){
  const N=G.nations.kor;
  if(N.gold<40){ log('국고가 모자라오.'); return; }
  N.gold-=40; G.pool=G.pool.filter(x=>x!==o); G.officials.push(o);
  log(o.nm+을를(o.nm)+' 등용했다.');
}
function conflictOf(id){
  const out=[];
  POL_CONFLICT.forEach(([a,b])=>{
    if(a===id && G.policies.includes(b)) out.push(b);
    if(b===id && G.policies.includes(a)) out.push(a);
  });
  return out;
}

function togglePolicy(P){
  const N=G.nations.kor;
  if(G.policies.includes(P.id)){
    G.policies=G.policies.filter(i=>i!==P.id);
    if(G.polSince) delete G.polSince[P.id];
    log(P.nm+을를(P.nm)+' 거두었다.'); return;
  }
  if(G.era<P.era){ log('아직 이를 논할 때가 아니오.'); return; }
  const clash=conflictOf(P.id);
  if(clash.length){ log(clash.map(polName).join('·')+을를(clash.map(polName).join('·'))+' 두고 '+P.nm+을를(P.nm)+' 함께 펼 수는 없소.'); return; }
  if(G.policies.length>=3){ log('정책은 셋까지요.'); return; }
  if(N.gold<P.cost){ log('국고가 모자라오.'); return; }
  N.gold-=P.cost; G.policies.push(P.id);
  (G.polSince||(G.polSince={}))[P.id]=G.year;
  if(P.id==='chagwan'){ N.gold+=400; log('차관을 들여왔다. 국고에 400전이 들어왔다.'); }
  log(P.nm+을를(P.nm)+' 시행한다.'); snd('treaty');
}

        const why = G.era<t.era? (ERAS[t.era].nm+' 이후') : (prev? prev.nm+' 다음' : '');
        g.fillText('· '+t.nm+'  — '+why, x+2, yy+15);
      }
      yy+=rowH;
    });
    yy+=14;
  });
  return yy;
}

function sideLog(g,x,y,w){
  g.fillStyle='#e0bd76'; g.font='13px serif'; g.fillText('기록', x, y+12);
  let yy=y+34;
  /* ── 지나간 치세 ──
     한 해 한 해의 잔글씨보다, 누가 얼마를 다스렸고 사관이 무어라 적었는지가
     판을 돌아볼 때 남는 것이다. 그래서 맨 위에 둔다. */
  const 치=(G.reigns||[]);
  if(치.length){
    g.fillStyle='rgba(150,145,135,.7)'; g.font='10px serif';
    g.fillText('지나간 치세 '+치.length, x, yy-6);
    yy+=8;
    const 빛={성세:'#8fa86a', 치세:'#e0bd76', 평세:'#c9bfa8', 난세:'#c9a24a', 망조:'#c4534a'};
    치.slice().reverse().forEach(R=>{
      const hov=inRect(Mouse,{x:x-4,y:yy-12,w:w+8,h:34});
      if(hov){ g.fillStyle='rgba(190,150,80,.12)'; g.fillRect(x-4,yy-12,w+8,34); G.tip=R.글; }
      g.fillStyle=빛[R.등급]||'#c9bfa8'; g.fillRect(x-4, yy-10, 2, 26);
      g.fillStyle='#e8e1d1'; g.font='13px serif'; g.fillText(R.나, x+6, yy);
      g.fillStyle='rgba(150,145,135,.75)'; g.font='10px serif';
      g.fillText(R.y0+'–'+R.y1+'  '+R.해+'년', x+6+g.measureText(R.나).width+10, yy);
      g.fillStyle=빛[R.등급]||'#c9bfa8'; g.font='12px serif'; g.textAlign='right';
      g.fillText(R.등급, x+w, yy); g.textAlign='left';
      g.fillStyle='rgba(140,135,125,.8)'; g.font='9px serif';
      const 짧 = R.글.length>44? R.글.slice(0,43)+'…' : R.글;
      g.fillText(짧, x+6, yy+13);
      yy+=34;
    });
    divider(g,x,yy-6,w); yy+=14;
    g.fillStyle='rgba(150,145,135,.7)'; g.font='10px serif';
    g.fillText('해마다', x, yy-6); yy+=8;
  }
  G.log.slice(0,60).forEach(L=>{
    g.fillStyle='rgba(150,145,135,.6)'; g.font='10px serif'; g.fillText(L.y+'', x, yy);
    g.fillStyle='#c9bfa8'; g.font='12px serif';
    const words=L.s; let line='', out=[];
    for(const ch of words){ if(g.measureText(line+ch).width>w-40){ out.push(line); line=ch; } else line+=ch; }
    out.push(line);
    out.slice(0,2).forEach((t,i)=>{ g.fillText(t, x+34, yy+i*14); });
    yy+=Math.max(18, out.slice(0,2).length*14+6);
  });
  return yy+10;
}

    /* 이 고을이 실제로 얼마나 버티는가.

       어디에도 보이지 않았다. 사만을 가지고도 성이 밀리는 것처럼 보인 까닭이다. */
    let 수비=null, 위태=false, 위협=0, 위협처=null, 원군=0;

           *mods().defKor*(1+techOf('kor')/220);

    const 수치=[['인구',짧?numS(P.pop):num(P.pop)],['개발',P.dev],['농지',P.farm],['상업',P.trade],

    const 칸너비 = 좁? (w-24)/열수 : 0;
    const 최소칸 = LAY.small? 52 : 64;

            + ' = 병력 '+num(P.army)+' + 원군 '+num(Math.round(원군))
            + (위협처? ('  ·  '+위협처.nm+'이 치면 '+Math.round(winChance(위협,수비)*100)+'%') : '');
        return;

      g.font='10px serif'; const lw=g.measureText(k).width;
      g.fillStyle= col&&위태&&k==='수비'? '#c4534a' : 'rgba(150,145,135,.75)';
      g.fillText(k, sx, y+22);
      g.font='14px serif'; const vw=g.measureText(v+'').width;
      g.fillStyle= col||'#e8e1d1'; g.fillText(v+'', sx, y+40);
      const nw=note? (g.font='9px serif', g.measureText(note).width) : 0;
      if(note){ g.fillStyle='#c4534a'; g.fillText(note, sx, y+51); }
      if(k==='수비' && inRect(Mouse,{x:sx-4,y:y+12,w:Math.max(70,vw+26),h:44}))
        G.tip = '이 고을이 실제로 버티는 힘 '+num(Math.round(수비))
          + '  =  병력 '+num(P.army)+' + 이웃의 원군 '+num(Math.round(원군))
          + '  ×  지형 '+TERR[P.t].def.toFixed(2)+' × 성곽 '+(1+P.fort*0.16).toFixed(2)
          + ' × 병종 '+unitOf(P).def.toFixed(2)
          + (위협처? ('    ·  가장 센 이웃 '+위협처.nm+이가(위협처.nm)+' 치면 '+위협처.nm+'의 이길 낌새 '

    if(좁){

    }
    // 명령
    const N=G.nations.kor;
    const 열 = LAY.phone? 3 : ACTIONS.length;
    /* 판이 좁으면 단추도 같이 좁힌다. 116 을 고집하면 줄이 판을 넘어가
       오른쪽 정무 구슬 위로 올라탄다 — 눕힌 손전화가 그랬다. */
    const 단추w = LAY.phone? (w-24-(열-1)*6)/열
                           : Math.min(116, (w-30-(열-1)*6)/열);
    const 단추간 = 단추w+6;

    let bx=x+16, by=LAY.phone? y+132 : y+58;
    ACTIONS.forEach((a,ai)=>{
      if(LAY.phone){ const r=Math.floor(ai/열); bx=x+12+(ai%열)*단추간; by=(y+132)+r*줄높이; }

             : ok? (돈? (별칙? '  ·  정무를 다 썼다. 별칙으로 밀어붙이면 값이 '+byeolMul().toFixed(1)+'배, 신하 충성 −3, 민심 −0.6' : '')

                 : '  · 지금은 할 수 없다');
      if(!LAY.phone) bx+=단추간;
    });
  }
  // 정무와 한 해 보내기
  const N=G.nations.kor;
  /* 좁은 판에서는 이름표와 구슬을 왼쪽 아래에 세운다.
     오른쪽 끝에 붙이면 명령 단추 줄과 겹친다. */

     '한 해를 보낸다'는 오른쪽에 둔다 — 엄지가 닿는 자리다. */
  const 끝 = 좁2? x+12 : x+w-14;

  g.textAlign=좁2?'left':'right'; g.font='10px serif';
  g.fillStyle= 남? 'rgba(150,145,135,.85)':'rgba(196,140,74,.95)';
  g.fillText(남? ((좁2?'남은 정무':'올해 남은 정무')+(mx>12? ' (+'+(mx-12)+')' : ''))
                : ('정무를 다 썼다'+(좁2?'':' · 별칙 '+byeolCount()+'회')),
             끝, 좁2? y+h-32 : y+66);
  g.textAlign='left';
  for(let i2=0;i2<알;i2++){
    const on=i2<남;
    g.fillStyle= on?'#e0bd76':'rgba(90,86,80,.5)';
    g.beginPath(); g.arc(시작+i2*간+간/2, 좁2? y+h-16 : y+82, r, 0, 7); g.fill();
  }

function wrapText(g,t,maxw){
  const out=[]; let line='';
  for(const ch of t){ if(g.measureText(line+ch).width>maxw){ out.push(line); line=ch; } else line+=ch; }
  out.push(line); return out;
}

/* 재주를 사람 말로 — 숫자를 그대로 보여 주면 아무도 읽지 않는다 */
function traitLines(K){
  const 재=(K&&K.재)||{}, out=[];
  const 곱=(k,말)=>{ const v=재[k]; if(v==null||v===1) return;
    out.push([말+' '+(v>1?'+':'−')+Math.round(Math.abs(v-1)*100)+'%', v>1]); };
  const 더=(k,말)=>{ const v=재[k]; if(!v) return;
    out.push([말+' '+(v>0?'+':'−')+Math.abs(v).toFixed(1)+'/년', v>0]); };
  곱('학문','연구'); 곱('무','공격'); 곱('지킴','수비'); 곱('재정','국고');
  더('다스림','민심'); 더('그릇','정통');
  if(재.붕당) out.push(['당쟁 '+(재.붕당>0?'거세다':'잦아든다'), 재.붕당<0]);
  return out;
}

function slotKey(s){ return CFG.SAVE+'_'+s; }
function packSave(){
  const d={ ver:VERSION, at:G.year, year:G.year, era:G.era, turn:G.turn,
    mapMode:G.mapMode, mapFocus:G.mapFocus, mapZoom:G.mapZoom, mapPan:G.mapPan, diff:G.diff,
    provs:{}, nations:G.nations, officials:G.officials, pool:G.pool,
    factions:G.factions, policies:G.policies, polSince:G.polSince,
    scores:G.scores, legit:G.legit, usedPeople:G.usedPeople, ended:G.ended,
    /* 예전 판이 흘리던 것들 — 다시 불러오면 사라져 있던 상태 */
    evDone:G.evDone, evQueue:G.evQueue, pendingEvent:G.pendingEvent,
    res:G.res, dip:G.dip, cj:G.cj, byeol:G.byeol, saheWait:G.saheWait, tab:G.tab, sel:G.sel, view:G.view,
    king:G.king, gen:G.gen, genN:G.genN, edict:G.edict, reign:G.reign, reigns:G.reigns,
    pendingReign:G.pendingReign,
    log:G.log.slice(0,60) };
  Object.entries(G.provs).forEach(([k,P])=>{ d.provs[k]={nat:P.nat,pop:P.pop,dev:P.dev,
    farm:P.farm,trade:P.trade,fort:P.fort,unrest:P.unrest,army:P.army,rebel:P.rebel||0,
    home:P.home,assim:P.assim||0}; });
  // 칸 목록에 보여줄 요약
  d.sum={ y:G.year, era:ERAS[G.era].nm, prov:natProvs('kor').length,
          pop:G.nations.kor.pop, gold:G.nations.kor.gold, ended:!!G.ended };
  return d;
}
function saveGame(slot){
  try{ localStorage.setItem(slotKey(slot||'auto'), JSON.stringify(packSave())); return true; }
  catch(e){ log('저장하지 못했다.'); return false; }
}
function slotInfo(slot){
  try{
    const d=JSON.parse(localStorage.getItem(slotKey(slot))||'null');
    if(!d) return null;
    if(!saveUsable(d.ver)) return { bad:true, ver:d.ver };
    return d.sum || { y:d.year, era:ERAS[d.era]?ERAS[d.era].nm:'', prov:0, pop:0, gold:0 };
  }catch(e){ return null; }
}
function deleteSlot(slot){ try{ localStorage.removeItem(slotKey(slot)); }catch(e){} }
function loadGame(slot){
  try{
    const d=JSON.parse(localStorage.getItem(slotKey(slot||'auto'))||'null');
    if(!d || !saveUsable(d.ver)) return false;
    newGame();
    G.year=d.year; G.era=d.era; G.turn=d.turn;
    G.mapMode=MAP_MODE_PARAM?START_MAP_MODE:(d.mapMode||'terrain');
    G.mapFocus=MAP_FOCUS_PARAM?START_MAP_FOCUS:(d.mapFocus||'korea');
    if(MAP_FOCUS_PARAM || d.mapZoom==null) setMapPreset(G.mapFocus);
    else { G.mapZoom=clamp(d.mapZoom,MAP_ZOOM_MIN,MAP_ZOOM_MAX);
           G.mapPan={x:(d.mapPan&&d.mapPan.x)||0, y:(d.mapPan&&d.mapPan.y)||0}; clampPan(); }
    G.nations=d.nations; G.officials=d.officials; G.pool=d.pool;
    G.factions=d.factions; G.policies=d.policies; G.log=d.log||[];
    G.polSince=d.polSince||{}; G.scores=d.scores||[]; G.ended=!!d.ended;
    if(d.legit!=null) G.legit=d.legit;
    if(d.usedPeople) G.usedPeople=d.usedPeople;
    /* 사건·연구·외교 — 예전에는 이것들이 저장되지 않아 불러오면 처음으로 돌아갔다 */
    G.evDone=d.evDone||{}; G.evQueue=d.evQueue||[]; G.pendingEvent=d.pendingEvent||null;
    if(d.diff!=null) G.diff=clamp(d.diff,0,DIFFS.length-1);
    if(d.minorDone) G.minorDone=d.minorDone;
    if(d.res) G.res={ pt:d.res.pt||0, done:d.res.done||{}, gain:d.res.gain||0 };
    if(d.dip) DIP_NATS.forEach(k=>{ if(d.dip[k]) Object.assign(G.dip[k], d.dip[k]); });
    // 이웃끼리의 사이 — 0.6.0 이전 판에는 없다. 없으면 새 판의 자리에서 시작한다.
    if(d.cj) Object.assign(G.cj, d.cj);
    G.byeol=d.byeol||0; G.saheWait=d.saheWait||0;
    /* 임금과 치세 — 0.7.0 이전 판에는 없다. 없으면 그 해의 임금을 다시 앉힌다. */
    G.king = (d.king!==undefined)? d.king : (G.year<1910? kingAt(G.year) : -1);
    G.gen=d.gen||null; G.genN=d.genN||0; G.edict=d.edict||null;
    G.reign=d.reign|| { y0:G.year, prov0:natProvs('kor').length,
                        node0:Object.keys(G.res.done).length, legit0:Math.round(G.legit),
                        pop0:G.nations.kor.pop, stab:0, 해:0, 전쟁:0, 사화:0, 뺏김:0, 얻음:0 };
    G.reigns=d.reigns||[]; G.pendingReign=d.pendingReign||null;
    if(d.tab && TABS.includes(d.tab)) G.tab=d.tab;
    if(d.view) G.view=d.view;
    if(d.sel && d.sel in G.provs) G.sel=d.sel;
    Object.entries(d.provs).forEach(([k,v])=>{ if(G.provs[k]) Object.assign(G.provs[k],v); });
    recalc(); G.plateDirty=true;
    return true;
  }catch(e){ return false; }
}
function hasAnySave(){ return SLOTS.some(s=>!!slotInfo(s)); }

/* ================================================================
   기록 — 끝난 판만 남는다
   ----------------------------------------------------------------
   세이브는 버전이 바뀌면 버려지지만, 기록은 남는다.
   어느 판에서 어디까지 갔는지는 규칙이 바뀌어도 뜻이 있다.
   ================================================================ */
function loadRecords(){
  try{ const a=JSON.parse(localStorage.getItem(CFG.RECORDS)||'[]'); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function pushRecord(how){
  const tot=G.scores.reduce((a,s)=>a+s.pt,0);
  let at='';
  try{ at=new Date().toISOString().slice(0,10); }catch(e){}
  const r={ ver:VERSION, y:G.year, how, total:tot, at,
            prov:natProvs('kor').length, era:ERAS[G.era].nm,
            legit:Math.round(G.legit), tech:Math.round(G.nations.kor.tech),
            node:Object.keys(G.res.done).length };
  const all=loadRecords();
  all.push(r);
  all.sort((a,b)=> b.total-a.total || a.y-b.y);
  const top=all.slice(0,10);
  try{ localStorage.setItem(CFG.RECORDS, JSON.stringify(top)); }catch(e){}
  return { rank: top.indexOf(r)+1, top };
}
function clearRecords(){ try{ localStorage.removeItem(CFG.RECORDS); }catch(e){} }

function drawSlots(g, mode){
  const w=창폭(560), h=430, x=(CFG.W-w)/2, y=(CFG.H-h)/2;
  g.fillStyle='rgba(4,5,8,.80)'; g.fillRect(0,0,CFG.W,CFG.H);
  bigPanel(g,x,y,w,h);
  g.textAlign='center'; g.fillStyle='#e0bd76'; g.font='22px serif';
  g.fillText(mode==='save'?'저장하기':'불러오기', CFG.W/2, y+44);
  g.textAlign='left';
  let yy=y+72;
  SLOTS.forEach(s=>{
    const info=slotInfo(s), 자동=(s==='auto');
    const rh=62, rx=x+30, rw=w-60;
    const hov=inRect(Mouse,{x:rx,y:yy,w:rw-70,h:rh});
    g.fillStyle= hov?'rgba(190,150,80,.18)':'rgba(24,28,34,.8)';
    g.fillRect(rx,yy,rw,rh);
    g.strokeStyle= hov?'rgba(224,189,118,.85)':'rgba(190,158,96,.25)';
    g.lineWidth=1; g.strokeRect(rx+.5,yy+.5,rw-1,rh-1);

    g.fillStyle= 자동? 'rgba(150,145,135,.9)':'#e0bd76'; g.font='13px serif';
    g.fillText(자동? '자동 저장' : ('칸 '+s), rx+16, yy+24);
    g.font='12px serif';
    if(!info){
      g.fillStyle='rgba(95,90,83,.9)'; g.fillText('비어 있다', rx+16, yy+44);
    } else if(info.bad){
      g.fillStyle='#c4534a'; g.fillText('옛 판('+info.ver+') — 쓸 수 없다', rx+16, yy+44);
    } else {
      g.fillStyle='#e8e1d1'; g.font='16px serif';
      g.fillText(info.y+'년', rx+16, yy+46);
      g.fillStyle='rgba(150,145,135,.85)'; g.font='11px serif';
      g.fillText(info.era+' · 고을 '+info.prov+' · 인구 '+num(info.pop)+' · 국고 '+num(info.gold)
                 +(info.ended?'  · 끝난 판':''), rx+72, yy+46);
    }
    // 누르는 자리
    const 쓸수있나 = mode==='save'? !자동 : (info && !info.bad);
    if(쓸수있나){
      hz(rx,yy,rw-(info&&!자동?66:0),rh, ()=>{
        if(mode==='save'){
          if(info) 확인('덮어쓰기','칸 '+s+'의 '+(info.bad?'옛 판':info.y+'년')+' 위에 덮어쓴다.','덮어쓴다',
            ()=>{ saveGame(s); MENU=null; log('칸 '+s+'에 저장했다.'); });
          else { saveGame(s); MENU=null; log('칸 '+s+'에 저장했다.'); }
        } else {
          확인('불러오기', (자동?'자동 저장':'칸 '+s)+'의 '+info.y+'년으로 돌아간다. 지금 판은 사라진다.','불러온다',
            ()=>{ if(loadGame(s)){ SCENE='play'; MENU=null; log('불러왔다.'); } else log('불러오지 못했다.'); });
        }
      });
    } else if(mode==='save' && 자동){
      g.fillStyle='rgba(95,90,83,.8)'; g.font='10px serif'; g.textAlign='right';
      g.fillText('해마다 저절로', x+w-46, yy+24); g.textAlign='left';
    }
    // 지우기
    if(info && !자동){
      btn(g, x+w-92, yy+18, 56, 26, '지우기', false, ()=>{
        확인('지우기','칸 '+s+'번을 지운다.','지운다',()=>{ deleteSlot(s); MENU={tab:mode, from:MENU&&MENU.from}; });
      });
    }
    yy+=rh+10;
  });
  btn(g, CFG.W/2-60, y+h-46, 120, 30, '돌아간다', false, ()=>{
    MENU = (MENU && MENU.from==='title')? null : { tab:null };
    if(SCENE==='title') MENU=null;
  });
}

/* 소리 — 효과음과 배경음을 켜고 끄고, 크기를 정한다 */
function slider(g,x,y,w,v,fn){
  const h=8, hov=inRect(Mouse,{x:x-4,y:y-8,w:w+8,h:24});
  g.fillStyle='rgba(0,0,0,.5)'; g.fillRect(x,y,w,h);
  g.fillStyle= hov? '#e0bd76':'rgba(190,158,96,.75)'; g.fillRect(x,y,w*clamp(v,0,1),h);
  g.strokeStyle='rgba(224,189,118,.35)'; g.lineWidth=1; g.strokeRect(x+.5,y+.5,w-1,h-1);
  const kx=x+w*clamp(v,0,1);
  g.fillStyle= hov? '#f0e2be':'#c9bfa8';
  g.beginPath(); g.arc(kx, y+h/2, hov?7:5.5, 0, 7); g.fill();
  hz(x-4,y-8,w+8,24, ()=>{ fn(clamp((Mouse.x-x)/w, 0, 1)); });
}

    btn(g, x+40, yy-14, 120, 26, '들어 보기', false, ()=>{ snd('era', 0); });
  }
  btn(g, CFG.W/2-60, y+h-46, 120, 30, '돌아간다', false, ()=>{
    MENU = (MENU && MENU.from==='title')? null : { tab:null };
    if(SCENE==='title') MENU=null;
  });
}

/* 놀이 중 메뉴 */
function drawMenu(g){
  if(MENU && MENU.confirm){ drawConfirm(g); return; }
  if(MENU && MENU.tab==='sound'){ drawSound(g); return; }
  if(MENU && MENU.tab==='records'){ drawRecords(g); return; }
  if(MENU && MENU.tab){ drawSlots(g, MENU.tab); return; }
  const w=창폭(300), h=436, x=(CFG.W-w)/2, y=(CFG.H-h)/2;
  g.fillStyle='rgba(4,5,8,.78)'; g.fillRect(0,0,CFG.W,CFG.H);
  bigPanel(g,x,y,w,h);
  g.textAlign='center'; g.fillStyle='#e0bd76'; g.font='20px serif';
  g.fillText('메뉴', CFG.W/2, y+42);
  g.fillStyle='rgba(140,135,125,.75)'; g.font='11px serif';
  g.fillText(G.year+'년 · '+ERAS[G.era].nm, CFG.W/2, y+62);
  g.textAlign='left';
  let yy=y+86; const bw=w-60, bx=x+30;
  btn(g,bx,yy,bw,38,'돌아가기',false,()=>{ MENU=null; }); yy+=46;
  btn(g,bx,yy,bw,38,'저장하기',false,()=>{ MENU={tab:'save'}; }); yy+=46;
  btn(g,bx,yy,bw,38,'불러오기',false,()=>{ MENU={tab:'load'}; }); yy+=46;
  btn(g,bx,yy,bw,38,'기록',false,()=>{ MENU={tab:'records'}; }); yy+=46;
  btn(g,bx,yy,bw,38,'소리',false,()=>{ MENU={tab:'sound'}; }); yy+=46;
  btn(g,bx,yy,bw,38,'새로 시작',false,()=>{
    확인('새로 시작','지금 판은 사라진다. 남겨 두려면 먼저 저장하시오.','시작한다',()=>{ 새판(); });
  }); yy+=46;
  btn(g,bx,yy,bw,38,'나가기',false,()=>{
    확인('나가기','시작 화면으로 나간다. 자동 저장은 남는다.','나간다',()=>{
      saveGame('auto'); SCENE='title'; MENU=null;
    });
  });
  g.textAlign='center'; g.fillStyle='rgba(120,115,105,.6)'; g.font='10px serif';
  g.fillText('Esc 로 여닫는다', CFG.W/2, y+h-16); g.textAlign='left';
}

function drawConfirm(g){
  const C=MENU.confirm;
  const w=창폭(420), h=180, x=(CFG.W-w)/2, y=(CFG.H-h)/2;
  g.fillStyle='rgba(4,5,8,.82)'; g.fillRect(0,0,CFG.W,CFG.H);
  bigPanel(g,x,y,w,h);
  g.textAlign='center';
  g.fillStyle='#e0bd76'; g.font='20px serif'; g.fillText(C.title, CFG.W/2, y+48);
  g.fillStyle='#d9d2c2'; g.font='13px serif';
  wrapText(g,C.body,w-70).slice(0,2).forEach((t,i)=> g.fillText(t, CFG.W/2, y+82+i*19));
  g.textAlign='left';
  btn(g, x+w/2-130, y+h-52, 120, 32, '그만둔다', false, ()=>{ MENU=null; });
  btn(g, x+w/2+10,  y+h-52, 120, 32, C.ok, true, ()=>{ const f=C.fn; MENU=null; f(); });
}

/* ================================================================
   본체
   ================================================================ */
let LAST_T=0;
function tick(){
  // 시간 — 움직임은 프레임 수가 아니라 흐른 시간을 따라야 한다
  const t=(typeof performance!=='undefined' && performance.now)? performance.now()/1000 : 0;
  DT = LAST_T? clamp(t-LAST_T, 0, 0.1) : 0;
  LAST_T=t; NOW=t;
  fxTick(DT);
  musicTick();
  const 창 = !!(G.popup || G.report || MENU || G.pendingReign);
  if(Key.pressed['Space'] && !창 && !G.ended && SCENE==='play'){ Key.pressed['Space']=false; snd('year'); endTurn(); }
  if(Key.pressed['KeyM'] && !창 && SCENE==='play'){
    Key.pressed['KeyM']=false; G.mapMode=G.mapMode==='terrain'?'political':'terrain';
  }
  if(Key.pressed['KeyF'] && !창 && SCENE==='play'){
    Key.pressed['KeyF']=false; setMapPreset(G.mapFocus==='all'?'korea':'all');
  }
  // ＋ － 로도 당긴다. 지도 한가운데를 붙들고 움직인다.
  if(!창 && SCENE==='play'){
    const 한가운데=[CFG.GX+MAP_GEO.width/2, CFG.GY+MAP_GEO.height/2];
    if(Key.pressed['Equal']||Key.pressed['NumpadAdd']){
      Key.pressed['Equal']=Key.pressed['NumpadAdd']=false; zoomAt(한가운데[0],한가운데[1],1.35); }
    if(Key.pressed['Minus']||Key.pressed['NumpadSubtract']){
      Key.pressed['Minus']=Key.pressed['NumpadSubtract']=false; zoomAt(한가운데[0],한가운데[1],1/1.35); }
  }
  // 오른쪽 판이 여섯 갈래가 되었으니 손으로도 넘길 수 있어야 한다
  if(!창 && SCENE==='play'){
    const 넘김=d=>{ const i=TABS.indexOf(G.tab); G.tab=TABS[(i+d+TABS.length)%TABS.length]; };
    if(Key.pressed['BracketLeft']){ Key.pressed['BracketLeft']=false; 넘김(-1); }
    if(Key.pressed['BracketRight']){ Key.pressed['BracketRight']=false; 넘김(1); }
    if(Key.pressed['Tab']){ Key.pressed['Tab']=false;
      넘김(Key.down['ShiftLeft']||Key.down['ShiftRight']? -1 : 1); }
  }
  if(Key.pressed['Escape']){ Key.pressed['Escape']=false;
    if(MENU){
      // 확인 창은 한 겹만 물러난다
      if(MENU.confirm) MENU=null;
      else if(MENU.tab) MENU = (SCENE==='title')? null : {tab:null};
      else MENU=null;
    }
    else if(G.report){ /* 결산은 도망칠 수 없다 */ }
    // 선택지와 결말도 도망칠 수 없다
    // 즉위 교서도 도망칠 수 없다 — 고르지 않고 넘길 수 있으면 고름이 아니다
    else if(G.pendingReign){ /* 사관의 글은 단추로 덮는다 */ }
    else if(G.popup && G.popup.kind!=='choice' && G.popup.kind!=='end'
            && G.popup.kind!=='accede') G.popup=null;
    else if(!G.popup && SCENE==='play') MENU={tab:null};
  }
  // 선택지 창에서는 1·2·3으로도 고른다
  if(창 && !MENU && !G.pendingReign && G.popup
     && (G.popup.kind==='choice' || G.popup.kind==='accede')){
    ['Digit1','Digit2','Digit3'].forEach((k,i)=>{
      if(Key.pressed[k]){ Key.pressed[k]=false; G.pickChoice=i; }
    });
  }
  draw();
  if(G.pickChoice!=null){
    const z=HIT.filter(h=>h.choice!=null).find(h=>h.choice===G.pickChoice);
    G.pickChoice=null; if(z&&z.fn) z.fn();
  }
  if(Mouse.click){
    Mouse.click=false;
    sndWake();                       // 브라우저는 사람이 누른 뒤에야 소리를 내준다
    const lo = MODAL>=0? MODAL : 0;
    for(let i=HIT.length-1;i>=lo;i--){
      const z=HIT[i];
      if(inRect(Mouse,z)){ if(z.fn){ snd('click', 0.03); z.fn(); } break; }
    }
  }
  Mouse.rclick=false; Mouse.wheel=0; Mouse.wheelX=null; Mouse.wheelY=null;
  Key.pressed={};
  requestAnimationFrame(tick);
}
loadAssets();
sndLoad();
newGame();                 // 판은 미리 만들어 두되, 화면은 제목부터
SCENE = 'title';
requestAnimationFrame(tick);
</script>
